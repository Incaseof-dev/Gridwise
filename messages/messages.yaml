        {npcs} can disrupt missiles and {has} been on you for {min} min. Your missiles do less damage and fly shorter:
        kill them first, or let drones handle them.
    2:
      - 'Missiles falling short? {npcs} can disrupt them. Kill them first, or send the drones.'
      - 'Missiles losing interest halfway? {npcs} can disrupt guidance. Kill them first, or close in.'
      - 'Less damage per missile? Guidance disruption. Shoot {npcs} first, or send the drones.'
    3:
      - 'Your missiles are taking the scenic route. {npcs} may have given them directions.'
      - 'Fire and forget. Mostly forget.'
      - 'The missiles left. They did not say where they were going.'
      - 'Somewhere out there, a missile is still looking for its target.'
      - 'Your missiles have formed a union and refuse to fly the full distance.'
      - 'Your missiles have filed a missing persons report. About themselves.'
      - 'Missile guidance has been replaced with positive thinking.'
      - 'Your missiles have decided to explore New Eden independently.'
  ended:
    0:
      - The NPCs that can disrupt missiles have stopped attacking you for now.
    3:
      - 'Your missiles found the map again.'
      - 'Your missiles are back from their voyage of self-discovery.'
    2:
      - 'Guidance is clean again. Your missiles go where you point them: start with what is left.'

