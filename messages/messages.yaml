    0:
      - >-
        {npcs} can paint you and {has} been on you for {min} min. A painted ship is easier to hit: kill them first, or
        keep moving to take less damage.
    2:
      - '{npcs} can paint you. You are now a very large, very easy target. Painters first?'
      - 'Taking more damage than usual? {npcs} can paint you. Painters first, or keep moving.'
      - 'You are lit up like a Jita station on a Saturday. Kill the painters first.'
    3:
      - 'Congratulations, you are the biggest thing on grid. {npcs} made sure of it.'
      - 'You now have the signature radius of a small moon.'
      - 'Every NPC on grid can see you. Probably from the next system too.'
      - 'Bigger is not always better, capsuleer.'
      - 'Painted. Fashionable, but deadly.'
  ended:
    0:
      - The NPCs that can paint you have stopped attacking you for now.
    3:
      - 'Your signature is back to its normal, modest size.'
      - 'The spotlight is off. You may return to being merely a target.'
