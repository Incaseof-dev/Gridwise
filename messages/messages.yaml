    0:
      - 'Five minutes in, with several kinds of threat. Check the brief: which wave is this, and do you need all of it?'
    1:
      - 'This fight has been going for {min} minutes. Worth a look at the brief: is anything here optional?'
    2:
      - 'Five minutes and counting. Check the brief, maybe not every wave needs your personal attention.'
      - 'This fight is older than some corporations. Check the brief: maybe skip the optional waves.'
      - '{Min} minutes. If this is a DPS check, the brief may know a faster way.'
      - 'Still here after {min} minutes. A look at the brief may save you the next ten.'
    3:
      - Are we fighting or conducting field research?
      - 'Five minutes in. Should I put the kettle on?'
      - 'At this point the NPCs should be paying rent.'
      - 'Do you want me to order food?'
      - 'Somewhere, a timer is judging you.'
      - 'This is not a site anymore. It is a lifestyle.'
      - 'I have aged. Have you?'
      - 'The wrecks have started forming opinions.'
      - 'I have started writing my memoirs. You are still in the same pocket.'
      - 'This encounter now qualifies as a long-term relationship.'
      - 'The NPCs have started a homeowners association.'
      - 'Should I schedule a maintenance window for this fight?'

multiTrigger:
  event:
    0:
      - >-
        You shot {npcs}: two triggers within a minute, so their waves can land together. Watch your tank, and kill
        anything that scrams or points first.
    1:
      - 'Two triggers in a minute ({npcs}). Their waves may arrive together: keep an eye on your tank.'
    2:
      - "I see you've selected the 'everyone at once' strategy. Watch your tank, and scrams first."
      - 'Two triggers in a minute: both waves may land at once. Tank first, scrams first, regrets later.'
      - 'Speedrun detected. Two triggers, double waves. Watch the tank, and kill the scrams first.'
    3:
      - "I see you've selected the 'everyone at once' strategy. Bold."
      - 'Two triggers in a minute. Never mind me, carry on.'
      - 'Two triggers in a minute. Somebody is in a hurry.'
      - 'Why fight two waves when you can fight them both at once?'
      - 'Ah yes, the pull-everything school of piloting.'
      - 'Bold. Possibly brave. Probably expensive.'
      - 'I will start the insurance paperwork, just in case.'
      - 'You have successfully converted a controlled encounter into a public event.'
      - 'Congratulations. You have invited the entire neighborhood.'
      - 'I see we have abandoned the concept of crowd control.'
      - 'Your insurance provider has left the chat.'
      - 'CONCORD has reviewed your tactical decisions and declined to comment.'
