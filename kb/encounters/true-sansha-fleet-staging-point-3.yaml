notes:
  - text: This site can be very hard, though the loot may be very rewarding. The site is not in deadspace, and it is ungated. Any aspiring hunter can warp directly to you with combat probes, so be careful if running the site. Unlike the True Sansha Fleet Staging Point and True Sansha Fleet Staging Point 2, the site has no gates.
  - text: The Sansha's Battletower has a fairly strong web that reaches out to 50 km. It deals a 2250-0-2250-4500 damage hit (in total 9,000 dph) per 20,000 seconds which could also have 1% chance to make 3x damage because it is turret type, and will fire the instant it locks your ship. It fires Citadel Mjolnir torpedoes every 120 seconds that deal high EM damage. It recharges shields to the tune of about 300 DPS. It is recommended to keep moving as fast as you can to mitigate as much damage from the battletower as possible.
