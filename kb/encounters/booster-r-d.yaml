  - name: Third Location
    notes:
      - text: Dominix
      - text: Ungated normal space pocket. For blitzing pick a asteroid/trash object near the shadow serpentis and warp to it. The trigger for escalation in case no commander is present is unknown.
      - text: There are damps. The elite cruisers and battlecruisers will approach to 6 and 20 km orbits. Once enemies get in range the incoming damage is quite high. Each group can be agressed separately. The reinforcements spawn in same locations where initial groups were.
      - text: "Dead End Message:: You follow the coming and going of the Serpentis who are seemingly unaware there is an enemy amongst them. When they start warping out again, you position your scanners, let your instruments run a tracking routine, sit back and hope for the best. And you win! The probability of loosing s simple destination track on a fleet like this is according to your instruments around 23100 to one, and you managed to do exactly that. You make a mental note to buy a ticket in The Forge Lottery the next time you are up in Jita."
      - text: "Escalation Message:: You follow the coming and going of the Serpentis who are seemingly unaware there is an enemy amongst them. When they start warping out again, you position your scanners, let your instruments run a tracking routine, sit back and hope for the best. And yes, you do indeed get a feedback indicating a location not too far away as their destination. If they have stuck their plans, this should be the site of the Serpentis medical research facility!"
