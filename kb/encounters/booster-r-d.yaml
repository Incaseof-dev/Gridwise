      - text: Stratios
      - text: "Message on attacking Core Lord Admiral:: Mayday! Mayday G6 industrial group being attacked by pirates!"
      - text: Notable structures
      - text: 'Escalation message:: Again your radio comes alive with the voice of this femme serpentia "This is an important security announcement, all ships in G5, G6, G8 and G9: evacuate immediately to a new location and wait for security forces to escort you back to base." It seems like your little enterprise has made the local division of the Serpentis organization a bit confused, perhaps they are not used to be the hunted. This message was a bit troubling though... you can expect two whole gas mining teams and a security team of an undisclosed size. You need to be more careful here...'
      - text: 'Dead-end message:: Again your radio comes alive with the voice of this femme serpentia "This is an important security announcement, all ships in G5, G6, G8 and G9: evacuate immediately and return to base."'
