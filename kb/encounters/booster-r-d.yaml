notes:
  - text: Escalates from Serpentis Vigil
  - text: 'Expedition start:: Going through the items found in the Serpentis outpost, you notice some unused boosters still in their original packs complete with documentation and bear the seal of the Serpentis Corporation. The documentation notes further that these boosters as "Field Test" material and not for common consumption and at the bottom there is ordering info, stating item number and the makers electronic address. Feeling it is worth a shot, you set your communication instruments to emulate those of the Serpentis facility you just laid to waste, feed in the booster factory addy and hit send. And lo and behold, you get an instant reply, a sleepy sounding female voice says "SC medical research 504, good day. How may I help you? Oh! It is Vigil 15? I have a message for you from the supply office, they say you are late. Get to G5, pick up the materials and get here as soon as possible" She adds information on the location and tells you to talk to Nadir, also at G5 if there is anything. And with that she is off the air.'
  - text: "Warning: this expedition seems to despawn shortly after you warp out of it."
