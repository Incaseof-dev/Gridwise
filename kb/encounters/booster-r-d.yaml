      - text: Astero
      - text: Harvesters and Harvester Guards does high DPS.
      - text: Notable structures
      - text: 'Escalation message:: Suddenly the channel comes alive with the Serpentis lady from the medical station again. "SCmr504 to Vigil 15, divert to a new location, we have news of pirate activity at G5, confirm please!" You broadcast a reply with the identification from the one of the ships you destroyed back at the Serpentis Vigil station, which seems to be sufficient for her; she says that you should stay off the air for security reasons and that she will contact you soon again with further instructions.'
      - text: 'Escalation dead-end:: Suddenly the channel comes alive with the Serpentis lady from the medical station again. "SCmr504 to Vigil 15, divert to a new location, we have news of pirate activity at G5, confirm please!" You broadcast a reply with the identification from the one of the ships you destroyed back at the Serpentis Vigil station, but it must have been invalid or outdated, because she spits some curses at you and vanishes.'
