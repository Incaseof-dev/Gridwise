notes:
  - text: "Escalation start: You are about to wrap up this little raid when all of a sudden you have an incoming transmission popping on one of your panels from someone asking where in flaming hell his ship components are. He continues to claim that he had ordered all sorts of stuff ages ago and nothing is getting delivered. This is all sent in Sansha code and comparison with the station logs from the place you just destroyed identify the person on the other end as a foreman from a local branch of the True Power corporation. When he hears some hesitation on your end, this guy gets all patronizing on you, raving back and forth about too many newbs being recruited to the production units, how your single digit IQ must be a shining light for every slug in the universe to follow and fabulates a bit about how he envisions the state your toilet training is in. He then shouts some instructions about how you are to get off your butt right this moment and haul it to a certain place, picking up his order for 300 10MN afterburners. He orders you to buzz him on this same frequency when you are there and that he will then give you further instructions."
  - text: A large fleet spawns 15 minutes after destroying the Sansha Yard.
  - text: A large fleet spawns 20 minutes after you warped into the site.
  - text: "Warning: Your ship can be freely attacked by others - NO CONCORD INTERVENTION - in Low Security Systems (0.1 to 0.4) and Null Security Systems (0.0). Always check Star Map statistics (Active ships, Ship kills, Pod kills, etc) of Low Security and Null Security systems first before entering. Fitting a Cloaking Device module on your ship and making more than one Safe spot will provide more safety."
  - text: The Sansha's Battletower has a lot of HP (50.000 HP Shield + 150.000 HP Armor), make sure to clear the site first or be able to tank the site for 5-10 minutes.
  - text: Put the Sansha Battletower to structure to spawn the Foreman.
  - text: "On completion: It may be all Sanshas knew where this station was, but the condition it is in now, they probably just want to forget it ever existed."
  - text: The Sites have no gates, so there are no ship restrictions
  - text: You can warp freely inside the site
  - text: make a bookmark on warp-in to bounce
  - text: Site 1 and 2 have no spawn at warp in
  - text: Site 3 has high incoming DPS at warp in, but you can get out of range fairly easy
  - text: You can warp in cloaked at Site 4 and bounce back to stay out of range (45km) of the towers
  - text: Site 1-3 can be done in good tanked Tactical Destroyers
  - text: Site 3 has faction loot only in the reinforcement spawn. The faction cruiser can be sniped as there is no initial aggro at 50km away after the group spawn.
  - text: Site 4 can be done in an Stratios
