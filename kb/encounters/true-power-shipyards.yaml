pockets:
  - name: Expedition Site One (High Security System)
    notes:
      - text: "Escalation Message: You didn't find 300 afterburners to fill the True Power order, but you guess that if you don't tell the guy, no one will. Not sure what this \"buzz\" was supposed to sound like, you hurl a loud beep! And some crackles on the prescribed frequency and a second later the True Power foreman descends on you again with curses and insults perfected by generations of pirate foremen. After a while his monologue draws to an end and he tells you to go and pick up 280 units of missile control modules at another location."
      - text: "Escalation Ends Message: You didn't find 300 afterburners to fill the True Power order, but you guess that if you don't tell the guy, no one will. Not sure what this \"buzz\" was supposed to sound like, you hurl a loud beep! And some crackles on the prescribed frequency. No response. You run through your computer sound files for anything resembling a buzz, but still nothing. Either he has forgotten about you, or he has found out that you are not who he originally thought you were and you start getting a bad feeling about this place, if the latter is true, it will probably fill with some very mean looking Sanshas very soon and then there was this distress call... It might be a good idea to sneak away while it is still possible."
