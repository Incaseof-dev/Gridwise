objectives:
  - text: Retrieve 1x Correspondence Log KL-513 (0.5 m3)
restrictions:
  - text: "Ship size limit: T1 Destroyer, Frigates"
notes:
  - text: "Suggested ships: Interceptor"
  - text: 2.4% Caldari State Faction Standing loss; Tractor Beam I and 25 km range weapon for pulling Cargo Container out of Forcefield
  - text: Gated deadspace pockets are one jump away in AJCJ-1.
  - text: "Blitz: kill Eroma Eralen, take Acceleration Gate then another Acceleration Gate. Arc around to the opposite side of the Forcefield, destroy the Caldari Bunker with a 16 km range weapon and Tractor Beam the Correspondence Log KL-513 Cargo Container."
  - text: "Alternative Blitz: kill Eroma Eralen, loot the Caldari Navy Overlay Transponder, take Acceleration Gate then another Acceleration Gate. Approach the Caldari Bunker, destroy each wave as it spawns and then destroy the 150 HP/s regenerating Forcefield."
  - text: "Tips: Orbit Eroma Eralen at 3 km to avoid damage"
  - text: "Tips: If you don't attack the friendly ships, they won't attack you"
  - text: "Tips: Caldari Bunker reinforcement waves spawn as you approach the Caldari Bunker"
  - text: "Tips: All Caldari Bunker reinforcement waves will spawn when you attack the Caldari Bunker or on proximity to the Forcefield."
  - text: "Tips: Enemy ships can't pass through the Forcefield (unless you encounter a bug where all ships can pass through the Forcefield)"
  - text: "Tips: Caldari Bunker drops two Cargo Containers: one has ammo and the other the Correspondence Log KL-513"
  - text: "Tips: You will lose 2.4% Caldari State Faction Standing when you destroy the Caldari Bunker (Note: Also lost standing for destroying the forcefield AND NOT the bunker)"
pockets:
  - name: Warp-in
    notes:
      - text: "Agent Conversation about Eroma Eralen: There's Kori's agent, Eroma Eralen. Take him out and grab his Caldari Navy Overlay Transponder. With that item in tow, you'll be able to get past the Caldari guards in the next part of this deadspace pocket. They will think you're Eroma. Be careful, though: Eroma is a wild card, and there's no telling what he'll do."
      - text: "Eroma Eralen: Good to see you again, capsuleer. I knew we'd meet again. You caught me without my smoke and mirrors. Guess I'll have to take you out the old-fashioned way."
      - text: "Eroma Eralen: I've been bested. You'll make a fine Gurista one day, capsuleer. I think it's about time I retire from flying. Thank you for giving me a glorious end to my career…"
