  - name: Room 2
    notes:
      - text: "NOTE: Alpha and Bravo Squadron waves are present on warp-in, the other bunker reinforcement waves are triggered based on proximity to the Forcefield. They spawn very quickly one after the other and you can easily trigger all of the reinforcement waves at once if you are not careful, especially if you are trying to blitz. The combined DPS will easily shred your tank, though the damage generally falls off past 20 km and you can use the forcefield to block their approach with good piloting."
      - text: "Message from Cilis (entering pocket): I'm surprised that worked. The Navy must be getting dumber and more gullible each year. Seems that way, at least, since the start of Heth's rise. Good for business, bad for them. We need that evidence of Kori's treason. It must be in that building behind the forcefield. Approach the bunker carefully and watch out for any Navy ships. Take out the forcefield, grab the evidence, and get out of there as fast as possible."
      - text: "Kori Latamaki agent message (on triggering reinforcements): I got a signal from Eroma's ship that he went down, but I couldn't reach my Navy friends in time. Looks like they're on their way, though. I should have figured you'd try to meddle in this, Cilis. I've worked on establishing contacts within the Navy for years. How do you think I knew about their bases, their projects, and their locations? I'm not going to let you ruin this deal like you ruined my career in the Guristas. No matter, though. I'll have them take out your capsuleer friend first. Afterwards, I'll set their sights on you. This isn't over, Cilis. Not by a long shot."
      - text: "Mission debriefing: We're a big, happy family, aren't we? You thought a pirate's life was all fun and plunder, profit and murder, the thrill of being an outlaw. We have our own problems, our internal strife. Sometimes, I don't know why I chose this lifestyle. But I'm a capsuleer, and life has a different quality to it. You probably know what I'm talking about. All this backstabbing and in-fighting, these land-grabs and territorial bickering. What does this matter for a demigod? For us, it's all a matter of attrition: The last clone standing wins all the worthless, empty space in the universe. Oh well. It's fun while it lasts, right? Kori was right: This isn't over between us. It never will be. But I'll win out in the end. He'll die, I'll die, Irichi'll die. But then I'll hop into my next clone, and I'll win. That makes it worth it, right? This feud is between us Guristas; you have your own battles to fight. So fly well, egger. Maybe we'll work together again someday."
