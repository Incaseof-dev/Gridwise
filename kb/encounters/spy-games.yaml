  - name: Room 1
    notes:
      - text: "Hold for Security: Please hold while we scan for your identification. Vessel registered as Eroma Eralen AKA Smoke and Mirrors AKA Rabbit Foot AKA Sergeant Paken Isurada, 3rd Battalion, 8th Regiment, Caldari Navy You are free to enter"
    waves:
      - id: entry-defender
