notes:
  - text: Blood Raider Coordination Center is a null security DED 7/10 site found through exploration.
  - text: Upon warping to the site you will arrive at an acceleration gate. It's possible to do this site in a ratting Ishtar but may take 3 hours to do in that manner.
  - text: "Database Information: The Blood Raider Covenant is infamous for its organized strike capabilities. It is no surprise, then, that Blood Raider coordination centers are a common encounter for capsuleer and DED forces in nullsec. Numerous battle reports support the theory that each complex serves as a primary base for a Dark Blood Hunter, a specialist in tracking, subduing, and harvesting the biomass of capsuleers. Because of the Blood Hunter's influence, the threat to civilian and Imperial assets posed by such coordination centers has been on the decline. The DED is more than willing to leave the Blood Hunters as a capsuleers' problem. DED Threat Assessment: 7 of 10"
