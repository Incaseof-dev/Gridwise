  - name: 5th pocket
    notes:
      - text: You land ~60km from the tower and it webs you at that range. It has low health, but when you're webbed you're going to be taking a lot of damage. In an armour ratting Ishtar, I used warrior drones to kill the tower, due to their speed, and overheated tank and prop during this time, as well as aligning out. I had a DCU2 fitted rather than an ADC, though. I believe that the site despawns a certain amount of time after you kill the Dark Blood Hunter, but you may not have enough time to kill that guy if you leave the tower up.
