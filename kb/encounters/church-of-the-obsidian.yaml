notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: "Suggested ships: Fast ship or Strategic Cruiser, Battlecruiser or Battleship with Micro Jump Drive and Relic Analyzer"
  - text: Requires Archeology III; a Relic Analyzer is given to you by the Agent; Amarr Empire Standing loss (despite being Ammatar ships)
  - text: thumb|192px
  - text: Two deadspace pockets up to three jumps away from Tanoo.
  - text: "Blitz: kill all Frigates, lure them away or rush through the Ancient Acceleration Gate. Rush for the Chapel of the Obsidian, hack it, loot the Blood Obsidian Orb and warp out."
  - text: "Alternative Blitz: lure ships 150 km away in the second room, turn around and approach enemy at a 45-degree angle; at the enemy fleet midpoint turn towards the Chapel of the Obsidian, hack it, loot the Blood Obsidian Orb and warp out."
  - text: "Tips: You cannot warp inside either room"
  - text: "Tips: Destroy Warp Scrambling Frigates if you cannot avoid them. They are positioned around the gate and do not aggro on warp-in, but they will still tackle you before you get to the gate unless you're cloaked"
  - text: "Tips: The frigates in the first room will instantly move back to the acceleration gate if you warp out, so you can only avoid them solo with a Micro Jump Drive or fast ship."
  - text: "Tips: Armor tanked Battlecruisers such as Prophecies, Myrmidons and Hurricanes can ignore the incoming DPS and go straight for the Chapel of the Obsidian"
