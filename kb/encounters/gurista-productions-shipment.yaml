notes:
  - text: "Expedition start:: As the bits and pieces from the disintegrated station charge into space, carrying the news of heightened entropy in the universe, your instruments receive an unusual message. It's obviously being transmitted from the Guristas and even though the person on the other end does not introduce himself as such, the special cypher reveals it is indeed theirs. He demands speaking over a secure channel and after you have established one, he continues with sarcastic congratulations on your victory. He then gives you an offer: If you travel to three different locations as he instructs and assassinate the Guristas leaders operating there, he will reward you handsomely. He then gives you coordinates to a location in a \"take it or leave it\" manner before bidding you farewell and adds that he will contact you after the first target is destroyed."
lootNotes:
  - text: Dread Guristas Stasis Webifier - 06/11/2014.
  - text: Dread Guristas Anti-Thermal Shield Hardener - 06/11/2014.
  - text: Dread Guristas Heavy Missile Launcher - 22/03/2020.
  - text: Dread Guristas Medium Graviton Smartbomb, Pithum A-Type Medium Shield Booster - 25/08/2021.
  - text: Pithum A-Type Explosive Shield Amplifier, Pithum A-Type EM Shield Amplifier, Pithum A-Type Medium Shield Booster - 25/02/2026.
