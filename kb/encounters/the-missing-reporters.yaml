objectives:
  - text: "Acquire these goods: 5x Gallente Corpse"
ewar:
  - kind: web
notes:
  - text: "Suggested ships: Harpy, Ishtar, Drake"
  - text: "Blitz: Not possible."
  - text: Do not attack any ships! Just Destroy the "Local Prison" structure as quickly as possible then warp away. During your assault on the prison, everything will start shooting at you. For this reason it is safest to pre-align then insta-warp when it detonates. Wait a minute then warp back to the mission. This time there should be zero aggro so you can go and pick up the contents of the dropped storage containers at your leisure, then turn in the mission.
  - text: If you're in a well-tanked ship, like a battlecruiser, you can safely approach it to 0m and then attack it. You should have way enough tank to loot the can and warp out in time, on my attempt I warped out with 85% shield left.
  - text: Shooting all ships leads to a total Standing Loss of -0.6 with the Angel Cartel (2 x -0.3 for Ship Kills). Incurred a further -0.3 Standing Loss with the Angel Cartel from destroying Prison.
  - text: "Blitz: Just kill the slave traders and take the can."
