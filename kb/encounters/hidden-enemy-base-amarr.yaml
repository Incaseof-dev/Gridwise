  - text: Deadspace with multiple gated pockets. Two Remote Cloaking Array's must be destroyed before a hidden gate that leads to the Enemy Base will appear.
  - text: "Tips: Use a Passive Tank and save time by not having to destroy Energy Neutralizer Sentries"
  - text: "Tips: When being Tracking Disrupted, your turrets can still be used effectively against stationary Sentries and Batteries (while your drones handle the frigates)."
  - text: "Tips: For Pockets 5 & 6, wait until all ships have spawned before bringing in a logistics ship"
