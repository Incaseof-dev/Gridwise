    onWarpIn: Sansha's Nation was founded well over a century ago. Sansha was a Caldari tycoon who carved out a sizable piece of space for himself; there, he set out to create an Utopian State. His vision and charm attracted thousands of people, and for some time the Nation flourished. But Sansha became ever more warped as his success increased. He started experiments, combining capsule technology with the human mind, creating zombie-like creatures having the cold, calculating minds of computers, yet retaining the ingenuity of humans. When this terrifying truth became public knowledge, Sansha was condemned, and special forces from each of the great empires joined forces to bring him down. His "True Sansha" servitors were decimated, scattered to the furthest reaches of known space. Remnants still remain far in the outer regions, but the once glorious Nation has been reduced to small gangs of pirates and pillagers.
