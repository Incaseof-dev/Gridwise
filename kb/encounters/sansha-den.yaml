notes:
  - text: "Rating: Class 4 Level 1"
  - text: Sansha Den is an unrated combat site belonging to the Sansha's Nation pirate faction. It can be found via exploration as a cosmic anomaly within systems owned by the Amarr Empire and Ammatar Mandate. As an ungated complex, the limitations as to which ships can complete this site are tied to the security rating of the system where the anomaly spawns (T2 Battleships for high-security systems, and up to Titans in low-security and null-security systems). Completing this complex may award the player with valuable True Sansha faction modules and ammunition.
  - text: "This combat site consists of a single ungated pocket of space containing a variety of Frigate-, Destroyer- and Cruiser-sized enemy ships. Destroying all hostile ships may escalate into the DED rated Sansha's Nation Neural Paralytic Facility complex. Three variations of this combat anomaly exist: Sansha Hidden Den, Sansha Forsaken Den and Sansha Forlorn Den."
  - text: "Two different site layouts can be encountered: The Light Missile Battery layout and the Heavy Missile Battery layout. Both layouts can spawn a True Sansha Cruiser and escalate."
  - text: ----
  - text: Single pocket, the last ship kill triggers next spawn. Light missile batteries have limited aggro range, only about 30 km.
  - text: Single pocket, the last kill triggers next spawn.
  - text: "Escalation: This site can escalate to Sansha's Nation Neural Paralytic Facility."
