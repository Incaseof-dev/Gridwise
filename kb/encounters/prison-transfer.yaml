pockets:
  - name: Warp-in
    notes:
      - text: "Warp-in Point: 25km from Cell Block D (appears as a Spawn Container on Overview). No hostiles on initial warp-in."
      - text: Approaching Cell Block D within 5km triggers the first spawn and temporarily despawns Cell Block D.
      - text: All spawns appear within 5km of Cell Block D and auto-aggro at close range.
      - text: Once mission completion has been triggered, Cell Block D respawns and you can retrieve the Caldari Operative.
      - text: Besides the "Derived Modification" normally received for any Storyline Mission, you will get standings losses of at most -0.02% each for "Combat - Ship Kill" for the Caldari State. These secondary standing losses are on the standard 15 minute standings timer, so divide how long it takes you by 15 minutes and round up, and that is how many of these you will get. These are unavoidable but negligible. With Social at level 4, expect a 9% gain with the faction you are working for and a 36% gain with the corporation you are working for.
