notes:
  - text: The site is behind an acceleration gate. Warping to the side lands you at 0 on the gate.
  - text: This site is rated DED 6/10. 3 Battlecruisers and a Battleship ran this site easily.
  - text: Warping to the site lands on an acceleration gate at 0.
  - text: Crimson Lord has 380 HP/sec active shield repair with 0 EM resist and additionally repairs 1500 armor HP every 25 seconds. You will need very high sustained damage output in excess of 700-800 DPS to volley through its shield and armor tank in a decent amount of time.
