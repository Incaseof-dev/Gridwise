    onWarpIn: "Industrial sector: Registered visitors entering this sector should report to the outpost security office as soon as they arrive. Failure to do so will be considered an act of aggression and handled with lethal force. Urgent!!! To all military personnel: Intruder alert! Report to battle stations immediately!"
  - name: Central Processing
    notes:
      - text: Crimson Sentinel has strong active shield tank (240 HP/s), high structure hitpoints (100k), and webs to 50 km. Save it for last, even with massive DPS it takes a long time to kill. It shoots battleship-grade Mjolnir torpedoes that deal 250 DPS EM with 1500 alpha - low enough to be able to speed tank.
      - text: Rats spawn 50-60 km from landing. There are two acceleration gates 48 km from landing leading to the last two rooms of the complex. The Sentinel may drop Dark Blood faction modules as well as a key (Crimson Hand Level 3 Passcard) which is not required for both gates.
      - text: BSs are all tier 1 battleships (300-400k bounty , not such a threat) they have a little hp and deal relatively low damage.
