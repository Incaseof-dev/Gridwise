  - name: Fourth Location
    notes:
      - text: Ungated pocket. You land on a colorful mixture of ruins, structures, and rocks. No rats initially present.
      - text: The Jeroon structure itself triggers a smartbomb wave when initially attacked which reaches out to 30 km. The structure itself is fairly easy to destroy with only 16k HP.
      - text: The Sansha's Berserkers/Demons should be destroyed first, they deal high damage compared to normal rats and have more tank, though not as much as normal elite frigates. Kazah Durn hits hard also, out to 100 km.
      - text: "Expedition end: For a while there, you almost wished you had brought more friends with you and you are relieved you managed to blow the station before more could scramble against you. You are also relieved you managed to kill off that blasted gurgle sound. Permanently."
