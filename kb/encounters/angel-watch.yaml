  - name: Second pocket
    notes:
      - text: "Blitz: Ignore all NPCs (though you can shoot the nearby destroyer) and attack the Gist Drug Farm. Once the Farm wave spawns, approach the Militant Overseer until you get within optimal range of your weapons. When doing so, it is recommended to use manual piloting to avoid the structures, sentries and rats. Destroy only the Gistum Militant Overseer to trigger the commander wave, then destroy the commander, bookmark the wreck, and warp out of the site, wait for it to despawn, and warp back in to pick up the loot."
      - text: "Note: Waves 2 and 3 are triggered by approaching structures, and are additionally possibly on a timer."
