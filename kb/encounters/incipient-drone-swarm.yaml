notes:
  - text: The site has three waves, each dealing around 200 DPS. The Rogue Drones (excluding Vexing and Punishing types) have a lot of EWAR, but it is very weak and can be easily ignored.
  - text: All rats, except for the occasional "Overmind" ships, are drone-sized targets. None of the ships, including battleships, warp scramble. Rats can drop Interstellar Navigation Logs which can be traded to Triglavian stations for valuable items. The salvage is the same as with Rogue Drones in K-Space.
  - text: The Overminds deal around 50-100 DPS each and are limited to a 58 km range, but have very high tracking within that range (100+, equivalent to frigate tracking speeds). They have a lot of EHP, often around or over 100K, but can be tanked fairly easily. Most of them have a large signature radius and can be hit relatively easily. They will orbit you at around 45-50 km. Recommended weapons to destroy them include torpedoes and cruise missiles due to their good application and high damage to battleships and above. (Use turrets for the Overmind Broodlord Omega since its signature radius is small (25m) meaning large missiles will not apply well to it and its shield tank is strong enough to shrug off what little missile damage can be dealt.)
  - text: The Grazing Phase-0 Forager deals no damage and has no EWAR, but has a lot of structure HP and can take a while to destroy. It has the signature radius of a battleship, though.
  - text: Each wave can have up to 8 or 9 ships.
pockets:
  - name: Pocket 1
    notes:
      - text: Additional waves are triggered when all non-Overmind/Forager ships are destroyed.
      - text: Once a certain number of enemies from the last wave are destroyed the rest of the ships warp off and the site is considered complete.
      - text: Completing the site awards a 8,500,000 ISK payout from Triglavian Collective. The ISK is scaled depending on how many people run the site.
