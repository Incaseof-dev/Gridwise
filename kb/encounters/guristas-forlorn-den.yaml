notes:
  - text: "Rating: Class 4 Level 4"
  - text: Guristas Forlorn Den is an unrated combat site belonging to the Guristas Pirates pirate faction. It can be found via exploration as a cosmic anomaly within systems owned by the Caldari State or occupied by the Guristas Pirates. As an ungated complex, there are no limitations so up to Titans are allowed. Completing this complex may award the player with valuable Dread Guristas faction modules and ammunition.
  - text: "This combat site consists of a single ungated pocket of space containing a variety of Frigate-, Cruiser-, Battlecruiser- and Battleship-sized enemy ships. Destroying all hostile ships does not trigger an escalation. Three other variations of this combat anomaly exist: Guristas Den, Guristas Hidden Den and Guristas Forsaken Den."
  - text: Ungated single pocket with multiple waves of rats.
  - text: "Escalation: None"
lootNotes:
  - text: "Bounty: 10.500.000 ISK"
  - text: "Loot: Dread Guristas faction modules (rare) and ammunition, implants"
