restrictions:
  - text: "Ship size limit: T3 Cruiser"
notes:
  - text: Desolate Site is an Unrated Complex found in high sec and low sec via exploration.
  - text: You must be flying a T3 cruiser or smaller to enter the acceleration gate.
  - text: Initially there are only two groups on grid. Third group consisting of a frigate and a destroyer appears in few seconds. You can ignore the groups that have destroyers or drones. Destroying the group with frigates only will trigger additional waves.
  - text: The first and second spawns appear by the Warning Sign structure.
  - text: "Escalation: Mare Sargassum: At first it seems strange the drones have picked this barren and resource deficient place to build a new hive. But then again, while you were blowing up the place, you noticed a few vessels that might have been used as transports, indicating the drones were pulling in the materials they needed from someplace else. As to compliment you on your reasoning, your communication systems start indicating several different incoming transmissions in drone beeps and clicks and after a while you manage to coerce your instruments into pointing out an approximate spatial origin of the message."
  - text: "Escalation: Destroying the first spawn group or sentient drone can escalate the site to Mare Sargassum."
