notes:
  - text: Drone Horde is an unrated combat site belonging to the Rogue Drones faction. It can be found via exploration as a cosmic anomaly in null-security systems across New Eden. As an ungated complex, the limitations as to which ships can complete this site are tied to the security rating of the system where the anomaly spawns (T2 Battleships for high-security systems, and up to Titans in low-security and null-security systems).
  - text: "This site comes in two forms: One which cointains a turret ring and a cloud gas centering a structure, and other that has 4 bunkers in the middle and many scattered in the corners of a square pattern."
  - text: This site contains four bunkers at 30km from landing and four other separated in a square pattern centering the bunker cluster. The initial wave spawns scattered at the "corners" of that square, all next waves spawn near the central bunker cluster. The site shows some major inconsistencies regarding the order and timing of wave spawning, resulting in some iterations spawning more than one wave at once, and in others skipping one entirely. There is incoming EM in this site (Alvus Queen, Exterminator Alvatis)
  - text: Features a structure 30km app. from landing, 8x Lookout Tokers and a Battlecruiser as the initial spawn. Waves are spawned on different points of an horizontal ring with a 20km radius centering the middle structure. Each of these waves spawns a little deployable (not lootable) that diminishes incoming damage. This combat site has a chance to spawn a Sentient Commander Rogue Drone, which drops drone components and may drop faction drone modules and items.
  - text: "Escalation: Both sites may escalate to Outgrowth Rogue Drone Hive (10/10)"
