notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: thumb
  - text: This mission can be accepted and completed remotely. No standing loss for destroying enemies, sentries, or structures.
  - text: "Blitz: Clear gates of rats (gates are locked while guarded, missile batteries do not need to be destroyed in order to unlock the gate though) and make best speed to the final room. In the final room orbit structure and eliminate tackle and incoming DPS as needed, but leave 1 battleship. Structure damage does not spawn additional waves. Structure kill completes mission."
  - text: "Tips: You can warp to the warp-in at range to avoid being webbed instantly."
  - text: "Tips: The NPCs in the warp-in area and the first pocket are at 0. The second pocket NPCs are roughly 50-60 km away."
  - text: "Tips: Remember to switch resists modules for this mission or the incoming kinetic damage will hit to your resist hole."
  - text: "Tips: Kinetic damage is much more important than thermal, both incoming and outgoing."
  - text: "Tips: The battleships with higher bounty will deal much higher damage than the ones that have lower bounty so you should take them out asap."
