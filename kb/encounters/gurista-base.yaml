restrictions:
  - text: "Ship size limit: T2 Battleship"
notes:
  - text: The site is very similar to Provisional Gurista Outpost. This site is doable in an Extender fit Drake. MWD or long-range weapons are recommended due to enemies spawning very far away.
  - text: Warping to the site lands you at an acceleration gate.
  - text: "Escalation: This site can escalate to Consequences Smonsequences."
  - text: 'Escalation: Escalation start: Guristas are the ones of the pirate factions who one usually thinks about as common thugs and loosely organized at best, but as far as you could see, this here was actually an advanced weapon lab run by these "common thugs", something is not right and you let your scanners go to work on the stations remains. While studying the ruined structure and ships, you get hold of some logs containing communication records which lead you to believe that this here operation was contracted and financed by an outside agent, or at least someone who didn’t identify himself as a part of the Guristas. In these records there are lists of orders and deliveries, everything going through a place called Zelig’s patch. That name rings a bell... well, you don’t know it personally, but your computers quickly connect this name with an entry in the regional trade registry, this is a trader in high tech lubricants and he even has an address...'
