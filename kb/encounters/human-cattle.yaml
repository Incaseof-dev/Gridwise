  - name: Pocket 3
    notes:
      - text: The mission completes on warp in, with both a pop-up and a message in local.
      - text: "Blitz: Immediately warp out on mission complete. No combat required."
      - text: "WARNING: ALL of the Imperial Navy Gamma II Support Frigates have warp scramblers."
      - text: In the third room of this mission, there are six groups of enemy ships in a 2x3 grid, about 160 km away from warp-in. Each group has two battleships, five frigates, and the bottom left group has the three Mallers. In addition, one of the five Gamma II frigates starts 20km away from warp in and will attempt to scram immediately. The Jakars attack with cruise missiles, while the rest of the battleships attack with beam lasers. The DPS in this room is extremely high - enough to destroy a heavily tanked Raven in roughly 30 seconds. If you insist on completing this room, it is strongly advised to bring at the very least a marauder with logi support.
      - text: "Pop-up: System message: Warning! Multiple battleships have been spotted. Suggested action: Tactical retreat."
      - text: Drops about 2500 m3 of loot in total, including Large Tachyon Beam Lasers and a chance of some Caldari Navy Fulmination Heavy Assault missiles.
