    url: https://wiki.eveuniversity.org/Human_Cattle
    license: CC BY-SA 4.0
    retrieved: 2026-10-23
    revision: "230659"
defaults:
  confidence: verified
  source: uni
objectives:
  - text: Retrieve the data chip(Encoded Data Chip - 0.1) from one of the habitation modules and return it to your agent. Please note you are not supposed to destroy the habitation module in this case.
notes:
  - text: Human Cattle is a 5 part mission chain. It consists of 4 encounter and a courier mission.
  - text: "Blitz: Destroy the Rogue drone ships, pick-up the data chip and get out."
  - text: "Agent completion message: Interesting. The data chip was in fact damaged by an ultra-powerful EMP burst. This would also explain why we received no distress signal from the settlement when the inhabitants were abducted. I assume whoever the perpetrators are, they are trying to be extra careful to avoid detection. The bad news is that our surveillance equipment was disabled by the EMP burst before it could detect who the attackers were. Therefore we're back to square one.*sigh*"
  - text: Warp-in at about 10-20km from the gate.
pockets:
  - name: Warp-in
    notes:
      - text: You have to dispatch the drones to open the cargo can (disguised as a habitation module) and pick up the data chip needed for the mission.
      - text: The bulk of the incoming damage is from the missile batteries, using Scourge Light missiles. They do roughly 10x as much damage as the ships.
      - text: "Agent completion message: Sorry about the trap you had to deal with, . Those drones and sentry guns must have been set up by whoever was behind the disappearance of the inhabitants. Thank goodness you made it out alive."
      - text: 2022-05-29 While the EVE-Survival import reports 2.4% standing loss with Caldari State no loss was seen.
