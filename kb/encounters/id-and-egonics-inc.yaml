notes:
  - text: "Suggested ships: Battlecruiser, Hauler (to pick up the captives)"
  - text: The mission contains 2 pockets. The first pocket must be cleared of NPCs before the acceleration gate can be taken. The NPCs are around 20 km away.
  - text: Both pockets contain a few battleships; they have poor tracking and can be speed-tanked in a cruiser.
  - text: "Possible Blitz:"
  - text: Kill the first pocket with a standard combat ship and then destroy the slaver in the second pocket.
  - text: Change ships to a T1 hauler. The fitting should include a tractor beam, medium prop mod, and passive/buffer shield tank of large shield extenders and hardeners.
  - text: Return to the second pocket, tractoring the mission objective can while aligning out, loot it and warp out.
pockets:
  - name: Warp-in
    notes:
      - text: Initially, the Amarr Slaver is present in the pocket next to the acceleration gate. He will taunt you in local, then warp off quickly.
      - text: No standings loss from killing the Amarr ships. Gate is locked until they are destroyed.
    waves:
