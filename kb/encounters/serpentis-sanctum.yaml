notes:
  - text: Serpentis Sanctum comes in two types.
  - text: Type 1 consists of one ungated pocket. In the pocket, you will find 5 large structures called Magnetic Double-capped Bubble and the initial NPCs between them.
  - text: If you have a mobil tractor unit, start orbiting it. If not, you can orbit one of the structures in the pocket.
  - text: Start by killing the smallest size ships, and save the next wave trigger NPC for last.
  - text: Information on this site is not very accurate.
  - text: Type 2 consists of one ungated pocket. In the pocket, you will a very large station (Pirate Complex), rock formations and scattered rocks. Initial Defenders spawn a few seconds after arriving into the site.
  - text: "Escalation: Can escalate to a Serpentis Fleet Shipyard."
lootNotes:
  - text: ~35.000.000 ISK bounty
  - text: ~19.000.000 ISK in salvage
  - text: Possibility for rare drop
