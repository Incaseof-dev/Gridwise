notes:
  - text: An extender fit Drake can run this site. Bring a MWD or long-range weapons, as the enemies all spawn very far away.
  - text: "Escalation: The site completes and de-spawns upon destruction of the faction battleship or the Serpentis Armory structure in Room #2 (if the faction battleship did not spawn). The site has a chance to escalate to Contract Killers."
lootNotes:
  - text: You can get about 4 million isk in bounties from this site. If the faction battleship spawns, you can get an additional 4 million isk in bounties, plus the value of its faction loot.
