notes:
  - text: "Rating: Class 8 Level 3"
  - text: Single ungated normal space pocket. Killing the last hostile ship triggers a reinforcement spawn. Be advised, especially if attempting to complete the site inattentively, that in addition to being warp disrupted during the 3rd Reinforcement Spawn, you will often be double-webbed and occassionally triple-webbed, causing damage to spike if you are attempting to tank with angular velocity. Bounties of 24m as at 03-14-2025. They have since been nerfed.
  - text: "Escalation: The anomaly can escalate to: Dark Blood Fleet Staging Point"
