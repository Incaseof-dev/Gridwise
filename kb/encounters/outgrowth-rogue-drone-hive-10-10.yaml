    onWarpIn: This outer section of the complex shows stark signs of the rogue drone infestation. The few human station structures that used to occupy this pocket have been reduced to debris, safe for a single storage facility. Odd drone-built constructions dominate the scene, serving as maintenance platforms for the resident automated machinery. Scouts have reported the acceleration gate being actively scrambled by the local defense force, requiring total elimination of drones before it is possible to continue deeper into the complex.
