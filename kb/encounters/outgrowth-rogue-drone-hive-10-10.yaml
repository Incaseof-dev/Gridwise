    onWarpIn: "This deadspace complex once held a great naval installation, but after a strain of rogue drones attacked and seized the complex, little remains from any human inhabitation. The sector has now been taken over for an outgrowth hive of the strain, though it is not developed enough to count as a true mother hive. DED Threat Assessment: Dangerous (10 of 10)"
  - name: Second Pocket
    notes:
      - text: ----
      - text: The room contains two acceleration gates. Ancient acceleration gate will take you to the third room while the surging acceleration gate will take you straight to fourth room but requires Plasma Physics to use. It also requires Zbikoki's Hacker Card (consumed on use) found in The Right Hand of Zazzmatazz. In a fleet only one member needs to have the hacker card. Once opened the gate will stay open for 10 seconds an allow passage to everyone with the required skill without requiring new hacker card.
      - text: The Surging Acceleration Gate can be used to blitz the site by skipping the fourth and fifth pockets, but you will miss out on some of the site's loot. If you want the full loot from the site, take the Ancient Acceleration Gate.
