notes:
  - text: Outgrowth Rogue Drone Hive is a DED 10/10 rated combat site that is found in null security space.
  - text: This site can be found by scanning cosmic signatures or as an escalation from Drone Squad, Drone Patrol, or Drone Horde.
  - text: Note that the DED 5/10 Rogue Drone site found in low is also called Outgrowth Rogue Drone Hive. See Outgrowth Rogue Drone Hive (5/10) for details on that. The two sites are very similar.
