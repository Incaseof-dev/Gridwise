  - name: Pocket 2
    notes:
      - text: The objective is in the Preacher's Quarters, which you can loot without engaging the enemies.
      - text: Note for blitzing, you have to wait a bit (until a message popup?). "Bring Preacher to {Agent Name}" from the mission tracker indicates the completion of the quest, after this you can warp out and complete the quest.
      - text: "Message from the Scions: Fool! Tolmak's gnats won't stop us!"
      - text: "Message from the Preachers: Thank you for saving us, we come in peace."
    waves:
