notes:
  - text: "Web/warp disruption: Elite Frigate"
  - text: "Suggested ships: Sniping Battleship, Heavy Assault Cruiser, Tech III Cruiser"
  - text: Extreme damage
  - text: Ungated semi-deadspace pocket three jumps away in Adacyne. You can warp around freely.
  - text: "Blitz: Destroy all Battleships, then destroy Rosulf Fririk. Pick up Ralie Ardanne from the Cargo Container."
  - text: "Tips: Either keep Pator 6 Elite Battleships at 140 km or be prepared to take 300 DPS from each as every is equipped with:"
  - text: "Tips: 125 Explosive DPS, 148 km range Missiles"
  - text: "Tips: 80 EM, 32 Kinetic and 64 Explosive DPS, 34+44 km range Turrets"
  - text: "Tips: 1000 m/s propelling Microwarpdrive"
  - text: "Tips: Addendum: It seems the Pator 6 Elite Battleships rarely use their MWD at ranges of 80km and under."
  - text: "Tips: It is suggested to use an MWD battleship (600-700m/s should be sufficient) and stay at 60+ km to avoid taking full damage. The Pator 6 Elite Battleships' turret fire is speed-tankable if you have a decent MWD."
  - text: "Tips: Alternatively, an MJD sniping battleship or marauder works well. Make sure you either have the range to stay out of range completely or the tank to hold under DPS pressure."
  - text: "Tips: Afterburner-fit Tech III or Heavy Assault Cruisers can orbit at close range and speed tank. The Elite Battleships have relatively poor tracking speed and their missiles don't apply well to anything smaller than battleships."
  - text: "Tips: The Elite Battleships will attempt to starburst out to ~40 km if you are too close to them. Try to force them to stay relatively clumped together if you rely on speed tanking, since you will have low transversal against individual battleships if you let them spread apart and cause them to ramp up a lot of damage."
  - text: "Tips: The Pator 6 rats deal primarily a mix of EM and Explosive damage, while Syndicate Battleships deal Kinetic/Thermal. Thus, it is recommended to omni-resist tank for the mission (but primarily Ex/Th), or switch before triggering the battleship wave."
  - text: "Tips: Sniping battleships can easily stay out of range of non-explosive damage, or all damage if past 148km. Cruise Ravens are ideal for this, or a cruise Praxis/Typhoon with missile-range-extending mods. Create bookmarks as you warp in to bounce between."
  - text: "Tips: Facetanking without use of a marauder is not advised for this mission, as you will need the ability to handle over 1800 DPS (omni damage types) for extended periods of time."
  - text: "Tips: If you are taking heavy damage, align out to a station and warp away if needed."
