restrictions:
  - text: "Ship size limit: Battleship"
notes:
  - text: The site consists of two deadspace pockets with acceleration gates, various structures and their defending pirates. Using the gate allows access to other areas within the site. The names and amount of ships listed may vary slightly.
  - text: "Escalation: After destruction of the Dread Guristas Imputor/Arrogator or Experimental Weapon Tower, you may receive the escalation Sooth Sayer."
  - text: 'Escalation: Destroying Dread Guristas.: "While fighting the last defenders of this hideout, you noticed three of their ships warp out and disappear from radar. Your navigational computer has had a few minutes now to mull over the data they left and has come up with a probable destination in case you want to chase them."'
  - text: "Escalation: Destroying Experimental Weapon Tower: Gurista commander destroyed. Determining probable origin point...found. Updating your journal with the location."
  - text: "Escalation: Possible escalation failure: The trail seems to run cold at this point."
