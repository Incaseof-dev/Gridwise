notes:
  - text: Objective
  - text: Deliver Tahaki Karin to the SoCT Luxury Spaceliner at the designated location in Arnon.
  - text: Notes
  - text: "Another uneventful courier mission. Don't forget to load your cargo before you depart the station. After dropping off your cargo in the SoCT Luxury Spaceliner, you'll get a pop-up message from a new agent, Kitar Ang, who will tell you: \"Republic intelligence tells me you might have a lead on our prodigal son, Dagan. He needs to be taken down for everyone’s good. The Republic will watch your back.\" Return to Sister Alitura for the next mission."
  - text: "Item description of Tahaki Karin: Her face is close enough, if you've only seen a photo or a holo. Right height, right weight. Her voice is close enough, too. Accent, vocabulary, everything suggests this is Tahaki Karin. She isn't, of course, but you've been forewarned. Anyone who knew the original would find themselves hard-put to detect the mimic. There are little things, though. The scar on her neck is newer. Her nails are filed smooth rather than roughly clipped. And she listens. To everything. She doesn't make a point of it, of course. But she's taking in everything. The whine of the electrical system, the buzz coming off the gravity plating. Who is she, really? You don't know. But she's closer to being Karin than she is anyone else. Close enough."
  - text: 'On turn in, Sister Alitura says: "Well done, capsuleer. I believe Karin has begun transmitting data already."'
  - text: "Next Mission: Sealing the Deal"
