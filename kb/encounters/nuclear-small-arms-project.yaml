notes:
  - text: 400px
  - text: Nuclear Small Arms Project is an expedition with 4 stages, and the final stage is located in a low-sec system. It has a chance to drop deadspace items. It is found by completing Angel Watch anomalies.
pockets:
  - name: Stage 1
    notes:
      - text: 400px
      - text: On warp in, there will be a stasis tower, some turrets and several mixed ships (frigs-BCs). Incoming damage is quite manageable. (Apparently) after a timer, you will either get the next location or a dead end. Shooting people seems to be optional, but there is almost always a faction ship. For me the escalation for this and the other stages in the expedition, happened immediately after destroying the "Domination" ship. Again a message in local, "Attacking the missile battery triggers an alarm, more ships are incoming!" There are 4 missiles batteries and each one adds more ships to the fray.
      - text: Attacking each missile battery will cause 3 cruiser, 3 destroyers to spawn.
      - text: "Total: 4.6M (Bounties:2.0M, Loot: 1.0M, Salvage 1.6M)"
      - text: You find nothing interesting among the debris. As time passes by, you grow convinced that this is a dead end.
  - name: Stage 2
    notes:
      - text: 400px
      - text: On warp in, there will be debris and a single damaged Mammoth (mini industrial, large collidable object). You're prompted to 'interact' with it in some way. Shoot it. Watch the Drone Carriers warp in then leave. After you've either got the escalation or a dead end, wait for a minute and several BCs and frigates, including a faction ship, will warp in and engage.
      - text: Lots of Veldspar asteroids there.
  - name: Stage 3
    notes:
      - text: 400px
      - text: On warp in, there are several ships and turrets located ~230k away. After a few seconds, you either get the escalation or a dead end. Engaging is optional, but you can warp to the asteroids near them and kill the faction ship for the loot.
  - name: Stage 4 LOW SEC
    notes:
      - text: This stage has heavy incoming damage, and webs, so a significant tank is recommended. Also, range may be up to 40k (I honestly can't remember), so a long-range weapon is preferable.
      - text: On warp in, you will be greeted by a significant number of enemy BCs and smaller along with stasis towers and missile turrets. Although it's probably possible to kill them, my strong suggestion is to immediately target the Secret Angel Facility (tower) and destroy it. This will spawn more ships, and at this point the incoming damage can easily melt a drake's shields in 20 seconds or less.
      - text: "Once the tower is destroyed, the following appears (typo intentional):"
      - text: It looks like you have managed to destroy a facility developing one of the hottest new commodities in the galactic underworld, the Nuclear Small Arms. As far as you know, none of these new weapons have hit the market yet, but from the look of this place, it is not long until common criminals will go nuclear. You cant help wondering what is wrong with the good old sawed off shotgun.
      - text: Bookmark the cargo container that the lab dropped, warp out, and warp back to the container. Loot, then leave. This minimizes your time in low-sec, and makes it very hard for anyone to get enough time to scan you down.
      - text: Loot consists of 130 Compact Nuclear Small Arms, worth approximately 20m ISK on contract.
