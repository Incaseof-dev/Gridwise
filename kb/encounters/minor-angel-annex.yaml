notes:
  - text: Minor Angel Annex is an unrated Complex occupied by the Angel Cartel pirate faction. It can be found by probing in Lowsec. Its signal strength is 10%, making it moderately easy to scan down.
  - text: The site is accessed through an acceleration gate. While a well fit battlecruiser can solo the first part, it would be difficult if not impossible to do so for the second part. This complex is unrated and is of a difficulty similar to a 5 or 6/10 DED Rated Complexes
  - text: "Escalation: This site may escalate to Angel Owned Station."
lootNotes:
  - text: "Bounty: Approx 7 M ISK in the first room, 10 M ISK in the second room"
  - text: "Loot and Salvage: Approx 6 - 8 M ISK in the first room, 6 - 8 M ISK in the second rooom"
  - text: The Domination ship has a chance to drop faction or Gist mods.
