notes:
  - text: "Escalation: Destroying either the Dark Blood commander or the Blood Raider Battlestation can escalate the site to Dubious Assignment."
  - text: 'Escalation: Dubious Assignment: As the bits and pieces from the disintegrated station charge into space, carrying the news of heightened entropy in the universe, your instruments receive an unusual message. It obviously is being transmitted from a Blood Raider ship and even though the person on the other end does not introduce himself as such, there is no doubt that this voice originates in a throat honed for the chilly, whispering and emotionless manner of speaking which is so typical for old timers within the Blood Raider Covenant. He demands talking in a closed channel and after you have established one, he continues with some congratulations on your brave victory and then he gives you an offer; If you go to three different locations he provides, assassinate the Blood leaders operating there and gather all loot you find for him, he will pay you one billion ISK. He then gives you coordinates to a location in a "take it or leave it" manner, before saying farewell and adds that he will contact you after this first target is destroyed.'
