notes:
  - text: "Suggested ships: Frigate"
  - text: "Acceleration Gates: Acceleration gates are not an uncommon sight for most pilots. Like warp gates, each acceleration gate can only be configured for one point in space; unlike warp gates, they can only be used for travel to other points within the same solar system. Acceleration gates can also be locked, preventing pilot from using them. Such locking mechanisms can be based on ship type, on the presence of active guard units in the area, or on appropriate codes/keys."
  - text: "Letters of Bishop Dalamaid:: The letters of Bishop Dalamaid have been the subject of volumes of intellectual discourse. The primary contention of the letters, that true saintly martyrdom is an impossibility for anyone even aware of the concept of sainthood, has gone through various levels of favor over the generations. Letters XIII through XV include a few juicy morsels about a prostitution ring that was run illegally from a monastery of one of the more prestigious orders in Dalamaid's time."
