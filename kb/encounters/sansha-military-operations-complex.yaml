    onWarpIn: "Despite the resource drain of their recent incursions throughout traveled space, Sansha’s Nation has maintained a military presence in deadspace pockets. One favored Sansha strategy is to hide outposts behind isolated or abandoned Amarr stations. All Sansha communications are then encrypted with an adaptive security key and hidden in pre-recorded Amarr chatter. The complex security is dependent upon the True Sansha Archduke, a vessel containing a physical network of True Slaves that serve as a living security key for their network. Eliminating the Archduke will render all Nation assets inoperable. DED Threat Assessment: 7 of 10"
