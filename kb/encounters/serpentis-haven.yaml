notes:
  - text: "There are two types of Havens: rock and gas. Gas havens have enemies pre-spawned, but the enemies are much more spread out. Rock havens have the enemies grouped together, but it takes a few seconds after warping in for them to spawn."
  - text: The site can be done in any drone boat.
  - text: The site consists of one ungated pocket. There is a hollow rock with a stargate inside about 20 km from warp-in.
  - text: The initial defenders will take a few second to arrive and new wave spawns once all ships from previous spawn are destroyed.
  - text: The site consists of one ungated pocket.
  - text: "Escalation: Can escalate to the Serpentis Fleet Shipyard."
lootNotes:
  - text: "Bounty: about 40.000.000 ISK"
  - text: "Modules: Roughly 6.000.000-15.000.000 ISK"
  - text: "Salvage: about 15.000.000 ISK"
