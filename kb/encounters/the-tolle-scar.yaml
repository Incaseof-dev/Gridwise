  - name: Room 1
    notes:
      - text: "The Tolle Scar: Antechamber: Further inside the compound, the area shows signs of a large-scale fight. To this day, the frozen corpses of men and women drift aimlessly amidst the debris. Structures are peppered with antimatter impact craters, in all cases showing signs of an instant and violent decompression. There was clearly no trial here for those criminals caught by Federation forces. Whoever was living inside these pleasure hubs was evidently never supposed to survive the initial attack, which must have been swift and unexpected. Despite the vista of death and destruction, this second area is crawling with signs of life. Among the twisted metal and burned hulls is the unmistakably alien movement of rogue drones as they rally and build in numbers inside their monstrous hive. They are not alone, however. Off in the distance, a convoy of Minmatar combat vessels bearing no ID tags idle their engines and remain fully aligned for a warp-out."
