  - text: "Web/warp disruption: Strain Decimator Alvi"
  - text: 5M ISK from Bounties
  - text: "Impetus: Impetus is the main producer of holoreels in New Eden, creating anything from epic historical movies to cheap porn flicks. Their cadre of established directors alone number in the tens of thousands; the actors they employ are literally countless. On one hand, the near infinite nature of their resources allows for the production of many risky, experimental holoreel projects, and yet at the same time, it is all too easy for an aspiring holoreel actress to get lost among a thousand other beautiful faces."
  - text: "The Tolle Scar: This ancient compound lies derelict and abandoned. Even Serpentis forces, known for tirelessly seeking out new footholds inside Federation space, remain unwilling to move into this prime strategic real estate. Few details are known about the events that took place here, and the local residents will all-too-eagerly move a curious tourist on to less uncomfortable topics. For most people, it is enough to know that the area is referred to as “The Scar”."
  - text: Gated deadspace pocket 0 jumps away in the same System.
  - text: "Blitz: approach the Gate, kill all ships, take the Gate and kill the Alvus Queens."
  - text: Complete the Mission remotely.
  - text: "Tips: You only need to kill the Alvus Queens in the last room to complete the Mission"
