  - text: Take out the Auxiliary Power Array
notes:
  - text: thumb|128px|Tarak Erand
  - text: "Smuggling: Smuggling is one of the larger illegal industries in New Eden. Each nation in the cluster has numerous underground distribution cartels sourcing all sorts of illicit goods. Tracking the movement of ships and their cargo across borders is a monumental task that often spreads customs agents thin. For this reason, it isn’t hard for a determined smuggler to find loopholes that they can exploit in the busy shipping schedules."
  - text: Objective
  - text: Take out the Auxiliary Power Array. Location is within the system, follow the warp link.
  - text: Notes
  - text: Don't worry about the number of pirates on your overview - the smugglers and the Nidhogger will warp out as you fly towards the Array, leaving 4 watchmen remaining. These will aggress you when you get close to the array.
  - text: Mission is completed once the power array is destroyed. The pirate ships do not need to be destroyed.
pockets:
  - name: Pocket 1
    notes:
      - text: If the Power array is destroyed before the trigger the reinforcements will not arrive.
      - text: "Agent hand-in message: My men finished cleaning up the remaining hostiles just a few moments ago. You'll be pleased to hear this though, . We caught someone trying to flee the scene; we think he knows something about the guys running this whole operation. He's been taken into questioning. If he does know anything, we'll have the information ourselves very shortly."
      - text: "Next Mission: Hunting the Lieutenants"
