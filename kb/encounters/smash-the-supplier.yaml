    notes:
      - text: No aggro upon warp-in. One big group at around 60 km distance (perfect for sniping).
      - text: Ships begin to spawn after accepting the mission, so be quick to the encounter otherwise you may be faced with overwhelming fire.
      - text: "No information regarding individual spawns at the moment, following a full list of ships that spawn:"
      - text: "Recommended generic setup for blitz: sniper (>100 km) with an afterburner"
      - text: "WARNING: Destroying the Control Tower without killing any ships still incurs a 2.4% standing penalty. Decline this mission if you care about your Amarr standings."
      - text: Blow up the Enemy Control Tower, and the mission is complete (Shipyards explode by themselves once Control Tower is killed). The Control Tower has zero resists, so hit it with your highest damage ammo.
      - text: "- Use a ship capable of speed-tanking if you can't survive sustained fire from the whole pocket."
      - text: "- The Control Tower has approximately 150,000hp. Fit for a good tank if you're going for the blitz."
      - text: Dropped tags
      - text: Imperial Navy Captain Insignia I x6
