objectives:
  - text: Capture the pirate(5x Prisoners, 75) your agent wants to interrogate. But first you must confront Drazin Jaruk who holds the key to your target.
notes:
  - text: "Dammage to resist: two with all types"
  - text: Guristas Strike - The Kidnapping is the third mission of the mission chain Guristas Strike. Unlike most storyline missions this mission gives no faction standing, but it does give agent standing. The faction standing is awarded for the final mission in the chain.
  - text: "The Odamian Renegades: The Odamian Renegades named themselves after the system where their organization was founded, in the Gallente controlled Placid region. The founders themselves were mostly made up of adventurers traveling from the Gallente capital system, Luminaire, searching for fame and fortune in the frontier. There they came into contact with Dakeur Hullan, a charismatic pirate veteran who had been working for the Serpentis organization until an unfortunate incident saw him outlawed from their territory, with a sizeable bounty on his head. Despite his misfortunes, Dakeur still had numerous contacts throughout the criminal world, both inside Serpentis and Gallente controlled space. With Dakeurs experience within the underworld of the Gallente Federation and his co-founders surprising piloting skills, the Odamian Renegades quickly garnered a reputation as a powerful and infamous drug smuggling syndicate within the Gallente territories."
  - text: Deadspace with gates
  - text: "Popup: Mission Info: This asteroid field has just recently been settled, by a group of pirate freelancers. A hastily erected mobile habitat floats idly in the midst of the giant rocks, while groups of mercenary ships lazily orbit various asteroids in defensive positions. One of the ships clearly has the markings of your target, Drazin Jaruk, who seems to be the leader of this bunch. You also notice another acceleration gate nearby which you guess, judging from it’s fairly clean exterior, has been only recently installed. Where it leads to is anyone’s guess."
