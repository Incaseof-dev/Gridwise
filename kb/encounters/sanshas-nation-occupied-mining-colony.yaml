    onWarpIn: 'DED Database Excerpt: Despite numerous laws across the empires bolstering security regulations after the outbreak of Sansha incursions in YC 113, mining colonies still provide a weak, target-rich environment for pirate factions... Sansha raiding fleets are wiping out the colonists and using their own Slaves to crew the mining equipment until it fails, leaving the colony as an empty husk. Eliminating the True Sansha Foreman is the most reliable way of shutting down the entire operation. DED Threat Assessment: 4 of 10"'
  - name: Room 2
    notes:
      - text: Rats are split in two groups and auto-aggro very quickly. Combined pocket damage can well exceed 500 DPS, but it falls off very quickly past 40 km. The left group will primary medium and heavy drones en masse and can quickly kill them from the sheer burst damage.
      - text: True Sansha Foreman requires 190 DPS EM to break its armor tank, but that will take time, so 200+dps EM is advised.
      - text: "Example times: A Jaguar with 180dps EM unheated will do the whole site (all opponents - loot Foreman) in about 25-27mn (11-12mn blitzing), whereas a Gila can do the whole site in less than 10mn (5-6 if blitzing)."
      - text: "Upon foreman death: Foreman Eliminated: The Foreman has been eliminated. All attached Slaves in the colony are now useless to the Sansha. Time to scoop up the loot."
