notes:
  - text: "Suggested ships: Cruiser"
  - text: Alluring Emanations is a mission involving combat against Rogue Drones. There are multiple level variants.
  - text: Upon warp-in, there will be one rogue drone at approximately 50km. Destroying this drone completes the mission and spawns an ambush group of 42 additional rogue drones.
  - text: The ambush group does not need to be destroyed, and because drones do not drop loot, it may be more time-efficient to blitz the mission by simply destroying the initial single drone and warping away.
  - text: Pilots who wish to engage the ambush group should ensure that they remain outside of the ambush group's optimal range, as getting too close can result in massive amounts of damage due to the number of hostiles.
