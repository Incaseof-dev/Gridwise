objectives:
  - text: Deliver the farming supplies (150) to the storage warehouse.
notes:
  - text: No combat required.
  - text: "The Caldari Mindset: Despite the existence of several popular political ideologies, financial concerns are the primary driving force among the Caldari people. Although the Federation often tries to paint the Caldari as soulless capitalists, most Caldari view any economic concerns as an extension of their pragmatic mindset, not as an inherent love for money."
  - text: Objective
  - text: Deliver 1 x Farming Supplies (150 m³) to the storage warehouse in Hatakani.
  - text: Notes
  - text: --You can complete this mission and accept the next one remotely.--
  - text: This is a simple transport mission. Check your cargo hold - the farming supplies require 150 cubic meters as warned by Agent Asaka. You'll warp to an acceleration gate. After activating the gate, you'll arrive in a deadspace area - the Storage Warehouse container will be 16km away.
  - text: "You'll get a message from Asaka: The Caldari forces look far better prepared this time around. “Anti-support” Frigates and Cruisers flank their larger allies, standing ready and able to deal with any smaller hostiles that come their way. If these drones try to escape, the faster and more agile ones won’t slip past the amassed fleet so easily now."
  - text: "The rogue drones won't bother you if you don't bother them. Simply travel to the warehouse and drop your cargo into it. Your mission objectives will then be fulfilled. You can complete the mission remotely - you'll then receive this message from Agent Asaka: Yes, I just received word from the colony. They should be able to stick to their production schedule, which is great news. Thank you, pilot, you’ve done the Caldari people a great service today. If you need any further help with your drone investigation, just say the word."
