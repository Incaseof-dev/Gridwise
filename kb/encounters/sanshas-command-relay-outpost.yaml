    onWarpIn: "This small outpost acts as a monitoring and coordination hub for the Centus division of the Sansha armed forces in this sector. It also relays communications between neighboring battletowers. DED Threat Assessment: Unsafe (3 of 10)"
  - name: Room 2
    notes:
      - text: "Upon taking the gate: Relay systems such as this one are the heart and soul of Sansha's Nation. Broadcasting a constant stream of strange and incomprehensible directives from a long-dead master. Even so, the Centus squadron guarding this base should not be dismissed as mere mindless drones."
      - text: The damage in this room can exceed 600DPS if you are not careful; however, the room is mostly destroyers, and they only deal significant damage within 10km. The destroyers are also fairly squishy, so they die quickly, reducing room DPS.
      - text: If you are in a well-fit (t2 or equivalent) cruiser, you can safely ignore everything except the Centus Black Ops Commander. Quickly kill him, burn to his wreck, loot, and warp off. Only one heavy missile battery will aggro on warp-in, so the sentries will not be a major concern as long as you keep your distance.
      - text: As a T1 cruiser, you can launch a single light drone, make it shoot once in an overseer frigate, and scoop it back. This will trigger his aggro and lure him out of the group.
      - text: The Centus Black Ops Commander has high omni resists in shield(90% to all damage types) but is weak in armor and structure.
      - text: "Upon destroying the Centus Black Ops Commander, if the site was from an escalation:: The Black Ops Commander has been destroyed, and with that, this space is safe from Sansha's mindless slaves once more."
