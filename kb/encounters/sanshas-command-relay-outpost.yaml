    notes:
      - text: The Squad Leader has much stronger resists and is immune to stasis webifiers, target painters, and possibly other EWAR. The Squad Leader drops a Command Relay Key which is needed to open the next gate and is reusable. All ships must be destroyed to unlock the next gate, in addition to the key. Note that the key is not used up by the gate.
