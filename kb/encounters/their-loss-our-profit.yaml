  - text: Destroy the Hyasyoda Research Facility and recover 1x S.I Formula Sheet (0.1 m3).
notes:
  - text: 3% Serpentis Faction Standing loss; 15M ISK in Bounties
  - text: "Bad Habits: Rivalry among the corporations of the Caldari State is a daily reality, even today. The breakdown of relations with the Federation, opportunistic Guristas invasions and countless other problems facing the Caldari people have done little to ease inter-corporate tensions, some of which predate the existence of the State itself. In other situations, rather than unifying the Caldari people, external threats only cause further divisiveness, and it is not uncommon for such issues to be leapt upon and twisted towards serving the agenda of one corporation or another. Survival within the harsh political arenas of the State requires a mastery of political cunning. To succeed requires even more – not only the ability to deeply understand events, but the capacity to shape them as well."
  - text: Accept the Mission remotely.
  - text: Ungated semi-deadspace pocket one jump away in Obanen (or Liekuri?).
  - text: "Blitz: destroy the Hyasyoda Research Facility and pick up the S.I Formula Sheet."
  - text: "Tips: You do not need to destroy any ship"
  - text: "Tips: If you can't survive the incoming damage destroy a few Battleships, but make sure to leave one Core High Admiral alive"
  - text: "Tips: Hyasyoda Research Facility has about 150 000 Hitpoints and 0% resistance"
  - text: "Tips: You will lose 3% Serpentis Faction Standing when you destroy the Hyasyoda Research Facility"
  - text: "Tips: You can freely warp inside the rooms"
