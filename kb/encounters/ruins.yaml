notes:
  - text: When you warp in only frigates are on site. Rest of the initial defenders spawn shortly. Only Strain Splinter/Render/Decimator/Infester Alvi frigate types will web and point.
  - text: 'Escalation: Menacing Mechanics:: This drone operation was so small that it could hardly be called a "hive", there were no substantial assembly plants or other major factories here. It looked more like a maintenance station, something that does not rhyme with what you have heard about drones and how they operate, as they usually are confined to self sufficient hives and perhaps operating small resource gathering satellite ops. But a drone maintenance station, servicing several other hives or passersby is almost unheard of. After scanning through the remaining debris, your instruments gather some service logs, further supporting the idea this was an open maintenance station. Most of the serviced ships seem to have been standard drone vessels, but you can also see some entries naming ships used by humans, even though it does not say anything about who was flying them. Some of the log entries contain extra notes on these customers and among them you find something that looks like coordinates in a system not too far away.'
  - text: "Escalation: Can escalate to Menacing Mechanics."
