notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: Single ungated pocket.
  - text: "Important Note: All rats in this mission have 60%+ (often 70%+) lowest resistance (explosive) and resistance is same for shield and armor!"
  - text: "Tips: Snipers can warp [fleet] at range. All groups and spawns will auto-aggro."
  - text: "Tips: Set your drones to passive to keep them from taking out trigger ships that could cause swarming, and watch them for frequent aggro."
  - text: "Tips: The last Hostile killed of a ship class triggers the next spawn unless marked otherwise."
  - text: "Tips: Following the trigger sequence is advisable for a sniper too, since even the Battleships move in fast."
  - text: "Tips: The Frigate spawn may not show up."
  - text: "Tips: Mission is flagged completed after you have killed the last Battleship."
  - text: "Tips: As usual divert Drone aggro by pulling them in for a second. Remote Shield Booster is an option for Sentries."
  - text: "Tips: The naming convention under the Overview for Type and Name are swapped. This results in Angel Destroyer being seen as the default name, instead of Gistior Seizer."
  - text: "Optional Approach: Use Micro Jump Drive as it's much easier to take everything out from a distance."
  - text: "Blitz: Kill the initial group, ignore the elite frigates, and focus on the reinforcement wave (triggered by the frigate)."
  - text: "Blitz: You may want to kill some or all of the elite cruisers and battlecruisers to reduce incoming damage."
  - text: "Blitz: Kill the disruptor frigates and all the battleships, done."
lootNotes:
  - text: "Loot: 1-14 million"
  - text: "Note: Loot for this mission is highly luck dependent. You can get several Clutch Restrained/ Pitfall Compact Warp Field Disruption Generators, worth around 2.7-2.8 million each. On one run I got 4 of these in total and ended up with 13.9 million ISK in loot as a result."
  - text: "Salvage: ~1.4 mil"
  - text: "Bounty: ~10 mil"
