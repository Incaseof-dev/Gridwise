notes:
  - text: The Ancient City is an extremely difficult escalation from the Sansha Provincial HQ and possibly other Sansha sites.
  - text: "Site Description: As the dust settles from the battle, you receive a transmission from someone claiming to be a local vigilante who congratulates you on a job well done. Your computers run a check on his ship ID's and other info they can gather on him in such a short period of time, but come up with nothing. He is at least not part of any pirate faction, nor seems he to represent any of the official states in the galaxy. This person continues to welcome you to the area and offers to point you to some other Sansha bases he knows about and have been a menace for the local population. If you want to come and meet him, he will lead the way."
  - text: This escalation has 4 locations, typically each location is 6-10 jumps between each other and can cross regional boundaries. Locations 1-3 are easier to blitz, but Location 4 is one of the hardest sites that exists in Eve.
  - text: It is not guaranteed for each location to escalate. After each location, killing the True Sansha Battleship will either trigger the escalation to the next location or not. If not, your time with the site is over.
  - text: Full details for this expedition are not currently available, the below is provided as best effort because this is a rare escalation.
  - text: No rats warp disrupt/scram in this entire escalation as of writing.
pockets:
  - name: Location 1
    notes:
      - text: "Blitz: Warp in, kill the True Sansha battleship, bookmark the wreck, warp out. Wait 2 minutes for site to despawn, warp to bookmark and loot."
      - text: No gate, you will warp in and the rats will be on the outside of an acceleration gate that does not work. No ewar reported in this room
      - text: "On gate activation to empty pocket: message in local: \"Orso Di Cura: Good to see you decided to come. I can not promise you any payment if you take on these Sansha bases, but you will earn fame among the locals and the fortune the Sansha leave behind. I'm going to send a couple of my spy drones to see if the Sansha are still where they were yesterday.\""
      - text: 'On escalation: The radio crackles, it is the vigilante all excited, who whispers in a conspiratorial tone "They are still here! Come quick and we shall introduce them to pain!"'
