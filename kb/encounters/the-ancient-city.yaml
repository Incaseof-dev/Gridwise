  - name: Location 2
    notes:
      - text: "Blitz: Warp in, kill the True Sansha battleship, bookmark the wreck, warp out. Wait 2 minutes for site to despawn, warp to bookmark and loot."
      - text: "Tip: True Sansha spawn is off to the right, away from the other groups. You can warp to the site cloaked (be careful not to be decloaked by the beacon), bookmark the center and then look for a good celestial behind the true sansha spawn. Warp out to that celestial, then warp to your bookmark at 30km. You'll land right on the TS spawn for a quick kill. Bookmark wreck and warp out, loot in 2 minutes after the site despawns."
      - text: Rats are in 2 main groups with 2 tiny groups on the side. Full site aggros on land. This site has a lot of DPS that will easily break a T3 Cruiser.
      - text: 'No escalation: "We sure did show them! You sure are better than no one to have around when the missiles are flying! But there is no time to float here fabulating, we must press on, another division of this same group is close by! I will pop over and scout, check if they are there still!" All these exclamation marks make you dizzy. It may well be that this guy is not much of a fighter, but he is no coward and you wonder if it is not hard to do scouting missions on an industrial... Around 30 seconds later you receive a transmission "OMG the bastards have scrambled me!! I am getting killed here! Help! Help! I am at moon six, where is everyone, come.." and then the transmission stops. You turn off the radio, there are too many "moon 6" around for you to go looking, and besides, this guy has probably already been turned into two tablespoons of space dust by now.'
