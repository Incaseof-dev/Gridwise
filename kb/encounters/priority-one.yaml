  - name: Room 2
    notes:
      - text: "Agent Conversation at landing: Shit, that wasn't the Senator's son, was it? Get to that wreckage. I need to be absolutely certain who was aboard that ship before I start panicking. Please: salvage the wreck, and do it quickly! The people that did this could be back any moment, and the wreckage itself could start to drift apart and break down even sooner than that, a few hours max. You must act quickly, pilot. Find a savager and move it. You have two hours. They will want updates as quickly as I will."
      - text: "Agent Conversation after salvaging: I'm looking at the analysis now. There is a neatly-cut hole in one of the metal sheets you salvaged; it must have been for a boarding tunnel. I can only guess that after the vessel was boarded, the attackers initiated its self destruct mechanisms. Your sensors don't show any shots fired from the Minmatar ships. This is good. Well...it's bad, very bad, but the Senator's son is still alive. I need you to stay on with us for a while, if you can. Report back to me if you're willing to take on the investigation of this matter, god knows we need the help now more than ever."
