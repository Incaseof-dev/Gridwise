notes:
  - text: "Suggested ships: Battleship"
  - text: No standing loss; Requires Salvager module (Salvage drones do not work)
  - text: Accept the Mission remotely.
  - text: Gated deadspace pocket within 1 jump of Tolle. You meet a shuttle that is trying to get the kid to safety. A hostile fleet arrives. When you land the Shuttle Wreck is surrounded by a fleet of Minmatar Republic ships.
  - text: "Blitz: take the Gate, take the Gate again, salvage the Shuttle Wreck."
  - text: Complete the Mission remotely.
  - text: "Tips: All Acceleration Gates are unlocked"
  - text: "Tips: There is no Minmatar Republic Faction Standing loss"
  - text: "Tips: Depending on your ship and salvage chance you may not be able to survive long enough to salvage the Shuttle Wreck; destroy a few ships first"
  - text: "Tips: Use a Microwarpdrive or a Micro Jump Drive to lure the Fleet way from the Shuttle Wreck"
  - text: "Tips: Remember to fit a Salvager module (Salvage drones do not work)"
pockets:
  - name: Warp-in
    notes:
      - text: "Ardanne Residance: The normally well-guarded antechamber leading to this compound has been brought to ruin. The few structures that remain tell the tale of a swift and violent strike that was evidently part of a deeper breach. All communications arrays have been targeted and destroyed. The area that used to house the Central Security Facility, the hub of all senatorial protection details, has been reduced to a few drifting sheets of burned metal. Judging from the intensity of the fires still burning, the attack only came a few hours ago at the most. The acceleration gate into the next room shows signs of even more recent activation and a shuttle can be clearly identified on the scans ahead."
