  - name: Third Pocket (Hall)
    notes:
      - text: "Database information: A large force of drones has taken up residence in this area. They obviously benefit greatly from salvaging the remnants of the former inhabitants, which still litters this patch of space. A drone presence this large could not be formed without an abundance of raw materials."
      - text: Rogue drones are present in this room. Floating Debris containers require a Relic Analyzer to access.
      - text: "Upon destroying one of the missile batteries: Drones have been deployed from the Drone Bunkers in response to the attack on the sentry guns!"
      - text: "When smartbomb wave is triggered: Someone has triggered an ancient land mine! All ships inside the blast radius take damage."
