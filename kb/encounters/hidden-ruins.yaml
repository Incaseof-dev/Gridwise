    notes:
      - text: "Database information: The source of the drone infestation seems to lie in this deadspace pocket, located inside a fiery nebula. The extreme and hostile environment, accompanied by a very heavy drone presence, seems to have kept most of the looters away, as two fully intact ancient ruins would indicate."
      - text: The Hive Mother does not have very strong tank but triggers several waves of defenders that can possibly overwhelm an unprepared explorer. The smartbomb wave from the Ancient Ruins is strong enough to instantly destroy any frigate not prepared for it.
      - text: "Reinforcements: The Drone Hive Mother has deployed Drone Cruise Missile Batteries along with more drone ships!"
