  - text: Terrorist Plot! is an expedition that can escalate from Guristas Watch.
  - text: "Escalation start: All through the battle, one of the Gurista cruisers was engaged in intense and thoroughly encrypted communications with some other ship in another system. Even though you didn't understand a thing of what was being said, your scanners successfully managed to locate the other party."
  - text: NPCs at intial warp in.
