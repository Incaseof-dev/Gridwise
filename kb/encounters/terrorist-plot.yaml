    notes:
      - text: "Approaching the stash will trigger a one time damage event (around 1,000 damage) and the following text:"
      - text: 'On approaching the stash: "Someone has approached the Viral Stash too closely, triggering an explosion from a hidden trap nearby!"'
      - text: "Opening the stash triggers the following message:"
      - text: "On opening the stash: \"In this container you find stacks of barrels containing viral agent, as well as a list of ship ID's, barrel ID's and times. Most of the times have passed, but the very last one is only a couple of minutes from now, perhaps if you intercept this ship that is supposedly arriving, you may find out more.\""
      - text: After opening the stash, the Relay Officer will spawn after a few minutes.
      - text: "Escalation dead-end: Sadly, the datacore of this ship has taken a direct hit and any information stored there has gone up in smoke."
      - text: "Escalation trigger: After a brief search of the ship's datacore, you find out that the Guristas, under contract from an unnamed third party, are supposed to disperse the viral agent in the atmosphere of two terrestrial planets in Caldari space. No information is given about which planets, but you do discover the coordinates of a rally point for the operation. It appears that a sizeable fleet was supposed to meet there."
