  - name: First Pocket
    notes:
      - text: Simple warp-in can trigger escalation.
      - text: "Escalation dead-end: You are not sure, but it seemed like the ship that slipped away had the markings of the dreaded Federal Intelligence Organization, a Gallente covert-op branch. If this is true, it bodes no good for the Caldari state, nor does it for the Gallenteans come to think of it. Action like this viral terror attack would probably be taken as a war declaration, not that the peace has been so convincing lately between the two. Whatever is to be made of it, your options to affect this matter either way have run out. You have no idea where the agent went and if this was indeed a FIO agent, he is probably already docking in some FIO base in the neighborhood and those bases are not exactly made to be an easy find."
      - text: "Escalation trigger: You are not sure, but it seemed like the ship that slipped away had the markings of the dreaded Federal Intelligence Organization, a Gallente covert-op branch. If this is true, it bodes no good for the Caldari state, nor does it for the Gallenteans come to think of it. Action like this viral terror attack would probably be taken as a full-scale war declaration, not that the peace has been so convincing lately between the two. Whatever is to be made of it, it seems like your instruments got a lock on the agents jump as he cleared local space and the approximate destination is already flashing on your navigation panel. You are not sure if it is a good idea to follow it though, crashing uninvited into a FIO base could be more than you can handle. Either way, you probably only have mere minutes to get there in time."
