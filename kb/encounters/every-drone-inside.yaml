notes:
  - text: Objective
  - text: "Neutralize every drone inside the quarantine area - Location: Hatakani ()"
  - text: Notes
  - text: 'This is a straightforward kill mission. There are 15 (drone/frigate) Rogue Drones attacking you in this mission, however, and you can get overwhelmed if your combat skills are undeveloped. Fit an afterburner on your ship, and be ready to use a kiting strategy - that is, set your "keep at range" combat control to your optimal weapon range, then turn on your afterburner and use that to keep at your optimal distance from each target, starting with the closest targets first. That will maximize your damage while keeping the drones at a safer distance. Remember: if you start to get overwhelmed, warp out - you can always warp back in after some repairs.'
  - text: You'll warp to an acceleration gate. Once in the deadspace area, you'll find yourself at about 100 km from 15 Rogue Drone ships. When you approach, they will all target you at 65 km, and close to attack.
pockets:
  - name: Pocket 1
    notes:
      - text: 'After you destroy all the targets, Agent Asaka will say:: "Nice flying pilot. That’s the last of the drones taken care of. Feel free to inspect the wreckage if you like but I just received an official transmission for you from the Sisters of EVE. Looks like they’ve got a new lead for you to chase up anyways.'
      - text: "Next Mission: A Sense of Dread"
