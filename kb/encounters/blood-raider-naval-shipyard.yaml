notes:
  - text: Blood Raider Naval Shipyard is a null security DED rated site found through exploration.
  - text: The Complex consists of three rooms. All these rooms have serious numbers of battleships, cruisers and frigates inside them. The third room contains an overseer structure, which when destroyed has a chance of dropping Corpus X-Type or Dark Blood modules and a Bhaalgorn BPC. The structure also always drops 23rd Tier Overseer's Personal Effects.
  - text: The complex contains many normal battleship NPCs Renamed as "Dark Corpus", however they are not faction and drop nothing of value.
