objectives:
  - text: Enter the colony and track down any information you can about the Pator 6
notes:
  - text: No Standing loss
  - text: Gated deadspace pocket two jumps away in Charmerout. Gather intel from Minmatar thugs. They won't co-operate so you will need to use force to gain the information from them.
  - text: "Blitz: Warp to zero and destroy the furthest Asteroid Micro-Colony Minor Structure (~ 45 km away). Destroy only the Defender Battleships. Last one will drop the Shanty Town Gate Clearance in a Cargo Container. Take the Gate while ignoring the Cruisers. Again destroy the furthest Asteroid Micro-Colony Minor Structure and kill The Elder."
  - text: "Tips: You only need to destroy the farthest Asteroid Micro-Colony Minor Structure in each room"
  - text: "Tips: Shanty Town Gate Clearance is consumed by the Acceleration Gate, so bookmark Room 1. Allies can follow you through the gate for a short time after activating it."
  - text: "Tips: The Elder's lowest Shield and Armour resistance is 72% Explosive"
pockets:
  - name: Warp-in
    notes:
      - text: "Shanty Town: Refugees from an impoverished world, struggling survivors in decrepit structures, the inhabitants of this colony epitomize the harsh realities of life in space. Scraping together a living from wreckage and scavenged ships, the Minmatar in this group appear quiet and subdued. The downtrodden are often the ones who know the most, although they have very little to gain from it."
      - text: "Agent Conversation at landing: These people know who took Ralie. They're hiding something and won't tell us. Looks like that acceleration gate is locked as well. We'll have to use some persuasion. Smoke those Matari out from their hiding places. One of them will either have the information we need or the means to go through that acceleration gate."
      - text: "Defenders begging: Here's the gate clearance for that acceleration gate. Go through it and talk to The Elder. Just please stop shooting us."
