notes:
  - text: ": While fighting the last defenders of this hideout, you noticed three of their ships warp out and disappear from radar. Your navigational computer has had a few minutes now to mull over the data they left and has come up with a probable destination in case you want to chase them."
  - text: This expedition consists of four different open area locations, all in high security systems (although some low security travel may be required to reach a location). All locations will have a Newly Constructed Acceleration gate leading to a second room. Accessing this gate is not required to complete this expedition. Gates permit all non-capital ships except capsules.
  - text: The ships encountered during the expedition are Frigate and Destroyer class. The names and amount of ships may vary from what is listed here.
  - text: "There may be significant travel involved in completing an expedition. In one instance of this expedition, the sequence of systems the locations appeared in were:"
