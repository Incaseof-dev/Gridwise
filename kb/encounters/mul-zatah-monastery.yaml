restrictions:
  - text: "Ship size limit: Battlecruisers"
notes:
  - text: Mul-Zatah Monastery is a DED 4/10 combat site that can be scanned down with probes, and can be found in high and low security space in the Amarr regions. Alternatively it can be received as an escalation from a Blood Refuge.
  - text: The site is behind an acceleration gate. Battlecruiser hulls and below can access it. Strategic (T3) Cruisers can not enter the site.thumb|400px|Inner Sanctum
  - text: "Expedition start: The Mul-Zatah Monastic order has for a long time maintained close links with Omir Sarikusa and the Blood Raider Covenant. The order is considered by most law enforcement agents to pose a limited threat to security, since they seem to keep to themselves for the most part. They are, however, notoriously intolerant of trespassers near their monasteries and it is not advisable to approach lightly armed. DED Threat Assessment: Risky (4 of 10)"
  - text: The enemies in each room remain passive until the player takes aggressive action. Therefore, sniper-fit ships can easily and safely move to long range before starting combat, and can kill enemies well before the enemies get in range to do damage.
  - text: Short-range combat ships will face a lot of enemy cap neutralizers, so a fit that requires low or no cap to operate is recommended.
  - text: Destroy all enemies in the first room, and be able to tank/avoid enough damage in the second room to destroy the Inner Sanctum. It goes down pretty quickly under fire.
