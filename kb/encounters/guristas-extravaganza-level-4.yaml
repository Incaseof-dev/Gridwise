notes:
  - text: "Web/warp disruption: Web (Guristas Kyoukan/Webifier)"
  - text: "Blitz: Pocket 1 - Destroy all ships."
  - text: "Blitz: Pocket 2 - Destroy the Ion Field Projection Battery and Moon Harvester, then kill all ships."
  - text: "Blitz: Pocket 3 - Destroy the Guristas Medium Refinery, Subspace Frequency Generator, and Asteroid Mining Post. Then kill all ships."
  - text: "Blitz: Pocket 4 - Destroy the Starbase Storage Facility, Starbase Reactor, and Guristas Starbase Control Tower. Then kill all ships."
  - text: "Blitz: Pocket 5 - Kill all Battleships and Battlecruisers from the first spawn."
  - text: "Notes: Structures drop no loot, with the exception of those in Pocket 5 and the Ion projections and Moon harvester."
  - text: "Notes: Asteroid Factory has a lot of armor and there's no point in shooting it."
  - text: "Notes: As of the Trinity 1.2 Update the Guristas Storage Facility no longer drops faction loot."
  - text: "Notes: Many of the frigates (Kyoukan/Webifier) in the earlier waves of each pockets only do little damages and doesn't web (Jan 5th 2025)."
lootNotes:
  - text: "Loot: ± 8.3 Mil ISK"
  - text: "Salvage: ± 4.4 Mil ISK"
  - text: "Bounty: ± 28 Mil ISK"
