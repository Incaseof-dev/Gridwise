restrictions:
  - text: "Ship size limit: Battleships"
notes:
  - text: Sansha Provincial HQ is a null security Unrated Complex found by scanning in Sansha infested space.
  - text: This site is practically impossible to solo, and is often called 'the secret 10/10'. HIGHLY RECOMMEND BRINGING FRIENDS FOR THIS SITE. For running this site, bringing a friend or two is recommended to help tank the DPS in the first pocket or break the Provisional HQ in the second room. T3 Cruisers and T2 Battleships can enter the site. Like with all unrated complexes, you land on an acceleration gate when warping to the complex.
  - text: "Escalation: Destroying the True Sansha commander battleship or the Sansha Provisional HQ may trigger an escalation to the expedition The Ancient City."
  - text: "Escalation: Escalation: As the dust settles from the battle, you receive a transmission from someone claiming to be a local vigilante who congratulates you on a job well done. Your computers run a check on his ship ID´s and other info they can gather on him in such a short period of time, but come up with nothing. He is at least not a part of any pirate faction, nor seems he to represent any of the official states in the galaxy. This person continues to welcome you to the area and offers to point you to some other Sansha bases he knows about and have been a menace for the local population. If you want to come and meet him, he will lead the way."
