  - text: "Space type: Deadspace"
  - text: "Blitz: When group 1 spawns, mission will complete, so you don't have to kill any rats at all if you don't want to, just warp out."
  - text: You are told to investigate nearby structures. Approaching star gate (at 10 km) group 1 spawns. Group 2 spawns only seconds later.
  - text: "Space type: Deadspace"
  - text: "Note: Declining this 2nd mission seems to then grant an alternative part 3 mission called A Crazy Plan (3 of 3)."
  - text: The alternative has the same format and hostiles as the normal 3rd part but there is NO ship restriction on the site.
