notes:
  - text: Drone Herd is an unrated combat site belonging to the Rogue Drones faction. It can be found via exploration as a cosmic anomaly in low-security and null-security systems across New Eden. As an ungated complex, the limitations as to which ships can complete this site are tied to the security rating of the system where the anomaly spawns (T2 Battleships for high-security systems, and up to Titans in low-security and null-security systems). This combat site has a chance to spawn a Sentient commander rogue drone, which drops rogue components and may drop faction drone modules and items. There are two minor variations with slightly different wave compositions.
  - text: This variant contains a prominent Ancient Ruins object.
  - text: "Escalation: There is a chance of getting the Outgrowth Rogue Drone Hive (5/10) or Drone Infested Starbase escalations."
