notes:
  - text: Hunting the Drudge Factory is an expedition that escalates from Chemical Yard.
  - text: "Expedition start message: As you decimate the last remnants of this rogue drone base, your sensors come across some old transportation data; lists of materials, modules, ships and locations. The only reason this is a kind of odd is that rogue drones usually are very self sufficient, making in situ what they need for their colonies. Perhaps this is nothing..."
  - text: "Escalation: This site can escalate to Hunting the Drudge Factory again."
pockets:
  - name: "Location #1 (ungated)"
    notes:
      - text: Sansha ships have been confirmed to spawn as of 7 Sep YC124. They spawn after the Rogue Drone cruisers are destroyed (not on timer).
      - text: "Note: Tackler frigates (WD) in this and next locations have lowest resistance EM of 60%+ so proceed with caution. They also attack drones. (as of Sept. YC124)"
      - text: "Escalation message: Arriving at the most recent location in the files, you come across a blown out rogue drone hive, someone must have been here before you. Thankfully there are a couple of other locations in those files that make any sense to your navigation systems, the closer one being..."
      - text: "Expedition dead-end message: Arriving at the only recognizable location in the files you found, you come across a blown out rogue drone hive. Whatever this once was, it obviously is no more...."
      - text: "Bounty: ± 681K ISK"
