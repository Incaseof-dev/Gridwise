      - text: "Footnote: Without going into too much details, that whole expedition SUCKS ! Much travel (32+ jumps), small rewards, Empty containers, have fun. Read [possible reward] as [next to nothing]."
      - text: 'Expedition complete message: Rogue drones mining and gathering resources far and wide to supply a huge drone factory! This scale of operations does not seem to fit anything you have seen or heard about them before and this level of organization kind of takes the "rogue" out of "rogue drones". You are pretty sure that somewhere, some authority would love to get a report on this. But on second thought... all the paperwork involved would probably be enough to exhaust a black hole.'
