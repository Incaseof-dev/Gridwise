notes:
  - text: This escalation consists of four parts.
  - text: 'Escalation start: In the ruins of this Angel structure you come across some logs containing a report from a ship identified as "Angel of Death". The ship is reporting the progress of operation "Spring Cleaning", where a squadron of Angels roam around the region and wipe out anyone the they view as a threat to their domination in the area. This gang has obviously been busy the last days, the log contains long lists of "confiscated" materials, destroyed structures and recycled biomass, the last item presumably being a measure of how many people they have murdered in the process. The list is a bit vague when it comes to identifying exactly who is being killed, which target is yet to be taken out and where these places are, but you try to extract the specifics and feed it into your databanks, which then relay the info to various search engines and registers in the region in the hope of being able to pinpoint some of the locations. Soon you get feedback indicating where to find one of these places; a small research station where scientists from the Caille University have a field laboratory. Or at least had one .. if the Angels have not hit them already, there is only one way to find out.'
lootNotes:
  - text: The Domination battleships drop faction ammo and dog tags, and may also drop Domination faction modules or even implants. The Gist Domination Murderer in the final location may drop Gist A-Type battleship modules and possibly a rare Machariel BPC.
