notes:
  - text: Angel Hideaway is an unrated combat site belonging to the Angel Cartel pirate faction. It can be found via exploration as a cosmic anomaly within systems owned by the Minmatar Republic or occupied by the Angel Cartel. As an ungated complex, the limitations as to which ships can complete this site are tied to the security rating of the system where the anomaly spawns (T2 Battleships for high-security systems, and up to Titans in low-security and null-security systems). Completing this complex may award the player with valuable Domination faction modules and ammunition.
  - text: "This combat site consists of a single ungated pocket of space containing a variety of Frigate-sized enemy ships. Destroying all hostile ships may escalate into the DED rated Angel Repurposed Outpost complex. Three variations of this combat anomaly exist: Angel Hidden Hideaway, Angel Forsaken Hideaway and Angel Forlorn Hideaway."
  - text: Single open normal space pocket.
  - text: "Escalation: Angel Repurposed Outpost"
