notes:
  - text: This expedition is in nullsec, with all four parts in Sansha infested nullsec. A high DPS ship is recommended to take out Naberius Marquis in the final location.
  - text: "Escalation from Sansha Military Complex: Going through the logs from one of the command ships you blasted, you come across a recent memo containing a draft for a plan where forces from this Military Complex and another similar to this one were to gang up and raid a space trucker station somewhere in the region. Where this space trucker station is, is not included in the logs, but the location of the rally point is there. It is supposed to be by a small asteroid belt, not too far away."
