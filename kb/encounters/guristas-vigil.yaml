restrictions:
  - text: "Ship size limit: Battlecruiser"
notes:
  - text: This site's acceleration gate allows only Battlecruiser class ships or lower and their Tech 2 equivalents to enter the site.
  - text: The site consists of three deadspace pockets with an acceleration gates, various structures and their defending pirates. Using the gate allows access to other areas within the site. The names and amount of ships listed may vary slightly.
  - text: 'Escalation: Kidnapped!: "As you enter the room, you receive a weak transmission; a hushed voice sneaks through your audio system, hastily whispering some words. All you can understand is something about kidnapping, pirates and a group of people. You play it back a several times, trying to make sense of it, but you can not discern who is kidnapped or how this group of people is involved and you cant actually hear what part the Guristas play in this, even though you take it for granted that they are the kidnappers in question. This message was sent on a general channel and your instruments have no problem pinpointing its origin. They have actually done so already in case you would like to investigate this further. Cant beat these new auto-personalizing AI systems, you have had this one for only a few days and it already feels like it has known you all your life."'
  - text: "Escalation: This site can escalate to Kidnapped!"
