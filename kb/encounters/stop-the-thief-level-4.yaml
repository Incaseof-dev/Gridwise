notes:
  - text: "Web/warp disruption: Mercenary Wingman"
  - text: "Video guide: Navy Raven, Sentry Dominix, Maelstrom, Gila, Manticore (Blitz) 2024-04-21"
  - text: Single ungated normal space pocket. Initial Group aggro at warp-in. Spawn may aggro drones.
  - text: You may [Fleet] warp to preferred range distance.
  - text: '"The Shadow" drops the required reports. Unlike in other missions the item is added directly to your inventory instead of dropping a container in space.'
  - text: "Tip: Start with the Grunt Cruisers to reduce incoming DPS from the spawn. Watch out for any scrambling Frigates and shift your primary target accordingly."
  - text: Optional Approach
  - text: Warp in, align, kill the Overlord, instantly warp out before scramblers lock on, then warp back at 50- 100km, make sure you're outside of Cruiser's range. Then aggro and use a MWD to separate the frigates. Count on webbing if Frigates come too close! After this keep aligning of course.
  - text: Select "warp-to" distance between 50- 100km, kill all the initial ships and the Overlord last then pick off the spawn as they approach.
  - text: Tank the Overlord and snipe everything else, Micro Jump and snipe the Overlord and Spawn.
  - text: "Warning: High EM damage from Shadow's Grunts"
  - text: "Blitz: Eliminate the Mercenary Overlord battleship to trigger the spawn. Watch out for any incoming Mercenary Wingman Frigates that web/scramble."
  - text: "Blitz: Eliminate Shadow. The Reports are automatically transferred to your ship cargo. Warp out (any Reports sold by NPC Corps on the market may be used)."
  - text: （A Gila with 44k EHP even resist passive shield tank doing this way without destroying ship that web/scramble, remain 5%~15% shield when warp out, YMMV. Small delay in operation may cause ship lost, use at own risk.)
  - text: No Warp Disrupt - July 14th 2023
