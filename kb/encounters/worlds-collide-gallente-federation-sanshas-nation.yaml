  - text: "Blitz: Pocket 1: Approach the Sansha gate kill the triggers or use Zbikoki's Hacker Card to jump in. (the card is consumed in process)"
  - text: "Blitz: Pocket 2: Kill web frigates with your guns/missiles then approach the acceleration gate (be sure that you don't go near group 2 or group 3 in order to do that go to smaller end of acceleration gate) and use it."
  - text: "Blitz: Pocket 3: Kill all Ships. (sometimes the cargo is unlocked before you kill all ships)"
pockets:
  - name: Pocket 1 (War Zone)
    notes:
      - text: Each gate is locked until you kill a trigger from each group. Gates can, however, be activated, before killing the trigger, by using a Zbikoki's Hacker Card.
      - text: Groups aggro individually and will not fly further than 30km from their control towers.
      - text: Strongly recommend using Thermal missiles against the Federation Navy Orion, even if you're flying a Drake or Tengu, as they'll deal 2x the damage, even after the 25% damage bonus from the hull / offensive subsystem is taken into account.
