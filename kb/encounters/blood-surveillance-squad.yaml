      - text: The Moka will use smartbombs to destroy drones and to damage ships.
      - text: As you deal damage to Moka more reinforcements will arrive. These include neuting, webs, points and tracking diruptors.
      - text: Motoh himself has a very powerful MWD, making it possible to separate him from the group. Just overheat your guns to destroy Moka (the building) and warp out. Warp back in at 100 and let Motoh MWD himself out of his escort and take him out at medium range. Bookmark the wreck and come back in 5-10 minutes.
