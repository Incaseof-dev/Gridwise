notes:
  - text: "Escalation message: Scanning through Pat Wead's logs reveals that this druglord was surprisingly well connected, long lists of buyers and sellers throughout the neighboring regions would make this document a dream read of any law enforcement agent in the galaxy, if only all the vital parts were not in some completely alien code. No matter how much you let your central computer chew on this stuff, you get no feedback on any names or places, execpt perhaps one... this seems to be a hasty entry from almost a year back, not in code. At least the coordinates do reflect a true point in space."
  - text: The initial escalation from Angel Vigil is thought to be around 10%, but each stage escalating higher is thought to be around 75%. High level angel drops are possible at each stage.
