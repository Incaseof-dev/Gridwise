notes:
  - text: Drone Infested Starbase is a DED 4/10 rated combat site that is found in null security space. It consists of a starbase protected by a shield bubble, a large number of sentries with neutralizers, and several waves of drones. Despite being listed as a level 4/10 site in game, it requires capital scale damage to complete. It can be found as an escalation from Rogue Drone anomalies. It lasts 3 days once earned in the Opportunities journal.
  - text: "Expeditions: You've intercepted an encrypted broadcast. It appears to be communications with an infested starbase. The location has been saved in your databanks."
  - text: "Description: A shielded starbase controlled by the Angel Cartel. It is recommended that this entrenched encampment be assaulted using capital ships."
