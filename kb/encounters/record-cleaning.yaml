      - text: "Note: Area deals enough damage to reduce my Rattlesnake's almost perfect passive tank (I have T1 Defense Field Purgers instead of T2, and level 4 in the shield compensation skills) to 56% (stable) by the time I fly to the next gate."
      - text: "Note: Seamus Donohue calculates, based on his personal observations, that the acidic cloud deals 600 damage per second as perfect omnidamage (that is, 150 EM/second, 150 thermal/second, 150 kinetic/second, and 150 explosive/second)."
