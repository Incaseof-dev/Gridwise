    notes:
      - text: NPCs are separated in three groups, each surrounding a fuel depot.
      - text: The frigate and destroyer groups are slightly separate from the battleships. The individual battleship groups will aggress you once you start shooting at the fuel depot they're next to. As long as you're moving with any sort of transversal, they shouldn't be much of a threat. The small ships will not aggress you if you don't approach or attack them.
