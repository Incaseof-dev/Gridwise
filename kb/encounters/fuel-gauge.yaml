objectives:
  - text: Take out at least one of the fuel depots, thereby destroying the surrounding ships.
restrictions:
  - text: "Ship size limit: T1 Destroyer, Frigate"
ewar:
  - kind: web
  - kind: warpDisruption
notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: 2.4% Caldari State Faction Standing loss
  - text: Accept the Mission remotely.
  - text: Gated deadspace pocket up to four jumps away.
  - text: "Blitz: destroy ships at warp in and take the Acceleration Gate. Destroy Fuel Depot Alpha and warp out."
  - text: "Tips: You do not have to destroy the Caldari Stasis Towers to activate the Acceleration Gate"
  - text: "Tips: You will lose 2.4% Caldari State Faction Standing if you destroy a Caldari Stasis Tower"
  - text: "Tips: Don't stay and fight; destroy any Fuel Depot and warp out - only one needs to be destroyed to complete the mission"
  - text: "Tips: Watch out for Elite Frigates as they Warp Scramble"
  - text: "Tips: Frigates and Destroyers are not harmed by the Fuel Depot explosion"
  - text: "Tips: Each battleship will drop a Caldari Navy Vice Admiral Insignia I; bookmark the site and return after turning in the Mission. Total tag loot amounts to ~60M ISK."
pockets:
