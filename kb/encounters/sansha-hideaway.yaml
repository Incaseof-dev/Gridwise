notes:
  - text: "Rating: Class 1 Level 1"
  - text: Sansha Hideaway is an unrated combat site belonging to the Sansha's Nation pirate faction. It can be found via exploration as a cosmic anomaly within systems owned by the Amarr Empire and Ammatar Mandate. As an ungated complex, the limitations as to which ships can complete this site are tied to the security rating of the system where the anomaly spawns (T2 Battleships for high-security systems, and up to Titans in low-security and null-security systems). Completing this complex may award the player with valuable True Sansha faction modules and ammunition.
  - text: "This combat site consists of a single ungated pocket of space containing a variety of Frigate-sized enemy ships. Destroying all hostile ships may escalate into the DED rated Sansha's Command Relay Outpost complex. Three variations of this combat anomaly exist: Sansha Hidden Hideaway, Sansha Forsaken Hideaway and Sansha Forlorn Hideaway."
  - text: Simple structure defended by Sansha pirates. Finishing each wave spawns the next one.
  - text: Enemies spawn orbiting the scanner post about 30km away from warp-in.
  - text: All spawns come from the lookout tower located 15km from warp-in.
  - text: "Escalation: This anomaly can escalate to the 3/10 Sansha DED site Sansha's Command Relay Outpost."
