restrictions:
  - text: "Ship size limit: Frigates up to Battleships"
notes:
  - text: The site is behind an acceleration gate. Warping to the site lands you at 0 on the gate.
  - text: "Escalation: This site can escalate to The Drone Roulette with the message:"
  - text: "Escalation: Escalation message:: Among the debris from this formidable hive, you find a blown out hangar containing a few burnt out space ships of various types, probably the possessions of some unfortunate adventurers that came here before you and didn't live to tell the story. As your scanners routinely run through this material, they come across some report with information on a few sister hives to this one. The explorer seems to have found that each of these so called 'independence hives' are surrounded with outposts that serve both as an early warning system against intruders on the drones territory and also as a resource gathering facility. It seems that if the hive is attacked, the drones from the outpost warp instantly back to defend it. One interesting bit of information the unfortunate explorer has noted is that the drones frequently move the hive itself between these outposts, so hunting these things is like playing Russian roulette, you never know if you are fortunate enough to hit an outpost and thereby reduce the inevitable resistance at the main hive or if you are warping straight into the lair of the drones. The report continues to list four locations, the nearest one being..."
