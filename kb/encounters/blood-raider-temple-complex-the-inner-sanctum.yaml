restrictions:
  - text: "Ship size limit: T2 Battleship"
notes:
  - text: This expedition only has one part, but it is VERY hard compared to its Dark Blood Fleet Staging Point variant. Advise bringing a friend or two in ships with a very strong tank and remote capacitor transmitters. Alternatively, bring ships that require little to no cap to operate. The first section is ungated, so capitals can be brought in. Past the acceleration gate, though, only T2 Battleships and below are allowed to enter.
pockets:
  - name: Warp-in point
    notes:
      - text: Due to heavy neuting, the energy neutralizer towers should be a very high priority. They have high armor and structure hitpoints, though, so your ship should be able to deal enough DPS to break them quickly. There are a lot of elite frigates in this room which like to target drones, so watch them and recall them if necessary.
      - text: None of the structures drop loot. The acceleration gate is 60 km from warp-in.
