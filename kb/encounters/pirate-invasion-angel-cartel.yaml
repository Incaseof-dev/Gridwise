notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: Single gated pocket. You warp in to an empty pocket but soon find yourself surrounded by a swarm of Hostiles.
  - text: Group spawn is slightly delayed and distances vary. The spawn order is group 4, 2, 1 and then 3 and 5 (numbered from closest to furthest).
  - text: Group 1 will auto aggro after some time.
  - text: Proximity aggro is a major factor in this mission. Please be aware that you can aggro a neutral group by just moving too close to it.
  - text: The proximity distance for Group 4 is about 80km. It is recommended that you do not move your ship.
  - text: All other groups remain neutral until attacked or approached.
  - text: "Tip: Attacking group 1 does not aggro any other groups."
  - text: "Tip: Attacking group 2 will aggro group 3 (and vice-versa)."
  - text: "Tip: Attacking group 4 will aggro group 5."
  - text: "Tip: To throw off aggro from group 5, wait until an enemy ship from group 5 has locked your ship. Warp out, then warp back in."
  - text: "Tip: If you have to move be careful not to approach the neutral groups, move up or down as you are surrounded from the sides."
  - text: "Tip: Recommended order of elimination: Group 1, 5 (if you do not warp out to throw-off aggro), 4, 2 and 3."
  - text: "Tip: All ships except Gist Saint and the Battlecruiser come in range of 5-8 km. Great for salvaging afterwards. Short range weapons recommended unless you can kill things before they get in knifefight range."
  - text: "Blitz: Warp in, destroy ships from Group 5 (MJD) and warp out."
lootNotes:
  - text: "Bounties: ≈ 9.5 Million ISK (2021-08-16)"
  - text: "Loot: ≈ 2.4 Mil ISK (100% Jita Buy, 2021-08-16)"
  - text: "Salvage: ≈ 1.4 Mil ISK (100% Jita Buy, 2021-08-16)"
