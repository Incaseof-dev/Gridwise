notes:
  - text: This expedition is a very hard one, and may require several people in strong ships (T3C, well-tanked Battleship or Marauder is advised). The first and second locations can be done solo, but the last two locations have very high incoming DPS that can overwhelm a ship running solo.
  - text: "Escalation start: As the dust settles from the battle, you receive a transmission from someone claiming to be a local vigilante who congratulates you on a job well done. Your computers run a check on his ship ID's and other info they can gather on him in such a short period of time, but come up with nothing. He appears to represent neither a pirate faction nor one of the empires. This person continues to welcome you to the area and offers to point you to some other Blood bases he knows about and have been a menace for the local population. If you want to come and meet him, he will lead the way."
