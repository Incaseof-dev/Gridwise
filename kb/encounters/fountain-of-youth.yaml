  - name: Third Location
    notes:
      - text: "From Cura Gigno:: Cura Gigno: I hope you will manage without me, but I am going to check the next and last target. It's one of the Blood's holy places, some Fountain of Youth thing, quite a splash! We don't want them to get away. I will hold them busy till you arrive!"
      - text: "Warning: The two stasis towers web you very hard, so expect high incoming damage."
      - text: The Blood Defense Outpost has very strong active shield and armor tank that requires about 1000 DPS to break (the equivalent of the firepower of 3 battleships). It only drops T1 ammo and meta modules, so don't bother wasting ammo to destroy it unless you need the escalation.
      - text: "Escalation trigger: \"I will hold them busy till you arrive!\" Yeah, right. The only way he is going to slow them down is to stun them with a steady flow of exclamation marks. The Dark Bloods are no joke. This innermost circle of the Blood Raiders is legendary for its brutality and the unparalleled skill of its pilots. Your radio crackles to life again when this chatty would-be vigilante sends a message to his newfound friend: \"Yes, they are here, and it seems the element of surprise is on our side! I suggest that you open with a full frontal assault so I can charge from the side, flank them, and then we can crush them between us! I will need to stay off the air for now, though: I am launching a covert ops through stealth tactics in order to get into position! Good luck !! \" Come to think of it, this guy might be a 12-year-old who has stolen his mom's ship. But there is nothing to wait for; there are the coordinates, and the enemy is waiting."
