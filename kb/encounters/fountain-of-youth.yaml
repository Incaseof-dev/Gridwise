  - name: Fourth Location
    notes:
      - text: This site is very hard, and will require multiple people in strongly tanked ships. Double Stasis towers will make you take a lot of damage. Recommend high resists against EM and Thermal damage. Avoid attacking the Blood Raider Military Outpost unless you can tank the incoming damage. The structure itself drops no loot. The site has 3 waves, and if you spawn 2 at once, the site is almost impossible.
      - text: The final wave is the overseer wave. It spawns when the Blood Raider Military Outpost is at 55% structure.
      - text: "Expedition end: This was a hard fight and even though your friend didn't fire many shots, he did his best to call them. Gutsy little fellow. You would think that by now he should have used half of all superlatives in the English language to describe your victory, but surprisingly enough he is dead silent there where he is orbiting the remains of this holy place. Closer inspection reveals that he has taken a direct hit and even though his ship looks intact, all the airlocks have been blasted out and either he must have died from the explosion, or he is lying there frozen from the exposure. It is kind of sad ... not that you will miss him personally, but you can be darn sure that if he had lived to run around and tell the story, you would have been a legendary hero 24 hours from now."
