  - name: Second Location
    notes:
      - text: Ungated pocket. Incoming damage is VERY high. Recommend using a sniper ship to pick of the enemies or activate an MJD away from the rats when you land. Alternatively use a strongly tanked ship that can tank the DPS (like a well-tanked T3 Cruiser).
      - text: Attack the Blood Control Center or the Blood Raider Chapels to trigger escalation if none if received from the commander.
      - text: 'Escalation dead-end: "We sure did show them! You sure are better than no one to have around when the missiles are flying! But there is no time to float here fabulating, we must press on, another division of this same group is close by! I will pop over and scout, check if they are there still! " All these exclamation marks make you dizzy. It may well be that this guy is not much of a fighter, but he is no coward and you wonder if it is not hard to do scouting missions on an industrial ... Around 30 seconds later you receive a transmission "OMG the bastards have scrambled me !! I am getting killed here! Help! Help! I am at moon six, where is everyone, come .. "and then the transmission stops. You turn off the radio, there are too many "moon 6" around for you to go looking, and besides...'
      - text: 'Escalation trigger: "We sure did show them! You sure are better than no one to have around when the missiles are flying! But there is no time to float here fabulating, we must press on, another division of this same group is close by! "'
