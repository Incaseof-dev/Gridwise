notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: "Suggested ships: Battleship"
  - text: 5M ISK collateral; 4M ISK in bounties + ~10M in loot
  - text: "Rising Tensions: For many citizens of the Minmatar Republic, the friendship with the Gallente Federation has been a costly one. Some view the recent abandonment of the parliamentary system as the most potent symbol yet that the Federation's influence hasn't always been to their benefit. Indeed, there are some Matari who view the return to a Tribal Republic as the last necessary step out from under the shadow of foreign empires. Whatever the claims may be, few deny that the relationship still has some fundamental challenges to overcome."
  - text: thumb|right|192px
  - text: Ungated semi-deadspace pocket one jump away in Illinfrik. All warps will land you at the same point, but you can warp around freely.
  - text: "Blitz: Kill Ailon Boufin then warp to a bookmark. Warp to the Cargo Container, pick up the passkey then warp to a bookmark. Warp to the Archives, insert the passkey and pick up Hauteker Memoirs from the Archives."
  - text: "Tips: When you arrive only Ailon Boufin and the Archives are present"
  - text: "Tips: Ailon Boufin's lowest resistance is 72% Kinetic Shield and Armor"
  - text: "Tips: Reinforcements arrive when Ailon Boufin takes shield damage and then again when they take armor damage"
  - text: "Tips: Both waves spawn ~50 km away from the Archives."
  - text: "Tips: All reinforcement waves will actively repair ~500 HP every 10 seconds or so."
  - text: "Tips: Killing Ailon Boufin immediately appears to stop the remote repair effects."
  - text: "Tips: If you are unsure if you can kill Ailon Boufin with Remote Repairers present, kill the reinforcements wave by wave first. Consider fitting for maximizing damage application or having at least 500 DPS pure volley damage to quickly break through the remote reps."
  - text: "Tips: If you overestimate yourself, you'll spawn all ships at once and make the Mission a nightmare"
  - text: "Tips: Create a Bookmark and warp to it to avoid taking significant damage"
  - text: "Tips: Place Ailon Boufin's passkey into the Archives to spawn the Hauteker Memoirs"
