  - item: + Commander and other valuable loot
  - item: Corpii A-Type modules
    note: From Corpii Monk
  - item: Cruor BPC
    note: From Corpii Monk
  - item: Mid-Grade implants and faction ammo/tags
    note: From Dark Blood Commander Frigates
pockets:
  - name: 1st location
    notes:
      - text: Ungated area. The rats are arranged in two groups which can be aggressed separately. Group 1 auto-aggros and has the commander among them. Group 2 does not aggro until attacked. Killing the commander frigate can trigger escalation. If no commander frigate is present then killing all ships may trigger escalation.
      - text: "Escalation message:: You have destroyed the pirate threat. Your sensors have recovered co-ordinates from one of the frigate wreckages."
      - text: "Escalation Failure message:: You have destroyed the pirate threat. No further threat is detected."
    waves:
      - id: wave
        trigger:
          on: warpIn
          text: Wave
        spawns:
          - count: "6"
            class: Frigate
            names:
              - Corpii Worshipper
              - Corpii Herald
              - Corpii Follower
            note: type list incomplete on the source page
          - count: 0-1
            class: Commander Frigate
            names:
              - Dark Blood Seeker
              - Dark Blood Upholder
            triggers: Escalation trigger
            drop: Can drop faction modules, BPCs or implants
  - name: 2nd location
    notes:
      - text: Ungated area. Killing the commander frigate can trigger escalation. If no commander frigate is present then killing all ships may trigger escalation.
      - text: "Escalation message:: As expected, the Blood tried to stop you. The fierceness of the ambush was great, even for Blood fighters and you wonder why they didn't just try to escape into the vastness of space. Perhaps they are hiding something? After your systems have analyzed transmissions between the Blood ships during the fight, they come up with a location."
    waves:
      - id: wave
        trigger:
          on: warpIn
          text: Wave
        spawns:
          - count: "6"
            class: Frigate
            names:
              - Corpii Diviner
            note: type list incomplete on the source page
          - count: 0-1
            class: Commander Frigate
            names:
              - Dark Blood Seeker
            triggers: Escalation trigger
            drop: Can drop faction modules, BPCs or implants
          - count: 3-4
            class: Cruiser
            names:
              - Corpum Arch Engraver
  - name: 3rd location
    notes:
      - text: "Note: You will a need mining laser. A Civilian Miner won't work, but a Miner I will do just fine. Alternatively, mining drones also trigger the defender spawn."
      - text: Ungated area. A Rock Formation is about 30km away. Close to the rock formation (in a blueish little cloud) there is a small Arkonor asteroid. Mine the asteroid (you have to complete one or two mining cycles) to spawn the defenders.
      - text: "Escalation message:: As weird as it was finding this shiny rock here in the middle of nowhere, it is a bit more understandable now, knowing it was only a sadistic trap laid out by the Blood. Luckily you were well prepared and handled the threat with ease. One of the destroyed ships even revealed co-ordinates to a large Blood Raider base."
    waves:
