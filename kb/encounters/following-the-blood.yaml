notes:
  - text: "Escalation message:: Without you noticing, a small group of the Blood ships slipped away at the beginning of the fight. Luckily your radar systems have picked up a trace leading to this location."
  - text: Traveling may vary; the first three locations are normally in high sec and the last one in low sec.
