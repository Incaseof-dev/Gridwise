notes:
  - text: Wispy Ruins is a combat relic site involving both combat and hacking. It appears to Probes as a scannable combat site. Unlike most combat sites, it is only found in the Feythabolis nullsec region, specifically in the I-3ODK constellation. A dedicated combat ship like the Vargur is highly recommended for this site. Avoid taking frigates into the site, as the smartbombs in the third and fourth pockets can easily destroy any frigate. The smartbomb damage can even be high enough to destroy a cruiser. Pirates from the Rogue Drones and Angel Cartel are featured.
  - text: There are four rooms in this complex but only three need to be completed. The second stage(Portal) can be skipped since the central deadspace pocket can be accessed more quickly by taking the other gate in the first pocket.
