  - text: Intercept the counteragent. Retrieve 1x Singed Datapad (0.1 m3)
notes:
  - text: No Minmatar Standing loss
  - text: thumb|right|192px
  - text: "RSS Residential Suites: This reconfigured station houses thousands of RSS agents along with their families, and serves as just one of many secure locations for employees to settle down. Often the line of work RSS agents undertake brings with it a risk for recriminations. In order to minimize the threat to their families and keep agent's minds on the job, the RSS often heavily subsidizes the accommodation at these residential suites. For them it is just another way to approach internal security; the cost of these subsidies pales in comparison to the amounts the Amarr would pay for just one good defector, and the damage done from a high-level leak would be significant for an entity that built itself on the security of information."
  - text: There is a counter agent in Republic Security Services. Intercept and destroy them.
  - text: The encounter will likely be in one of the neighboring systems. You can warp in at your desired range, and upon arrival there will be a number of friendly craft. Wait a moment for Lomar Vujik to appear and recover the Singed Datapad from their Cargo Container.
  - text: "Tips: Lomar Vujik deals up to 500 DPS over 80 km and uses a Microwarpdrive to approach at 1000 m/s"
  - text: "Tips: Lomar Vujik's lowest resistance is 49% Explosive, and has similar tank to a standard NPC battleship"
