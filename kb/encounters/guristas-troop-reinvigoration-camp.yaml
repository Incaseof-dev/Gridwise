            drop: May drop Pith Guristas Spa-card
    onWarpIn: "This deadspace complex has been annexed by the Guristas forces to house an entertainment and recuperation center for troops on leave. While the area is not heavily guarded by on-duty personnel, the complex is normally occupied by a wide range of warships and experienced off-duty military staff. DED Threat Assessment: Major (6 of 10)"
  - name: 2nd pocket
    notes:
      - text: "Database information:: The so called 'Recuperation Tower' pocket appears to be a sector where Pith Guristas soldiers can rest and help themselves to a drink at the local cantina. It serves as a meeting point for troops coming in with weekend passes, to continue further into the festivities that take place deeper into the complex."
      - text: The NPCs are spread out in 3 groups. The closest group (2 battleships, all frigates and 3-4 destroyers) will auto-aggro on landing, the other two groups will not attack unless approached within 25 km and will shoot drones. Combined damage output will be quite high if you aren't careful with pulling room aggro. The acceleration gate is locked until all defenders are dead.
