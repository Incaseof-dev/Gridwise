  - text: Guristas Troop Reinvigoration Camp is a DED rated site found through exploration. It can also be received as an escalation from the Guristas Rally Point and Guristas Hidden Den combat anomalies.
  - text: 800 DPS T3 Cruiser is sufficient to clear the site in ~20-25 minutes.
