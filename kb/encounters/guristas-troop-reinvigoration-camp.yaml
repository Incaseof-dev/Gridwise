pockets:
  - name: 1st pocket
    notes:
      - text: "Database information:: This entrance pocket of the complex serves as a checkpoint to alert the internal pockets of the complex in the case of any intrusion or a Concord raid. The acceleration gate leading towards the Recuperation Tower is scrambled by the resident Guristas pilots, making it critical to take out those peripheral defenses before advancing forth."
      - text: The acceleration gate is locked until all defenders are dead. All ships are ~15 km away and auto-aggro.
    waves:
