notes:
  - text: Serpentis Hideaway is an unrated combat site belonging to the Serpentis Corporation pirate faction. It can be found via exploration as a cosmic anomaly within systems owned by the Gallente Federation or occupied by the Serpentis Corporation. As an ungated complex, the limitations as to which ships can complete this site are tied to the security rating of the system where the anomaly spawns (T2 Battleships for high-security systems, and up to Titans in low-security and null-security systems). Completing this complex may award the player with valuable Shadow Serpentis faction modules and ammunition.
  - text: "This combat site consists of a single ungated pocket of space containing a variety of Frigate-sized enemy ships. Destroying all hostile ships may escalate into the DED rated Serpentis Narcotic Warehouses complex. Three variations of this combat anomaly exist: Serpentis Hidden Hideaway, Serpentis Forsaken Hideaway and Serpentis Forlorn Hideaway."
  - text: Total cargo loot amount to around 20k ISK.
  - text: "Escalation: This anomaly can escalate to Serpentis Narcotic Warehouses."
