  - text: "Suggested ships: Frigate, Destroyer"
  - text: "Lore Blurb: Termination: Because of the importance placed on \"saving face\" in Caldari culture, mid- and high-level executives often remain employed despite failures in leadership or performance, simply because firing them publicly would damage the corporation's reputation. In extreme cases, it is not altogether unknown for superiors within the corporation to arrange \"accidents\" for executives who fail to meet objectives and threaten their employer's bottom line. This eliminates the drain on corporate resources and allows them to save face. While such methods of dealing with \"problem employees\" are simply not discussed openly (doing so would be in horribly poor taste, after all), it is something that lurks in the back of every corporate executive's mind."
