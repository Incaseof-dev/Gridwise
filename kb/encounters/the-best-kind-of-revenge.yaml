notes:
  - text: "Web/warp disruption: Mercenary Wingman"
  - text: "Black market clones: Hundreds of small companies exist in the fringes of space that cater to those who either can't afford or are banned from the big-name cloning companies. Naturally, there is a much greater risk with these organizations. No regulations means there are no guarantees of revival, and there are many stories of capsuleers waking up in distant backup cloning facilities after their local clone never activated. For most capsuleers this represents only a minor inconvenience, since very few are foolish enough to place their lives in the hands of questionable company. For those criminals who can pay, the clones are nearly as safe as the Empire ones, a fact that has stymied efforts to curb the proliferation of capsuleer outlaws, and allowed them to move about the cluster with the freedom capsuleers are famous for."
  - text: Accept the Mission remotely.
  - text: Gated deadspace pocket up to four jumps away. Eliminate all hostile targets, then upload the Serpentis Inquest virus by approaching the Central Database Hub Structure.
  - text: Complete the Mission remotely.
  - text: "Tips: You do not need to kill the Cruise Missile Batteries"
  - text: "Tips: Destroying the Cruise Missile Batteries incurs minor Guristas Pirates Standing Loss"
