restrictions:
  - text: "Ship size limit: Battleship"
notes:
  - text: "Blitz for ranged ship (need lock and weapon range > 65-70 km): Warp to first pocket, kill 4 stasis towers, kill Gist Gate Commander to unlock the gate. Warp through the gate to second pocket. Kill first stasis tower (explode with 3k damage, be careful), recharge tank if needed, kill second stasis tower. Flee out from Angel Control Tower in 30-40 km range, shot it. Kill all tackling frigates, kill Domination boss, take loot, warp out."
  - text: 2 pockets' initial groups and 1 spawn for a total of 44 ships.
  - text: "Escalation: This site can escalate to Pioneers Peril."
  - text: "Escalation: Pioneers Peril: Going through the logs from one of the command ships you blasted, you come across a recent memo containing a draft for a plan where forces from this Military Complex and another similar to this one were to gang up and raid a space trucker station somewhere in the region. Where this space trucker station is, is not included in the logs, but the location of the rally point is there. It is supposed to be by a small asteroid belt, not too far away."
