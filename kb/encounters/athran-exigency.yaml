  - text: Athran Exigency is a five part mission chain. Involving combat with the Minmatar Republic.
pockets:
  - name: Part 1 of 5
    notes:
      - text: "The Athran Brotherhood: Sometimes calling itself \"The Scions of Athra,\" the Athran Brotherhood is a group of Khanid secessionists with headquarters located on the Khanid homeworld of Amarr Prime (called Athra in the Old Khanid tongue). This group tends to rise perhaps every other generation or so, seemingly from its own ashes, making trouble for local government and interstellar trade alike. Given the many large pirate organizations and other independent \"freebooters\" of New Eden, not to mention the constant weight of intergalactic politics and the ongoing \"Minmatar Problem,\" Amarr rulers cannot generally spare a large-scale military effort to deal with these relatively minor troublemakers. Perhaps this is the reason the Brotherhood seems never to die, but always reappears just when authorities start to think they've rid themselves of the nuisance."
  - name: Warp-in
    notes:
      - text: Single pocket without gate.
      - text: Approach the mission objective (Abandoned Mining Station). Make it visible in the overview by enabling 'Types - Celestial - Large Collidable Object'.
      - text: The Station is 40km away from warp-in. The mission is flagged as complete when within 5km of the station.
    waves:
      - id: 20-30km-spawn-when-you-are-within-10km-of-the-station
        trigger:
          on: other
          text: 20-30km, spawn when you are within 10km of the station
          confidence: inferred
        spawns:
          - count: "2"
            class: Frigate
            names:
              - Athran Agent
  - name: Part 2 of 5
    notes:
      - text: "Battle Tips: Always be ready to warp out if you start taking heavy damage, whether in a mission or in lawless space. Sometimes it's a good idea to have a jump route selected before going into a mission so you can simply click your autopilot to get out quickly; this is a valid approach only with relatively small ships, though. Eventually, once you get into something like a Battleship, aligning to warp can take so long — especially if you begin once you're already taking heavy damage — that your ship might be destroyed by the time you actually start your warp. Remember too that if you take damage in battle, you can always return to a nearby station for repairs; also be sure to replenish your ammunition while you're there if you're running low. Combat in EVE can be deadly and costly, so do what you can to cut your losses. \"It's better to warp away and fight again another day.\""
