notes:
  - text: "Rating: Class 1 Level 3"
  - text: Blood Forsaken Hideaway is an unrated combat site belonging to the Blood Raiders pirate faction. It can be found via exploration as a cosmic anomaly within systems owned by the Amarr Empire and Ammatar Mandate. As an ungated complex, the limitations as to which ships can complete this site are tied to the security rating of the system where the anomaly spawns (T2 Battleships for high-security systems, and up to Titans in low-security and null-security systems). Completing this complex may award the player with valuable Dark Blood faction modules and ammunition.
  - text: "This combat site consists of a single ungated pocket of space containing a variety of Frigate- and Destroyer-sized enemy ships. Three variations of this combat anomaly exist: Blood Hideaway, Blood Hidden Hideaway and Blood Forlorn Hideaway."
  - text: Single ungated normal space pocket.
