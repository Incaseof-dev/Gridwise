  - name: Fourth and Last Location
    notes:
      - text: "Access: Gateless, Open Access"
      - text: This site is extremely difficult, and can require 3-4 people in very tough ships. The site contains 4 waves, and if you manage to spawn 2 at once, the site is near impossible.
      - text: The four waves trigger when you attack the Serpentis Privateer Stronghold (wave 1), when it reaches 50% shields (wave 2), at 25% shield (wave 3), and when it goes into armor (wave 4).
      - text: You spawn 200 km from the station.
      - text: Kill the frigates, then the web-towers, then the siege blasters and then the rest.
      - text: This wave spawn about 250km from the station, close to the warp-in location. They are spread in 4 groups.
      - text: An easy and fast wave that spawns about 200km from the station.
      - text: The fourth and last wave is the commander wave. It spawn at 0 on station. The drones web and the frigates points, while Heysus deals approx. 1800 dps from about 125km away.
      - text: The drones are VERY fast, so the best strategy seems to damage the station while aligned to a bookmark 200+ km off, and warp to it as soon as they spawn. Then kill the drones while they come to you, then the frigates after.
      - text: "End message:: This was a hard fight and even though your friend didn't fire many shots, he did his best to call them. Gutsy little fellow. You would think that by now he should have used half of all superlatives in the English language to describe your victory, but surprisingly enough he is dead silent there where he is orbiting the remains of this holy space. Close inspection reveals that he has taken a direct hit and even though his ship looks intact, all the airlocks have been blasted out and either he must have died from the explosion, or he is lying there frozen from the exposure. It is kind of sad... not that you will miss him personally, but you can be darn sure that if he had lived to run around and tell the story, you would have been a legendary hero 24 hours from now."
