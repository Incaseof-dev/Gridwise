  - name: First room
    notes:
      - text: Entering this room can trigger the escalation.
      - text: In the room you find a lot of Siloes and a structure/ship called "Ours De Soin".
      - text: "Escalation message:: Your communication instruments finally come alive as the Serpentis contact who hired you starts talking on the private channel. Even though the area was empty, he commends you on a job well done and gives you directions to the next assassination target."
  - name: Second Location
    notes:
      - text: This site consists of one ungated room.
      - text: The enemies are grouped in in four separate groups. You spawn in the middle of them.
      - text: The two statis towers webs you to a halt, making you take A LOT of damage, and the damping makes them hard to hit. This can make the site hard to survive.
      - text: 'Escalation message:: "We sure did show them! You sure are better than no one to have around when the missiles are flying! But there is no time to float here fabulating, we must press on, another division of this same group is close by!"'
      - text: 'Dead end message:: "We sure did show them! You sure are better than no one to have around when the missiles are flying! But there is no time to float here fabulating, we must press on, another division of this same group is close by! I will pop over and scout, check if they are there still!" All these exclamation marks make you dizzy. It may well be that this guy is not much of a fighter, but he is no coward and you wonder if it is not hard to do scouting missions on an industrial... Around 30 seconds later you receive a transmission "OMG the bastards have scrambled me!! I am getting killed here! Help Help! I am at moon six, where is everyone, come.." and then the transmission stops. You turn off the radio, there are too many "moon 6" around for you to go looking, and besides, this guy has probably already been turned into two tablespoons of space dust by now.'
