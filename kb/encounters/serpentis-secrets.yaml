  - name: Third Location
    notes:
      - text: "From Ours De Soin:: I hope you will manage without me, but I am going to check the next and last target. It is a central station for the local Serpentis. We don't want them to get away. I will hold them busy till you arrive!"
      - text: This site is yet another ungated pocket. You spawn 100km from the NPCs and the two web-towers makes the travel to the station very slow, while the damp makes hitting anything hard.
      - text: If you get the Shadow Serpentis Battleship to spawn, kill it for the escalation. If not, destroy the station.
      - text: The Siege Sentries does a lot of damage, but they are only two. Clear the area of rats before you engage the station.
      - text: "Escalation message:: \"I'll keep them busy till you arrive!\" He sounds optimistic, but the only way he's going to hold them back is with colorful language. Your computer provides you with the coordinates and you can already hear the sounds of battle coming through the channel."
