notes:
  - text: EDENCOM Covert Research Headquarters is a limited time Expedition that can escalate from Upwell Covert Research Facilities.
  - text: Rogue drones are the same type as in the Upwell Covert Research Facilities. The fifth and final spawn contains Triglavian rats.
  - text: The rats will sometimes warp in at 500 km then warp at 0 on you a few seconds later. Their behavior is very atypical compared to the normal rats in New Eden.
  - text: Ungated pocket. There are around 5-8 ships in each wave. Subsequent waves spawn several seconds after previous wave is destroyed.
  - text: The site will become a warpable beacon when it is warped to so anyone can come into the site.
  - text: "Escalation: Destroying the overseer structure can escalate the site further to Signal Source."
  - text: 'Escalation: Escalation trigger: The explosion of the infested fluid router causes an encrypted signal burst directed at a specific set of coordinates in a nearby star system. Check the "Escalations" section within the "Exploration" tab of the Agency for details of that location.'
