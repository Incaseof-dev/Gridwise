      - text: "You should get the escalation upon landing. If so, you will see message below pop up:"
      - text: 'Escalation message:: During the fight, you picked up a transmission from one of the station houses: someone is ordering someone else not to warp in. The message is answered a couple of times with this "someone else" demanding a reason for the change of plans until he is told in no uncertain terms to shut up and stay off the air. By that time your instruments have managed to pinpoint where the transmission is coming from.'
