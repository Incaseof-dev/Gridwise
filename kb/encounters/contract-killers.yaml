  - name: Contract Killers - Part 2
    notes:
      - text: The room is ungated, meaning you can warp around in it, and people can warp directly to you.
      - text: Take care of the NPCs but ignore the factory, as although it may look like an overseer structure it doesn't actually drop any deadspace items other than random contraband. The factory reps shield and armor so you will need around 1500dps just to break the tank. It fires Citadel torpedos which are relatively weak and can be tanked easily. The factory webs you up to 50km out.
      - text: The next stage is to shoot the structure named "Serpentis Drug Lab". To clarify, this is not the structure that shoots you or repairs itself. This will trigger another wave of ships about 160-180k from the beacon.
      - text: One battleship is named "Quertah Bleu", and is the overseer for the site. He moves very quickly and hits for a fair amount of damage and has exceptional tracking and damage application against fast moving targets. His tank, however, is nothing special. He is extremely fast and can be kited away from the rest of the wave easily, allowing you to kill and loot him.
      - text: "Note: (The player who receives aggro from the Serpentis Drug Factory can keep it at range of at least 60km. In this instance the Drug Factory will still rep its shields but will cease to repair its armor and will be much easier to take down. All other players assisting can keep the Drug Factory at preferred range as long as the player who receives aggro from the factory keeps it at 60km. Factory does not switch targets.)"
      - text: "Escalation Ends:: Someone once described a Mindflood trip like if you managed to blow your brains out shooting both barrels of a double-barreled shotgun at the same time. With this place gone, a lot of junkies in the region will have to resort to the latter, if they want a fix."
    waves:
