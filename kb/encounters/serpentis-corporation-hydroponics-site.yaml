restrictions:
  - text: "Ship size limit: Battleships"
notes:
  - text: The damage can be overwhelming. However, in a cruiser sized ship, with a 100mn afterburner, you should be able to avoid most damage by orbiting a stationary target at around ~25km at ~900m/sec. Just make sure you target the rats which can hit you first, there should only be about 3-5 per pocket which can. However, this method becomes a bit difficult to execute due to the webs in the last room, so be wary. The webs practically make you a stationary target for the rats to shoot.
  - text: The names and amount of ships listed may vary slightly.
  - text: If you want to blitz the last pocket, head-shot the Sarpati Family Enforcer, bookmark their wreck, and warp out. Then come back by warping to the bookmark, since the gates will already have despawned, as will have all the remaining rats in the final room, and you can scoop the loot.
