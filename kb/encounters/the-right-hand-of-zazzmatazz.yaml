notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: "Blitz: Kill Zor, destroy the Outpost Headquarters and warp out."
  - text: Single ungated pocket. You can [Fleet] warp at preferred range.
  - text: Mission is flagged completed after you have destroyed the Outpost Headquarters and Zor.
  - text: "Tips: Incoming DPS will get intense at close range, make sure your ship is tanked properly or fitted with MJD to jump to sniper range if needed."
  - text: "Tips: Zor drops Zbikoki's Hacker Card, which is used to blitz the Worlds Collide missions."
  - text: "Tips: Zor occasionally drops Zor's Custom Navigation Hyper-Link - a 53 mil implant. But usually he just drops Zor's Custom Navigation Link, an almost worthless implant."
  - text: "Tips: Zor deals long range damage, so some tank is needed even on sniper fitted ships."
  - text: "Different approaches that works well: Kill Zor first to reduce the incoming DPS. If he is out of range, kill the closest Cruisers and hit Zor once he is in optimal."
  - text: "Different approaches that works well: Start with the Frigates from group 2, then the Cruisers before they get into their optimal range (15km) and finally the two Battleships."
  - text: "Different approaches that works well: Take out several Cruisers to quickly manage aggro, shoot the Battleships and then the rest of the Cruisers and the Frigates."
