notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: "The Sleeper Civilization: Although there are many theories, few know what happened to the Sleepers. Their ruins were already old when the Amarr reached space. For most, the Sleepers were little more than a curiosity; an ancient civilization lost and forgotten. Then wormholes opened across the cluster. Explorers that ventured into the strange space beyond were met with highly-advanced drones protecting relics that we now know once belonged to the Sleepers. Apart from the drones themselves, the only structures found are lifeless ruins. But the Sleeper drones themselves function all too well, despite what must be centuries of neglect."
  - text: Single gated deadspace pocket.
  - text: Wave 1 is triggered when Gath Renton is first damaged, Wave 2 when Gath Renton's armor is damaged, and Wave 3 shortly after Gath Renton's hull is damaged.
  - text: "Blitz: Kill Gath Renton while tanking the other spawns."
  - text: The mission can be completed and the next mission accepted remotely.
  - text: No standing loss for destroying Angel sentries. Initial defender spawn is 60 km from warp-in and does not auto-aggro. Sentries have limited aggro range out to ~25 km.
