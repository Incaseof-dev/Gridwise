notes:
  - text: "Web/warp disruption: Elite Frigate"
  - text: The number of ships in groups may vary.
  - text: "Tip: The drone bunkers in the 1st pocket are not part of the mission objective, so they can be ignored."
  - text: "Tip: Fitting an Afterburner might be useful to burn to the gate."
  - text: "Blitz: Eliminate all ships in the 1st pocket to unlock the warp gate."
  - text: "Blitz: Eliminate all ships in the 2nd group and destroy the Bunker, done."
  - text: "Blitz: You do not have to kill the third and furthest group in the second pocket."
lootNotes:
  - text: "Salvage: ± 1.7 Mil ISK"
  - text: "Bounty: ± 4.1 Mil ISK"
pockets:
  - name: 1st Pocket
    notes:
      - text: Auto aggro from the 1st group, 2nd group remains neutral. The warp gate to the next pocket is ~33km away and locked until all hostiles are cleared.
      - text: If you get stuck colliding with the structures when you try to use the acceleration gate, just blow up the structure that is stopping the warp. The large structure has less HP than you may assume.
