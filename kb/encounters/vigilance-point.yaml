notes:
  - text: Vigilance Point is a combat anomaly located in the Pochven Region.
  - text: This site will spawn 10 waves every 2 minutes, increasing in spawns with each wave. The rats themselves are random, but will be a mix of frigates, destroyers, cruisers, battlecruisers, and battleships. The structure's shields must be destroyed before each wave finishes or else the site will end.
  - text: This site has extremely high DPS but typically low tracking, with no neut pressure and is usually done in self tanking AB fit kiting Eos fleets, as the site does not target drones. Due to the sites high damp pressure, signal boosters and info links are almost required.
