notes:
  - text: "Web/warp disruption: Yes (Chief Republic Magni)"
  - text: "Blitz: In the first pocket, use the following kill order:"
  - text: 4x Battlecruisers
  - text: 2x Elite Frigates
  - text: 3x Elite Cruisers
  - text: 2x Elite Frigates
  - text: It is necessary to one-shot each of the elite frigates in Group 3 in order to avoid immediately spawning reinforcements. The acceleration will be unlocked as long as there are no remaining hostile targets. If reinforcements spawn (whether due to not one-shotting the frigates, or taking too long to activate the gate), the gate will be locked until all hostile targets are destroyed.
  - text: In the second pocket, approach the Dysfunctional Solar Harvester. The mission is flagged as completed once the first three spawns have been destroyed.
lootNotes:
  - text: "Loot: ± 3 Mil ISK"
  - text: "Besides normal loot, the NPCs also drop Republic Fleet Insignia ('tags'):"
