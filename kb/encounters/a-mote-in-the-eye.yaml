notes:
  - text: "Web/warp disruption: Elite Federation Libertus"
  - text: Fighters will respawn indefinitely until the three Fighter Bay structures are destroyed. With each structure, one fighter pops. Fourth structure, the Power Generator (250k ehp), does not take damage until Fighter Bays are destroyed. When the Generator is destroyed, the Neut that's attached to it is also destroyed.
  - text: Mission is in deadspace, you will always be warping to the entry point(at range is allowed) and cannot warp to fleet members/bookmarks directly.
  - text: "Strategy: Take out structures, missile & web towers, leave neuts until last."
  - text: "Strategy: Either take one neut and one spawn at a time, or shoot at all neuts and warp your rr out while the tank gains aggro. Takes 30-50 seconds before majority of dps is in place if you stay at warp-in."
pockets:
  - name: Warp-in
    notes:
      - text: All enemies aggro on warp-in. Initial group will do around 800 dps with 42% Kinetic/58% Thermal.
      - text: These spawns are approximations and there could be some variance. Can end up around 5,000 dps with 37% Kinetic/73% Thermal.
      - text: The Elite Federation Libertus have web/scram, the Federation Praktor Dionia has energy neutralizer(20gj/s) and sensor damepener.
