  - text: "Web/warp disruption: Elite frigates"
  - text: "Suggested ships: Battleship, Tanked Frigate (Blitz)"
  - text: No Amarr Standing loss; 2.5M ISK collateral
  - text: "The Ammatar – Past and Present: The Ammatars are descendants of Minmatar that collaborated with the Amarrians during the latter occupation of the Minmatar worlds. When the Amarrians were thrown out during the Minmatar Rebellion their collaborators fled with them. The Amarrians helped their Minmatar allies to settle in a few systems not far from the newly formed Minmatar Republic. The Ammatars regard themselves as the true rulers of the Minmatars, mainly based around the fact that a fair proportion of the old Minmatar aristocracy, or tribal leaders, were among them. In this vein they named their domain San Matar, meaning ‘true home'. The term Ammatar was first used by the Gallenteans to distinguish between the two groups. Out of convenience even the Ammatars themselves started using it, stating that, with the help of the Amarrians, they had progressed beyond the old social structure of the Minmatar tribes. Indeed, the Ammatars have very deliberately abolished many age-old traditions of the Minmatar tribal society and embraced some Amarrian ones instead. In the months following the Elder War of YC110, the Ammatar Mandate was beset with turmoil and uncertainty. During the war, its lucrative tsula plantations -- the Mandate's largest export crop and arguably the backbone of its economy -- were systematically destroyed by Chamberlain Karsoth's forces in retaliation for the Mandate government's harboring of Starkmanir Minmatar tribesmen, a clan lineage long-since thought extinct. After Empress Jamyl I rose to power in the Amarr Empire, however, appointing Royal Heir Yonis Ardishapur as Ammatar's savior and protector, the nation has entered into something of a renaissance. Aid now flows in a steady stream from the Empire's coffers, command hierarchies are being reinforced and morale is on the rise. It appears the star of Ammatar will soon shine bright once more."
  - text: Ungated semi-deadspace pocket within one jump of Frarn. All warps will land you at the same point, but you can warp around freely.
  - text: "Blitz: warp in, then warp to bookmark. Warp to Central Burial Tomb, loot the Wildfire Khumaak and warp out."
  - text: Complete the Mission remotely.
  - text: "Tips: The Mission is done when you approach the Central Burial Tomb, but if you don't loot the Wildfire Khumaak you won't be able to complete the next mission."
  - text: "Tips: Large ships like the Praxis will bump off of the structure before they get within 2500m, making it impossible to loot, and even frigates can easily get stuck on the structure. It might be safest to use a heavily-tanked frigate and MWD away after looting rather than trying to warp off immediately."
  - text: "Tips: Approaching the structure from the domed top half at no more than ~500m/s in a ship of cruiser size or smaller will usually allow you to grab the loot most easily."
  - text: "Tips: ~500 DPS applied immediately after pinging to the structure"
  - text: "Tips: Powerful Amarr Elite Battleships will arrive only if you destroy all Battlecruisers"
  - text: thumb|right|192px
  - text: "Hautekar Burial Site: The next morning she was borne up to the stars, to be closer to him. He had her enclosed inside a giant holy dome, a place so magnificent that we wept to see it. In the warmth of the Zaid sun she would remain, forever embracing the shared secret that had brought them together."
pockets:
  - name: Pocket 1
    notes:
      - text: This spawn is not to be underestimated. Judgment Elite Battleships each do 300 DPS EM/Thermal out to 65 km, total wave damage is roughly 1000-1200 DPS. Do not attempt to face-tank them without a marauder.
      - text: "Mission Completion Dialogue: Wait, you found a Khumaak out there? What the hell is a Wildfire Khumaak? I'm dying to look at it, I admit, but we can't screw around here. We need to get this thing somewhere safe before we start trying to figure anything out. I have a bad feeling about all of this . Boufin was strangely protective, Angels were all over the burial site, and the Amarr were plenty aware of its location too. With that many people involved, I doubt nobody noticed us lifting that thing out of the tombs. I have an idea about where to take it, but I need to make a quick holovid call first. Talk to me again in a few moments, ok?"
