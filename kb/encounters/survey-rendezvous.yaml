id: survey-rendezvous
kind: mission
name: Survey Rendezvous
level: 2
enemyFaction: Rogue Drones
review: unreviewed
sources:
  uni:
    title: EVE University Wiki – Survey Rendezvous
    url: https://wiki.eveuniversity.org/Survey_Rendezvous
    license: CC BY-SA 4.0
    retrieved: 2026-10-23
    revision: "202690"
defaults:
  confidence: verified
  source: uni
objectives:
  - text: Retrieve Survey Data (0.1 m3)
notes:
  - text: Requires data analyzer
  - text: Survey Rendezvous is the starting mission of a 3 part mission chain, The other missions are Listening Post and Kicking the Nest.
  - text: "Blitz: Take the gate at warp-in. Hack the survey ship in the pocket. Grab the item and return to agent."
pockets:
  - name: Warp-in
    notes:
      - text: The acceleration gate is not locked. You can proceed to the next pocket without killing the drones.
    waves:
      - id: wave
        trigger:
          on: warpIn
          text: Wave
        spawns:
          - count: 16-27
            class: Drone
            names:
              - Arachula
              - Asmodeus
            note: All types are possible; type list incomplete on the source page
      - id: wave-2
        trigger:
          on: other
          text: Wave
          confidence: inferred
        spawns:
          - count: "1"
            class: Acceleration Gate
            names:
              - Acceleration Gate
            note: Not locked
  - name: Pocket
    notes:
      - text: The survey ship(hackable container) contains the mission item. Hack it, grab the item and return to agent to complete the mission.
      - text: If you have low tank you can drag the rats away from the survey ship and then fly past them with MWD.
    waves:
      - id: wave
        trigger:
          on: warpIn
          text: Wave
        spawns:
          - count: "1"
            class: Hackable
            names:
              - Survey ship
            triggers: Triggers reinforcement B
            drop: Survey Data
      - id: initial-defenders
        trigger:
          on: warpIn
          text: Initial defenders
        spawns:
