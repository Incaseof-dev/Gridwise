            class: Frigate
            names:
              - Infester
              - Splinter
              - Decimator Alvi
          - count: 2-5
            class: Destroyer
            names:
              - Shatter
              - Ripper Alvior
          - count: 1-2
            class: Cruiser
            names:
              - Wrecker
              - Destructor Alvum
            triggers: Last ship triggers reinforcement A1
      - id: reinforcement-a1
