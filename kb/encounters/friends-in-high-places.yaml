  - name: Area RRD-XX3
    notes:
      - text: "Mission Completion Dialogue: Excellent work out there, . We're making copies of the data you recovered now. It looks like we'll have more than enough here to work from. From first impressions, it looks like this RSS agent was working almost entirely alone on some operation involving a highly-placed Ammatar defector and the Wildfire Khumaak. The RSS people here with me are claiming they've never heard of this matter before. I'm seeing reports here to suggest that this Ammatar “sister” was a source for historical information on the Wildfire. I don't like the name of that RSS operation though, . Stillwater? That's basically the opposite of “Wildfire”. We should be careful not to trust the RSS too much on this one, I think. In fact, I have an idea. I'll speak with you again after I've made a few arrangements with the RSS."
    waves:
