notes:
  - text: "Suggested ships: Combat Ship (mission-after-next requires combat, this one is on the way there)"
  - text: "The Republic Security Services: Perhaps less is known about the Republic Security Services than any other national intelligence agency in the universe of New Eden. Their numbers, their spheres of operation, the scope of their involvement in affairs national and international: all these things are hidden in a fog of silence and misdirection. In the absence of concrete recorded information, the only detectable pattern is composed of reports from those few times the agency has revealed itself. Pieced together, a picture begins to emerge: grim, humorless, determined and fierce, these men and women stalk the underworld and mingle with its demons so their brethren may live in the sunshine."
  - text: thumb|right|192px
  - text: Accept the Mission remotely.
  - text: Go to Alakgur eight jumps away, take the Acceleration Gate, approach the RSS Radio Telescope and take three items from RSS Radio Telescope (0.3 m3).
  - text: Complete the Mission remotely.
