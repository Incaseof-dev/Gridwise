  - text: Destroy the Society spy ship at the designated location in Arnon.
  - text: Notes
  - text: "When you arrive at the mission location, find the Society Spy, an Independent Green-Crewed - this is the ship you want to destroy. Ignore the 7 frigates. After you destroy this ship, the frigates will de-spawn and you'll get a pop-up message from another agent, Adani Yusev: \"I’m Adani Yusev from Ishukone internal security. We’ve been monitoring data traffic between you and the Servant Sisters of EVE. No, don’t get excited. We’re all on the same side, here. The State will help you get Dagan… as long as you hand him over to us once you’ve got him.\" Seems like all of the different factions want Dagan!"
  - text: 'On turn in, Sister Alitura says: "Excellent work. The Omnipresence has been destroyed, and there’s no indication that she managed to inform her Society masters. We’ll be resuming contact with Karin immediately."'
  - text: "Next Mission: Chasing Shadows"
