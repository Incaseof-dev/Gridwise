notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: Single gated pocket. At warp-in, you will see Group 4. Four other groups will spawn several seconds later.
  - text: The spawn order is Group 2, Group 1, Group 3 and finally Group 5.
  - text: It is recommended that you do not move your ship. The proximity aggro bubble for Group 4 is about 80km and you may get aggroed EITHER during warp-in or if you move towards it.
  - text: Group 1 will auto-aggro immediately.
  - text: Groups 2, 3, 4 & 5 will remain neutral until attacked or aggroed via proximity.
  - text: Warning
  - text: The two Loyal elite frigates in Group 1 will frequently warp scramble you in under 20 secs.
  - text: Proximity aggro is a major factor in this mission. Please be aware that you can aggro a neutral group by just moving into its aggro bubble.
  - text: "Aggro Notes: Attacking Group 1 does not aggro any other groups. You can safely deploy drones to attack this group."
  - text: "Aggro Notes: Attacking Group 2 aggros Group 3 (and vice versa). You can safely deploy drones after the pair have been aggroed."
  - text: "Aggro Notes: Attacking Group 4 aggros Group 5 (attacking Group 5 didn't aggro group 4). You can safely deploy drones after the pair have been aggroed."
  - text: "Aggro Notes: Group 4 may aggro drones if they get too close to that group."
  - text: "Tips: Be absolutely careful not to move towards the neutral groups. Move away from them to minimize setting off the proximity aggro"
  - text: "Tips: Recommended order of elimination: Group 1, Group 5 & Group 4, finally Group 2 & Group 3."
  - text: "Tips: Mission is flagged completed when ALL ships in Group 5 are killed."
  - text: Blitz:Destroy all ships from Group 5 and warp out. Kill warp disruptor if needed.
  - text: Ships ordered by distance. Not by spawn order. Ships spawn one group at a time over several seconds after you warp in.
