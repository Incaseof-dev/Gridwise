notes:
  - text: "Web/warp disruption: Yes"
  - text: Combat is optional
  - text: "Mordu’s Legion: The Legion, mostly consisting of old Caldari veterans from the war with the Federation and young hotheads eager for action, is the largest and most famous mercenary corps in New Eden. They accept members from any race, as long as they are not known enemies of the Caldari State, and non-Caldari that have served in the Legion for a long time are offered Caldari citizenship on their retirement. The Legion is often employed by governments to settle issues that are not directly under anyone’s jurisdiction, especially when fast deployment and swift results are needed. Their reputation as combat experts as well as fair and honest warriors has never been tarnished."
  - text: Objective
  - text: Get the Scope reporter, Corin Risia (1 m³) and return him to Sister Alitura at the Arnon IX - Moon 3 - Sisters of EVE Bureau station
  - text: 'Possible glitch on mission reads "and destroy his captors." This will not let you turn in the mission by snatch and grabbing Risia. Warping back to the mission and briefly engaging frigates allowed mission completion of the mission. Note: In this instance, Mordus frigates were heavily tanked and used web and point. I warped out when scram failed.'
  - text: Notes
  - text: Fit an afterburner or micro warp drive on your ship if you can - speed helps here. When you warp into the mission, Risia's Wrecked Ship container will be about 45 km away. Make a beeline for it, and loot it to put Risia into your cargo hold. When you do this, you'll see seven Mordus frigates appear at 45-60 km range. You do not need to destroy these ships to fulfill the mission - just warp back to Sister Alitura's station before they can get in range. If you wait too long, the enemy frigates will web you - don't wait around to let this happen.
  - text: "On arrival - Corin Risia: Hey! Get me out of here before a patrol finds us here!"
