  - text: "Ship size limit: Cruiser T1/Faction"
notes:
  - text: Haunted Yard is an unrated combat site belonging to the Rogue Drones faction. It can be found via exploration by scanning anomalies in high security and low security systems.
  - text: This site can escalate to Pulverize the Pioneers
  - text: The leaking caskets are unlocked so head straight for them. The commander wave spawns near the warp in so boost back there.
  - text: Frigate, Cruiser, Shuttle, Corvette, Assault Frigate, Destroyer, Interdictor, Covert Ops, Interceptor, Stealth Bomber, Electronic Attack Ship, Expedition Frigate, Tactical Destroyer, Logistics Frigate, Command Destroyer
  - text: "Escalation: This site can escalate to Pulverize the Pioneers."
  - text: "Escalation: Expeditions: Pulverize the Pioneers: Throughout this last fight, your radar equipment has been busy chewing on information about incoming and outgoing vessels and it seems it has traced a very large group of ships that left this place few minutes before you arrived. You have no clue why they left, were they fleeing? Or was it a coincidence? Either way, there is only one way to find out."
