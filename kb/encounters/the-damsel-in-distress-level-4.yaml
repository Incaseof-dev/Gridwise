notes:
  - text: Destruction of the garden results in an 3,000 Explosive damage Explosive damage in a 30-40 Km radius. This kills drones.
  - text: Single ungated pocket. You can warp in at preferred distance.
  - text: Reinforcements arrive when you attack Kruul (unless the Casino is destroyed first) and when the pleasure garden takes armor and hull damage.
  - text: "Important note: The Damsel will appear in the cargo hold of the ship that got the last hit of the Pleasure Garden. This should be noted if you are running this mission in fleets."
  - text: "Note to important note: Endrulf Anbet Skor reported on 7 January 2023 that the Damsel did not appear in the cargo hold so this is most likely no longer true."
  - text: "Note to note to important note: as of 2024-06-23, the Damsel *does* show up in the cargo hold. This may be inconsistent, pay particular attention when blitzing this mission."
  - text: "Notable loot: Kruul drops just some DNA. Zor drops Zbikoki's Hacker Card that allows you to skip the first room in Worlds Collide missions. Zor also drops an implant that is usually cheap but can be valuable if you are lucky. The gardens drop commodities such as tourists and tobacco."
  - text: "Tip: Don't let your drones shoot Kruul as that will trigger the Battleship reinforcements. Also, recall your drones before your last hit to the Pleasure Garden, it explosion can kill your light or salvage drones (from someone who lost 10 salvage drones because he forgot about this)"
  - text: "Blitz: Destroy Kruul's Pleasure Garden (the one further away from warpin) and return to agent. The Damsel will appear in your cargo hold. The incoming DPS is very high if all waves are triggered."
lootNotes:
  - text: "Loot: ≈ 7-8M ISK (100% Jita Buy, 2020-12-06) - small chance at a unique drop from 'Zor' worth around 100M."
  - text: "Salvage: ≈ 489k ISK (100% Jita Buy, 2020-12-06)"
  - text: "Bounties: ≈ 5.0 Million ISK (2020-12-06)"
