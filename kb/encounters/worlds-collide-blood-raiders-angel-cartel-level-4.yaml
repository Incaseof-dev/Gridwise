pockets:
  - name: First Pocket (Warzone)
    notes:
      - text: You arrive in the middle of two large groups and two gates approximately 33km from the warp-in. One for your primary enemy, and one for the faction mentioned in the mission briefing (in this case, Blood Raiders and Angels). They start far away from you behind their own gate. The gates are locked until you kill the last ship of that faction.
      - text: "Blitz: You can blitz this by using Zbikoki's Hacker Card. (Obtained from Zor in other missions). It will be consumed upon unlocking the gate."
