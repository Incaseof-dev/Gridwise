    notes:
      - text: "Aggro at warp in: Yes (might web too)"
      - text: "Tips: Using drones on the Spies causes the whole room to aggro."
      - text: "Tips: The Saints throw Bane torpedoes and can hit at 55km or more."
      - text: "Tips: Arch Gistum Centurion is fast and will close the range to under 20km, so kill before the Saints."
      - text: "Tips: Cherubim throw Havoc cruise missiles to at least 80km. Thrones are shorter range."
      - text: "Tips: Chance of spawning a Gist Overlord [543k battleship] as well. Chance increases with every ship that enters the room. Overlord waits to be attacked, and attacking it caused the remainder of the room to aggro."
      - text: "Tips: Original player leaving to get more ammo and returning does not cause remaining groups to aggro."
      - text: "//Untested: A second ship (gangmate) present may cause entire room to aggro immediately.//"
