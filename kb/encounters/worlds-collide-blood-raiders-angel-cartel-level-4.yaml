  - name: 3rd Pocket (Blood Raiders)
    notes:
      - text: Killing all the ships in the 3rd pocket trips the "mission completed" flag even if you do NOT pick up the stranded crew. If you forget you will have to quit the mission with loss of standings from agent, corp, and faction.
      - text: The pocket looks like a single group, but it's actually 3. Use the same technique suggested for the Blood Raider pocket. If you do everything wrong [use drones, etc.] full-aggro is 900-950dps (EM 51%/TH 49%) with the occasional kinetic cruise missile from the battleships.
      - text: "Tips: Group 1 won't move very fast, so you can get some range on them if you can find a direction to go that doesn't come close to other groups."
      - text: "Tips: Group 2 can be attacked separately."
      - text: "Tips: You only need to blow up the auto-aggro group to get the ship crew."
      - text: "Tips: Keep drones on Passive to prevent any unwanted aggro."
      - text: "Tips: On occasion, you might - even without drones or partners - aggro all of the groups (some of which can warp scramble). I suggest you put some distance fast between you and the groups you haven't yet aggroed."
