  - name: Blood Raider Pocket
    notes:
      - text: "Warning: If you do it all wrong and aggro all of them the full-aggro is 1,100-1,200dps (EM 50%/TH 50%) with the occasional kinetic cruise missile from the battleships."
      - text: "Tips: Shooting the Spies with your own guns/missiles will not aggro anything else. Drones and anyone else will."
      - text: "Tips: Drones can be safely used to kill the auto-aggro group. Just make sure they don't shoot Spies."
      - text: "Tips: One can slowboat to the next gate. No additional aggro. You will be at around 5 km to the gate when the gate group aggros you."
      - text: "Tips: Wait for the 1st group to target you, and take them all out. Fire on another ship, it's group will target you, and take that group out. Feel free to take out the Blood Spies, once the 2nd group is gone, to trigger the last group."
      - text: "Tips: You might find a collidable structure in your way (or even hit it) as you enter."
