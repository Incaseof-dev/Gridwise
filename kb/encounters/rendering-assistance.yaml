notes:
  - text: "Colonial Supplies: The Gallente Federation emphasizes personal freedoms and accomplishments, but they also believe in providing the tools for personal advancement. Gallente believe in ”investing in the future,” so shipments of supplies for new colonies are almost always supported by lobbyists and the government. History has shown that the returns generated over the years more than repay the initial investment."
