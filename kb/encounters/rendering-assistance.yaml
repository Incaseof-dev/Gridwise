  - text: --You can complete this mission and accept the next one remotely.--
  - text: Be sure to load the Antibiotics (0.2 m³) into your ship's cargo bay before leaving the station. This is a very easy mission. You will warp in at 45 km from the Colonial Supply Depot container. Simply approach it, open it, and transfer the Antibiotics to that container.
