    onWarpIn: "...Sansha's Nation continues its raids against poorly defended civilian areas. Mining colonies, merchant waypoints, and research outposts are favorite targets. Once the structures are overrun by Sansha slaves and drones, surviving locals are turned into test subjects. Many of these areas are used to develop new neural paralytic agents used in abductions. A common thread in numerous reports is the presence of a Sansha known as Ation09.... DED Threat Assessment: 5 of 10"
  - name: Room 2
    notes:
      - text: The majority of the incoming DPS in this pocket comes from the battlecruisers and battleships, destroying them significantly reduces incoming damage, which can exceed 700 DPS.
      - text: Alternatively, you can keep the battleships at around 60-70 km and the battlecruisers at more than 40 km, the DPS is significantly reduced. Long-range weapons are recommended for this method. Smaller ships can simply destroy the cruiser and battlecruiser spawns, as the battleships' tracking is poor enough for a cruiser to speed-tank relatively easily.
      - text: Unlike other DED sites of this rating, the gate in this pocket is unlocked from the beginning. If your ship is fast and can field a strong tank of upwards of ~700 DPS EM/Thermal, you can simply cross the 40 km distance to the gate and skip the pocket entirely.
      - text: "Note: rats info here is not exact. Only some battleships use EWAR."
