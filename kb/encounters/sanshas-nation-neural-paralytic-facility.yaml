  - name: Room 3
    notes:
      - text: "Transmission from Slave Ation09:: When you wake up in your next clone, remember it was the Master's will that you died here today."
      - text: This pocket is the single most dangerous in the site. The triple stasis tower spawn will web you down to a standstill and make you an easy target for even the battleships to hit, even in fast moving cruisers. Additionally the weapons range of most of the battleships is very large and the smaller ships will close in quickly. Killing the stasis towers should be your highest priority, unless you can field at least 500 DPS/tank with over 80% EM/Thermal resists, in which then you can opt to immediately snipe the overseer. Once the towers die the rest of the fleet is significantly easier to speed-tank.
      - text: Slave Ation09 is located around 40-45 km from the warp-in.
      - text: "Note: rats info here is not exact. Only some battleships use EWAR."
      - text: "After Ations death:: Ation09 is dead again. Might as well gather his goodies before he has a chance to resurrect."
