  - text: "Web/warp disruption: Elite frigates"
  - text: Requires data hacking. No standing loss
  - text: "'Harkan's Plan': My associate is a man named Terrus Harkan. He was once the head of Lord Miyan's security forces and later an activist for slavery reform. After years of watching the Holders bicker and drag the Empire into pettiness and unrighteousness, he came to us with a fascinating plan. We are going to replace Lord Miyan with himself. Or something close. Sansha's Nation has a solid lead in mind-body cybernetics. Using the appropriate combination of implants the Sansha can create an effective verisimilitude of a human intelligence, and that can receive directives from the Nation. With this replacement Harkan wishes to turn the Kor-Azor political landscape around and restore the honor Harkan believes it once had."
  - text: Single ungated pocket. Communications array holds no items, it simply must be successfully hacked to complete the mission.
