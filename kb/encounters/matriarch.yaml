notes:
  - text: "Suggested ships: Battleship"
  - text: For this storyline you are asked to retrieve a mission objective (Salvaged Electronics, 20 m³) which is inside a cloaked cache.
  - text: After destroying the whole group present, a new spawn will appear.
  - text: In total there are one initial group (Angels) and three waves (Sanshas) equals four groups.
  - text: All groups will autoaggro after some seconds.
  - text: "Note: All NPC may aggro your drones, need to be verified."
  - text: "Blitz: Not possible as all the ships have to be killed in order for the cloaked cache to be revealed."
pockets:
  - name: Single Pocket
    notes:
      - text: After destroying all ships, the sansha's waves start. This is indicated by a message about a cynosural field opening.
      - text: The cynosural field opens about 25 km from the initial warp in point.
      - text: After destroying all ships, the next group spawns.
      - text: After destroying all ships, the final group appears.
      - text: "After having killed all ships you receive the following message: The automated base defenses register that combat has ceased, uncloaking a nearby cache of valuables."
      - text: You'll find a now revealed Bunker labelled "Cloaked Cache" which contains scrap metal and the mission's objective (Salvaged Electronics).
      - text: Destroyed Bunkers may drop T1 module(s) and scrap metals.
      - text: The Watchtowers didn't drop anything.
      - text: The two battlestations have a lot of hitpoints.
      - text: Battlestations dropped no loot.
      - text: "Bounty: ≈8M"
      - text: "Loot: ≈2-3M"
      - text: "Salvage: ≈3-4M"
