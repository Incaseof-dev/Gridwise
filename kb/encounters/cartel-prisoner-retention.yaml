    notes:
      - text: ----
      - text: "Important: The main structure (Angel Retention Facility) will steadily repair its shields, and if anything (ships or drones) is within 35~38km of it, it will web you and repair all of its armor every few seconds. This dramatically increases the DPS needed to break it."
    onWarpIn: This heavily guarded pocket bestows the prison battlements and a massive fleet of Angel vessels that see to it that no one can escape from within the retention core. The acceleration gate that takes prison transport ships into the main Prisoner block is scrambled by a scramble wave generator to keep the gate closed at almost all times.
