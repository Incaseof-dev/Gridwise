    onWarpIn: This area of the complex handles the traffic of incoming (and sometimes outgoing) prisoners. The pocket is well defended by a small but powerful Angel fleet. The resident jailor holds control over who is allowed further inside the complex, through the traffic gate towards the prison battlements.
