notes:
  - text: The expedition consists of two parts.
  - text: "Escalation start: As you blow up the Blood raider chapel, a strong electromagnetic pulse erupts, threatening to knock out your instruments, but after a few milliseconds of quantum level queasiness, they reel back and start going around their business as usual. A short while later, one of your scanning modules reports readings of a similar electromagnetic anomaly in a system not so far away."
  - text: The Blood High Priest repairs other enemy ships until it is destroyed. Advise destroying it first if you want to take out the other rats.
loot:
  - item: Corpus C-Type Battleship module
    from: Dark Templar Uthius
  - item: Dark Blood battleship modules
    from: Dark Blood battleship
    note: May also drop from the Blood High Priest
  - item: Bhaalgorn BPC
    from: Dark Templar Uthius
    note: Rare drop
lootNotes:
  - text: Typical loot from the Dark Blood battleship and the Blood High Priest includes dog tags and faction ammunition. Dark Templar Uthius can drop Corpus C-Type modules and in rare cases a Bhaalgorn BPC.
