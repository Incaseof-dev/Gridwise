    class: Battleship
pockets:
  - name: First Location
    notes:
      - text: Ungated pocket. You land among four Blood Raider Chapels. Shoot them to trigger escalation if none is gotten from the Dark Blood commander.
      - text: "Escalation dead-end: The cathedral erupts in a ball of flames, quickly subdued by the lack of oxygen. Then there is a second explosion, an enormously powerful nuclear thunder, accompanied by a huge electromagnetic pulse. Then a few milliseconds later, your instruments manage to pick up another pulse, much fainter, distant. You have no idea where it came from and the pulse seems to have confused your computer long enough that it has no record of the event."
      - text: "Escalation trigger: The cathedral erupts in a ball of flames, quickly subdued by the lack of oxygen. Then there is a second explosion, an enormously powerful nuclear thunder, accompanied by a huge electromagnetic pulse. Despite this local electric storm, your instruments manage to pick up another pulse a few milliseconds later, in another system not far away. How this distant pulse got here in such a short time is a mystery, but there it is, no doubt about it."
