    onWarpIn: The central pocket of the complex houses the drug refinery, narcotics storages and military supply warehouses. The headmaster of the drug refinery must clear all visitors before allowing entry to the acceleration gate towards the administration sector.
  - name: Fourth Pocket - Administration Sector
    notes:
      - text: ----
      - text: 300px|thumb|Fourth Pocket
      - text: The Serpentis Supply Stronghold has a lot of hit points, so it is recommended to bring a high DPS ship. It does not, however, repair itself. Shooting it will aggro all ships.
      - text: "After destruction of Supply Stronghold:: The Serpentis Supply Stronghold is a smoking wreckage, and its administrators are dead, cloned, or on the run. There is now little left in the area except the quiet ruins of past criminal activity."
