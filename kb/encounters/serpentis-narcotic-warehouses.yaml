            class: Accl Gate
            names:
              - Acceleration Gate to Central Warehouses
            note: Locked until all NPC ships are destroyed
          - count: "1"
            class: Container
            names:
              - Charge Ammunition Storage
            drop: T1 ammo
    onWarpIn: Check-in tunnel contains warehouses and storage's for equipment and drugs ready for categorization and registration. Incoming vessels are required to check in at the Staff Quarters before continuing to the main drug refinery and central warehouses.
