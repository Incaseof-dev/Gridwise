lootNotes:
  - text: The main attraction of this site is the Coreli A-Type modules. The Small Armor Repairer and Small Remote Armor Repairer aren't as strong as corresponding deadspace modules from other factions due to widespread farming and cheaper prices. The Multispectrum Coating and prop mods are just as strong as corresponding deadspace modules from other factions.
  - text: It is also possible to get faction modules from the overseers but this is very rare.
  - text: "Bounty: ± 1.1 Mil ISK (All five pockets)"
  - text: More loot data
pockets:
  - name: First Pocket
    notes:
      - text: ----
      - text: 300px|thumb|First Pocket
      - text: Fastest way through this room is to jump into security corridor ignoring all the rats in the room.
    waves:
      - id: initial-defenders-gradual-spawn
        trigger:
          on: warpIn
          text: Initial defenders(gradual spawn)
        spawns:
