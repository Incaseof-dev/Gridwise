            names:
              - Acceleration Gate to Check-In Tunnel
            note: Locked until pocket is cleared
    onWarpIn: "This deadspace complex was built by the Serpentis Corporation to protect and store narcotic and military supplies for their members. The complex also acts as a temporary storage area for the corporation's traffic of illicit substances. While the entrance check-in sectors of the complex are not known to be heavily guarded, certain sections house experienced security staff using top-of-the-line equipment funded by the Serpentis Corporation's income from illegal activity. DED Threat Assessment: Unsafe (3 of 10)"
  - name: Second Pocket - Check-In Tunnel
    notes:
      - text: ----
    waves:
      - id: initial-defenders
        trigger:
          on: warpIn
          text: Initial defenders
        spawns:
          - count: "18"
            class: Frigate
            names:
              - Coreli Agent
              - Coreli Patroller
              - Coreli Spy
            ewar:
