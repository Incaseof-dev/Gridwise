            names:
              - Charge Ammunition Storage
            drop: T1 ammo
          - count: "1"
            class: Accl Gate
            names:
              - Acceleration Gate to Central Warehouses
            note: Locked until all NPC ships are destroyed
    onWarpIn: The entrance pocket of this complex contains light peripheral security around the advent ware storages. Two acceleration gates give way to two different routes inside the complex, one leading to the check-in tunnel and the other to the more heavily defended security corridor. Visitors are cleared by security at the Traffic Management office, allowing members of the Serpentis Corporation access to the Check-in Tunnel.
  - name: Second Pocket - Security Corridor
    notes:
      - text: ----
      - text: Gate to 3rd room is 55km from warp in.
      - text: 300px|thumb|Second Pocket - Security Coridor
      - text: "Information: Database Information:: The security corridor is the main defense barrier before continuing through the acceleration gate towards the main refinery and central warehouses. All guest passes and operation handling is made by the Chief of Security on duty."
    waves:
      - id: initial-defenders
        trigger:
          on: warpIn
