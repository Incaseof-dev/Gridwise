notes:
  - text: Dubious Assignment is an escalation from the Blood Raider Fortress.
  - text: The expedition consists of four possible parts. Each part containing a single dark blood faction spawn with the final part having a chance at dropping Corpus A-type battleship modules, however the escalations and loot are not always guaranteed to trigger.
