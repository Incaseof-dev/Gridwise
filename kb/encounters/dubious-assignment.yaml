  - name: Room 1
    notes:
      - text: "If the escalation ends...: Having waited for this devious Blood Raider for a while, you are starting to think he is not going to show up at all. You kind of feel used... but on the other hand, you got to rob some more Blood Raiders."
      - text: "If the escalation Continues...: Finally your communication instruments come alive as this devious Blood Raider who hired you starts talking on the private channel. Even though the place was empty, he commends you on a job well done and gives you directions to the next assassination target."
  - name: Part 2
    notes:
      - text: "If the expedition continues...: This time your employer is right on time with the coordinates to the last location. He sounds somewhat stressed, but before you can reply he is gone."
      - text: "If the expedition ends...: This time your employer does not let you wait, with a more hissy voice than before he thanks you for services rendered and congratulates you on being scammed for a good cause. And with that he is off the air, permanently this time. It is true that having some reward for your efforts would be nice, but then again, you got to kill some Blood Raiders who would otherwise still be alive."
