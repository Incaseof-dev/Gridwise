notes:
  - text: "Web/warp disruption: Ishukone Watch Hawks"
  - text: "Crielere; a parable told to all aspiring young Caldari: “There once was a great rich merchant,” she began hesitantly, suddenly all too aware that all eyes in the room were on her. But she plunged on regardless, steeling her nerves. “He lived to a grand old age and possessed every wealth a man could dream of. Many looked to him in awe or envy, coveting his treasures and desiring to imitate his great successes. Yet the old man was never happy and on his deathbed, a young clerk working for him asked: ‘You must feel that your life has been one great success story, what with all the wealth you have accumulated.' But the old man replied. ‘My life has been one of misery and sorrow. As a young man I chose wealth over family, discarding the love of my life. When I die all that I will leave behind in the world is money. But money is the same all over, mine is no different from anyone else's. Once my wealth has been scattered, all that I will be is dust and vague memories. My life is a failure young man, don't make the same mistakes I did.'"
  - text: The mission objective is slightly misleading. The mission is marked complete when you approach (or warp at range) close to the Ishukone Watch Base 3 structure - no cargo pickup is required.
  - text: "Blitz: Use a fast frigate or shuttle, create a ping while warping in, ping off, warp to the structure, and warp out immediately. The mission will be marked finished shortly after."
  - text: "Notes: The mission is in ungated semi-deadspace which means it allows warping inside the pocket, although you will always warp to the mission location when warping from outside the pocket. Create a bounce bookmark as you land on grid for easy repositioning."
  - text: The cruise missile batteries will hit battleships hard. You will want to take them out soon. For smaller ships, primary the Stasis Towers as they will make speed-tanking difficult.
  - text: Ishukone Operational Reports will drop from a can next to you when you get near the station. Picking it up is not required to complete the mission.
  - text: Killing NPCs is optional but they drop Caldari Navy insignias, which can be profitable (approx. 25M). No standing loss for killing them.
