    onWarpIn: Private military compounds like these house the very finest of corporate security fleets. Decked out with the latest high-end military technologies, these fortresses perform vital roles protecting corporate assets and other more shadowy interests. During the liberation of the Caldari Prime, it was compounds like these that supplemented the Caldari Navy's military infrastructure, ensuring the success of the most ferocious surprise attack in recent State history. In this era of heightened tension, many stations still stand as supplemental bases for Caldari Navy contingency plans. Others though, have returned to much older tasks, guarding over the secrets of their parent corporation, and serving its own agenda ruthlessly.
