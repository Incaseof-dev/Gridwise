  - text: "Roadhouses: Small, independent trade hubs throughout New Eden are sometimes referred to by a most peculiar and archaic term: “Roadhouses.” Though no one quite remembers why they're called that, it's common knowledge that roadhouses are ideal locations for moving stolen goods, making underworld contacts, or getting hurt. Needless to say, these establishments are frequented by unscrupulous roughnecks for whom pain doesn't hurt."
