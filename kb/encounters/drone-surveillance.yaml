notes:
  - text: Drone Surveillance is an unrated combat site belonging to the Rogue Drones faction. It can be found via exploration as a cosmic anomaly in low-security and null-security systems across New Eden. As an ungated complex, the limitations as to which ships can complete this site are tied to the security rating of the system where the anomaly spawns (T2 Battleships for high-security systems, and up to Titans in low-security and null-security systems).
  - text: There are two variations of this combat site. The first variation takes place in the ruins of a megastructure and includes Light Missile Batteries in the initial wave. The second variation takes place inside an asteroid-filled cloud and includes Defense Vampire (nosferatu) batteries instead. Both variations have a chance to spawn a Sentient commander rogue drone, which drops drogue components and may drop faction drone modules and items. This site has a chance to escalate to Rogue Drone Asteroid Infestation.
  - text: "Escalation: This site can escalate to Rogue Drone Asteroid Infestation."
  - text: "Escalation: Rogue Drone Asteroid Infestation: Your scanner has picked up a transmission originating from a nearby system. It would be wise to investigate this mysterious signal further."
