    onWarpIn: The so called "Product Park" is where the complex's most vigorous mining operations take place. Structures built into asteroids house the pre-processing and manufacture of crude parts before being shipped further into the complex.
  - name: Room 4
    notes:
      - text: The two sentries and the group camping the warp-in will auto-aggro on landing. Attacking Skomener Effotber will aggro the entire pocket.
      - text: Skomener Effotber has strong armor tank that needs at least 600 DPS of pure EM damage (70% weakest resist) to break. He does ~450 dps EM/Thermal damage at 70km range. Combined with the full room aggro the total incoming damage in this pocket can well exceed 1000 dps. There are no webbing ships so speed tanking will reduce the room damage by a lot.
      - text: "Blitz: Kill Skomener Effotber, bookmark wreck, warp out, wait 3 minutes, warp back to loot wreck."
