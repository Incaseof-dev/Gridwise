notes:
  - text: The site is behind an acceleration gate. Warping to the side lands you at 0 on the gate.
  - text: This site is rated DED 6/10. 3 Battlecruisers and a Battleship ran this site easily. A well tanked T3 Cruiser is usually sufficient to clear the site in ~30-40 minutes.
  - text: Warping to the site lands on an acceleration gate at 0.
