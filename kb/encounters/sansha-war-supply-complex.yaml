lootNotes:
  - text: You can get about 24 million ISK in bounties and a similar amount of meta module loot. There is an opportunity to get Centum Cruiser A-type Module drop, and you are guaranteed a 19th Tier Overseer's Personal Effects (~51 million ISK).
