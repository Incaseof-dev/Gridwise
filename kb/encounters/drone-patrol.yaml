notes:
  - text: Before hacking and slashing, beware that there are three versions of the site, and the spawns may vary considerably. There is at least one version of the site that is considerably more difficult than what is listed below!
  - text: The site consists of one ungated pocket. There is an Abandoned Station about 3 km from warp-in and around 30-40 Ship Debris spread around the pocket. New wave spawns once ships from previous spawn are dead.
  - text: Some of the frigates scramble and warp disrupt.
  - text: This variant contains a prominent Abandoned Station
  - text: "Escalation: Site may escalate to Outgrowth Rogue Drone Hive (10/10)"
lootNotes:
  - text: The drones drop no loot
  - text: Bounty amount to about 22-23 million ISK
  - text: There is a rare sentient spawn
  - text: There is a rare INFESTED CARRIER spawn (18.06.2024)
