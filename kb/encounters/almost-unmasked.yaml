notes:
  - text: "Paranoia: Hyasyoda is one of the oldest of the Caldari megacorporations, having been formed shortly after first contact with Gallente when the Caldari were still in their Industrial Age. Throughout State history, Hyasyoda executives have always been conservative and cautious. As a result the corporation has informally claimed as theirs the age old Caldari saying, “only the paranoid survive.”"
