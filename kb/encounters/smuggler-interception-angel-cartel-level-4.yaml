notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: I've kited this in an armor tanked Kronos without ever getting into armor. All you need in both pockets is an AB to keep out of their range (70km), fit accordingly.
  - text: I've sniped from the warp-in beacon in a Dominix with Bouncer II, starting with closest Hostile (group 2 was closer) only got to 75% Shield.
  - text: In the 2nd pocket on the other hand, the hostiles close in fast, either burn off or Micro Jump when the heat gets too intense.
  - text: "Pocket 1: Kill everything"
  - text: "Pocket 2: Only the ships in the group with the Transports needs to be destroyed to complete the objective (don't forget to loot the 10 Militants)."
lootNotes:
  - text: "Loot & Salvage: 6.7 mil"
  - text: "Bounty: 6 mil"
