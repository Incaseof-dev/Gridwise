notes:
  - text: Salvation Angel's Shipment is an expedition found by completing Angel Outpost combat sites. It may contain up to four parts, each of which will be about 4 jumps from the previous system. The first three will be in high-sec space, while the fourth will be in low-sec.
pockets:
  - name: Part 1
    notes:
      - text: As soon as you warped in to the last room, your instruments registered a large group of ships escaping the fight in the last second. Further analysis of the data indicates this was a convoy of six to eight transport ships from the Salvation Angels, accompanied by an unknown number of combat ships. Your navigational systems have already come up with a likely location for you to get to, in case you feel you have any business with them.
      - text: 500px
      - text: Taking out the Domination cruiser triggers the escalation. Assuming you always get a low bounty (and therefore short range) BS in the spawn, you can minimize DPS and fit for more gank by simply moving away from the BS after warpin. Even moving slowly you'll buy yourself enough time to take out all the BCs. The drake that had to warp in and out above had no trouble here.
  - name: Part 2
    notes:
      - text: Even though most of the convoy left before you even got there, you still have a good indication of where to follow them.
      - text: 500px
  - name: Part 3
    notes:
      - text: Despite their heavy ships, the Angels seem to be outmaneuvering you, getting away without a scratch. Your scanners have a new destination ready in few seconds...
      - text: 500px
  - name: Part 4
    notes:
      - text: After this fierce fight you are relieved to see your instruments still have track on the main convoy which seems to still contain all of the original transport ships.
      - text: 500px
      - text: "First Pocket: 2x Frigates (Impaler/Hunter)"
      - text: "First Pocket: 3x Elite Frigates (Arch Impaler/Arch Ambusher) Web/Scram(?)"
      - text: "First Pocket: 3x Destoryers (Seizer)"
      - text: "First Pocket: 3x Battleships (Saint/Nephilim)"
      - text: "Second Pocket: 1x Frigates (Impaler)"
      - text: "Second Pocket: 4x Elite Frigates (Arch Impaler/Ambusher/Raider) Web/Scram(?)"
      - text: "Second Pocket: 3x Battlecruiser (Legionnaire/Primus)"
      - text: "Second Pocket: 1x Battleships (Saint)"
      - text: "Second Pocket: 1x Cruiser (Gistum Domination Racer, doesn't appear to be actual Domination)"
      - text: Upon clearing Gistum Domination Racer I got a completion message but no loot and Racer wreck yielded T1 salvage.
      - text: In a recent instance, the Gistum Domination Racer dropped a single Gistum A-Type 50mn MWD, with no other modules or tags in the wreck.
