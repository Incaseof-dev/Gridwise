restrictions:
  - text: "Ship size limit: Battleships"
notes:
  - text: The site is behind an acceleration gate. Warping to the site lands you at 0 on the gate.
  - text: Warping to the site lands on an acceleration gate at 0.
  - text: "Escalation: Destroying the Serpentis Stronghold structure in Room #2 may cause the site to escalate to Suspicious Job."
  - text: "Escalation: On Escalation:: As the bits and pieces from the disintegrated station charge into space, carrying the news of heightened entropy in the universe, your instruments receive an unusual message. It's obviously being transmitted from the Serpentis and even though the person on the other end does not introduce himself as such, the special cypher reveals it is indeed theirs. He demands speaking over a secure channel and after you have established one, he continues with sarcastic congratulations on your victory. He then gives you an offer: If you travel to three different locations as he instructs and assassinate the the Serpentis leaders operating there, he will reward you handsomely. He gives you coordinates to a location in a \"take it or leave it\" manner before bidding you farewell and adds that he will contact you after the first target is destroyed."
lootNotes:
  - text: You can get about 30 million ISK in bounties from fully clearing the site. The faction battleship may drop additional valuable loot.
