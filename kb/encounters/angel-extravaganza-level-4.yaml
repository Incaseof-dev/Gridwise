  - name: Bonus Pocket
    notes:
      - text: Bring an Angel Diamond Tag to unlock the Bonus pocket gate!
      - text: Fit with either very high DPS to take out most of the aggro, or with a massive tank to not worry about that.
      - text: Move away from the Angel Bunker to buy you a bit of time to kill the sentries as the enemy ships try to close in.
      - text: Eliminating all the Angel Cruise Missile Batteries and Tower Sentry Angel III first will negate a significant portion of the incoming damage.
      - text: Do not kill the Gist Seraphim trigger, wait until you have cleared the pocket from all other hostile targets.
      - text: The Single Spawn isn't triggered if you destroy the Angel Bunker before Killing the Gist Seraphim.
      - text: Depending on the spawns, damage is Explosive (49- 55%)/ Kinetic (22- 28%)/ EM (7- 14%)/ Thermal (9- 15%).
      - text: The Sentry Towers deal equal EM/ Thermal. Angel Cruise Batteries, Arch Gistii Ruffian, and Gistatis Tribunis deal lots of Thermal.
      - text: Angel Viper, Gistatis Legatus, Gist Malakim, and Gist Throne deal EM. Removing these may help your tank, depending on how you decide to set up.
      - text: "Tips: Angel Cruise Missile Batteries spam Cataclysm Cruise Missiles every 25 secs. Each missile deals 900 Thermal damage at 0% resist."
      - text: "Tips: Angel Light Missile Battery fire Piranha Light Missiles."
      - text: "Tips: Tower Sentry Angel III fires every 2- 3 sec, each hit deals 80- 250 Explosive damage at 0% resist."
      - text: Angel Battle Station & Angel Bunker drop T1 modules and ammo. The Angel Battle Station has over 400k hp and has not been observed to drop anything of significant value so it may not be worth destroying.
      - text: "Incoming Transmission: What are you doing?? I told you to return to me immediately after destroying the Angel general. You are now flying into uncharted territory, who knows what you might encounter there. Do not throw your life away so carelessly ..."
      - text: ± 17.4M ISK (2025-04-21) By Verum Peto
