  - text: "Pocket 1: Kill the Scanner Post, then kill the initial ships and wave 1."
  - text: "Pocket 2: Kill all ships."
  - text: "Pocket 3: Kill the Battleship, ignore everything else."
  - text: "Pocket 4: Kill the Silo (bookmark the can) and the Radio Telescope, then kill all ships."
  - text: "Pocket 5: Kill the Battleships, starting with the highest bounty of each group to trigger spawns, kill Tiogo Kargaz you're done."
  - text: "Notes: Bring an Angel Diamond Tag to unlock the Bonus pocket gate."
  - text: "Notes: Auto aggro from initial groups in every room. The spawns may target your drones."
  - text: "Notes: No Hostiles at initial gate."
  - text: "Notes: Identifying the spawn trigger may be tricky, it is usually the highest bounty Battleship yet not always or could be one that flies differently."
  - text: "Notes: Fit for DPS, tanking doesn't require much, with the exception of bonus room."
