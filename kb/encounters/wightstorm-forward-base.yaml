notes:
  - text: thumb|View of a Wightstorm Forward Base.
  - text: If a capsuleer is present at the Forward Base it will appear in the Overview of every capsuleer in the same System.
  - text: Enemy ships can warp to tactical bookmarks and often target drones. They deal EM & Thermal damage with lasers, and Kinetic & Explosive damage with missiles, similar to their Incursion counterparts. Frigates have a 50k ISK bounty, Cruisers 125k, Battlecruisers 250K and the Battleship 2M. Only the Battleship drops loot.
  - text: Similar to other event sites post-2019, the site is doable with a well fit Battlecruiser with application support. One of the event challenge texts recommends a T2-fit Battleship.
pockets:
  - name: Warp-in
    notes:
      - text: (2025) The warp-in may feature a Sansha's Transit Modulator container, which you can use to deposit a Cryostorm Clarifier to replace the normal boss with a harder, tankier variant that deals more damage, has more HP and gives higher rewards. After the Acceleration Gate is used, the modulator will be disabled and the site unable to be modified.
    waves:
      - id: structures
        trigger:
          on: warpIn
          text: Structures
        spawns:
          - count: "1"
            class: Acceleration Gate
            names:
              - Acceleration Gate
  - name: Room 1
    notes:
      - text: The first wave spawns after 30 seconds. All types will frequently primary drones, so heavy droneboats are not recommended unless you can quickly remote repair your drones effectively.
      - text: After the Wave 1 is defeated, the boss will warp in at about 20 km from the beacon after about 20 seconds. They do around 400 DPS. (Roughly 500 for the alternate spawn)
