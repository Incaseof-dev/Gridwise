notes:
  - text: Sansha Refuge is an unrated combat site belonging to the Sansha's Nation pirate faction. It can be found via exploration as a cosmic anomaly within systems owned by the Amarr Empire and Ammatar Mandate. As an ungated complex, the limitations as to which ships can enter this site are tied to the security rating of the system where the anomaly spawns (up to T2 battleships for high-security systems, and titans in low-security and null-security systems). Completing this complex may award the player with valuable True Sansha faction modules and ammunition.
  - text: This combat site consists of a single ungated pocket of space containing a variety of frigate- and destroyer-sized enemy ships. Destroying all hostile ships may escalate into the DED rated Sansha's Command Relay Outpost complex.
  - text: The site is an open single pocket, one may warp to a preferred distance.
  - text: thumb|400px|Site variant 1 on warp-in
  - text: Distinguished by orange clouds. You land at 10km away.
  - text: thumb|450px|Site variant 2 on warp-in
  - text: Distinguished by cyan clouds. You land directly at the site.
  - text: "Escalation: This anomaly can escalate to the 3/10 Sansha DED site Sansha's Command Relay Outpost."
