  - text: Destroy all enemy ships
notes:
  - text: 'Blitz: Kill right spawn, then all Cruisers and "Demon" Frigates reinforcements in that chain.'
  - text: It is recommended to target one EoM Prophet from each group and kill them first. Then kill the remaining ships one at a time and eliminate the chain of spawns after it. This means you get a total of three of each of the Reinforcement Spawns!
  - text: An easy way to tackle this is to approach from either the left or right hand side and just pick off the ships as they approach.
