  - name: Pocket 3
    notes:
      - text: Hoborak Moon does a nasty amount of EM damage with Mjolnir Torpedoes. The Webifiers/Vipers should be a high priority target if you rely on speed tanking, since the webbing will allow Hoborak to apply his main damage to you much more easily. His resist profile is also modestly stronger than most Angel ships of his size (Weakest Explosive, 50%, Strongest EM 80%), and he repairs shield faster. 400+ sustained DPS in Explosive damage should be enough to crack his tank at a reasonable pace.
      - text: Sentries have limited aggro range and do not need to be destroyed to complete the mission.
      - text: Mission is complete once all ships are dead. Battlestation in the final room drops worthless loot, mostly ammo.
