  - text: "Ship size limit: Battleships"
notes:
  - text: "The site is located behind an acceleration gate that allows T2 Battleships or lower to access and consists of two parts: Part 1 is found by probe scanning or as an escalation. Completing Part 1 will always cause an escalation to Part 2 at another location."
  - text: The Serpentis Logistical Outpost and Serpentis Logistical Outpost Part 2 are considered to be the hardest Serpentis Escalations.
  - text: Use extreme caution when completing the sites due to the Scramming Frigs and T2 Neuting Towers
  - text: "Escalation: This site always escalates to Serpentis Logistical Outpost Part 2 with the following message."
  - text: 'Escalation: Escalation message:: "Serpentis Logistical Outpost P2 - After disposing of the defenders, you manage to decode some of the surviving ship data-cores. The information contained within those reveals the location of a second facility."'
lootNotes:
  - text: Clearing it all gives 23.000.000 ISK in bounties. This site has no notable loot drops.
