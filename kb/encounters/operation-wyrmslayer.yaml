pockets:
  - name: Single Pocket
    notes:
      - text: Direct warp into ungated deadspace pocket. Full room aggro on first shot.
      - text: There are 2 Ship groups and 2 Tower groups. In an attempt at simplicity, the total numbers of hostiles are combined. (I.e., there are only 12 ships per Ship group and 5 towers per Tower group.)
      - text: Destroying the non-elite (not Guardian) frigates of that spawn causes a random Shadow Serpentis Battleship to appear which must be killed to complete the mission.
      - text: After the frigate spawn, there will be another tower spawn.
      - text: "Blitz: Shoot the initial frigs and the Maulus frigs that spawn in order to spawn the Shadow Serpentis BS. Kill this BS to trigger completion."
