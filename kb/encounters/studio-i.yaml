  - name: Room 1
    notes:
      - text: Make a ping bookmark as you warp in, and use the asteroids as warp points. Unlike the first room, you can warp directly to a spot in this room from the outside.
      - text: "Grab the kid and go: I don't know how they discovered our location, but let's get out of here. You Matari bastards, take the kid with you and meet up with us. Deliver the senator's son to us, then get out of this region. You'll never work with us again. Same with you, Gian. The deal's off. Your sick plans are shut down."
      - text: Structures on site
      - text: The structure damage wave spawns directly underneath the Studio I structure. The Elite Battleships do a combined total of 1800 DPS Kinetic/Thermal but have limited range. Keeping at range of at least 40 km (or spiraling in <10 km orbit, in a well-tanked T3C or similar) will mitigate most of their damage.
