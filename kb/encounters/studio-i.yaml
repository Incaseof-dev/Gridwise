      - text: "Studio I: Unlicensed studios are a rare breed in the Gallente Federation. With the freedoms instilled into Gallente culture, the power of expression has almost limitless boundaries with which to explore. But there's a market for everything, and warped minds require debased stimulation, a desire fulfilled by unlicensed studios such as Studio I. The underworld is sick and diseased, and this studio is more impetus for wanton depravity."
