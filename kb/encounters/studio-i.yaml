notes:
  - text: "Suggested ships: Sniping battleship"
  - text: Extreme damage
  - text: Gated semi-deadspace pocket two jumps away in Osmeden. You can warp around in both rooms freely.
  - text: "Blitz: strongly discouraged; destroy all ships at warp-in, take the Gate and destroy Studio I Structure."
  - text: "Tips: Complete the Mission by destroying the Studio I Structure"
  - text: "Tips: The Studio I has about 150,000 hitpoints, evenly spread out across shield, armor and hull"
  - text: "Tips: Studio I drops the Holoreel: Wanted for Love lore item"
  - text: "Tips: Warp at 100 km and use propulsion modules to keep away from Elite Battleships"
  - text: "Tips: Create Bookmarks and warp between two of them to get distance from the enemy"
  - text: "Tips: Use miscellaneous Structures as warp points"
  - text: "Tips: Align to a Structure and warp away if you need to"
  - text: "Tips: Overheat your Shield or Armour modules"
  - text: "Tips: Destroy Frigates and Cruisers first, although the frigates are extremely slow and not a threat to snipers"
  - text: "Tips: Elite Battleships will try to approach to 10km, while normal battleships will stay at 50km; both have difficulty tracking an afterburning cruiser."
  - text: "Tips: 3% Syndicate Faction Standing loss for destroying the Studio I Structure. Normal Syndicate faction standing loss for ship kills, even the Pator 6 frigates."
