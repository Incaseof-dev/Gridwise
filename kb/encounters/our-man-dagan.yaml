  - text: Kill Dagan
notes:
  - text: Your selected agent will tell you to fly to the designated location to take out Dagan.
  - text: "This is the third and final difficult mission of the epic arc. It is even more difficult than Mission 48: Chasing Shadows and Mission 28: Burning Down the Hive. This is not because of the incoming damage or EWAR pressure, but because Dagan himself is extremely well-tanked for an enemy of this mission level."
  - text: "Dagan is flying an exotic Society of Conscious Thought battlecruiser: a Gnosis. Dagan's ship repairs its shields at about 100 EHP/s, so you'll need to bring a ship that can deal more than 100DPS. Depending on the damage type that you are dealing, you may need to adjust this figure (lasers will need upwards of 120 DPS to break Dagan, for example.) You can preview how much you DPS your ship can do in the ship fitting screen. It is recommended to bring a destroyer or a cruiser."
  - text: While Dagan uses a target painter, he cannot otherwise attack from beyond 30km and moves at close to 300m/s, so an afterburner can help you stay at the desired range. If using a long range ship like a Caracal with Heavy Missiles, just align away from the station. Dagan's armor resists are EM 85, Th 81.25, Kin 77.5, Ex 73.75 in both armor and shields.
  - text: Orbit Dagan at short range and unload as much DPS as you can into him. Dagan does somewhat poor damage for his range, so you may slow down in order to help your turrets track. You can take down Dagan's escorts if you need to remove DPS pressure.
  - text: Alternatively, if using a long range ship like a Caracal or Vexor, simply align away from the station or orbit Dagan at the appropriate range. An afterburner-fit cruiser is enough to maintain range.
  - text: Dagan's lowest resist is Explosive (74%).
  - text: 'Item description of Dagan: Dagan lies imprisoned within his pod. Distorted through the glass, you can see impressive, chiseled features contorted in impotent rage. He knows he is at your mercy, and has every reason to fear the "mercy" of a capsule pilot.'
