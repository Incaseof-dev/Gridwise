notes:
  - text: Guristas Den is an unrated combat site belonging to the Guristas pirate faction. It can be found via exploration as a cosmic anomaly within high-security systems occupied by the Guristas Pirates. As an ungated complex, the limitations as to which ships can complete this site are tied to the security rating of the system where the anomaly spawns (up to Titans in null-security systems). Completing this complex may award the player with valuable Dread Guristas faction modules and ammunition. This combat site consists of a single ungated pocket of space containing a variety of Frigate to Cruiser-sized enemy ships.
  - text: "Note: The Missile Batteries may be left alive and do not count when spawning the next wave. Each wave is triggered on death of the last ship in that wave."
  - text: "Escalation: This site can escalate to Guristas Hallucinogen Supply Waypoint."
