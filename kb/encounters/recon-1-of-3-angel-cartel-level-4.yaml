  - text: Recon mission chain has three missions. The parts 2 and 3 are same for all factions.
  - text: The Angel cartel ships deal mixture of all damage types. Majority of the damage is explosive and kinetic but many of the ships deal EM or thermal as their third damage type.
  - text: "Blitz: The gates are not locked, so you can blitz this mission in a shuttle without a single kill. Go to warp gate, activate it, when you reach the next pocket you are done! (Attemping so in a Caldari shuttle failed on Jul 23 2022, ship explode before reaching, not sure if it is skill problem)."
pockets:
  - name: 1st pocket
    notes:
      - text: The gate is not locked so you can proceed to next pocket as fast as you can move. ~60km to acceleration gate, no loot drops from structures.
      - text: "Clear: In general, keep moving either towards the other gate or towards a distant object. Every minute, another group will respawn. If you are not killing them fast enough, you can get overwhelmed. There are a couple warp scrambling elite frigates, and most of the ships do damage from a distance (36km). Once they all spawn, it can make things rather difficult for a weakly tanked ship. So be careful."
