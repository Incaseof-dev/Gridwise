notes:
  - text: "Under the Radar: Nicknamed the “Shadow HQ” after its curious location, the Nugoeihuvi station in Poinen sits just one jump out from their Headquarters and shares the system with Internal Security HQ, the security arm of NOH. For certain individuals, the station is ideally situated, offering fast and easy personal access to many of NOH's highest-ranking officials – whilst remaining on the periphery of things, unnoticed in the shadow of the 13th moon. To those who are charged with the defense of Nugoeihuvi interests, it is not Josameto but Poinen that is considered the nexus, the bustling heart of a corporation that is their whole world."
  - text: Deliver Questionable Cargo (3.0 m3) one jump away to Josameto VIII - Nugoeihuvi Corporation Publisher.
