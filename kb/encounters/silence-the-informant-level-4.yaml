pockets:
  - name: 1st pocket
    notes:
      - text: Acceleration gate to next pocket is at 4km. The gate is locked until all ships are destroyed. Sentries do not need to be destroyed.
      - text: Auto-aggro from the Sentry Towers, attacking them will aggro the entire pocket (use to draw 3rd group closer). Other groups can be agressed one by one.
      - text: "Battleships deal very high thermal and kinetic damage. It is recommended to take them out first. Unlike other drones, they don't have an omni-resist: it's best to deal EM damage to their shields, then switch to explosive for their armor."
      - text: Aggressive drones may attack the sentries and cause unwanted aggro. Watch out for drone aggro.
