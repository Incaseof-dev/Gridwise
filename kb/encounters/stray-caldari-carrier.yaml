notes:
  - text: "Web/warp disruption: All frigates"
  - text: "Space type: Normal Space, No Gates"
  - text: "Recommended ships: Completed in (1) Maelstrom w/ Passive Tank and (1) Maelstrom with Shield Transporters"
  - text: "Tips: Mission occurs in normal space, so you can always warp to distances and to bookmarks farther away from the NPCs."
  - text: "Tips: Your first warp attempt will be a forced Warp to 0. Even if you select Warp to 100 you will arrive at the Warp-In Beacon"
  - text: "Tips: Try selecting warp, canceling your warp, then warping to your desired distance"
  - text: "Tips: Warping to within 100km leaves plenty of distance that spreads out the aggro"
  - text: "Tips: Cruise Missile Batteries have a maximum range of 170km, and the Carrier’s NOS has a maximum range of 150km"
  - text: "Tips: Fighters will immediately attack your drones when they spawn from the Carrier, but this can be used to your advantage"
  - text: "Tips: Small Drones are invulnerable to the Fighters, as long as they are moving/attacking; and they are a great way to draw-off the Fighters aggro. Have your small drones attacking the carrier when the fighters spawn."
  - text: "Tips: The Fighters are only be able to hit Large and Medium drones"
  - text: "Tips: Mission is flagged complete when the Carrier and Fighters are destroyed. You do not need to destroy the Cap Ship Maint Array"
