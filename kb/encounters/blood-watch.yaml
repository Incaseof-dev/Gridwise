restrictions:
  - text: "Ship size limit: Battlecruisers (Incl. T3 cruisers)"
notes:
  - text: This is a combat site that can be scanned down with probes, and can be found in high security space in the Amarr regions.
  - text: The site is behind an acceleration gate. Battlecruiser hulls and below can access it.
  - text: A passive tanked battlecruiser or faction cruiser can run this site with little difficulty.
  - text: "Escalation: This site can escalate to Medical Twilight."
  - text: 'Escalation: Expeditions: Medical Twilight:: The slaves you liberated from this Blood facility report that this was a holding place where slaves were gathered, before being sent off to a blood replenishing "medical" station. You have heard about those places; where the Blood members go to get their blood exchanged with the blood of a slave who has been put on a special "blood cleansing" diet for a period of time. Needless to say, this leaves the poor slave empty of the vital fluid in question. Understandably your newfound slaves are quite thrilled with these recent turn of events. None of them knows where this so called "medical" station is, but a couple can tell you that they were in another holding station like this one, before they came here and coincidentally it is not all that far away ...'
  - text: 'ExpeditionsShip: Sentry Vexor: On warp in launch your light scout drones to clear the ships close to you. While clearing the first enemies, make sure to burn away from the other groups to gain time. Be careful not to kill the "Elder Corpii Spy Drone" as it triggers the next wave. As it webs you careful watch on your drones is required. Once you have moved far enough away, kill the "Elder Corpii Spy Drone". As the next wave spawns, retrieve your light scout drones and launch sentry drones. You should now be able to pick off the remaining waves using your sentry drones without problems.'
  - text: 'ExpeditionsShip: HM Gnosis; blitzing: Since you will likely be armor tanked, you can stay close to the enemies and pick them off. Avoid destroying the "Elder Corpii Spy Drones" until all other enemies are cleared, then destroy them to trigger the next wave. Make sure not to trigger several waves at once, as DPS output will become very high. When the Militant Commander spawns, only kill the Corpatis Militant Commander then take the acceleration gate. For the second room, clear the room of rats before engaging the Blood Raider Cathedral. Make sure to stay as far away from it as possible to evade incoming damage. After aggressing the Cathedral, only kill the Corpus Militant Supervisor to trigger the commander wave. Then kill the Dark Blood commander that spawns, bookmark his wreck, and warp out and back in later to collect the loot.'
