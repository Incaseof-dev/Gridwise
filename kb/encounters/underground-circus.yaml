  - name: Room 1
    notes:
      - text: "The Undergound Circus: Depravity, consumption, and the pleasures of the flesh are big business throughout New Eden. These desires are even more profitable in society's fringe: the gutters and ghettoes of the Empires, the borderlands, and the dark pockets of empty space. When law, ethics, and customs are of little concern, any service can be provided, any object bought, though often at a very steep cost. Even the underground has an economy: the supply and demand of desire. The Underground Circus is home to just such decadence, straddling the boundary between the legal and illicit. The Ringmaster runs this operation, and she is shrewd enough to know how to keep herself under the radar. Or maybe her circus remains open at the whim of some greater authority, in order to fulfill the desires of a corrupt law enforcement agency."
