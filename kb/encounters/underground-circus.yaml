notes:
  - text: 10M ISK in Bounties
  - text: "The Underground Circus: “Guilt is unknown in the Gallente Federation. Pleasure, desire, lust, avarice: These are the rights of all people, laws be damned. Our economy is built not upon currency or scarcity, but on the supply and demand of needs, wants, and yearnings. A guilty pleasure is the highest right of the Gallente; my Circus is here to satisfy and fulfill this right. Let us redefine what it is to be guilty.” -The Ringmaster, on the opening of the Underground Circus, YC 108"
  - text: Gated deadspace pocket one jump away in Caslemon.
  - text: "Blitz: clear Room 1, take the Gate, destroy The Ringmaster's Pleasure Hub Structure, kill the The Ringmaster and pick up the Ringmaster from their ship wreck."
  - text: "Tips: You cannot warp inside the Rooms"
  - text: "Tips: There are three different Factions that you need to destroy"
  - text: "Tips: The Ringmaster's Pleasure Hub has a lot of Structure Hitpoints"
  - text: "Tips: Clear both Rooms if you are unsure about surviving"
  - text: "Tips: Destroy the Sensor Dampening ships first"
  - text: "Tips: The Ringmaster's smallest resistance is 74% Kinetic"
