  - name: 2nd Pocket
    notes:
      - text: ----
      - text: Full room aggro on warp-in. You can blitz this pocket by shooting the triggers, but expect high incoming damage. Highest bounty battleship will trigger the next spawn. All waves will spawn on the Rent-a-Dream Pleasure Garden structure that is roughly 40 km from warp-in.
      - text: Hashi Keptzh has active shield tank which needs 450+ DPS Explosive damage to crack. He does 495 DPS Kin/EM with 21 km range turrets, and 450 DPS Explosive damage with 34 km range torpedoes, though they have poor application to non-battleships. He uses MWD to close in on you at 1000m/s and will apply -90% web within 15 km, making kiting outside of his web range extremely important. Shooting from ~30km away seems to be the safest option as he will rarely use MWD at 30km range and under.
      - text: "Escalation end: The facility has been neutralized and the sector officers ship is now nothing but wreckage."
