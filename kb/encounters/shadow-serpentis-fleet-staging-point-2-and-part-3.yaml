pockets:
  - name: First Pocket
    notes:
      - text: "Access: Gateless, Open Access"
      - text: This site is rather easy. Mind the wave trigger and destroy the Energy Neutralizers fast and you should have no problems.
      - text: There are no warp disrupters on any of the NPCs, so you can come and leave as you see fit.
      - text: Remember that since the site is gateless, you can make bookmarks you can warp to.
      - text: "Escalation message:: The last Serpentis Battleship sends out a distress signal before it goes down. Luckily your com systems have managed to decrypt the message and follow it to it's final destination."
      - text: "Note: December 29th 2018 - Sentry wave never spawned"
      - text: "Note: February 9th, 2020 - Sentry wave does in fact spawn, about 4-5 minutes after warp-in. They neutralize 61 GJ per cycle each."
      - text: "Note: May 2020/2022 - The sentries never spawned."
      - text: "Note: May 5th, 2023 - Sentry wave did spawn, Neutralizing 75 GJ per cycle each."
