restrictions:
  - text: "Ship size limit: Ungated"
notes:
  - text: "Escalation: Video"
  - text: "Escalation: Access: Gateless, Open Access"
  - text: "Escalation: This site can be hard or easy, depending on how you approach it. It is very easy to accidentally trigger all 3 reinforcement waves. They are triggered at 70% station shield, at 30% shield and at 50% armor."
  - text: "Escalation: You should first clear out any NPCs. Then do minimal damage to get the stations shield to 70%, clear out that wave and repeat for the next wave and the last wave. Consider de-grouping launchers or/and only using some of the drones. If you do it in groups, coordinate with the others. Station tanks ~1,000 dps. Avoid using Sentry drones as they may auto aggress the structure"
  - text: "Escalation: Trigger testimonial:: My experience was quite different. During the initial wave, my drones accidentally shot the control tower. This immediately spawned waves 1 and 2, first volley spawned wave 1 and second volley spawned wave 2 before I recalled. For reference this was in a 0.3 system. Not certain of web max range, but it could not reach 75km. The neut towers, however, did reach that far."
