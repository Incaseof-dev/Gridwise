    notes:
      - text: ----
      - text: "Escalation message: You don't remember having seen such a large and rabid swarm of rogue drones before, luckily they were gimpy as heck. You wonder what they were trying to defend in such a desperate manner, throwing themselves at you wave after wave until all were obliterated. The signal is weaker but still there..."
      - text: "Dead end message: When the battle is over, all is silent and you wonder why all these drones wasted themselves against your guns in such seemingly senseless manner. Not a single one left, not a single one seems to have escaped and your instruments sense nothing more out there. Even though you feel something is missing, you have no alternative but to call off the chase."
