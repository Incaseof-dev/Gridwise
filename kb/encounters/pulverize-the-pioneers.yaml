notes:
  - text: "Expedition start message: Throughout this last fight, your radar equipment has been busy chewing on information about incoming and outgoing vessels and it seems it has traced a very large group of ships that left this place few minutes before you arrived. You have no clue why they left, were they fleeing? Or was it a coincidence? Either way, there is only one way to find out."
  - text: Pulverize the Pioneers is an expedition escalated from Haunted Yard.
  - text: The first three locations are generally in high security space and last in low security space but this can vary.
  - text: The first three locations can be done in a T1 frigate at range, though for the last location a high DPS destroyer or a cruiser is advised.
lootNotes:
  - text: The commander drones in sites drop drone components and can also drop Rogue Drone 46-X Nexus Chip (Astero) or a faction module. The container in last location contains T2 salvage.
pockets:
  - name: "Location #1"
    notes:
      - text: ----
      - text: thumb|Example drop from Sentient drone
      - text: Destroying the Abandoned Drones or the Sentient Decimator from initial defenders triggers the reinforcement.
      - text: "Escalation message: There is no trace of the ships themselves, but you pick up signals from a score of astrometric probes in the area. If this were not drones, one could think they were looking for a place to settle. Though faint, your instruments manage still to discern the current location of this mysterious group of ships."
      - text: "Dead end message: There is no trace of the ships at the location, but you pick up signals from a score of astrometric probes in the area. If this were not drones, one could think they were looking for a place to settle. Sadly, all this electronic chatter seems to have confused your instruments to the point where you get no further information on the ships you were seeking."
