  - name: Mordu's Folly (Part 2 of 2)
    notes:
      - text: "Blitz: Destroy the Caldari Supply Depot."
      - text: "Tip: Even though the mission is against Caldari State, you can run it without standing loss if you only destroy the Caldari Supply Depot. But you have to deal with the ECM from some of the NPCs. Therefore either have good sensor strength or use drones to destroy the structure. As of 23 Aug YC124, Depot defenders do attack drones so watch them carefully. Supply Depot is very tough (above 180k HPs) but explodes when structure strength falls below 75% (armor and shield go to 0%)."
  - name: Single Pocket
