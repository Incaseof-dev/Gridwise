      - text: No hostiles on the initial acceleration gate.
      - text: The last Mordus ship drops the mission objective, it's recommended to leave one frigate until the end so picking up takes no time.
      - text: Every new wave aggros you and your drones, so keep them safe.
      - text: Mission contains a field of about 40 Veldspar asteroids with a diameter of around 40 km.
      - text: Five Abandoned Containers with t1 loot (usually 1 item per container). Tractor beam doesn't work on them.
      - text: "Tip: As of 23 Aug YC124 Abandoned Containers contained only Metal Scraps and ammo (hybrid and energy turrets)."
