      - text: Initially only the elite frigates and destroyers are present. Frigates and cruisers spawn within about 10 seconds or so. The elite cruisers and battlecruisers are on a ~1 minute timer.
      - text: "Escalation trigger message:: The janitor of this tiny pleasure dome is an old sickly man, who seems quite pleased to see his former employer's real-estate been blown apart. Among the things he tells you is that he was a slave captured by the Blood Raiders years ago and what saved his life was that his blood was useless to them as he had contracted some nasty VD during his teenage years while he worked as a page at the interregional trade council in Jita. He can also inform you about the location to a small hideaway, similar to this one, where he once served as a janitor, until his old master lost him in a game of craps to the station manager, for whom he has worked ever since."
