notes:
  - text: The expedition has a chance to trigger upon the destruction of the Corpus Station Manager, a Dark Blood Cruiser Commander found in the Blood Vigil.
  - text: "Expedition trigger message:: Among the information your scanners pick out of the badly damaged station manager ship are logs containing a conversation indicating that the manager himself had an RR hideout not far away where he spent his free time doing whatever perverted things Blood Raider hotshots do when they are on a vacation."
