    notes:
      - text: The ambush group does not need to be destroyed, and because drones do not drop loot, it may be more time-efficient to blitz the mission by simply destroying the initial single drone and warping away.
      - text: The maximum combined damage of the drone ambush group is 132 hp/s. Pilots who wish to engage the ambush group should ensure that they remain outside of the ambush group's optimal range, as getting too close can result in massive amounts of damage. Alternatively, a sufficiently-tanked ship can wait until the ambush group gets within range and use a smartbomb to destroy them all at once, though it can take some time (~2 minutes) for the ambush group to approach to smartbomb range.
