    onWarpIn: This is the location of one of Jakerion Pahydan's brothels. Jakerion is an infamous outlaw who controls a loose-knit criminal organization which split itself from the Serpentis a few years ago. 'The Seven' it is called, named after the small group of comrades within the Serpentis who founded the organization. Jakerion's popular nickname, Zazzmatazz, is known by most Gallente Federation citizens from the hit movie 'Into The Deep', which portrays a few Gallente heroes who brave the 'Seven's' stronghold and rescue a damsel in distress.
