pockets:
  - name: Pocket 1
    notes:
      - text: Blitz
      - text: You do not need to kill any hostile ships in this pocket. The warp gate is unlocked and sits about 24km from the warp-in point.
      - text: You can use any fast frigate/cruiser (over 500m/s) to evasively tank Spawn 1 and quickly cover the distance to warp off through the gate.
      - text: Mission is flagged completed once you have activated the gate and warped into Pocket 2.
      - text: Auto aggro from Spawn 1 after several seconds. New spawns will appear at an interval between 60-90 secs from the three Shipyard structures, each about 20-30km from the warp-in point.
      - text: Structures drop no loot.
      - text: Drones will be aggroed by the later spawns, so retrieve/deploy them as necessary to avoid damage.
      - text: Once Spawn 1 has been initiated, the Shipyards will keep spawning ships regardless of your location. If you had warped out, there will be a full gang waiting when next you warp-in.
      - text: The full gang's DPS estimate is 900-1100dps.
      - text: The loot from the battleships is generally rather good (usually about 2m/each).
