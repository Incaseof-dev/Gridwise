notes:
  - text: Sansha Burrow is an unrated combat site belonging to the Sansha's Nation pirate faction. It can be found via exploration as a cosmic anomaly within systems owned by the Amarr Empire and Ammatar Mandate. As an ungated complex, the limitations as to which ships can complete this site are tied to the security rating of the system where the anomaly spawns (T2 Battleships for high-security systems, and up to Titans in low-security and null-security systems). Completing this complex may award the player with valuable True Sansha faction modules and ammunition.
  - text: This combat site consists of a single ungated pocket of space containing a variety of Frigate-sized enemy ships.
  - text: Single ungated pocket with multiple waves of rats. Killing the last ship of each wave triggers the next.
  - text: "Escalation: This site does not appear to escalate."
