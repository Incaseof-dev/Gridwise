  - name: Location 3
    notes:
      - text: "Hint: If you are only interested in the Faction npc, he is considerably faster then the other ships. It is possible to simply tank the Sentry Towers and wait for him to get close."
      - text: Warp to site
      - text: "\"You have stumbled upon the enemy ship's scouting party. Prepare for a fight!\""
      - text: "Please note: The Tachyon Towers have a very long range and do a decent amount of dps, even with 80%+ resists."
      - text: Structures on site
      - text: "Escalation message: Just before the Sansha ship blew apart, it sent out a distress call. Not that it would have helped you any, except that this call got almost an immediate reply. Your instruments have pinpointed the origins of this transmission and the resulting location glows in small, warm, orange letters on your otherwise dull looking navigation panel."
