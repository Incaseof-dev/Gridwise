  - name: Location (Low Security)
    notes:
      - text: "Warning: Your ship can be freely attacked by others - NO CONCORD INTERVENTION - in Low Security Systems (0.1 to 0.4) and Null Security Systems (0.0)"
      - text: "Hint: Always check Star Map statistics (Active ships, Ship kills, Pod kills, etc) of Low Security and Null Security systems first before entering. Fitting a Cloaking Device module on your ship and making more than one Safe spot will provide more safety."
      - text: "Repair Drones active: The Repair Drones busily repair nearby Centus ships."
      - text: "Repair Drones inactive: The Repair Drones busily repair nearby Centus ships, but seem to have run out of power for the time being."
      - text: The Repair Drone cruisers will periodically remote rep all hostile NPCs in this pocket for about 50-75 DPS worth while they are active.
      - text: "Upon attacking the Repair Drones: Centus ships have undocked from a nearby Starbase Hangar! Centus Colony General: You dare attack my repair drones! Do you know how many slaves went into building those beauties? I'll have your head on a platter delivered straight to my Master for this barbaric attack!"
      - text: Centus Colony General will use MWD to catch up to you if you are over 40km away, so it can be kited away from the other rats with good piloting. Speed-tanking T1 cruiser with AB and 60+ km range weapons can comfortably snipe it. It does ~100 DPS EM/Th with its turrets at ranges under 20km.
      - text: "Please note: Centus Colony General has a 9,375,000.00 ISK Bounty and can drop True Sansha and Centii A-Type modules."
      - text: "Upon attacking the Centus Colony General: More Centus ships undock from a nearby Starbase Hangar to defend their leader!"
      - text: Structures on site (may drop loot)
      - text: "Upon destroying the Centus Colony General: If the Sansha outposts you passed earlier were part of some sort of a complex with this place extended as a future centerpiece, their operation in the area seems have taken on a manner more large and ambitious than you have ever seen before."
