notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: Deadspace complex with two gated rooms. No hostiles at initial gate.
  - text: This mission contains large number of spawns from the Mother Drone. Stop shooting the Mother Drone and take out each spawn, this avoids getting swarmed and possibly overwhelmed by their combined DPS.
  - text: If your ship is well tanked, you may opt to finish the Mother Drone first and take out the swarm as it approaches.
  - text: The highest DPS in this Pocket comes from the Mother Drone.
  - text: "Blitz: Kill everything."
lootNotes:
  - text: "Bounties: ± 3.5 Mil ISK"
  - text: "Loot: ± 1.25 Mil ISK"
  - text: "Salvage: ± 1.13 Mil ISK"
pockets:
  - name: 1st pocket
    notes:
      - text: "Upon warp in, you will find a single hostile, the Kayzum Mother Drone, which will call in reinforcements upon reaching a certain level of damage:"
      - text: 80% Armor triggers the 1st Spawn.
      - text: 50% Armor triggers the 2nd Spawn.
      - text: 30% Armor triggers the 3rd Spawn.
      - text: Hull Damage triggers the 4th Spawn.
      - text: The reinforcements spawn 6 ships in 20-60 km range at the Veldspar asteroids. The battlecruisers spawn closest to the Asteroid Mining Post, cruisers next closest, frigates farthest from the station which will be closest to the warp-in. Reinforcement Spawns will aggro your Drones. Acceleration gate to the next pocket is at 7km and is locked until all ships are destroyed.
      - text: Kayzum Mother Drone has reversed weaknesses compared to all other rogue drones (Weakest Explosive 50%, Strongest EM 80%).
