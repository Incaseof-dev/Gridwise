notes:
  - text: "Rating: Class 4 Level 1"
  - text: Blood Den is an unrated combat site belonging to the Blood Raider Covenant pirate faction. It can be found via exploration as a cosmic anomaly within systems owned by the Amarr Empire and Ammatar Mandate. As an ungated complex, the limitations as to which ships can complete this site are tied to the security rating of the system where the anomaly spawns (T2 Battleships for high-security systems, and up to Titans in low-security and null-security systems). Completing this complex may award the player with valuable Dark Blood faction modules and ammunition.
  - text: "This combat site consists of a single ungated pocket of space containing a variety of Frigate-, Destroyer- and Cruiser-sized enemy ships. Destroying all hostile ships may escalate into the DED rated Blood Raider Psychotropics Depot complex. Three variations of this combat anomaly exist: Blood Hidden Den, Blood Forsaken Den and Blood Forlorn Den."
  - text: Single pocket, the last ship kill triggers next spawn.
  - text: Single pocket, the last kill triggers next spawn.
  - text: "Escalation: This site can escalate to Blood Raider Psychotropics Depot."
