restrictions:
  - text: "Ship size limit: Battlecruisers/T3"
notes:
  - text: T1 Cruisers (with good skills)
  - text: T1 Battlecruisers
  - text: This site is possible to complete in a T1 Cruiser, however the damage can easily become excessive if care is not taken in managing the triggers. It is recommended to bring a well-tanked T2 Heavy Assault Cruiser or Battlecruiser.
  - text: You will arrive at an ancient acceleration gate.
  - text: "Escalation: This site has a chance to escalate to Jet-Set Hooligans."
  - text: "Escalation: Expeditions: Jet-Set Hooligans: As the dust disperses, you receive a transmission from a few jumps away. You feel a certain temptation to go and investigate."
  - text: "Escalation: Previously the escalation message was much more entertaining and read"
  - text: "Escalation: Expeditions: Jet-Set Hooligans: As the dust disperses, you receive a transmission from someone claiming to have had some rather intimite relations with your sister and that he is waiting for you a few jumps away, to see what you are going to do about it. Despite the fact that you have no sister that you know of and the guy sounds like he has been drinking more than just Quafe, you feel a certain temptation to go and see what this is all about."
