pockets:
  - name: First Pocket
    notes:
      - text: There are three options for unlocking the Acceleration gate to the next room.
      - text: Destroy each wave until the fourth wave, and destroy the Corelum Militant Commander
      - text: Approach the Acceleration gate, which sets off the alarm and spawns the fourth wave, skipping waves 2 and 3, and destroy the Corelum Militant Commander. If you cannot tank the rats, destroy all of them EXCEPT FOR THE CORELUM SCOUT.
      - text: Unlock the Acceleration gate by having a Serpentis Silver Tag in your inventory (the tag is consumed).
      - text: Attack the Corelum Scout to trigger the next wave.
      - text: Attack the Corelum Scout to trigger the next wave.
      - text: Attack the Corelum Scout to trigger the next wave.
      - text: Destroy the Corelum Militant Commander to unlock the Acceleration Gate.
      - text: 16 x Scordite (~1.1 million units)
      - text: 26 x Veldspar (~1.25 million units)
