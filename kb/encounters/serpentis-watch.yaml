    onWarpIn: Previous explorers have commented that one of the gates requires a passkey. Alternatively, it can be bypassed by convincing the commander to unlock it. The overseer guards the Starbase Control Tower vigorously.
  - name: Second Pocket
    notes:
      - text: Tower wave is triggered by attacking the Starbase Control Tower. It will not spawn if the Gate Wave is already destroyed.
      - text: Gate wave is triggered by attacking the Smuggler's Gate. Simply using an EWAR module(preferably Target Painter) works. Shooting at the gate will also trigger tower wave if it has not been triggered already.
      - text: The gate wave consists of one large group by the gate and three smaller groups scattered around the site. Once all groups are in range the incoming dps can be too much for t1 cruiser or even a battlecruiser.
      - text: The commander wave is triggered by destroying Supervisor's Guardians (in the Gate Wave). The Shadow Serpentis frigate will approach you very quickly, at 1700 m/s. He can be separated from the others, therefore avoiding a lot of DPS. Supervisor's Henchmen tend to keep behind the supervisor and regularly retarget drones.
