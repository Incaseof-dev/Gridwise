notes:
  - text: This combat site is an unrated complex which can be found in Low-sec through exploration.
  - text: You can do first pocket in Assault Frigate with ~200DPS, orbiting at 10km. Second pocket is same except you need to manually control your range due to large asteroid in center of complex.
  - text: "Escalation: This site has a chance to escalate to Gurista Productions Shipment."
  - text: "Escalation: Expeditions: Gurista Productions Shipment: As the bits and pieces from the disintegrated station charge into space, carrying the news of heightened entropy in the universe, your instruments receive an unusual message. It's obviously being transmitted from the Guristas and even though the person on the other end does not introduce himself as such, the special cypher reveals it is indeed theirs. He demands speaking over a secure channel and after you have established one, he continues with sarcastic congratulations on your victory. He then gives you an offer: If you travel to three different locations as he instructs and assassinate the Guristas leaders operating there, he will reward you handsomely. He then gives you coordinates to a location in a \"take it or leave it\" manner before bidding you farewell and adds that he will contact you after the first target is destroyed."
