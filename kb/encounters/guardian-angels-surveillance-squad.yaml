notes:
  - text: Guardian Angels Surveillance Squad is an expedition that escalates from Provisional Serpentis Outpost.
  - text: "Expedition start:: It seemed for a while you would manage to get all of the pirates, but evidently one of the guard ships from the Guardian Angels has slipped away. Luckily your scanners seem to have gathered enough information to give you its approximate destination."
  - text: The first three locations are usually in low security space while the last location is usually in null security space but this varies.
