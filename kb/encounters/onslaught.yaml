    onWarpIn: Are we glad to see you! ORE is tearing this field apart. All this debris is their doing. They're chewing up rock and spitting it out. Impacts have battered our equipment and knocked out power. But we can't cut out yet! We have a crew of scientists out there somewhere. We've lost contact. Find them before it's too late!
