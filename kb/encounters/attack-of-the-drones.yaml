notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: Single ungated pocket. When you warp in it turns out the convoy you were supposed to escort is no more. Your task is to destroy the rogue drones that killed the convoy. No blitzing, you must kill all drones to complete the mission.
  - text: "Tips: To manage aggro, do not kill the trigger ships all at once. Eliminate the incoming reinforcement spawn first, before you trigger the next spawn."
  - text: "Tips: You can snipe or out run the Supreme Alvus Battleships. Their max attack distance is around 35 km, and they move very slowly."
  - text: "Tips: You may [Fleet] warp at a preferred range and snipe."
  - text: "Spawns and rats: Initial group appears and auto aggro after a delay."
  - text: "Spawns and rats: Each ship killed from the initial group triggers one of the spawns."
  - text: "Spawns and rats: All spawns auto aggro and may aggro Drones and Fleet Members, keep an eye on your drones."
  - text: "Spawns and rats: The order, ship amount and names of the spawns will vary."
  - text: In total you will be facing 10 battleships. All at once if you so trigger. It is very much recommended to not trigger all at once.
lootNotes:
