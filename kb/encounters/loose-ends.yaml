    onWarpIn: It looks as if you have surprised the drones while pillaging the remains of this asteroid colony. Again you can see bodies floating around, even some children toys... You don't know who these people were, but no one deserves this tragic and violent end from the "hands" of the machines. You can only hope you have found the rest of the drones connected to this hive so the people in the region may be safe from the drone menace for a while at least...
