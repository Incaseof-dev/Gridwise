    notes:
      - text: ----
      - text: No gate. 1 Battleship and 1 frigate upon warpin. 6 Battleships and 2 strain cruisers spawned 1 minute in. 4 Battleships were 200km out and despawned after ~30 seconds. 4 Battlecruisers and 3 strain cruisers spawned after another minute. 6 Frigates spawned after one more minute, no further spawns. All drones auto-aggress upon spawning or warpin, except for the 4 battleships 200km away which never aggressed. Killing the frigate (Colony Captain Overseer) gives the end message. A commander cruiser spawned a minute afterward (not sure if related to the frigate kill or simply another time based spawn, please confirm), wreck contained ~27m worth of tech II salvage.
