pockets:
  - name: First Location (Low Sec)
    notes:
      - text: ----
      - text: No gate. Single pocket. A sentient cruiser at close range on warpin, all auto-aggress. Killing the strain frigate spawns 3 new ones (no further spawns from these). Killing the sentient cruiser may give you the next chapter of the escalation.
      - text: "Escalation Message:: All you find here are bits and pieces of something that has once been a mining and refining station. The debris along with a few frozen bodies still floating around suggests that the drones have invaded and destroyed a once thriving colony."
    waves:
      - id: initial-defenders
        trigger:
