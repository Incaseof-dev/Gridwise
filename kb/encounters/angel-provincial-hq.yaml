notes:
  - text: Angel Provincial HQ is a null security unrated site found through exploration.
  - text: "Escalation: The site can escalate to Special Forces."
  - text: "Escalation: Escalation message:: As the dust settles from the battle, you receive a transmission from someone claiming to be a local vigilante who congratulates you on a job well done. Your computers run a check on his ship ID´s and other info they can gather on him in such a short period of time, but come up with nothing. He is at least not a part of any pirate faction, nor seems he to represent any of the official states in the galaxy. This person continues to welcome you to the area and offers to point you to some other Angel bases he knows about and have been a menace for the local population. If you want to come and meet him, he will lead the way."
