objectives:
  - text: Deliver the ransom money (3) for Dr. Lujia Elban (1).
notes:
  - text: Deliver ransom money (provided by Sister Alitura) for Dr. Lujia Elban (1.0 m³). Then bring back Dr. Elban to the agent.
  - text: Notes
  - text: Be sure to put the "A Lot of Money" item (3.0 m³) into your ship's cargo hold before leaving the station.
  - text: You will warp in 15km from a container called "Dead Drop". After placing the money in the container, the pirates will appear at ~25 km range and attack you.
  - text: After destroying the second wave, the doctor silently and magically appears in your cargo hold. Return to the Sisters of EVE Bureau station to report back to Sister Alitura and complete the mission.
  - text: Anyone thinking about trying to get the money back from the dead drop should know that although the dead drop can be damaged, the money is destroyed along with it if you blow it up.
