notes:
  - text: --You can complete this mission and accept the next one remotely.--
  - text: Warp to the mission site. Then follow Wolf Burgan's instructions that pop-up. You will travel through one acceleration gate and then three “Spatial Rift” gates that act the same way as an acceleration gate. You will see the Mysterious Drone as you warp in, but it will quickly leave (making the Spatial Rifts upon exit). After the second drone sighting, Bargan will lose the signal and the mission can be completed remotely.
