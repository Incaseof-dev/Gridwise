            triggers: Escalation trigger
            drop: Drops faction ammo, tags and chance of faction modules
      - id: structures
        trigger:
          on: warpIn
          text: Structures
        spawns:
          - count: "1"
            class: Accl Gate
            names:
              - Acceleration Gate
  - name: First room
    notes:
      - text: ----
      - text: Entering this room can trigger the escalation.
      - text: "Escalation message:: Your communication instruments finally come alive as the Serpentis contact who hired you starts talking on the private channel. Even though the area was empty, he commends you on a job well done and gives you directions to the next assassination target."
  - name: Second Location
    notes:
      - text: There is only the warpin pocket with no acceleration gate. The Commander Battleship or possibly one of the Elite Cruisers can trigger the 3rd part of this escalation.
  - name: Warpin
    notes:
