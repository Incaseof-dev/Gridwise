pockets:
  - name: First Part
    notes:
      - text: "Warp in. If Shadow Serpentis is there: kill him, possibly get escalation. Else (or If didn't get escalation): Use acceleration gate, possibly get escalation."
      - text: "Escalation start: As the bits and pieces from the disintegrated station charge into space, carrying the news of heightened entropy in the universe, your instruments receive an unusual message. It's obviously being transmitted from the Serpentis and even though the person on the other end does not introduce himself as such, the special cypher reveals it is indeed theirs. He demands speaking over a secure channel and after you have established one, he continues with sarcastic congratulations on your victory. He then gives you an offer: If you travel to three different locations as he instructs and assassinate the Serpentis leaders operating there, he will reward you handsomely. He then gives you coordinates to a location in a \"take it or leave it\" manner before bidding you farewell and adds that he will contact you after the first target is destroyed."
  - name: Warp-in
    waves:
      - id: initial-defenders
        trigger:
          on: warpIn
          text: Initial defenders
        spawns:
          - count: 3-4
            class: Battlecruiser
            names:
              - Corelatis Captain
              - Corelatis Squad Leader
              - Corelatis Wing Leader
          - count: 3-5
