restrictions:
  - text: "Ship size limit: Destroyers"
notes:
  - text: Angel Creo-Corp Mining is a DED Complex (rated 2/10), occupied by the Angel Cartel pirate faction. It can be found via exploration by probing in Highsec systems.
  - text: The site consists of a volume of space with an acceleration gate and contains various structures and their defending pirates. Using the gate allows access to other areas within the site. The names and amount of ships listed may vary slightly, but will always be of Cruiser class or smaller.
  - text: This site's acceleration gate allows only destroyer class ships including tech 2 and tech 3 destroyers.
  - text: This site is doable in a beam-laser-fit Punisher with good piloting, but destroyers are recommended due to high number of ships. Pirate Frigates will have no problems with this site, and a Tactical Destroyer will make this site laughably easy. Avoid using Amarr ships as they deal EM and Thermal damage, the strongest resists of the Angel rats.
