notes:
  - text: Deepflow Rifts are a Cosmic Anomaly which can be scanned down, appearing initially as a Level 1 Combat Site, but in reality is a fishing mini game involving Tractor Beams and Loot Crates.
  - text: Deepflow Rifts are Level 1 Combat signatures that appear in both K- and J- space as well as Pochven. Upon warping to the signature Aura will inform you that a Deepflow Abyssal rift has been detected. Target Lock the Deepflow Rift and manually activate your tractor beams to start "fishing". Be aware you will need to have 'Rifts' displayed on your overview. Using a Mobile Tractor Unit is helpful for collecting the crates but does not work on the Rift itself.
  - text: thumb|The tracker for Deepflow Rifts includes the number of Canisters found, the time remaining, the current instability and the number of surges so far.
  - text: Destroying the spawned Surges will give a very minor faction standing boost for both EDENCOM (+0.004) and the Triglavian Collective (+0.009).
  - text: The drone spawns behave very similarly to Homefront Operation rats. Corrupted prefix NPCs will frequently primary drones and generally orbit you at 20+ km. Alienator webbing frigates orbit within 10 km and will never shoot drones. Machinist orbits a random NPC and thus can be anywhere from point-blank range to 30 km out.
  - text: If all containers are retrieved from the rift while the rats are still present on grid, they will continue shooting you for ~2 minutes before warping off.
  - text: 2025-11-19 - Using 3 Tractor beams at once after 1 minute triggered ~15 frigate rogue drone response.
  - text: "2025-01-30 - Deepflow Rifts returned: https://wiki.eveuniversity.org/UniWiki:Patch_Notes/Patch_Notes_-_Version_22.02#Deepflow_Rifts"
  - text: "2025-02-05 - Number of canisters now scales with system security: https://wiki.eveuniversity.org/UniWiki:Patch_Notes/Patch_Notes_-_Version_22.02#PVE_4"
  - text: "2025-03-19 - Rift timer increased from 15 to 18 minutes: https://wiki.eveuniversity.org/UniWiki:Patch_Notes/Patch_Notes_-_Version_22.02#Drifter_Crisis"
  - text: "2025-05-15 - Spawn frequency updated and rewards and enemies updated: https://wiki.eveuniversity.org/UniWiki:Patch_Notes/Patch_Notes_-_Version_22.02#Nexus_Reckoning"
lootNotes:
  - text: Targeting the rift with a Tractor Beam has a chance to generate a Deepflow Cargo Container in space. These containers can have Blue Loot, Red Loot, and other rare items. While in the site, Tractor Beam auto-cycling is disabled, so they need to be manually activated each cycle. The site can generate up to 21 Canisters in High-sec, 27 in Null-sec and Wormholes, and 33 in Low-sec and Pochven, indicated by a tracker, and will expire after 18 minutes, also tracked on screen. Additionally, an indicator is present for stability, and if too many Tractor Beams are activated on the Rift in too short a period of time, a "surge" will happen and a force of roughly 10-15 Rogue Drone frigates and destroyers will appear.
  - text: There is also a bonus payout for retrieving all containers from the Rift (3M ISK in High-sec, Low-sec and Null-sec), but you must be in a fleet (even with yourself) to be eligible for this reward. Cloaked ships will not receive a payout. If multiple fleets are competing in the same site, only the fleet that contributed the most (retrieved the most containers) gets the payout.
  - text: Recommended to use no more than 2-3 Tractor beams for the site, since triggering a surge will cause a swarm of Rogue Drones to appear. They do about 250-300 DPS EM/Thermal damage which can quickly kill an undertanked ship. Thankfully, they have no EWAR aside from stasis webs so you can warp off at any time. Destroying them also gives small Rogue Drone standing hit if you intend on getting positive Triglavian and EDENCOM standings.
  - text: "Payout: Average of 25 mil per site, with chance of 'Glorified' crates that give higher value loot. Loot includes Triglavian Survey Databases and Sleeper Data (Red and Blue Loot)"
