notes:
  - text: Serpentis Rally Point is a Class 6 combat anomaly that can be found in low and null sec space.
  - text: Total bounties amount to around 4,500,000 ISK.
  - text: There are two variants of the site.
  - text: The site is an open deadspace pocket that can be warped to at any range. Tower Sentry Angels give Serpentis standing hit despite belonging to the Angel Cartel.
  - text: Sentries spawn 35-40 km away from the warp-in point. All other ships spawn at 0 on the anomaly.
  - text: "Escalation: This site can escalate to Serpentis Logistical Outpost."
  - text: "Escalation: Serpentis Logistical Outpost Site: Your scanner has picked up a transmission originating from a nearby system. It would be wise to investigate this mysterious signal further."
