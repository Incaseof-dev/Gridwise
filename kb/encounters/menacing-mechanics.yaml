notes:
  - text: Unlike many escalations, rats from different pirate factions are present here.
  - text: 'Escalation start: This drone operation was so small that it could hardly be called a "hive", there were no substantial assembly plants or other major factories here. It looked more like a maintenance station, something that does not rhyme with what you have heard about drones and how they operate, as they usually are confined to self sufficient hives and perhaps operating small resource gathering satellite ops. But a drone maintenance station, servicing several other hives or passersby is almost unheard of. After scanning through the remaining debris, your instruments gather some service logs, further supporting the idea this was an open maintenance station. Most of the serviced ships seem to have been standard drone vessels, but you can also see some entries naming ships used by humans, even though it does not say anything about who was flying them. Some of the log entries contain extra notes on these customers and among them you find something that looks like coordinates in a system not too far away.'
pockets:
  - name: First Location
    notes:
      - text: ----
      - text: Single pocket containing drone and Guristas ships.
      - text: Second wave is triggered without killing anything. Either timed spawn or after agressing.
      - text: Wave 3 is triggeres by killing the commander battlecruiser.
      - text: 'Escalation message:: This was probably the smallest Gurista hideout you ever saw and no wonder they were forced from time to time to get their ships serviced elsewhere, even though it was by rogue drones. The mystery is how they managed to get in there and out again in one piece. Usually rogue drones have only one standard response to the sighting of a carbon based life form and that is to run the "murderous rampage" script, or whatever it is that makes them go bonkers in a company where not all members are not purely held together by nuts and bolts. While this has been happening, your instruments have been analyzing the drone logs and the next location which shows any promise is already flashing on one of the panels.'
      - text: 'Dead end message:: This was probably the smallest Gurista hideout you ever saw and no wonder they were forced from time to time to get their ships serviced elsewhere, even though it was by rogue drones. The mystery is how they managed to get in there and out again in one piece. Usually rogue drones have only one standard response to the sighting of a carbon based life form and that is to run the "murderous rampage" script, or whatever it is that makes them go bonkers in a company where not all members are not purely held together by nuts and bolts. Your systems can not find any further information of value in the drone logs.'
