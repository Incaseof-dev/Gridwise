notes:
  - text: Part of the Crimson Harvest (2026) event. Event sites change from year to year.
  - text: In both the Crimson Gauntlet and Tetrimon Base sites after clearing all waves in the first or second pocket, there is a chance that an Abyssal rift will open and spawn a small group of additional ships, being either Rogue Drones, Sleepers, or Triglavians. The spawns always consist of one boss enemy and a small escort of ships from Pochven. The boss drops Mutated Blood Samples and has a chance to drop a Criterion Cipher for the Criterion of Fitness combat sites, the escorts have the same loot tables as their counterparts in Pochven. The NPCs will not leave after site completion and will only despawn once the site complex itself disappears from the overview.
pockets:
  - name: Pocket 1
    notes:
      - text: Triglavian escorts can be either Raznaborg or normal type (Have not observed Hospodar or Zorya's spawns yet - 9 October 2026). Typically there are usually around 3 escorts plus the boss. No standing loss from killing all ships.
