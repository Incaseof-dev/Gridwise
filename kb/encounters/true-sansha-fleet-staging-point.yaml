  - name: Second Pocket
    notes:
      - text: Energy Meutralizer Sentries have a decent amount of armor, so it takes a while to destroy them, even with a high DPS battleship. Their range is exactly 115km. If you are in range of both Energy Neutralizer Sentries and don't have a cap booster fitted, you will run out of capacitor before you destroy even one of them. Some good approaches are either using cap boosters or a Micro Jump Drive to get out of the range of the sentries. It is not mandatory to destroy them for the site to be completed and/or to get an escalation.
      - text: This site does not drop any special loot.
