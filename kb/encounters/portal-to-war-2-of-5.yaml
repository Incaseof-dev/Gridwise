objectives:
  - text: Infiltrate the Amarr complex and destroy the control tower quickly, before it manages to call in reinforcements. Bring back the contents of the loot-1x Encoded Data Chip (0.1)- from the control tower to your agent. Once you enter the complex and the alarm bells sound, you will only have a certain amount of time before they manage to greatly bolster their defenses.
ewar:
  - kind: neut
  - kind: trackingDisruption
  - kind: web
  - kind: warpDisruption
notes:
  - text: "Web/warp disruption: Caldari Navy Delta II Support Frigate (Web, Warp Disrupt)"
  - text: "Suggested ships: HAC, Battlecruiser"
  - text: Prop mod or Tractor Beam to pull cargo container
  - text: If you destroy the Control Tower, the 2nd and 3rd Reinforcements will not spawn.
  - text: Structures do not drop loot.
  - text: Standing loss for killing Amarr in part 2 is -0.24, this can be avoided by only blasting the Control tower for the chip.
  - text: As of 09-May-YC124, I destroyed only Control Tower in pocket 4 and got 0.24 standing loss from Amarr Empire (no ships were shot). This was in addition to standing loss in pocket 3 (another 0.24 from Amarr).
  - text: After mission was complete and standing from agent was increased, another 0.24 standing loss from Amarr Empire - total for part 2 of 5 is 3x 0.24 loss from Amarr !
  - text: "Next: Portal to War (3 of 5)"
