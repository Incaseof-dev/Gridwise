notes:
  - text: "Web/warp disruption: Guardian Veterans"
  - text: Guristas Strike - The Secret Meeting is mission 6 of the mission chain Guristas Strike. Unlike most storyline missions this mission gives no faction standing, but it does give agent standing. The faction standing is awarded for the final mission in the chain.
  - text: Deadspace with gates. No hostiles at initial gate.
pockets:
  - name: 1st pocket
    notes:
      - text: "Pop-up - Transmission from Darkonnen Envoy: Welcome, agent. I presume you are the one who reduced our base to rubble. That really … complicated our operations, and caused our leader to become quite … angry. Even so we don’t blame you for it, you were simply following orders. We were quite surprised to find out that the authorities had discovered the location of our outpost which you destroyed. We were certain that we had been betrayed, and during our thorough investigation of the matter we discovered that not only had we been betrayed but also framed by our most loathsome rivals, the Serpentis. They were the ones who kidnapped the girl and started this whole mess, we had nothing to do with it. Their obvious motive was to trick your government into attacking our base, which paralyzed our operations in the area, and resulted in the loss of most of our clients in these parts. Although we found it hard to believe at first, we have a long-standing relationship with the Serpentis and regularly supply them with goods they cannot acquire through other means. Their meddling in our affairs makes no sense. But the evidence is overwhelming, and therefore we must act. Now here is where you come in. We led you here for a reason, this acceleration gate leads straight to a Serpentis convoy, ferrying some very valuable goods which they purchased from us. Its escort team is not prepared for a sneak attack, and so this should give you the perfect opportunity to strike. Capture their leader, and your people may be able to acquire information leading to the girl through him. I’m sure he will give you the answer you seek, and hopefully end this crusade against our corporation."
      - text: Optional Fight. May drop a +4 implant.
      - text: As indicated in the mission briefing and the transmission received when arriving in this pocket the envoy is the covert contact you were send to meet. There is no need to engage .
