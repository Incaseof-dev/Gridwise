  - text: "Web/warp disruption: Elite Frigate"
  - text: "Suggested ships: Interceptor"
  - text: Gated deadspace pocket one jump away in P-FSQE. Your task is to retrieve the Capital Ship Design – “Dictator” from the Assembly Station DC105-A.
  - text: "Blitz: fly through the Proximity Charge field to the Acceleration Gate. Loot the Capital Ship Design – “Dictator” from the Assembly Station DC105-A."
  - text: "Tips: You cannot warp inside the rooms"
  - text: "Tips: The Elite Frigate will often Web you but will rarely Warp Scramble"
  - text: "Tips: The Proximity Charge deal damage at 7 km, but detonate at 7.5 km which means if you approach them slowly they will detonate without dealing any damage"
  - text: "Tips: You will lose 2.4% Caldari State Faction Standing when you destroy the Proximity Charge"
