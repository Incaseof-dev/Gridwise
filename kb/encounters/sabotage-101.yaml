      - text: Proximity mines are spread out in a cross-shaped formation extending both horizontally and vertically, centered on the Acceleration Gate. With good manual piloting and avoiding reckless use of your prop mod, you can burn to the front of the gate and get into the next pocket without needing to shoot any of the mines and taking no damage.
