notes:
  - text: Angel Capital Staging is an escalation site released on the 11th of June 2024 under the Equinox expansion and is designed to encourage the usage of capital class ships for running PVE within Nullsec.
  - text: The site features three Angel Dreadnoughts as well as a large number of sub-capital ships. The site is designed to be run by a dreadnought fitted with anti-capital weapons, plus a smart bomb to kill the warp-disrupting frigates.
  - text: Bounties of 180 mil isk for the three dreads with no faction or deadspace loot. Dread salvage can run up to 20 mil per wreck.
