  - text: "Load the tracking data to a jet can at the designated mission location - don't forget to put the data container into your ship first. When you do, you may encounter six Mordu's Legion frigates at close range who will attack you. One will web you if you are within 10 km of that ship. You are not required to kill them to complete the mission. Fit an afterburner for speed, if you can. If you get destroyed and lose the Drone Tracking Data, don't worry. You can repeat the mission, but standings WILL be lost. TIP: Kill Mordus first, then get tracking data from station and put it in ;-)"
  - text: "On arival - Corin Risia: Doesn’t this seem odd to you? All these clandestine machinations for a single drone? I’ve sold more important information to seedier clients, and right in front of a Concord station, no less. There’s more to this than they’re letting on."
