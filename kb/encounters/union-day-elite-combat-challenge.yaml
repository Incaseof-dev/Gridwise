  - text: The Union Day Elite Combat Challenge is a limited-time combat site that spawns during the Caldari Union Day (2022) in Caldari Lowsec space. It contains 4 rooms with different faction enemies, being the Gallente Federation, Triglavian Collective, Rogue Drones, and the Guristas Pirates, in order.
