  source: uni
objectives:
  - text: Mine 235 of Green Aristite
notes:
  - text: "Summary: All gates in the missions are unlocked."
  - text: "Summary: Several missions have pairs of Energy Neutralizer Towers that do 5gj/s each."
  - text: "Summary: Damage can get quite high for a level 3 in later stages, especially if blitzing."
  - text: alt=Screenshot of the grid of the Raw Materials mission, showing the group of mercenaries|thumb|left
  - text: You must mine the Green Arisite yourself, buying it will not complete the mission.
  - text: No initial aggro from enemies on grid. After some time 3 Cruisers (Mercenary Miners) depart. You are able to mine the Green Arisite from a distanse without being attacked, but may aggro if you get within about 15km.
  - text: As with any time you mine (even in missions or sites), it is possible for belt rats to spawn.
  - text: A Pioneer can mine the required ore in seconds without moving from the warpin and without aggroing any enemies.
  - text: "Blitz: Mine the Green Arisite"
  - text: A passive tanked battlecruiser is a good choice for this mission due to energy neutralizers.
  - text: "Blitz: Go straight through gate, blow up Professor Delainen's Lab, and loot the cargo container spawned."
  - text: "Blitz: Destroy Stasis/Energy Neutralizer towers as needed."
  - text: Damage is primarily thermal.
  - text: "Blitz: Kill Delainen-ROM Symbiote, loot Elite Drone AI, and warp out."
  - text: Energy Neutralizers combine for -15gj/s and have a range in excess of 120Km. Web towers have a range of about 30km. If you are active tanked focus down the neutralizers first.
  - text: "Blitz: Kill Group 2 to trigger Wave 1. Kill the battleship, loot the can, warp out."
  - text: "Blitz: Jump through first gate, kill Delainen-Solar Cinder Entity, warp out."
