restrictions:
  - text: "Ship size limit: T2 Battleship"
notes:
  - text: Forgotten Ruins is a very rare combat relic site found only in the Delve region, especially in the OK-FEM constellation. Up to T2 Battleships can enter the site, and it often features large groups of Rogue Drone and Blood Raider rats. This combat site is harder than many lowsec and nullsec ones, and should only be attempted by skilled players.
  - text: The site is similar to the Bloated Ruins and Wispy Ruins. Try to avoid triggering two waves at once, as the site can then become very difficult.
