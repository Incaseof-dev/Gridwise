  - name: Fourth Pocket (Sanctum)
    notes:
      - text: The Drone Creation Compound fires Citadel Explosive torpedoes that deal very high Explosive damage. Recommend at least 70% resists to Explosive damage.
      - text: There are 2 Ancient Ruins containers that must be hacked with a Relic Analyzer before getting access to their contents. Hacking can trigger a spawn of Blood Raiders (4xBS,3xCruisers). Approaching a container can also trigger an explosion.
      - text: "Smartbomb trigger: Huge bursts of energy and material spurt from the ancient ruins as someone approaches them. Some kind of ancient technology seems to have been put in place to protect the ruins. Your ship takes damage 3000!"
      - text: Hive has an active tank that requires about 400-500 DPS to break.
      - text: Rare chance Kasham Murdec arrives. No loot.
    waves:
      - id: initial-defenders
        trigger:
          on: warpIn
