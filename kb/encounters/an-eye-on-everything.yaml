objectives:
  - text: Investigate the smuggling hub and report back to Keita Eslin.
notes:
  - text: thumb|128px|Keita Eslin
  - text: Objective
  - text: Warp to the smuggling hub at the designated mission location in Hek, investigate, and report back to Agent Eslin.
  - text: Notes
  - text: Warp to the designated location. You will find yourself about 50km away from a sizable pirate fleet consisting of 3 frigates, 12 cruisers, and 7 battleships, plus a Nidhoggur class carrier.
  - text: Don't attack! Don't move! Don't do anything!
  - text: "You'll get a message from Agent Eslin: \"Looks like they're still getting reinforcements. They even have a stolen Nidhoggur. Alright, I have all the information I need, good work. Get back to me before they realize you're there, and we can discuss what comes next.\""
  - text: Before you fly back to the station and complete the mission, take a moment to do a "Look At" on the Nidhoggur carrier. You usually see these only in low-sec or 0.0 space, so check it out before leaving. The fleet won't attack if you simply look at them.
  - text: "If you still want to fight the pirates just to get that high sec carrier kill, here are the details on the rats:"
  - text: The carrier neuts 1200 GJ/30 seconds (40 GJ/s), but does no damage and does not have fighters. The carrier will only aggress if you approach close to it or attack it. Simply attacking the other ships will not agro the carrier. There are no warp disruptors in this mission. It is recommended to destroy all the other ships before attacking the carrier, that way you will not have to deal with the neuting while under fire. After all the other ships are dead, you can attack the carrier. When attacking the carrier, you should either use weapons that don't require capacitor (projectile weapons, missiles, or drones) or have a lot of cap batteries, rechargers, and/or cap boosters. The carrier will always stay stationary and is immune to all forms of EWAR and tackle. The carrier always drops a 5,000,000 ISK Minmatar Rear Admiral Tag, and may drop a large quantity of marines and small arms. The carrier does not drop capital modules, and does not have any noteworthy salvage. Salvaging the carrier will not yield T2 salvage.
  - text: Most of the incoming damage will come from the Serpentis and Angel battleships. The best way to destroy the pirate fleet is to keep at range, perhaps with a micro jump drive, and use long range weapons. A marauder or a Rattlesnake is recommended due to the high damage. When all the ships are close, the damage can exceed 600dps. The carrier can take several minutes to burn down even with a marauder, so it is recommended to engage it last.
