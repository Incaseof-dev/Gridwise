    notes:
      - text: The Blood Raider Fleet Outpost has a strong active armor tank and 50 km web as well as substantial passive shield tank. This site although ungated is now DEADSPACE, meaning you cannot warp around freely while in the site. Any time you warp out and warp back in you will land at the same beacon every time. Recommend bookmarking an off grid location if you need to get out and get back in quickly. The fleet outpost fires Citadel EM torpedoes that deal heavy damage approx. 2000 EM damage. DO NOT STAND STILL or you risk getting alphaed. T3C or well tanked Battleship is advised.
