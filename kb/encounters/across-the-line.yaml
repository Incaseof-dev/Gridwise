pockets:
  - name: Warp-in
    notes:
      - text: "Nugoeihuvi Central Storage Facility: This unassuming facility appears to house a number of different storage departments, allowing Nugoeihuvi staff to safely stow away anything from ships to chemical goods. As with most of these compounds, all goods are held in the strictest of confidence. Nugoeihuvi maintains complete discretion through the application of lethal force to anyone foolish enough to venture in to these dens of secrets. Regardless of their intentions, those who have crossed the line inside can never be allowed to live."
      - text: Defenders spawn when you attack or approach the Nugoeihuvi Caretaker at 130 km. Nagashin Elite Battleships each hit for 300 DPS Kinetic/Thermal at 90 km range. Combined with the large amount of tackling elite frigates and jamming cruisers, the incoming damage can be extremely problematic for ships without long-range sniping capabilities. Consider fitting to face-tank close to 1000 DPS of Kinetic and Thermal damage, or bring a sniping battleship. The individual ships, elite frigates included, all move pretty slow and can be outrun with an afterburner (the one exception being the Nugoeihuvi Caretaker).
      - text: Nugoeihuvi Caretaker will use MWD to catch up to you, so you can separate it from the rest of the spawn and snipe it, then warp to the Office Facility and grab the mission objective. Note that it will not use MWD at ranges of ~80km and under and it will still hit for about 200 DPS Kinetic/Thermal.
      - text: "Mission debriefing: You've done it, . You've actually done it. Those people are, without a doubt, Katsen Isha's family. We can guarantee his silence now, an absolutely excellent result. You've brought a potentially disastrous situation to a clean and comfortable end. We are all indebted to you for it, particularly those whose lives will be spared when our rescue teams continue to find them out there, waiting for someone. Your actions give us all hope. I know it hasn't been an easy journey for you; getting mixed up in the machinations of corporate agendas and personal grudges is never pleasant. It's the darker side to our society, and not something anyone ever wants to contend with. The way you handled everything however, it was exemplary. If only more Caldari would work for peace and stability like you did, we would be faring even better as a nation. I'd like to give you something as thanks. I'm sure it's not much to a capsuleer like you, but all the same, we in Hyasyoda would like you to have it. We salvaged it from the research facility that Serpentis overtook – the same one you were misled into raiding. I like to think that it will remind you of everything you accomplished, and that good things can come out of bad situations if you only work at it. Thank you once again, , and fly safe. We won't forget what you've done for us."
