notes:
  - text: "Web/warp disruption: Elite Frigates"
  - text: "Suggested ships: Battleship"
  - text: No Caldari State Faction Standing loss; High damage
  - text: "From Crielere; a parable told to all aspiring young Caldari: “There once was a great rich merchant,” she began hesitantly, suddenly all too aware that all eyes in the room were on her. But she plunged on regardless, steeling her nerves. “He lived to a grand old age and possessed every wealth a man could dream of. Many looked to him in awe or envy, coveting his treasures and desiring to imitate his great successes. Yet the old man was never happy and on his deathbed, a young clerk working for him asked: ‘You must feel that your life has been one great success story, what with all the wealth you have accumulated.' But the old man replied. ‘My life has been one of misery and sorrow. As a young man I chose wealth over family, discarding the love of my life. When I die all that I will leave behind in the world is money. But money is the same all over, mine is no different from anyone else's. Once my wealth has been scattered, all that I will be is dust and vague memories. My life is a failure young man, don't make the same mistakes I did.'"
  - text: Ungated semi-deadspace pocket four jumps away in Ishisomo.
  - text: "Blitz: create Bookmarks, destroy the Nugoeihuvi Caretaker, warp to the Office Facility and grab the Deteis Family."
  - text: "Tips: You can freely warp inside the pocket."
  - text: "Tips: You always land at the beacon when you warp from the outside."
  - text: "Tips: Fire your long range weapon and warp to another location to avoid getting hit."
  - text: "Tips: Battleships do heavy damage at extended range, consider sniping from at least 100 km away."
  - text: "Tips: No standing loss for destroying enemy ships, even if their description say they belong to the Caldari State."
