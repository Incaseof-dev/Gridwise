notes:
  - text: This site is fairly hard due to large number of ships and neuting towers. It can be done in a group of T2, T3 or Faction cruisers or a few battleships.
  - text: Warping to the site lands you at 0 on an acceleration gate.
  - text: "Escalation: The site has an almost 100% chance to escalate to Dread Guristas Fleet Staging Point 2."
  - text: "Escalation: Dread Guristas Fleet Staging Point 2: The last Guristas Pirate Battleship sends out a distress signal before it goes down. Luckily your com systems have managed to decrypt the message and follow it to it's final destination."
