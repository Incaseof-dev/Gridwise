notes:
  - text: "Suggested ships: Well tanked battlecruiser, fast cruiser"
  - text: Gas Cloud Damage
  - text: There are no NPC ships to kill. The warp gate is 60km away from the warp-in point. The gate is configured to reject Capsules and Capitals.
  - text: The toxic environment will damage your ship in consecutive toxic cloud waves. Each wave deals an equal amount of each type of raw damage with no resists applied. Damage amount increases with each successive wave.
  - text: After the final giant toxic cloud wave there will be no more damage coming from the toxic environment.
  - text: "Tip: The toxic cloud waves will be reset after you have warped out."
  - text: "Tip: The waves take 4:00 min, if you warp back shortly after the final wave, they don't reset and you can fly to the gate unmolested. If you come back too fast they are still going and you can die. If you wait too long or if someone else warps in, the wave sequence may reset."
  - text: "Tip: The way to do this safely is to start a 4 minute timer as you start to warp, then warp out as soon as you land (about half the time a Shuttle can make it out), re-dock and get a new shuttle if needed, when the 4 minutes is up, warp in, fly to the gate."
  - text: "Blitz: Fit an omni-tank with a minimum sustainable 200 ehp per damage type."
  - text: "Blitz: Fit a Microwarpdrive (or afterburner) to quickly cover the distance to the warp gate to save time and if your tank does not meet the minimum requirement."
  - text: "Blitz: If you're in a slow battleship fit a Micro Jump Drive, align to the gate and jump, you'll only have to fly about 15km this way."
  - text: "Blitz: Alternatively, fit a fast frigate to tank 4200 ehp capable of making it to the acceleration gate in two MWD cycles."
  - text: The mission is flagged completed once you have activated the warp gate and landed in the second room.
  - text: The 4 minute trick.
  - text: Take shuttle named 神風 (Kamikaze) outside the station.
  - text: Set the station you just left as "Destination"
  - text: Click "Warp to location" and start your stopwatch/timer.
  - text: When in warp, enable the Autopilot
  - text: Land at gas cloud .. and let the Autopilot warp you back to the station
  - text: When in warp, disable the Autopilot
  - text: Wait outside of the station for the timer to hit 4 min. and click "Warp to location"
  - text: Land at gas cloud, start approaching the warp gate and open a can of Quafe
  - text: Reach the warp gate unharmed, warp to second pocket
  - text: Return to Agent and collect payment.
  - text: Easy does it ;)
  - text: Geometry itself must smile upon you for this to work.
  - text: Warp to a bookmark or celestial object that is north of the mission location. Exactly north is ideal, but any angle within 45 degrees of north will still help. (In space, the compass on your HUD marks north with a tiny little ^ symbol; it will rotate as your camera rotates. When you open the Solar System Map, the map camera initially faces north and downwards. If no such bookmark or celestial is available, then you must use a different Blitz method.)
  - text: Find your own name in any chat channel you have joined. Right-click on your name and click "Form Fleet With...". If you're already in a fleet, then you must be a Fleet Commander, Wing Commander, or Squad Commander.
  - text: Right-click the mission location and warp your Fleet, Wing, or Squad (whichever applies in your specific case) to the mission to within 70 kilometers. If your chosen location in Step 1 is exactly north of the mission, then you will drop out of warp almost on the center of the Acceleration Gate; the greater the angular deviation from north, the further away from the Acceleration Gate's center you will be, but in some cases this will still be within immediate activation range of the gate. Increasing deviations from north will put you at increasing distances from the Acceleration Gate.
  - text: If necessary, approach the Acceleration Gate at your best speed.
  - text: Activate the gate and warp to the second pocket.
  - text: Return to Agent and collect payment.
  - text: In the worst case scenario, you'll confuse north and south and you'll land 130 kilometers away from the Acceleration Gate. In this case, warp out of the mission (preferably to a bookmark or celestial in the same direction as the Acceleration Gate, whereupon you can immediately warp the "fleet" back to the mission to within 70 kilometers again). If needed, switch to the 4 minute trick described in "Alternative Blitz", above.
