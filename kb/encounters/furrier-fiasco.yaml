objectives:
  - text: Destroy the infested laboratory.
notes:
  - text: "Suggested ships: Frigate"
  - text: Single gated(locked) pocket with defenders at the gate.
  - text: "Walkthrough: When you warp in there are no pirates but a whole lot of debris and an acceleration gate."
  - text: "Walkthrough: Attempting to activate the acceleration gate prompts a message to say that it is locked and you must destroy all nearby enemies."
  - text: "Walkthrough: Approaching the gate at approximately 5 km the first wave of Environmental Terrorists (Serpentis ships) then spawn."
  - text: "Walkthrough: Killing all the Environmental Terrorists unlocks the acceleration gate so you can then pass through."
  - text: "Walkthrough: On arrival in the second pocket, there are no enemies but three hollow asteroids, one of which contains the Infested Laboratory which you need to destroy."
  - text: "Walkthrough: Attacking the Infested Laboratory spawns the first wave of Environmental Terrorists."
  - text: "Walkthrough: Kill all the Environmental Terrorists and destroy the Infested Laboratory to complete the mission."
  - text: "Blitz: Kill the Environmental Terrorists in the first pocket to unlock the gate."
  - text: "Blitz: Destroy the Infested Laboratory in the second pocket and warp away."
  - text: "Standing: No empire standing lost."
  - text: "Notes: The Infested Laboratory is inside the Hollow Asteroid. Kill all of the Environmental Terrorists before attempting to navigate to retrieve the drop, because you do not want to be fighting them while bouncing around inside the asteroid."
  - text: "When 1st wave arrives: Incoming enemy ships."
