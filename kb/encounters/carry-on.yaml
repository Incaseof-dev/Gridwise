objectives:
  - text: Find the Carry On Hub and approach it.
ewar:
  - kind: neut
  - kind: sensorDamp
  - kind: web
  - kind: warpDisruption
notes:
  - text: "Web/warp disruption: Veteran 'Carry On Guard' Frigate"
  - text: "Suggested ships: Battleship (Fast frigate for Blitz)"
  - text: Minor Syndicate faction standing loss for ship kills if not blitzing
  - text: "Carry On Token: If you found the Carry On token, you may find it useful at their illicit location. Even smugglers charge admission."
  - text: Gated semi-deadspace pocket two jumps away in Osmeden.
  - text: "Blitz: place your Carry On Token from the previous Mission on a Microwarpdrive equipped Frigate, take the Toll Booth Gate and approach the Carry On Hub Structure."
  - text: "Tips: Bookmark the final Room after either going through the Alley or using the Carry On Token, so you can warp away"
  - text: "Tips: The Carry On Token is consumed"
  - text: "Tips: The Toll Booth Gate stays open for 60 seconds after activating"
  - text: "Tips: The last room is not deadspaced"
  - text: "Tips: Group 1 in the last room warp away when you get close to the Carry On Crow's Nest"
  - text: "Tips: Veteran Carry On Guard Battleships deal heavy Kinetic/Thermal damage out to 40 km."
