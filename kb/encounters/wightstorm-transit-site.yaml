notes:
  - text: Wightstorm Transit Site is a Null Security Combat Anomaly that appears inside Volatile Ice Storms during the Winter Nexus event in 2020 till 2025.
  - text: If a capsuleer is present at the Transit Site it will appear in the Overview of every capsuleer in the same System.
  - text: The Sansha's Transit Modulator near the entry gate can be loaded wit a Cryostorm Mapper (Verity Cryo Tech), granting access to a more dangerous sector of the storm.
  - text: Enemy ships can warp to tactical bookmarks and often target drones. They deal EM & Thermal damage with lasers, and Kinetic & Explosive damage with missiles, similar to their Incursion counterparts.
  - text: A very well-tanked battleship is a must-have for the boss, which can and will shred you if you do not pilot well.
