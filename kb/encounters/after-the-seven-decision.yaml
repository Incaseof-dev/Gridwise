  - text: Deal with Locced
notes:
  - text: This mission is issued by a Security division agent and is part 5 of the 5 part mission chain After The Seven
  - text: Upon warp-in, Locced (Destroyer) will be within 20km. If you attack him, 2 extra Guristas frigates will spawn at 25km. There is also a bribe container . If you approach the cargo container Locced will despawn. If you attack Locced the cargo container will despawn.
  - text: Kill Locced or open the cargo container to complete the mission.
  - text: "Locced's Message: I'm glad you got my message. Implanting triggered responses into the minds of our former captives is the easy part; the hard part is figuring out what to do with nosy capsuleers that interfere with our operation. Listen, we're both capsuleers, so there's really no point in dueling out here in the middle of space, is there? Here's my offer: If you head over to those asteroids, you'll find a cargo container with some valuable odds and ends inside. You don't have to tell anyone where you got them."
pockets:
  - name: Pocket 1
    notes:
      - text: "When attacking Locced - Locced's message: I had hoped you where smarter than that. Let’s waste some time and resources then. Here we go, boys!"
      - text: "When taking the container - Locced's message: Good Capsuleer."
      - text: "Agent after completion: What am I, your receptionist? Here's another message from that hostage you rescued: “Trustworthy Capsuleer, It's going to take Locced quite a while to replace that ship. Well done, and thank you again for all of your efforts against The Seven.”"
