    notes:
      - text: "Space type: Deadspace"
      - text: "Blitz: Kill the Prophecy, warp out."
  - name: Single Pocket
    notes:
      - text: Warp in at about 50km from the nearest group.
      - text: When you fire on the Prophecy pretty much everything aggros except the Prophecy may not aggro.
      - text: There are two timed spawn (only a few minutes after you warp in and quickly after each other).
      - text: "Tags (all spawns): Imperial Navy Sergeant III x 7"
      - text: "Tags (all spawns): Imperial Navy Major I x 11"
      - text: "Tags (all spawns): Imperial Navy Colonel I x 34"
      - text: 0.018% with Amarr Empire (per standing tick - can be done in 15 minutes easily with a Paladin for example - did not destroy the towers)
    waves:
