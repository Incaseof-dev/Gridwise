  - name: Part 2 of 5 (Mine Sweeper)
    notes:
      - text: "Space type: Deadspace with Gate"
      - text: "Blitz: For snipers: snipe all of the mines from as far away as you can. Keep shooting the mines until the \"Amarrian drone mine 1\" spawns. Blow that one up, and mission is completed. (Note: When I did the mission Drones didn't attack until blowing up the last 3 mines - NikalVaszol.) Using this blitz you can do the mission in less than 10 minutes, easily."
      - text: "Blitz: For ships with high alpha strike: if you can kill a mine in one volley (by grouping your turrets/launchers), it will not spawn any NPCs. Mines have 1200 hp each. Using this method you can complete the mission in two minutes in absolute safety."
      - text: There are 6 mines at warp-in 22km - 70km away.
      - text: After one mine explodes 4 new mines spawn. After shooting 4 more mines there's another spawn of 4 mines + the "Amarrian drone mine 1".
      - text: After blowing up "Amarrian drone mine 1" the mission is over.
      - text: Upon firing on the Mines, 4 Amarr Smart Drones (really Rogue Drone Cruisers and Battlecruisers) will appear around the mine, and your ship (and any in your fleet on the grid) will take 600-1000 damage. Destroy the drones after each mine to avoid being swamped.
      - text: "Loot: No loot, 1.4 m3 (3-4M isk worth) of salvage."
      - text: 2.4% with Amarr Empire (per standing tick) for destroying the mines (show as "Amarr Lookout")
  - name: Part 3 of 5
    notes:
      - text: (1 Large EMP Smartbomb I, Volume 50m³)
      - text: (10 Quafe Ultra, Volume 1m³)
      - text: (1 Design Documents, Volume 0.5m³)
  - name: Part 4 of 5
    notes:
      - text: "Note: If you decline this, you'll get an alternative part 5 of 5."
      - text: "Space type: Deadspace"
      - text: These ships are present upon warp-in. They do not cause spawns.
      - text: These ships are on a timed spawn.
      - text: Mission is complete when all Amarr Recon Ships are destroyed.
      - text: "Tip: Outpost Defender drones do 100 DPS each, orbit at 3 km, and will MWD towards you at 2000 m/s. EMP smartbombs can be quite useful here."
      - text: "Tags: Imperial Navy Sergeant II x 8"
      - text: "Tags: Imperial Navy Midshipman III x 4"
      - text: "Tags: Imperial Navy Major I x 1"
      - text: "Tags: Imperial Navy Colonel I x 19"
      - text: "Tags: Imperial Navy General I x 1"
      - text: 2.4% with Amarr Empire "for destroying Amarr Empire's Outpost Defender" !
