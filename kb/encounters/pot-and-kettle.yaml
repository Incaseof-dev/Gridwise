  - name: Pocket 1
    notes:
      - text: You warp in the first pocket using an acceleration gate, no aggro on warp in. There are 3 groups, with increasingly larger size ships, all faction (so no bounty). The 2 groups closest to you (40km and 80km) can be pulled or sniped. If you need to get closer to the 3rd group to pull them (120km) they will aggro you when you are 80 to 90km away. The gate at about 45 km distance is locked, so you need to remove all ships anyway. The optimal range of the battleships is around 40 km usually.
      - text: "Tags (Room 1): Imperial Navy Sergeant II x 9"
      - text: "Tags (Room 1): Imperial Navy Major I x 3"
      - text: "Tags (Room 1): Imperial Navy Colonel I x 11"
