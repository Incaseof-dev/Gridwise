  - name: Fourth Location
    notes:
      - text: The rats are spread out in 5 groups. Avoid triggering 2 waves at once; if that happens, the site is practically impossible. Try to eliminate the Siege Autocannon sentries as soon as possible, there are 10 of them and they deal VERY high DPS.
      - text: The third and final wave is the commander wave. It is triggered by bringing the Angel Military Outpost into structure. This is a hard wave, as the large number of elite frigates can keep you halted in one spot, while the overseer battleship (Einhas Malak) deals a LOT of damage. Recommend keeping over 15 km from the elite frigates so you won't get webbed and pointed while Einhas Malak puts your tank to the acid test.
      - text: Einhas Malak does about 3000 points of Explosive damage and 700-900 points of Kinetic damage. He also repairs both shield and armor, with strong passive shield and armor tanks with his shield recharging at about 300 DPS and his armor at about 250. Recommend over 85% resists to Explosive and Kinetic damage and at least 550 DPS to break Einhas. He has 76% EM and Kinetic resists and 66% Explosive and Thermal resists.
