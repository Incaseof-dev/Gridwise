  - name: Second Location
    notes:
      - text: The site is NOT in deadspace, so you can grid warp in this location. Destroy the Amarr Control Center if no escalation is triggered from the Domination battleship.
      - text: "Warning: Destroying each cruise missile battery triggers a smartbomb wave that deals around 8000 Explosive damage. Recommend bringing a ship with a strong tank and over 80% resists to Explosive damage if you are going to destroy the cruise missile batteries."
      - text: "Escalation trigger: Kaerleiks Bjorn: We sure showed them! I'm actually starting to think I'll become a fighter some day. Will you teach me? Maybe after we're done ... We sure did show them! You sure are better than no one to have around when the missiles are flying! But there is no time to float here fabulating, we must press on, another division of this same group is close by!"
    waves:
      - id: wave
        trigger:
