    onWarpIn: "Kaerleiks Bjorn: Good to see you decided to come. I can not promise you any payment if you take on these Angel bases, but you will earn fame among the locals and the fortune the Angels leave behind. I'm going to send a couple of my spy drones to see if the Angels are still where they were yesterday."
  - name: Third Location
    notes:
      - text: "From Kaerleiks Bjorn:: Kaerleiks Bjorn: I hope you will manage without me, but I am going to check the next and last target. It is a central station for a bunch of Domination members. We don't want them to get away, I will hold them busy till you arrive!"
      - text: "Warning: The DPS in this room can become quite heavy if all ships get in range. Make sure you know what you're doing or risk losing your ship. Clear all rats before engaging the Military Outpost."
      - text: The Domination Commander battleship will approach you with MWD, so it can be kited away from the other rats.
      - text: "Escalation trigger: \"I will hold them busy till you arrive!\" Yea right, the only way he is going to hold them up is to stun them with a steady flow of exclamation marks, the Dominations are no joke. This innermost circle of the Angel cartel is legendary for its brutality and the unparalleled skill of their pilots. Soon the radio livens again when this chatty vigilant type sends a message to his newfound friend \"Yes, they are here and it seems the element of surprise is on our side! I suggest that you open with a full frontal assault, so I can charge from the side, surround their flanks and drive a stake through their rotten hearts! I will need to stay of the air for now, I am launching a covert op through deceptive tactics in order to get into position! Good luck !! \" You feel the only appropriate answer is \"Mmmm..k\", Come to think of it, this might be a 12 year old who has stolen his mom's ship. Anyways, there is nothing to wait for, there are the coordinates and the enemy is waiting. \""
