    onWarpIn: This corridor is used to guard prisoners that are deemed incapable of breaking out by themself (and thus safe enough to contain in low-security facilities) but are "connected" well enough to demand a high security deadspace pocket. Prisoners, brought here for rehabilitation, have their equipment confiscated by the authorities. Then it is "taxed" heavily to pay upkeep costs and it often leaves the prisoners without any belongings. Dewak keeps these taxes under lock and key, guarded by his number-one warden.
