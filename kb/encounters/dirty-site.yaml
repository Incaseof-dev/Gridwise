restrictions:
  - text: "Ship size limit: Battlecruiser"
notes:
  - text: Dirty Site is an Unrated Complex found in lowsec via exploration.
  - text: The site is behind an acceleration gate. Warping to the site lands you at 0 on the gate.
  - text: "Escalation: Loose Ends: From one of the drone ship databases your sensors burst through as you tore this hive-in-the-making apart, you gain information on something that seems to be small satellite ops. The info is largely a listing of varied equipment, dates of when it arrived here, its quality and lastly; coordinates to a couple of these places."
  - text: "Escalation: Can escalate to Loose Ends."
loot:
  - item: + Commander and other valuable loot
  - item: Rogue Drone 43-X Nexus Chip
    note: est. 65m ISK (wiki) · 1-5% estimated drop rate from sentient drone. It can be traded for a Stratios BPC at a SoE station
