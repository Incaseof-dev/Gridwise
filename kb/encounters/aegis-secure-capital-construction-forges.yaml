pockets:
  - name: Site notes
    notes:
      - text: Data Analyzer required to obtain the key to get into the main pocket with your loot. The hacks required for this site are the hardest difficulty tier (120 HP red core hack).
      - text: The site should not be attempted without several strongly-tanked Marauders or better. Allegedly the site was designed for Dreadnoughts but they are not allowed past the acceleration gate. You can expect upwards of 5k DPS in omni damage even at long range. Micro Jump Drives and other methods of kiting the incoming damage are strongly recommended.
      - text: NPC resists are mostly uniform with slight weakness to Kinetic and Thermal damage.
      - text: The site must be completed within 30 minutes of activation before it despawns.
  - name: Warp-in
    notes:
      - text: You land close to 0 on a large group of ~20 frigates, cruisers and battleships supported by Heavy GunStar sentries which aggress based on your EDENCOM standings. The acceleration gate requires an AEGIS Coded Security Key SCCF-FTS to use, which can presumably be obtained by hacking (one of) the containers.
      - text: Picador neuts 36 GJ/s at extremely short range, Gendarme warp disrupts (no scram, can still MJD) with 56 km range.
