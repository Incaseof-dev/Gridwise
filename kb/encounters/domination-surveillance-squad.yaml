    notes:
      - text: Ungated pocket, with debris, rocks, and an Elysian structure. No rats are initially present at warp-in.
      - text: Attacking the Elysian structure also triggers multiple smartbomb waves.
      - text: Note that warping off for too long may 'reset' the smartbomb trigger, causing another set of waves when your return.
      - text: "Smartbomb trigger: The pirate station has activated a smartbomb, damaging all hostile ships within its range!"
      - text: Nikmar Eitan has a strong passive shield tank compared to the other NPCs, and has a 2.5 million ISK bounty on him.
      - text: "Expedition end: For a while there, you almost wished you had brought more friends with you and you are relieved you managed to blow the station before more could scramble against you. You are also relieved you managed to kill off that blasted gurgle sound. Permanently."
