notes:
  - text: "The first three locations are usually in low security space and the last in null security space, but this can vary. For locations #1-3, take the Newly Constructed Acceleration Gate into the first pocket if no escalation is given from destroying the commander or if the commander ship does not spawn. Gistum Breaker/Defeater cruisers rarely web."
  - text: "Escalation start: It seemed for a while you would manage to get all of the Angels, but evidently one ship from the Domination Angels has slipped away. Luckily your scanners seem to have gathered enough information to give you its approximate destination."
