  - text: Find the Cartel hideout using the bookmark Pinala uploaded into your mission journal. Capture one of their pilots(1) and bring him to Pinala Adala.
notes:
  - text: "parts: (1 of 5), (2 of 5), (3 of 5), (4 of 5), (5 of 5)"
  - text: "Lore Blurb; The Disgraced Son: The Brutor, Hnarlir Afer, has been an outcast from his home-world, Matar, ever since his Voluval ritual. The mark it left behind was so shameful even his loving father disowned him. He moved to the Gallente Federation, where hardly anyone recognized the mark or paid it any attention. There he began a life of a mercenary, having been bred as a space pilot by his military veteran father. He quickly made a name for himself, before becoming a freelancer. Using the wealth he garnered from that profession, he started up his own corporation, The Markoni Dragons. It has been quite successful, earning Hnarlir a small fortune. But even with his change of fortune, Hnarlir greatly misses his homeworld. He desperately wants to return and reclaim a position within his nation of birth. But he dares not return with the mark on his cheek as visible as ever. His family has suffered enough shame on his behalf already. Yet Hnarlir still has hope. Hope that his ‘condition' can finally be modified. Even though it goes against everything the Minmatar consider holy, Hnarlir is just desperate, and wealthy, enough to pull it off. He wants to learn the method which the Vheriokor shamans use to perform the Voluval ritual and modify the mark so that it no longer resembles the symbol of the Ammatar Mandate."
