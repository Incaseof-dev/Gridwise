    notes:
      - text: There is considerably higher damage in this pocket; the Guristas Annihilation Missile Battery does extreme EM damage and the Siege Railgun Sentries do high alpha Therm/Kin damage. Together they can destroy an improperly tanked T3C in as few as three volleys. Thus, mainly tank against EM and Kinetic damage.
      - text: Attacking the Guristas Annihilation Missile Battery triggers a defensive wave. Destroying it or the commander battleship may trigger escalation and allows you to blitz through this location.
