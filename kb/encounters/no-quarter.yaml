  - name: Fourth location
    notes:
      - text: This location is very hard, requiring around 3-4 people in high-DPS strong tank ships. The overseer battleship has extremely strong shield reps which require the damage to exceed 1200 DPS to thermal.
      - text: Attacking the Guristas War Installation spawns two defensive waves, the second wave including the overseer.
      - text: The Siege Sentries deal a high alpha damage of 1200 mostly therm/kin per turret but fire every 16 seconds. Since there are at least 8 turrets firing at warp in, they can destroy a single T3C in two volleys if improperly tanked. It is advised to make a bookmark on-grid as you land at the site to warp to in case of danger and to reset aggro.
      - text: Terrorist Overlord Inzi Kika deals 500 DPS with turrets and nearly 1500 DPS with missiles. He has 89% EM resists, 79% Explosive and Kinetic resists, and 69% Thermal resists.
      - text: It is strongly advised to keep your ship aligned to a bouncing bookmark 200 km off, warp to it as soon as the overseer wave spawns, and snipe the spider drones, the elite frigates and then the Terrorist Overlord. His turrets reach out to 200 km and his missiles to 130 km.
