      - text: 'Escalation trigger: The radio crackles, it is the vigilante all excited, who whispers in a conspiratorial tone, "They are still here! Come quick and we shall introduce them to pain!'
      - text: "Escalation dead-end: After a few exciting moments waiting for further messages, a series of less interesting moments waiting still and then a few very boring moments while your patience approaches a grand finale, you decide that this stranger must have wet himself when he saw you and used the chance to hide deep inside his Industrial. Or maybe his 'spy drones' simply take forever and a day to accomplish their task. Either way you decide to abandon this farce and continue on with your business."
