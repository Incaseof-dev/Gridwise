notes:
  - text: The first two locations are doable solo, while the last two are much harder, with the final location requiring at least 1200 DPS minimum to break the overseer's tank. Even then it takes a long time due to the boss's strong active shield tank and high hitpoints, as well as high DPS that can tear apart a well-tanked T3 Cruiser with ease.
  - text: "Warning: The DED 10/10 The Maze combat site is comparatively easy to this escalation. Use extreme caution unless you want to risk losing your ship."
  - text: "Escalation start: As the dust settles from the battle, you receive a transmission from someone claiming to be a local vigilante who congratulates you on a job well done. Your computers run a check on his ship ID's and other info they can gather on him in such a short period of time, but come up with nothing. He is at least not a part of any pirate faction, nor seems he to represent any of the official states in the galaxy. This person continues to welcome you to the area and offers to point you to some other Gurista bases he knows about and have been a menace for the local population. If you want to come and meet him, he will lead the way."
