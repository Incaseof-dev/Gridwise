  - name: 3rd pocket
    notes:
      - text: Last pocket. This time Anire Scarlet has nowhere to run to so you can finish her.
      - text: The initial defenders are from a random faction. The spawn's faction is based on the initial defender's faction, if Guristas, then the spawn will be Blood Raider, if Angels then Serpentis. Anire Scarlet deals about 2-3x the damage of a normal NPC battlecruiser at 28km range.
      - text: "Note: Scarlet's Station does not drop loot."
      - text: The Angel/Guristas spawns will be roughly 50-75 km away from you. Blood Raiders/Serpentis spawns will be further, at ~100 km.
