  - name: 1st pocket
    notes:
      - text: You will see Anire Scarlet when you warp in but she will warp to the next pocket once a hostile module of any kind is activated on her. However, you can kill her here if you can do so with one volley from grouped turrets. She will leave a normal wreck, but not the additional jet can with the +3 Charisma implant. Despite this, she will be present in the next pocket.
      - text: This room contains either Guristas ships or Blood Raider ships.
      - text: Gate to next room is not locked so you can skip combat. The gate is 29 km away.
    waves:
      - id: initial-defenders-guristas
        trigger:
          on: warpIn
          text: Initial defenders (Guristas)
        spawns:
          - count: 3-5
            class: Battlecruiser
            names:
              - Pithatis Enforcer
            note: type list incomplete on the source page
