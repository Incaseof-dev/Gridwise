notes:
  - text: "Web/warp disruption: Elite frigates (last pocket)"
  - text: "Suggested ships: Battleship (clear), T2/T3/faction cruiser (blitz)"
  - text: Every pocket in this mission has ships from one randomly selected faction. Your fit should be able to fight with all of them. You can bring an extra Gate Key to skip warpin area or to give to fleet members.
  - text: The mission pockets are semi deadspace. This means that you can warp within a pocket grid but any warps from outside the pocket will land on the warpin area.
  - text: "Blitz: Bring your own gate key and skip first room."
  - text: "Blitz: Rush to acceleration gates and make your way to last room. All gates are open."
  - text: "Blitz: Kill Scarlet and return to agent."
pockets:
  - name: Warp-in
    notes:
      - text: "Merchant message: Hey there, you must be the bounty hunter. Anire just boarded her ship. You should see her in the next area. To get inside you'll need to destroy their security guards and loot a passkey for the gate. We've just reported to them that you fired on our merchant convoy, so they'll be here shortly to respond. Good luck!"
      - text: "Anire Scarlet, after taking the first gate: Well, well. You're the one who's given my boys some trouble, I see. Don't worry, I'll make this as fast and painless as possible. Anire Scarlet is nothing if not merciful."
      - text: The gate deeper into the mission requires one Gate Key. The key is dropped by last battleship. The key is not consumed on use so you can keep it and skip fighting at warpin next time you get this mission.
      - text: you can warp in at distance to snipe.
      - text: At first some merchants are on the gate. The hostiles arrive soon. The hostiles are either Serpentis ships or Angel ships.
