              - Corpus Monsignor
  - name: 2nd pocket
    notes:
      - text: You can see Anire again when you warp in. This time you will have enough time to get one or two shots at her. If you have enough DPS you can kill her here and complete the mission prematurely. If you manage to kill her here you will be able to loot an +3 charisma implant from her wreck. Anire Scarlet is most vulnerable to EM/Thermal damage; it is advisable to preload EMP ammo or Mjolnir missiles before warping into the pocket. Any fit that can deal at least 1000 DPS EM or can do at least 7-8k alpha in EM damage should be able to accomplish this.
      - text: This room contains initially either Serpentis ships or Serpentis and Guristas ships. Regardless of which are present first more Guristas battleships will spawn as reinforcement.
      - text: The gate to next room is again unlocked. The gate is 19 km away.
    waves:
