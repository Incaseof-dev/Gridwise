notes:
  - text: The Smuggler Hideout is a Capsuleer Day XIX event site. It consists of two gated pockets. You have to clear most of the NPCs in the first pocket to make the acceleration gate to the second pocket usable. In the second pocket your goal is to destroy the Smuggler Underboss which drops various loot. The number of NPC spawns and their size depends on the highest ship class used, especially T3 cruisers lead to significantly more NPCs. The number of ships entering doesn't affect the spawns though. A full clear will net you 7.5 million ISK in bounties (before tax).
