notes:
  - text: "Rating: Tier 1 Level 4"
  - text: "Upon warping to this site, you receive the following message:"
  - text: "Pop-up:: Operating from the heart of the Curse region, the Angel Cartel is today the largest and best organized of the space-based criminal factions. The Angels are divided into several groups, each with a very special function; it is commanded by the Dominations. In the century they've been lurking in deep space, they have stolen, plundered, or sabotaged countless number of ships and kidnapped, assaulted, or murdered thousands of people. The Angels recruit members from all the races, and are thus not bound to any one zone of operation; instead, their reach spans almost the entire known universe. Many believe that the Angels got their power by uncovering Jovian technologies hidden in their ancient homeworlds, now infested by the Angel Cartel."
  - text: "Escalation: This site does not appear to escalate."
