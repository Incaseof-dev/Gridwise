notes:
  - text: "Wormholes: The sudden appearance of wormholes across New Eden proved to be a boon to scientific communities of all disciplines. Nearly everyone in the cluster has some vested interest in the wormholes. The Angel Cartel has been investing heavily into wormhole exploration. They not only scavenge the Sleeper ruins for new technology, but also exploit the wormholes' ability to link otherwise distant points. A wormhole can potentially turn an eighty-jump trip from Curse to Fountain into a twenty-minute jaunt. Although these opportunities represent significant logistical advantages, they are always fleeting, and every effort to map wormhole space have thus far failed."
