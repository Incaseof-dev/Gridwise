notes:
  - text: This combat site can be quite challenging solo without high skills and good modules. It can be done in a good drone boat, like the Gila or Ishtar.
  - text: In the first room you want to clear out all the NPCs before attacking the Gate Scrambler.
  - text: The second room can be quite challenging, since the waves arrive pretty fast on a timer. You want to kill of the frigates first because they scram you, so you can warp off if needed.
