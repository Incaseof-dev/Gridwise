  - text: "Former Selves: The fortunes of the Minmatar have ebbed and flowed continuously. At one time they had a flourishing empire with a level of mechanical excellence never before or since seen anywhere. Later, however, they had to endure centuries of enslavement, toiling and dying for the benefit of foreign masters. Today most of them have regained their freedom, but the legacy of their enslavement has been the diaspora of the race."
