      - text: The entire site has no warp disruptors or scrams so most rats can be ignored if you can tank them.
      - text: Upon landing approach the Warning Sign near the Hierarchy structure. Getting close will trigger the first spawn.
      - text: Each new wave is triggered by simply damaging a single rat so you can quickly spawn the battleship wave.
      - text: Kill all the battleships, spawning the Sentient, kill it, bookmark the wreck and warp off. After the site has despawned grab your loot and possibly salvage the wreck (average 9-11m in Salvage).
