notes:
  - text: The site is behind an acceleration gate. Warping to the site lands you at 0 on the gate. All rats must be cleared to activate the acceleration gate to the second room.
  - text: "Escalation: Can escalate to Trouble in Paradise, a four part expedition."
  - text: "Escalation: Escalation message:: At the beginning of this fight, your instruments picked up a distress call from a drone squadron not too far away, supposedly meant for the hive you just destroyed. The messenger was calling in combat assistance, including identification marks, information on what he was fighting and the location. The weird thing is that this is obviously a drone messaging and claiming he is being attacked by some other drones..."
