objectives:
  - text: Look for signs of any "alien activity".
notes:
  - text: Mysterious Sightings is a 4 part mission chain consisting of 3 Encounter missions and a Courier mission. It involves combat with the Serpentis.
  - text: "Ancient Peoples: There are a number of ancient races who have left traces of their civilizations scattered throughout the EVE universe: The Takmahl, masters of cybernetics and bioengineering; the Talocan, with their hyper-advanced spatial manipulation technology; and Yan Jung, who excelled in gravitronics and force field theories. Others include the mysterious Sleepers, who some say are the ancestors of the enigmatic Jovians. Those who wish to learn more of these ancient peoples are well-advised to develop their Science and Archaeology skills."
  - text: The Unidentified Spacecraft destroys the Federation Scouts and warps out.
  - text: Deliver 1 unit of reports to station.
  - text: Industrial is destroyed upon engaging the frigates.
