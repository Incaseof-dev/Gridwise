  uni:
    title: EVE University Wiki – Recover the Containers
    url: https://wiki.eveuniversity.org/Recover_the_Containers
    license: CC BY-SA 4.0
    retrieved: 2026-10-23
    revision: "217438"
defaults:
  confidence: verified
  source: uni
objectives:
  - text: Bring 3x Sealed Containers to your agent
ewar:
  - kind: web
  - kind: neut
  - kind: ecm
  - kind: warpScramble
  - kind: warpDisruption
notes:
  - text: "Web/warp disruption: Warp Disrupt (Elite Frigates}, Scram (Taibu State Nagasa)"
  - text: "Suggested ships: Passive Battleship + Logistics Battleship, Hauler (for hauling)"
  - text: Data Analyzer required
  - text: Using Auto-Targeting missiles and setting drones to "aggressive" may help with target jammers.
  - text: Each room's databanks contain 1 of the 3 Sealed Containers.
  - text: Databanks are trapped and can explode if you fail a hack attempt. (Each explosion will cause 350 HP of proximity damage!)
  - text: The 2nd Pocket's maximum damage dealing of all ships is 2,130 HP/s (82% Kin, 17% Therm).
pockets:
  - name: 1st Pocket
    notes:
      - text: Full room aggro after 5 seconds.
      - text: "* Each of the 4 closest Stasis Towers spawns 1 Energy Neutralizer when destroyed."
    waves:
      - id: initial-group
        trigger:
          on: warpIn
          text: Initial Group
        spawns:
          - count: "2"
            class: Sentry
            names:
              - Tower Sentry Caldari III
          - count: "4"
            class: Sentry
            names:
              - Caldari Cruise Missile Battery
          - count: "7"
            class: Sentry
            names:
              - Caldari Stasis Tower
            ewar:
              - kind: web
            triggers: Tower Reinforcement*
            note: Each of the 4 closest Stasis Towers spawns 1 Energy Neutralizer when destroyed.
      - id: tower-reinforcement
        trigger:
          on: other
          text: Tower Reinforcement
          confidence: inferred
        spawns:
          - count: "4"
            class: Sentry
            names:
              - Caldari Energy Neutralizer Sentry III
            ewar:
              - kind: neut
  - name: 2nd Pocket
    notes:
      - text: Initial Group and databanks.
      - text: Reinforcement spawns appear to be timed and appear in the Debris Field.
