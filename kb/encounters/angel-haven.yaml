notes:
  - text: Ungated normal space pocket. There are 2 variants of this anomaly, commonly referred to as "gas" or "rock" haven by players. The rock haven variant is readily identified by the warp-in popup received. Each also feature different structures within the site.
  - text: "Note: In Case of a Dreadnought spawn, note that if the only Ship left is the Dreadnought you must not leave the Site or the Dreadnought will despawn!"
  - text: "Escalation: This site can escalate to Angel Cartel Naval Shipyard or alternatively escalate to Angel Capital Staging, Angel Shielded Starbase and Angel Occupied Mine."
lootNotes:
  - text: Bounty of the site is around 30 Million ISK (2020).
