notes:
  - text: "Expedition start: As soon as you arrive, your instruments detect a large group of ships departing. Further analysis of the data indicates this was a convoy of six to eight transport ships from the Salvation Angels accompanied by an unknown number of combat vessels. Your navigational systems have already come up with a likely destination in case you feel you have any business with them."
  - text: Angel Kickbacks is an expedition that escalates from Serpentis Lookout.
  - text: The three first locations are usually in high security space while the last location is usually in low security space but this can vary.
