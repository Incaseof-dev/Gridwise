notes:
  - text: Drone Menagerie is an unrated combat site belonging to the Rogue Drones faction. It can be found via exploration as a cosmic anomaly in low-security and null-security systems across New Eden. As an ungated complex, the limitations as to which ships can complete this site are tied to the security rating of the system where the anomaly spawns (T2 Battleships for high-security systems, and up to Titans in low-security and null-security systems). This combat site has a chance to spawn a Sentient commander rogue drone, which drops drogue components and may drop faction drone modules and items.
  - text: Drone Wall Sentry Guns can hit you out to 250 km, though they don't do particularly significant damage.
  - text: "Escalation: This site can escalate to Outgrowth Rogue Drone Hive (5/10)."
