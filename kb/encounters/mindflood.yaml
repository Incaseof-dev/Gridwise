notes:
  - text: Sites are not gated, and can be completed in a T1 frigate at range, though larger ships will be safer. The final named frigate requires around 50 DPS. In all sections, killing the Shadow Serpentis named frigate will trigger the next phase. If using a T1 frigate, a Tristan and proper range is highly recommended.
  - text: In the second room in each phase there is usually Elgur Erinn escorted by two frigates and they will warp away immediately.
