lootNotes:
  - text: Each part has a commander rat which, when killed, will drop faction ammunition and Shadow Serpentis tags. Typical module drop includes a Vortex Compact Magnetic Field Stabilizer. The commander may also drop implants, e.g. Mid-grade Snake Beta (and possibly Shadow Serpentis modules by comparison with other escalations, but not seen). Salvaging commander wrecks may generate T2 salvage.
  - text: Elgur Erinn may drop Coreli C-Type modules.
