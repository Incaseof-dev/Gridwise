  - text: "Ship size limit: T2 Battlecruisers or smaller"
notes:
  - text: "Suggested ships: HAC, Battlecruiser"
  - text: "The Brothers of Freedom: Formerly an extremist labor movement in the State, the Brothers of Freedom led a widespread revolt against corporate security forces on a number of Caldari planets a number of years ago -- some time before Tibus Heth's vastly more successful revolt of a similar nature -- after 65,000 protesters were killed by Caldari paramilitary forces while trying to force their way onto a CEP station in the New Caldari system. After months of dogged pursuit by Caldari authorities, the riots were put down and most of the leaders were killed or arrested. Some of the leadership, including the ringleader Melarius Torvil, did manage to escape the final Caldari Navy operation that crushed the Brothers' movement. Torvil and a small group of associates fled to the Minmatar Republic and applied for asylum from Caldari persecution, which was granted by then-President Midular's Gallente-friendly government. Today, though they have been largely eliminated as a major force in the State, the Brothers of Freedom continue to spread anti-corporate propaganda and speak out against the CEP's government in the Gallente Federation and the Minmatar Nation, as well as outlying State settlements and facilities."
  - text: Destroy all hostile ships (incl. the industrial) in the initial spawn and the FTL Transmitter to complete the mission.
  - text: The reinforcement spawns are on an unknown timer. A Gnosis can clear the mission before they spawn.
  - text: Total standing loss for destroying the ships in the initial spawn + Radio Telescope is 0.305 (unadjusted). -0.003 Minmatar faction standing for destroying the reinforcement spawns.
  - text: By 2026 the damage dealt by the initial group of enemies is, atypically for Minmatar, primarily EM.
  - text: Structures do not drop loot.
  - text: Scordite asteroids are present.
lootNotes:
  - text: "This mission drops a tag for each ship killed in the reinforcement spawns, corresponding to its class and firepower. The following were obtained from a full sweep:"
  - text: Republic Fleet Captain Insignia I x2
  - text: Republic Fleet Commander Insignia I x2
  - text: Republic Fleet High Captain Insignia I x15
  - text: Republic Fleet Private Insignia II x4
  - text: In addition, various other loot is dropped in the form of meta modules and assorted Minmatar ammo. Salvage is also decent. Total loot value comes up to about 29,300,000 ISK. Most of this value, 27 million of it, comes from the tags, with salvage of 1.3 million, and 1 million of modules.
  - text: https://evepraisal.com/a/11pide
  - text: (no salvage)
