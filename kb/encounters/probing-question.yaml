      - text: This mission does not have acceleration gates. Distances and directions of enemies are relative to the warp-in point of the mission. Being part of a fleet (even if it's only a fleet of just yourself) and warping the squad/wing/fleet to the mission "to within 30 km" from the southeast will put you at close range to all waves. Warping the squad/wing/fleet to the mission "to within" some distance from the north, northwest, or west will increase your initial distance from all waves.
      - text: The most recent editor of this page forgot to check if the mission is in deadspace; warping to zero on a fleetmate in the mission might instead warp you to zero on the mission warp-in point.
      - text: The elite cruisers, renamed Divine Imperial Justicar and Divine Imperial Ambrose, have a noticeable amount of armor repair. If running this mission as part of a fleet, then tagging targets and focusing fire is recommended. These cruisers give a small negative Amarr faction standing
