restrictions:
  - text: "Ship size limit: Battlecruiser"
notes:
  - text: "Escalation: True Power Shipyards: You are about to wrap up this little raid when all of a sudden you have an incoming transmission popping on one of your panels from someone asking where in flaming hell his ship components are. He continues to claim that he had ordered all sorts of stuff ages ago and nothing is getting delivered. This is all sent in Sansha code and comparison with the station logs from the place you just destroyed identify the person on the other end as a foreman from a local branch of the True Power corporation. When he hears some hesitation on your end, this guy gets all patronizing on you, raving back and forth about too many newbs being recruited to the production units, how your single digit IQ must be a shining light for every slug in the universe to follow and fabulates a bit about how he envisions the state your toilet training is in. He then shouts some instructions about how you are to get off your butt right this moment and haul it to a certain place, picking up his order for 300 10MN afterburners. He orders you to buzz him on this same frequency when you are there and that he will then give you further instructions."
  - text: "Escalation: This site can escalate to True Power Shipyards."
pockets:
  - name: First Room
    notes:
      - text: The gate is unlocked by destroying the security tower. No other thing needs to be destroyed to proceed.
      - text: Use caution when attacking or destroying towers to reduce dps- it's easy to unleash the large swarm of defenders.
      - text: The second gate drops you in to the middle of the initial defenders and towers. Destroying the webbing stasis tower releases the webbing spider drones and additional defenders. Tank on the order of strong T1 cruiser to survive the immediate initial dps in room 1.
      - text: Structures on site
