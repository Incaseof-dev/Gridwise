notes:
  - text: This is the final mission of the Amarr epic arc. This will be a long mission so load your ship with plenty of ammo.
  - text: Four rooms with several spawns. It is recommended that you are in a fleet (even if alone) and tag the waves to avoid triggering too many waves at once.
  - text: The mission is NOT in deadspace. You can bookmark the rooms, warp out and then warp back in.
  - text: "Blitz: Clear rooms 1-3."
  - text: "Blitz: Kill Harkan's Behemoth in room 4."
