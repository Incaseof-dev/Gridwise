  - name: Room 4
    notes:
      - text: "Warning: You will face a total of 17 spawn waves. Be very careful in attacking spawn triggers."
      - text: "Warning: Suggest getting plenty of range from landing beacon in order to manage spawn waves."
      - text: "Warning: Wave 1 is triggered by attacking Harkan's Behemoth, Wave 2 at armor damage and Wave 3 when Harkan's Behemoth is destroyed."
      - text: "Warning: Repeating Chain Group is triggered when any of the other ships in the Initial Group is damaged."
      - text: The Repeating Chain Group will repeat itself 4.5 times before it runs out. It will feel like groundhog day.
      - text: The key to identifying the start of a new chain is the appearance of Group 1 Battlecruisers.
      - text: Group 2 is triggered by destroying one of the Battlecruisers in Group 1.
      - text: Group 3 is triggered by destroying the last Elite Frigate in Group 2.
      - text: Attacking any ship in Group 3 triggers a new chain i.e. it resets back to Group 1.
      - text: "Tips: Harkan's Behemoth Battleship will approach you with MWD at 900m/s making it easy to separate him from the rest of the spawn."
      - text: "Tips: Destroying Harkan's Behemoth Battleship flags the mission objective as completed."
      - text: "Tips: Marauders seem to be able to prevent additional waves from spawning by triggering the next wave within a few seconds. This may or may not work on Room 3."
      - text: "Blitz: Get Harkan's Behemoth Battleship to aggro and lead him away from the spawn area, concentrate attack only on him and ignore the other ships."
      - text: Attacking any ship in "Harkan destroyed wave" or the initial spawn will trigger chain Group 1. The chain groups will spawn four times if triggered.
      - text: "Rewards: 1x Imperial Navy Modified 'Noble' Implant = Slot 10 (+3% to Armor HP's and +3% to repair amount)"
      - text: "Rewards: Amarr Empire Faction Standing increase = +10% Base (+12.5% with Social 5)"
