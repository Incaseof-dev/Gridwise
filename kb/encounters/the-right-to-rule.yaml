  - name: Room 3
    notes:
      - text: "Warning: Enemy ships will breed like rabbits if you do not manage your triggers in this pocket."
      - text: "Warning: The key trigger is the single Battleship in the Initial Group. Pay careful attention when you attack it."
      - text: "Warning: 1st chain group 1 is triggered when the Initial Battleship receives any damage."
      - text: "Warning: 2nd chain group 1 is triggered when the Initial Battleship is damaged to about 10% shield."
      - text: "Warning: 3rd chain group 1 is triggered when the Initial Battleship is damaged to about 10% armor."
      - text: "Warning: 4th chain group 1 is triggered when the Initial Battleship is destroyed."
      - text: Each chain group 1 will spawn one chain group 2 when attacked. Additionally the Centus Tyrant will fully repair when new group is spawned. (Update Feb 17, 2020 - Tyrant instantly fully recovers all health after each of the first two new chain groups spawns, then after chain group 3, it recovers all armor and half shields which recover slowly over the next few minutes. Recommend following tips below unless you can tank all chains at once).
      - text: "Tips: STOP your attack on the Centus Tyrant Battleship after a chain group has spawned."
      - text: "Tips: Eliminate all ships in that chain group before attacking Centus Tyrant Battleship again."
      - text: "Tips: Rinse and repeat."
