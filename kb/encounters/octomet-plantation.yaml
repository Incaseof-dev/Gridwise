  - text: "Web/warp disruption: Elite Frigates"
  - text: Sometimes low security systems
  - text: "Arnalen Octomet: The last known member of the Octomet family is Arnalen Octomet, a former executive in Quafe. He was the last member of a withering dynasty, and much like his family, he could not handle the lifestyle of a wealthy socialite. Drugs, especially Frenetix (a diluted form of the Frentix booster) took control of his life. Within a few years, all of the former Octomet properties were abandoned or foreclosed. Arnalen Octomet disappeared shortly afterward, assumed dead, though he has been spotted as a day laborer in some systems in Solitude."
  - text: This mission option sometimes requires travel to low-sec mission location, but often the mission can also be located in a high security system. You can check before you choose the branch.
  - text: "Blitz: In second room kill Plantation Consumer for the token. Kill just the Octomet Mansion, that marks mission complete"
pockets:
  - name: First room
    notes:
      - text: No NPC's on warp in. Various structures located here. Explode for fun? Children Pasture, Human Containment Facility and Pressure Silo drop loot. You will get tattered doll, prisoners and Octomet dog tags from the wrecks.
  - name: Second pocket
    notes:
      - text: "Tip: Plantation Customer drops the 'Carry On Token' which can be used to blitz part of mission 15. Destroying Octomet Mansion incurs -3.0% faction standing for The Syndicate"
