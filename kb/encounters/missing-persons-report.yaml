              - Caldari Frigate
  - name: Pocket 2
    notes:
      - text: The Damaged Gallente Passenger Liner is 34km from the warp in beacon but does NOT contain the mission objective.
      - text: You must destroy all ships in this pocket and loot a Cargo Container that is dropped when the last ship is destroyed.
      - text: Enemy types and numbers may vary, below is just one example.
      - text: Killing the last ship in Group 5 drops a Cargo Container at the Damaged Gallente Passenger Liner. This contains 1 x Survivors which is the mission objective.
      - text: Triggering Groups 3 and 4 of Pocket 2 may cause an uncomfortable amount of DPS heading your way. If you had difficulty tanking the first 2 groups of that pocket you might want to call a friend.
      - text: Something (waiting around or looting the objective?) causes a small amount of AoE damage near the passenger liner that can destroy drones.
