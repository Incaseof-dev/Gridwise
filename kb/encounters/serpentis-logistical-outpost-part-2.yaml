  - name: First Room
    notes:
      - text: ----
      - text: As in the first pocket you can warp around, so use bookmarks if needed.
      - text: In the room is a Serpentis Stronghold in the shape of a Gallente station. When warping in you face four groups of rats. One group in front of the structure is close to you when you warp in and consists of battlecruisers and frigates which web and point. One group is in the center of the structure and consists of battleships and frigates. The other two groups are on the left and right of the structure and consist of battleships and (battle-)cruisers. After a short while in the center of the structure also towers spawn (one of them is neuting). For more details see the table below.
      - text: The four groups independently trigger respawns. In theory you could only kill the center group and it's following spawns to trigger the commander wave. But in practice you'll want to at least kill all pointing frigates and the neuting tower. For the center group a new wave is triggered if it is completely cleared. For the other groups the last ship of it's biggest shipclass is the trigger. (If the spawn contained battleships the last battleship killed in this spawn will trigger a new one and so on.) Uehiro Katsen will approach you with microwarpdrive and projects 1050 DPS out to 21 km, with -90% web within 15 km. If you can't safely project at least 600 DPS of pure Kinetic damage beyond his weapons range, you will find killing him extremely hard.
      - text: Great little advice is to form a solo fleet and assign marks to the center group and its following waves for easy overview of who to kill.
      - text: "Expedition ends message:: Uehiro Katsen's clone has departed, and the remaining Serpentis are scattering to the wind amongst the ruins of their former operation."
