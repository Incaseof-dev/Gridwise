notes:
  - text: Serpentis Logistical Outpost Part 2 is escalation from the Serpentis Logistical Outpost.
  - text: The Serpentis Logistical Outpost and Serpentis Logistical Outpost Part 2 are considered to be the hardest Serpentis Escalations.
  - text: Use extreme caution when completing the sites due to the Scramming Frigs and T2 Neuting Towers
  - text: The site consists of a warpin area and one normal space pocket.
  - text: The site is not in deadspace so you can warp around freely. Take advantage of this by making bounce bookmark ~300 km off the site as you land in. You can then use this bookmark to bounce on asteroid/wreck to get in good position. This also means that a potential hunter can warp directly to you in second room with combat probes.
lootNotes:
  - text: The boss might drop Corelum A-type modules, shadow serpentis modules, and Vigilant BPC. He always drops 19th Tier Overseer's Personal Effects. Clearing all rats gave around 50m isk bounty. Never checked salvage and so on. I usually expect salvage to be half of the bounty.
pockets:
  - name: Warp-in
    notes:
      - text: The rats are in 3 groups and you land in the middle of them. The initial two neut towers are close to two other towers. The two other groups have three towers each and after two minutes an additional neuting tower spawns at them. As this isn't dedspace you can warp freely. (The groups are close to some asteroids and structures so you have warpin points.) Carefully consider how you want to run the site and adapt it to your ship(s) because if you warp to the towers you'll face a good bit of DPS, be pointed, and webbed.
