notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: This mission consists of a deadspace complex with warpin area and three gated rooms. The warpin area has a gate to both Serpentis and Guristas bases. Both of these bases have a gate that leads to the same final room.
  - text: "Blitz: Kill either Serpentis battleships or Guristas battleships in first room and take the corresponding gate."
  - text: "Blitz: Clear out the second room you chose"
  - text: "Blitz: Guristas room has higher DPS, ECM and elite cruisers. Serpentis room has more battleships to chew through."
  - text: "Blitz: In last room kill group 1, grab the crew and return to the agent."
lootNotes:
  - text: "Bounties: ± 28 Mil ISK (including all the pockets)"
  - text: "Loot: ± 9.1 Mil ISK sometimes faction shadow module 200 millions ISK"
  - text: "Salvage: ± 9.1 Mil ISK"
pockets:
  - name: Warp in - "Warzone stage"
    notes:
      - text: Choose one of two groups, kill them (you only need to kill the battleships) and go deeper using appropriate warpgate into second pocket (Serpentis base or Gurista base). From both second pockets route is directly to third pocket which is always same (Research outpost).
      - text: The ship groups are around 130 km from warpin
      - text: The gates are around 20 km from warpin.
      - text: You can skip killing the battleships by using Zbikoki's Hacker Card. (Obtained from Zor in other missions). It will be consumed upon unlocking the gate.
