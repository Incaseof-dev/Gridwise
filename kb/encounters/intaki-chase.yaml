  - text: "Tips: All enemies spawn at the location of the Control Tower"
  - text: "Tips: Syndicate Veteran Battleship deals 300 DPS 20 km away and approach at 1000 m/s"
  - text: "Tips: Syndicate Veteran Battleships attack and destroy Drones very quickly"
  - text: "Tips: Keep an eye on your Drones; at very high speeds, they will give up attacking the target"
pockets:
  - name: Warp-in
    notes:
      - text: "Mercy: Please, what more do you want from us? The Black Eagles have harassed us enough since we've moved in here. We're not criminals. We're just poor folk struggling to survive. Even though we're Intaki, we are still Federation citizens. Why would they insist on treating us like we're not? Mercy, please. We beg for mercy."
      - text: "Warning: If you want the kid to live, you will not pursue us any further. Tell the Eagles to call off their guards, or they will pay dearly for interfering with our business. You have been warned."
