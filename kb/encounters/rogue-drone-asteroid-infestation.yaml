restrictions:
  - text: "Ship size limit: Cruisers (Not Tech 3)"
notes:
  - text: Rogue Drone Asteroid Infestation is a DED rated combat site found in high and low security space. It is often regarded as a low value site as it contains no faction drones and has a very low chance to drop a single faction module.
  - text: Interestingly, the site can have low amounts of Rogue Drone alloys in the cans in the last two pockets that can be reprocessed for minerals.
  - text: There are minable asteroids of Omber and Veldspar, but the site will despawn shortly after the drones guarding the Scratched Cask in the last room are defeated, preventing them from being mined unless someone stays in the site, although you do have enough time to go to a nearby station to drop off.
  - text: While mining the ore in the site, pirate rats (based on which empire space you're in) can randomly appear, their strength relative to the system's security rating.
