notes:
  - text: "Web/warp disruption: Elite Frigates"
  - text: "Suggested ships: Fast ship or Strategic Cruiser, Battlecruiser or Battleship with Micro Jump Drive and Relic Analyzer"
  - text: Requires Archaeology; requires a Relic Analyzer; Ammatar Faction Standing loss
  - text: thumb|192px
  - text: Ungated semi-deadspace pocket within three jumps.
  - text: "Blitz: kill all Frigates, rush and hack up to six Ammatar Relics."
  - text: "Alternative Blitz: lure ships 150 km away, warp to the Ammatar Relics, hack up to six of them and warp out."
  - text: "Notes: You can Bookmark and warp inside the room"
  - text: "Notes: Keep your standing loss to a minimum by avoiding killing any Ammatar Navy Detectives. Killing other ships will give minor (-0.006) Ammatar Mandate standing loss."
  - text: "Notes: Hacking an Ammatar Relics can spawn another Ammatar Relics which must also be hacked."
  - text: "Notes: All Ammatar Relics hacks are Very Easy difficulty."
  - text: "Notes: A maximum of 6 Ammatar Relics can spawn and the Engraved Blood Obsidian Tablet is always dropped by the final one you need to hack"
  - text: "Notes: The Relics drop cargo containers when hacked, containing lore items and the objective item"
  - text: "Notes: Kakoti Rend will briefly appear as a non-hostile NPC when the final relic is hacked"
  - text: "Notes: Destroy Warp Scrambling Frigates if you cannot avoid them, but unlike the previous mission they are easily lured away from the objective"
  - text: "Notes: Complete the hacks in one session. If you leave for a while, they'll reset and will need to be hacked again in the order they spawned in, which can be impossible to keep track of if you don't bookmark and number them."
