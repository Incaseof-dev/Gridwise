    onWarpIn: "Despite numerous laws across the empires bolstering security regulations after the outbreak of Sansha incursions in YC 113, mining colonies still provide a weak, target-rich environment for pirate factions. The Angel Cartel takes an unorthodox approach to these colonies, imprisoning the miners and replacing them with their own excavation teams, led by a Domination Excavator. The CDIA has yet to determine what the Cartel is after, though no significant amount of traditionally valuable ore has been taken. DED Threat Assessment: Risky (4 of 10)"
  - name: Room 2
    notes:
      - text: "Upon entering room 2.: Excavator Detected: I'm reading the presence of a Domination Excavator. Prepare yourself for a fight. Scientists or not, the Cartel only fields warships."
      - text: The entire pocket will auto-aggro in a few seconds, and the combined DPS is quite high. Well-tanked battlecruiser or pirate faction/heavy assault cruiser is advised. The Domination Excavator is marked with a battlecruiser icon but is an Overseer Cruiser. It has a fairly strong active tank which requires at least 250-300 Explosive DPS to safely break. Medium and heavy drones have no fun in this pocket as the rats tend to switch to attacking them in swarms and killing them quickly with high burst DPS.
      - text: "Excavator Down: The Excavator has been eliminated. Whatever the Cartel was looking for, they won't get it now. Don't forget to rob the wreckage of delicious prizes."
