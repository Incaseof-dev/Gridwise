pockets:
  - name: 1st pocket
    notes:
      - text: Group 1 is the hardest hitting group. No webifiers, so turn around and move away from the blob while tanking the group. At a safe distance (100km from next rat) blow them up. Drones didn't aggro the rest of the pocket at 50km from the next group.
      - text: While the mission does not have drone aggro or stage aggro, the second person to warp in will get aggro from the group with the webifiers, unless that group is already aggressed.
      - text: "Effective Jan. 2009, there are two versions of this mission:"
      - text: Version A, Group 1 will auto-aggro but Group 2 will ignore you until it is attacked.
      - text: Version B, there will be no auto-aggro, but Group 2 will aggro as soon as you fire on Group 1 --> HOWEVER, Group 2 can be attacked without causing aggro by Group 1. So, if you aren't attacked by Group 1 within 20 seconds or so of warping in, move out to sniping range and attack Group 2 first.
      - text: After blowing group 1 up, take out the group with the webifiers (Group 2). No other group will be aggroed.
      - text: The groups 3-5 are consisting of short range, low damage battleships. No webbing rats.
