notes:
  - text: Blood Refuge is an unrated combat site belonging to the Blood Raiders pirate faction. It can be found via exploration as a cosmic anomaly within systems owned by the Amarr Empire and Ammatar Mandate. As an ungated complex, the limitations as to which ships can enter this site are tied to the security rating of the system where the anomaly spawns (up to T2 battleships for high-security systems, and titans in low-security and null-security systems). Completing this complex may award the player with valuable Dark Blood faction modules and ammunition.
  - text: This combat site consists of a single ungated pocket of space containing a variety of frigate- and destroyer-sized enemy ships. Destroying all hostile ships may escalate into the DED rated, Mul-Zatah Monastery complex.
  - text: "Escalation: This anomaly can escalate to Mul-Zatah Monastery."
  - text: "Escalation: Mul-Zatah Monastery: Your scanner has picked up a transmission originating from a nearby system. It would be wise to investigate this mysterious signal further."
