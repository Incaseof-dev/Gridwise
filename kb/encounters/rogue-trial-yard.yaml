restrictions:
  - text: "Ship size limit: Battlecruisers"
notes:
  - text: This combat site is a Unrated Complex which can be found in Low-sec via exploration. Its signal strength is high (20%), making it easy to scan down.
  - text: "Escalation: Killing the Sentient Annihilator Alvum may start the escalation chain Moving Day."
  - text: "Escalation: Expeditions: Moving Day: Mid fight you noticed a transport ship coming in from warp accompanied by a few drone escorts and after some targeted scans your instruments get a suspicious reading along their incoming warp trajectory."
lootNotes:
  - text: Total bounty about 1.8 M ISK. (recent 01/2017 run gave 2.69M ISK, plus ~11M ISK in Rogue Drone Component drops)
  - text: "may drop sentient drone components: Sentient Damage Control, 2017-08-26, 270 mill +"
  - text: Sentient Drone Navigation Computer, 2018-04-29, ~135M
  - text: Rogue Drone 43-X Nexus Chip, 2020-10-19, ~119M ISK
  - text: "Red box doesn't work: 4mil bounty and 5.6mil salvage/loot 2023-01-29"
