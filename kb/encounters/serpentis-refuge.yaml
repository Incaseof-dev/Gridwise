notes:
  - text: Serpentis Refuge is an unrated combat site belonging to the Serpentis Corporation pirate faction. It can be found via exploration as a cosmic anomaly within systems owned by the Gallente Federation or occupied by the Serpentis Corporation. As an ungated complex, the limitations as to which ships can enter this site are tied to the security rating of the system where the anomaly spawns (up to T2 battleships for high-security systems, and titans in low-security and null-security systems).
  - text: Completing this complex may award the player with valuable Shadow Serpentis faction modules and ammunition. This combat site consists of a single ungated pocket of space containing a variety of frigate- and destroyer-sized enemy ships, as well as two batteries. Destroying all hostile ships may escalate into the DED rated Serpentis Narcotic Warehouses complex.
  - text: "Escalation: This anomaly can escalate to Serpentis Narcotic Warehouses."
  - text: "Escalation: Serpentis Narcotic Warehouses: Your scanner has picked up a transmission originating from a nearby system. It would be wise to investigate this mysterious signal further."
