restrictions:
  - text: "Ship size limit: Battleships"
notes:
  - text: Upon warping to the site you land at an acceleration gate.
  - text: "Escalation: Destroying the True Sansha commander and/or the Sansha Control Center may escalate the site to Shady Operation."
  - text: 'Escalation: Escalation trigger: As the bits and pieces from the disintegrated station charge into space, carrying the news of heightened entropy in the universe, your instruments receive an unusual message. It obviously is being transmitted from a Sansha ship and even though the person on the other end does not introduce himself as such, there is no doubt that this is the voice of one of those facistic Sansha pricks who have "True Power" printed on their undies. He demands talking in a closed channel and after you have established one, he continues with some congratulations on your brave victory and then he gives you an offer; If you go to three different locations he provides, assassinate the Sansha leaders operating there and gather all loot you find for him, he will pay you one billion ISK. He then gives you coordinates to a location in a "take it or leave it" manner, before saying farewell and adds that he will contact you after this first target is destroyed.'
