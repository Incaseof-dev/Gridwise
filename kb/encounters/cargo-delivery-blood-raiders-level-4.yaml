pockets:
  - name: Single ungated Pocket
    notes:
      - text: Looting the Quafe Ultra from the Warehouse (40km) triggers the spawn, potentially scrambling you.
      - text: A second [optional] spawn is triggered by killing the Destroyer (Corpior Friar).
      - text: Beware that this spawn has up to 6 Battleships with Nosferatus on top of the container, so if you intend to fight be prepared to warp out before you get capped out (beware of warp disruptors).
      - text: The battleships are also of the more stronger variants. Combined with neuts they pose a serious threath.
      - text: Loot the Warehouse with a shuttle, come back with a Battleship, Micro Jump and snipe if needed.
      - text: Done with a T2 fit Dominix from warp in (~646 DPS, 112.9 ehp/s rep, 16 min cap).
      - text: If you can get outside their effective gun range (about 40 km) you can easily snipe them safely.
