objectives:
  - text: Retrieve crew members from the wrecks.
ewar:
  - kind: neut
  - kind: nos
  - kind: trackingDisruption
  - kind: web
  - kind: warpDisruption
notes:
  - text: "Web/warp disruption: All Frigates"
  - text: "Notes: You need to retrieve 3x Massive Sealed Cargo Containers (6000.0m3). To complete this mission, you will require a ship with a hacking module online, as well as an available cargo capacity of at least 2,000 m3 volume (and preferably 6,000 m3)."
  - text: There are 4 containers each in the 2nd and 3rd room and 5 in the last room. One among each of these groups has 1 of the 3 large containers you need to finish the mission. The rest only ever contain 1 unit of scrap metal. They are bunched together at 40km from the warp in in each of the rooms. Hacking 4 was enough for me to hack all of them. To find which of the cans you need to hack make sure you have 'type' column active and the objective can should have a different type than the rest.
  - text: Hacking can in 2nd/3rd room will cause spawns to appear and attack
  - text: "2nd room: 2 elite frigs, 2 spawns"
  - text: "3rd room: 5 elite frigs 6 elite cruisers, 1 spawn"
  - text: Hacking cans in any of the rooms will randomly cause a 500 aoe damage around the cans that hits your ship or any drones you have orbiting you.
  - text: The mission requires you to carry 6,000m3 which will require an Hauler/Transport ship to carry.
  - text: You need to equip an Analyser module to hack the datacenters.
  - text: You need more than Hacking level 3.
  - text: There are destructible structures in most of the rooms, none of them drop anything.
