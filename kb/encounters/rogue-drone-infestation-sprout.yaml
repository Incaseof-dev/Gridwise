    onWarpIn: This central pocket of the complex is the construction site of a rogue drone hive. If left uninterrupted, the complex might soon become the home of a rogue drone mother which would seriously jeopardize security within the system. The construction supply containers have been reported to be defended by heavier types of rogue drones, thought to serve as overseers of the construction process.
