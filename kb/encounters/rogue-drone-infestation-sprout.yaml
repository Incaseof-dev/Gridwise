lootNotes:
  - text: This combat site does not drop much of anything valuable. Most of the time the 5th tier overseer's personal effects are the only item of value. The faction module in final room is very rare.
  - text: "Bounties (full clear): 200k ISK"
pockets:
  - name: First room
    notes:
      - text: ----
      - text: "On gate activation: DED Database Information: This deadspace complex pocket is under Rogue Drone domination. According to information gathered by explorers, it appears they have begun construction of a small hive deep inside the warp disruption field. The first sector contains an old acceleration gate leading towards the outskirts of the drone operation."
    waves:
      - id: wave
        trigger:
          on: warpIn
          text: Wave
        spawns:
          - count: "2"
            class: Drone
            names:
              - Moth
              - Firefly
              - Termite Apis
    onWarpIn: 'This deadspace field appears to have been infested with a strain of Rogue Drones. Rogue Drones are a self-replicating "lifeform" controlled by artificial intelligence, often in the form of a lucid communication hivemind or centered inside one of their dreaded Rogue Drone Mothers. This particular complex is the construction site of a new hive, far away from its maternal headquarters. DED Threat Assessment: Minor (2 of 10)'
  - name: Second Room
    notes:
      - text: ----
      - text: "Blitz: This pocket can be completely ignored. The acceleration gate is unlocked."
      - text: "On gate activation: DED Database Information: The outskirt pocket of the complex seems to serve as a some kind of a defence perimeter. We have picked up multiple signals of drone activity from within the pocket, leading us to believe it is populated with weak and easily replaceable worker drones."
      - text: The ships in this pocket spawn gradually. The Strain Operation Bunker may look like an overseer structure but drops nothing valuable.
      - text: In the past destroying it might have given heavy standing hits from Rogue Drones, but this is no longer true (Verified lack of standings loss May 2025).
    waves:
      - id: structures
        trigger:
          on: warpIn
          text: Structures
        spawns:
          - count: "?"
            class: Structure
            names:
              - Strain Operation Bunker
            note: Destruction causes standing loss towards Rogue Drones (No loot)
          - count: "?"
