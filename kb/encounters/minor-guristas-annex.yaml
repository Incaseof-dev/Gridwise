notes:
  - text: This site is very similar to Guristas Watch. Recommended high resists for kinetic and thermal damage.
  - text: Upon warping to the signature you will land at an acceleration gate.
  - text: Large amount of ECM in this room.
  - text: "Escalation: Guristas Owned Station: To your surprise, the Overseer seems to have spent the last moments of his life sending some message to your ship on a private channel, a fact you learn from a blinking entry on your communication panel a few seconds after his innards slid across your windshield, bounced along your fuselage and were sucked into your thrusters. It appears he wanted to save his life by telling you the whereabouts of some place you could load your cargohold with riches, but before he could get very far with his offer, his journey ended. All you have is some hysteric babble about a hidden mining station at a certain location."
  - text: "Escalation: Can escalate to Guristas Owned Station"
loot:
  - item: + Commander and other valuable loot
  - item: Dread Guristas Gold Tag, faction ammo
    note: est. 1.5M (wiki) · From Dread Guristas Executor
  - item: + Exploration logs
  - item: Feb 2014
    note: est. ~95M ISK (wiki) · Doable in a passive-tanked HAM Tengu, though there is very high DPS on the supervisor wave.
