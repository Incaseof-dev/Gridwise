notes:
  - text: "Suggested ships: Battleship, Marauder"
  - text: "Lore blurb: Racing: Ship racing has become very popular in the past few years. Pilots race their ships to see who can complete a circuit the fastest and thus show off proper ship handling, attention to quick course corrections, and how much power can be coaxed out of a ship. The Amarr have some of the best racers in the sector and to commemorate their successes, they are building a new racing area in one of our poorer systems to help stimulate the economy, while at the same time showcasing Amarr skill in flying the best ships in pod pilot hands today."
  - text: Federation Praktor Praeses come to close range (15km), but all the others stay at around 45-51km.
  - text: Beside the derived standing loss you get a -0.002 standing loss for Gallente per tick for Ship Kill. In a Marauder, it can be done in a single tick.
  - text: "Loot/Salvage: ~54M"
