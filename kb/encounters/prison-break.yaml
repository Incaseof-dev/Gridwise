pockets:
  - name: Part 1 of 2
    notes:
      - text: "Space type: Deadspace, Allows direct warp to bookmarks or gang mates."
      - text: "First a few things to know about this mission:"
      - text: It’s bugged, you can’t finish it properly yet. Yes I have bug reported this. And you can still finish it (you have to travel 10,000km in a ship, twice).
      - text: You can warp directly into any part of the mission despite it being a deadspace.
      - text: The rats don’t warp scramble (or at least they haven’t scrammed me)
      - text: Spawns vary in numbers a bit for the 3 main rooms, numbers below are just guidelines.
      - text: This fix worked for my mission, but CCP may change/fix this mission. I reported this fix and workaround at 17 June 2011 (confirmed still bugged and work around still works at 12 May 2012), see how out of date this is before trying the mission.
      - text: There are 3 rooms in this mission that have a basic structure of 2 gates 1 active that leads to a guard room and 1 inactive that leads to the next room. Kill all the spawns in the room for a key to drop take that to the guard room and kill all the spawns there for the guard post to appear, drop the key in the guard post for the inactive gate to become active. This works for the first room but it does not work for the second or third room.
      - text: Since you can warp to anywhere in the mission grab a fast ship, align yourself with the gate and travel 10,000km to get to the room, bookmark and come back with a fleet. With a 5 km/s cepter it took roughly 30 minutes to travel to the next room. This won’t work for the second broken gate as the inactive gate is also facing the wrong direction (it’s instead facing the same way as the guard post so if you try and travel you’ll just end up at the guard post) the real direction is roughly 90 degrees to the left of where it is pointing which is very hard to get to if you try to align yourself with that gate.
      - text: However all 3 rooms and the final room are in a straight line. So if you warp from the first room to the second room you should be facing the right direction to reach the 3rd room and same for the 4th. You will however need to make sure it’s the same spot your warping between in these two rooms, therefore bookmark the beacons and warp between those to align yourself to travel to the next room.
      - text: "Tips: The third rooms CONCORD spawn starts off at close range which lets the frigates and cruisers get damage on you much earlier, it is the hardest to tank of all the spawns"
      - text: "Tips: CONCORD frigates and cruisers often orbit at point blank range (especially the ones at the initial warp in) Smartbombs are extremely effective (even T1 have enough range). However the CONCORD cruisers have a very high shield regenaration, you will need to bring 2 Large smartbombs or they will out rep the damage."
      - text: "Tips: This mission can be farmed for loot/tags/bounty as it resets every downtime and bookmarks from a previous downtime will still work."
  - name: Warp-in
