      - text: However during the first guard post room this acceleration gate will become inactive MAKE SURE TO MAKE BOOKMARKS IN ALL THE ROOMS.
      - text: "Various CONCORD type rats will also spawn here at various stages of the mission. At the end there will be a total of roughly:"
