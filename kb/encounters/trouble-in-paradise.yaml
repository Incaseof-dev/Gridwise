      - text: "Escalation Message: After thwarting these ambushers desperate attempt to see the transports safely away, you pick up their signal once again and your instruments set course..."
      - text: A 3rd wave spawned as I was warping off. -- Kelon Darklight 3 May 2021.
      - text: "Escalation Message: Beating this hive makes you almost feel like disposing of the first one was more a mercy killing than anything else, as it would never have been able to keep up the fight with this one for long. You have never seen or heard of a drone hive of similar strength or scope and you hope you never will again."
