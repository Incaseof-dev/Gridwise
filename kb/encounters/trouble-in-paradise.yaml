notes:
  - text: Trouble in Paradise is a four part expedition that can escalate from the Hierarchy combat site. The four parts are each about 5-8 jumps apart, and can take you far from the starting point. The rewards can be worth it though. The rogue drones in these combat sites do mostly explosive damage, with kinetic a close second. They are weak to EM damage.
pockets:
  - name: First Location
    notes:
      - text: "Access: Gateless, Open Access"
      - text: The Sentient is the trigger for the escalation and contains loot. It is spawned from the beginning. This part can be blitzed by destroying the Sentient fast.
      - text: "Escalation Message: This battle obviously took place only few minutes ago; smoldering wrecks litter the battlefield and as far as you can tell there are only drone wrecks aside from the destroyed ships. After a short while your scanners identify the ship that was calling in assistance and, surprisingly enough, its navigation module is still mostly intact. From the ship logs you learn that it was a part of a force designated to contain the threat posed to its hive from another strain of drones of a different hive. The newest log entries reveal that this ship was sent, together with a few others, on a sabotage mission and were supposed to blow up an array of moon harvesters and silos at this location."
