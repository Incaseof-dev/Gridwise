notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: Strong enemy battleships; Frigates will apply heavy webbing to your drones and kill them.
  - text: The Mordus headhunters has some of the hardest combat among L4 missions. Each pocket of this mission involves drone aggro and proximity aggro groups. However, in each stage it's possible to position yourself so that you can happily take out at least the first group without aggro from the others. The battleships deal decent damage and have strong tank.
  - text: "Blitz: 1st Pocket: Kill all the ships."
  - text: "Blitz: 2nd Pocket: Kill the group 3 (with the Mordus Mammoth). To avoid getting stage aggro, fly towards the right edge of the group and wait until the group aggro your ship. You can then attack the ships without aggro from the rest of the room."
  - text: No hostiles at initial gate.
  - text: Mission reward and mission reward bonus is approximately 2.3M
  - text: Approximately 10.6 million in bounties. (Updated 06/29/2026 by Verum Peto)
  - text: Approximately 15 million in loot and salvage. (Updated 06/29/2026 by Verum Peto)
  - text: Group 1,2, and 4 in the second pocket doesn't have to be killed to complete the mission. You can complete it by just killing group 3.
