    notes:
      - text: "Access: Gateless, Open Access"
      - text: This part is pretty straight forward. Clear the site of NPCs, aggress the station, kill the Shadow Serpentis and get out.
      - text: Notable structures
      - text: "Escalation message: Again you let your scanner comb the remains of the station and the ships, looking for clues on this alleged raid, and before long you are holding a log listing the second rally spot and as far as you can see, the raiding parties have already departed form here and two other stations and are supposed to convene within the hour. If one of the raiding parties was supposed to come from the Serpentis station you destroyed originally, you have already managed to diminish their forces somewhat."
    waves:
      - id: initial-defenders
        trigger:
          on: warpIn
          text: Initial defenders
        spawns:
