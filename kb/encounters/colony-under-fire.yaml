            class: Beacon
            names:
              - Guidance Beacon
            note: Approach this to trigger the next part of the escalation
  - name: Part 4
    notes:
      - text: "Access: Gateless, Open Access"
      - text: This can be quite hard. The first 3 waves spawn on a 4 minutes timer. The third wave have a Relay Commander, killing this spawn the Relay Wave. Killing the second Relay Commander spawns Black Ceasar and his followers.
      - text: You want to clear each wave before spawning the next wave.
      - text: "Expedition complete: Black Ceasar has been torn to pieces, and the Serpentis have scattered back to the darkness from whence they came."
      - text: Attacking the Trucker Gate spawns a defensive wave. This offers nothing except the bounties - so there is no reason to attack the gate. They also hit A LOT harder than any other wave.
      - text: Structure
