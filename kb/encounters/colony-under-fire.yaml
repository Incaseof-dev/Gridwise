    notes:
      - text: If the second part of the escalation triggers, you get this message.
      - text: "Expeditions: Clues within the wreckage of the ship hint at where it's from: another Serpentis station. More an outpost than a station perhaps, but it is a pure military outfit, not a regular colony."
    waves:
      - id: second-room
        trigger:
