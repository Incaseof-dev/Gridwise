  - name: Room 2
    notes:
      - text: Beacon
      - text: If the second part of the escalation triggers, you get this message.
      - text: "Escalation message: A fixed guidance beacon sitting here all alone.. you examine the thing and discover its guidance system points to a place not too far away. Perhaps that is the space trucker station? In any case, that is the only clue you have to follow, if the pirates have ever been here, they have gone already."
    waves:
      - id: structures
        trigger:
          on: warpIn
          text: Structures
        spawns:
