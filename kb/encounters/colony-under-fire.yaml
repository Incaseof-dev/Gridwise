    notes:
      - text: "Access: Gateless, Open Access"
      - text: In the first room you find a warp gate. Killing the NPCs allow usage of that gate to the second room.
      - text: You might have a Shadow Serpentis spawn in the first room. Killing this triggers an escalation.
      - text: If it is not there, going to the second room and killing the scout can trigger the escalation.
      - text: Notable structures
    waves:
