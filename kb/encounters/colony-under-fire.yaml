notes:
  - text: The first 3 parts of this escalation are quite easy, but the 4th part can be somewhat challenging.
lootNotes:
  - text: "the first part: Can drop shadow serpentis modules, ammunition and tags."
  - text: Gives around 28.000.000 ISK in bounties.
  - text: "the second part: Can drop shadow serpentis modules, ammunition and tags."
  - text: Gives around 36.000.000 ISK in bounties.
  - text: "the third part: Can drop shadow serpentis modules, ammunition and tags."
  - text: Gives around 15.000.000 ISK in bounties.
  - text: "the fourth part: Can drop Core A-Type Modules, shadow serpentis modules, ammunition and tags."
  - text: Gives around 50.000.000 ISK in bounties.
pockets:
