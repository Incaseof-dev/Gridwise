  - text: Fly to the coordinates in your journal. Destroy the Thukker mercenaries there, and wait for their reinforcements. Once all of the reinforcements have been destroyed, along with their captain, then report back to your agent. (Bring back 1x Mercenary Pilot 1)
notes:
  - text: "Suggested ships: Battlecruiser"
  - text: "Blitz: Wait for the 4th reinforcement and kill all ships in that wave (see \"Reinforcement 4\" table below). You don't need to shoot any other ships. The mission target, Mercenary Pilot, drops from the last wave's ship that is killed."
pockets:
