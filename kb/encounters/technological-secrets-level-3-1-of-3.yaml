      - text: New waves will aggro your drones, so pull them in whenever a new wave spawns.
      - text: The mission target, Mercenary Pilot, drops from the last wave's ship that is killed.
      - text: "Agent hand-in message: Good work. But it seems that your captive is no longer of use to us. My guess is that he injected himself with a deadly viral agent before you arrived. But don't worry, we expected as much, and we have an antidote ready for you in the infirmary. However, this will complicate matters a bit. Now we have to wait for them to make the next move ..."
      - text: "Next: Technological Secrets (Level 3) (2 of 3)"
