    onWarpIn: "The Serpentis-Phi alliance control this mining outpost. Business is limited but the owners of the outpost are nevertheless well-off. DED Threat Assessment: Risky (4 of 10)"
  - name: Second Pocket
    notes:
      - text: ----
      - text: thumb|Second Pocket
      - text: "Information: Database Information:: The asteroid colonies that have been built here are for show only. This deadspace pocket contains labs and bunkers for booster production and advanced experimental neural implants."
      - text: The Phi-Operation Protector battleship has a microwarpdrive, and will use it to close in on targets. On paper, its MWD can bring it up to 1000m/s, however in practice it usually will not exceed 850m/s. Its weapons are ineffective beyond around 30km, so if it can be outrun it should not be a major threat. Significantly, this battleship's armor has very high Kinetic resistance (80%) and it will actively repair itself. Its lowest resistance is Thermal (50%), which should be the damage used to kill it.
    waves:
      - id: initial-defenders
        trigger:
          on: warpIn
          text: Initial defenders
        spawns:
