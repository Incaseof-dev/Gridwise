pockets:
  - name: First Pocket
    notes:
      - text: thumb|First Pocket
      - text: The electronically sealed container is unlocked after certain ships have been destroyed. The acceleration gate requires the stolen passkey to get through. The key is found in the sealed container, which is located inside a Hollow Asteroid that will require a bit of manual piloting to maneuver through to reach the container.
      - text: The above statement is not expressly true. When competing for this site I have seen my competitor take the gate to the second pocket without accessing the sealed cask. Either the key is reusable or the only requirement to jump is all enemies in the pocket being destroyed.
      - text: (29 January 2026) Stolen Passkey was not consumed on use after clearing entire pocket and taking gate. It may ?? be possible to skip part of this pocket by killing the ships guarding the Electronically Sealed Container (unconfirmed).
      - text: "Note: The site has been known to despawn all NPCs except for the Phi-Operation Protector."
