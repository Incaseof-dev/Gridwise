notes:
  - text: Wightstorm Muster Point is a Low Security Combat Anomaly that appears inside Volatile Ice Storms during the Winter Nexus event.
  - text: If a capsuleer is present at the Muster Point it will appear in the Overview of every capsuleer in the same System.
  - text: Enemy ships can warp to tactical bookmarks and often target drones. They deal EM & Thermal damage with lasers, and Kinetic & Explosive damage with missiles, similar to their Incursion counterparts.
