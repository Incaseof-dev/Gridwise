    note: est. 9.9M ISK (wiki) · From Guristas Scout Commander
  - item: Dread Guristas faction modules
    note: From Guristas Scout Commander
pockets:
  - name: Warp-in
    notes:
      - text: You land on a beacon.
      - text: Wave 2 triggers when the penultimate battleship in initial spawn is attacked.
      - text: Wave 3 triggers when the last battleship in initial spawn is attacked.
      - text: The Guristas Scout Commander does not have significant tank, like a regular Overseer Cruiser. Its wreck may produce T2 salvage materials, though.
      - text: Destroying the commander (and possibly, failing that, all ships) will trigger an escalation to Dread Guristas Fleet Staging Point 3. To blitz, then, kill battleships until the elite frigates spawn, then kill the Overseer cruiser.
      - text: "Escalation trigger: The last Guristas Battleship sends out a distress signal before it goes down. Luckily your com systems have managed to decrypt the message and follow it to it's final destination."
      - text: The acceleration gate to the first pocket does not have to be used; the first pocket is optional, and only worth doing for extra bounties/salvage.
