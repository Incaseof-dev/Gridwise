notes:
  - text: The site is considerably harder than the unrated complex due to heavy neuting and webbing, as well as high DPS. Again, a fleet of T2, T3 or Faction Cruisers or a small group of Battleships is recommended for this site.
loot:
  - item: + Commander and other valuable loot
