notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: "Blitz: Mission is completed when the Core Lord Admiral is killed. Shooting the triggers first to blitz the mission is possible, but not recommended due to very high incoming damage and dampening."
  - text: Large number of damping elite cruisers. Fitting an (extra) Sensor Booster or Signal Amplifier is recommended to counteract the dampening. Avoid triggering additional spawns before previous elite cruisers are dealt with.
  - text: Spawns and triggers vary, usually the odd-one-out Battleship is the trigger but not always (below are some examples). Auto and Drone aggro from initial group and all spawns.
  - text: "Tip: Auto-targeting missiles and drones work even when you are not able to target anything."
  - text: Single ungated pocket. you can (Fleet) warp at preferred distance.
lootNotes:
  - text: "Loot + Salvage: 16.6 mil"
  - text: "Bounty: 19.5 mil"
