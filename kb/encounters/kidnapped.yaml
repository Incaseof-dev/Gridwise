pockets:
  - name: First location
    notes:
      - text: At first, the site may appear empty. Be warned, several groups warp in within a few seconds.
      - text: "Escalation Failure: While investigating the wreck, you suddenly receive the same transmission as before, but this time in much better quality. Soon you discover that this is actually a message recorded on some children's toy that utilizes small shiny plastic discs as a storage medium. This message must have been running for some time, as the transmitter has almost run out of power. After playing the message again and analyzing it in depth, you can now hear that the speaker is describing an attack and that she, along with a group of people have been kidnapped by a locally known Gurista bandit. Either this happened so long ago that this pirate has relocated, or perhaps you just don't know the area well enough. In any case, you have no idea where to go to rescue these people."
