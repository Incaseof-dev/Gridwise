    notes:
      - text: Initially a small contingent of Guristas will await you at a station named Conquered Station 'Fatal Rabbit', complete with stationary heavy missile platforms. Make sure you bring serious firepower, as to complete the escalation you will need to seriously damage the station.
      - text: "The next wave will trigger when you start damaging the Station:"
      - text: When the Station reaches 20% Structure the commander Battlecruiser will spawn. Be advised that he may drop no loot at all.
      - text: "On completion this text box should appear:"
      - text: 'On completion: If ending the hostages plight was the objective, this is definitely a case of "mission accomplished" and as the people who would most energetically refute that statement are eternally indisposed, you should have little problems feeling good about yourself.'
