    onWarpIn: As you enter the room, you receive a weak transmission; a hushed voice sneaks through your audio system, hastily whispering some words. All you can understand is something about kidnapping, pirates and a group of people. You play it back a several times, trying to make sense of it, but you can not discern who is kidnapped or how this group of people is involved and you cant actually hear what part the Guristas play in this, even though you take it for granted that they are the kidnappers in question. This message was sent on a general channel and your instruments have no problem pinpointing its origin. They have actually done so already in case you would like to investigate this further. Cant beat these new auto-personalizing AI systems, you have had this one for only a few days and it already feels like it has known you all your life.
  - name: Second location
    notes:
      - text: "As before, the site may appear empty at first. Soon Guristas will warp in:"
      - text: Destroy the Commander Cruiser to roll for a chance to escalate further.
      - text: "Escalation: You find no sign of any hostages and you are pretty sure that if they had been in the bunker, you would have noticed some body parts being thrown around when you blew it up. You notice that all the ships and the buildings are marked with some sort of a logo, depicting a triangle with glowing corners in different colors and everything encircled with a band of I´s and O´s. You have never seen exactly this one before, but it reminds you of badges some of the more pretentious pirate chiefs you have met have used to bolster their image. After your main computer has had a few seconds to munch on this graphic, it suggests that this symbolizes three locations, one which you are at now and two others, the I´s and O´s seem to be the coordinates to all three locations in binary, the only problem is that there is no indication where on the circle to start reading. But it seems like your instruments have found some reason to make an educated guess and come up with two unexplored locations, the nearer one of the two being..."
