      - text: "Upon killing Karkoti Rend: The truth is a weapon and must be wielded with care. That was my greatest mistake: I could not handle its power. The khumaak is just a thing, an empty item; this book holds the true power. Use it wisely, but understand what it is saying. It could change everything."
