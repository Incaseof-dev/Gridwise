objectives:
  - text: Destroy the Numon Control Tower, along with all of the Numon mercenary ships, and then report back to your agent.
ewar:
  - kind: web
notes:
  - text: The mission chain contains several near death scenarios, and 5 individual missions. This mission chain is absolutely not meant to be completed for new pilots, especially in solo, although it is absolutely doable with the sufficient knowledge on flying the ship.
  - text: "Recommended ship: In general a tech 2 or 3 cruiser is appropriate considering these are pirate missions: they take place in and around NPC nullsec so being able quickly warp off when hostiles arrive is valuable."
  - text: "Recommended ship: Tengu (tested, and completed)"
  - text: "Recommended ship: High survivability battleship"
  - text: "Recommended ship: Small fleet with logi support"
  - text: "Caution: Room 2 warps you into a group containing several webbing frigates (Gamma)."
  - text: In room 2, Captain Yeni Sarum (Named cruiser) drops a 3% implant (controlled bursts for me)
  - text: Room 3 is very dangerous with 3 spider drones, Kazar Numon with a long point and web at the warp in and three very high damage 250km range sentry turrets (Tower Sentry Amarr III) spaced around the room. Named rats in room 3 all drop implants (Gunnery 3%, Small Energy Turret 3%, and Numon Family Heirloom).
