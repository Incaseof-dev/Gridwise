  - text: The site is similar to Dark Blood Fleet Staging Point. It is much harder than its counterpart, though, and should only be attempted by skilled players in a ship with a very strong tank. Warping to the site you will land at an ancient acceleration gate, which permits T2 Battleships.
  - text: "Escalation: There is an almost 100% chance of the site escalating to the expedition Blood Raider Temple Complex (The Inner Sanctum)."
  - text: "Escalation: Escalation trigger: Your scanner has picked up a transmission originating from a nearby system. It would be wise to investigate this mysterious signal further."
