notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: The epic arc has a few missions that can be difficult - and "Burning Down the Hive" is one of these. Rare is the new player who does not suffer his or her first ship loss in this mission.
  - text: The first room of this mission features multiple Strain Infester Alvi rogue drones that webify and warp disrupt your ship. If the rats get within range and point you, then you will not be able to warp out of the mission deadspace to preserve your ship. This is one of the only Level 1 missions that has warp disrupting rats; you will not see them commonly again until Level 3 missions.
  - text: "You must do two things to survive: Fit your ship properly, and use the correct tactics. In missions up to this one most players will have been taking the approach of diving in to the enemy group and fighting them at short range, warping out if you bite off more than you can handle. In this mission the presence of warp disruptors and the large number of enemy ships makes this unlikely to work. The key tactic to this mission is one called \"kiting\", where you fit long range weapons and keep the enemy at range so that they can't damage you much, and to avoid being caught by warp scramblers and webs."
  - text: The key here is to be fast, and to destroy the warp disrupting drones from outside their range (approximately 10 km). An afterburner is essential as these drones have a speed of 900 m/s. You should use long range weapons, aiming for a range of 15km. Tracking is not an issue. As usual for rogue drones, EM and/or Thermal damage is preferable. If your ship has a drone bay then this will help a lot, since your drones can damage enemies up to 25 km with no problems.
  - text: A Punisher with pulse lasers and long-range crystals (microwave or radio) has been effective in this mission, but for other races, fit light missiles, railguns, or artillery to get the range you need. A Destroyer with its range bonus and increased DPS (but reduced speed) may work better than a frigate. With the addition of drone destroyers, such as the Algos and the Dragoon, you can easily take down the entire mission with light drones at range. The choice is yours.
  - text: When you first warp to the mission location, there will be a few rogue drone ships and an acceleration gate. Destroy the drone ships; this first group has none of the scrambling ships. Once you are done, activate the acceleration gate.
  - text: Once your warp is done, sit and watch the rats move for a short time. You will receive a message that your drone - cruiser size and called the Mysterious Drone - has left through an acceleration gate. You will see that there are two groups of rogue drones, 14 in total, which merge and then separate. You will want to engage the two groups separately, unless you feel lucky. Once you see two distinct groups, lock one Strain Infester/Render Alvi and fire at it; you will likely miss since you are out of range, but that group (and only that group) of rats should still start chasing you.
  - text: Once the drones are chasing you, turn your camera 180 degrees in the opposite direction from them (so that they are 'behind' you) and double-click in space to move away from them. This is a tactic known as "kiting", where you move steadily away from your enemy while matching speed with them, keeping them at your optimal range. Keep an eye on your overview, and start shooting drones when they enter your range. If they're not catching up, slow down your ship; if they're gaining too fast, activate your afterburner. Make sure that none of the Strain Infester/Render Alvi drones get closer than 10km to you. The drones have short range weapons and will do very little damage at over 10km, while your weapons should be able to damage them consistently. Continue until all drones in the first group are destroyed, then repeat the process for the second group.
  - text: Fly back to the next acceleration gate and finish the mission; the drones in the last room pose no significant challenge.
  - text: Multiple gated deadspace pockets. The acceleration gates are not locked. So once the warp disrupting drones are dead you can proceed to the next pocket.
  - text: Mission is completed when the frigate rats in the last room are dead.
  - text: "Blitz: if you have a MWD it is possible to hit the acceleration gate before you get warp scrambled (but this is risky)"
  - text: "Pop-up - The Drone is escaping: The drone has escaped through that acceleration gate. Follow it."
