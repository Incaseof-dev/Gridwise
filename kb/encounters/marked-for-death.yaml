notes:
  - text: Objective
  - text: Assassinate Izia Tabar located within the Hek system.
  - text: Notes
  - text: Warp into the encounter. Be cautious. At first, you will see a pack of five Mercenary Rookie ships at about a 20 km distance. Destroying them will trigger a second wave of five Mercenary Rookie ships. After eliminating all 10 ships, the named ship Izia Tabar will spawn. He is your mission target and is notably fast and heavily armored. Engaging him directly is recommended.
  - text: Optional Objective:* The in-game prompt may suggest destroying the Amarr Tactical Outpost located near Izia Tabar's position. However, this action is not necessary to complete the mission. Engaging the outpost is unconfirmed to provide any benefits and may (unconfirmed) lead to a standings hit with the Amarr Empire. To avoid potential negative consequences, it is advisable to focus solely on eliminating Izia Tabar and his escorts.
  - text: 'On mission completion, Keita Eslin will comment: "You have done exceptionally well, . Our teams will head over to Tabar’s compound now and comb the area for further evidence. Get back to me when you are ready for one last assignment. It is about time the Minmatar repaid you for all you’ve done, and I have some information about how we can make that happen."'
