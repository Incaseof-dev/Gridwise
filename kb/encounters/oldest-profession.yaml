notes:
  - text: "Suggested ships: Stealth Bomber or Cloaky T3C"
  - text: This pathway option requires travel through low-sec to a different high-sec location (possibly always Archavoinet; Oulley is often smartbomb-camped). Use Eve Gate-Check before you travel
  - text: Go to the Spintrix. Talk to the workers there and look for Ralie. Destroy any aggressors and if that doesn't do it, destroy the Spintrix. Recommended to Omni-Tank for this mission.
  - text: 3% Syndicate Faction Standing loss for destroying the Spintrix structure.
  - text: "WARNING: Aubenal and Oulley is home to sophisticated pirates that place hundreds of cans around the gates preventing you from cloaking and escaping their camp"
