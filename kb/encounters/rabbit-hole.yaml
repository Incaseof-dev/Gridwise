    notes:
      - text: Reinforcements 1 will spawn shortly after you enter the room.
      - text: Reinforcements 2 will spawn upon destruction of the Caldari Navy Destroyer from reinforcements 1.
      - text: Destroying one of the Point Defense Batteries (possibly the one on the right from warp-in) will make the Large EM Forcefield structure disappear and you can attack the Caldari Navy Storage Bunker structure directly instead.
      - text: Destroying the storage bunker will make it drop Lieutenant Kipo “Foxfire” Tekira. Note that it will drop two cargo containers and only one has the mission objective.
      - text: Destroying Caldari Bunker causes -0.24 standing loss to the Caldari State.
      - text: Reinforcements will arrive soon after entering the pocket.
      - text: Bring back Kipo Tekira to Irichi Tsunikabda to complete the mission.
