restrictions:
  - text: "Ship size limit: Battlecruisers"
notes:
  - text: An Unrated Complex that can be scanned down with scanner probes. It is commonly found in highsec systems occupied by the Sansha's Nation pirate faction.
  - text: The site consists of a volume of space with an acceleration gate and contains various structures and their defending pirates. Using the gate allows access to other areas within the site. When attacked, the defenders may send multiple waves of reinforcements. Each group's appearance is triggered by the destruction of members of the previous group. The names and amount of ships listed may vary slightly, but will always be of Cruiser class or smaller. There are two variations of the site.
  - text: This site's acceleration gate allows only Battlecruiser class ships or lower and their Tech 2 equivalents to enter the site. Flying too close (4 km) to the second gate will trigger a large spawn. Shoot the Sansha Mind Control Tower to get the Centum Militant Supervisor to spawn. He's got the good stuff.
  - text: The first pocket can be skipped if you have a Sansha Silver Tag in your cargo hold. This will be consumed when the acceleration gate is activated.
  - text: "Escalation: Destroying the True Sansha's faction spawn or the Centum Militant Overseer may trigger an expedition Nation on the Rise, with this message:"
  - text: "Escalation: Nation on the Rise: A couple of the ships you destroyed bear different marks than the rest and after closer inspection you find that their navigation logs point to a place nearby as their home base."
loot:
  - item: + Commander and other valuable loot
  - item: Mid-grade Nirvana Alpha BPC
    note: est. 17m (wiki) · Unknown drop rate
