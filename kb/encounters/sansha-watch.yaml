    notes:
      - text: Sentries are split into two groups to the left and right, relative to the next acceleration gate. They are out of range of the warp-in point and can be ignored without any damage if one simply burns straight to the next gate.
      - text: "Reinforcement wave message:: The Patroller calls on reinforcements from a nearby pocket as he is attacked!"
      - text: "Gate proximity wave message:: Someone has entered the vicinity of the acceleration gate, and has awakened the Slave Commander! Prepare for a fight, unless you have the means to bypass the gate's security system."
      - text: "Message from Slave Commander:: Centus Slave Commander: Fool, you've overstepped your welcome here. Minions, defend your master!"
      - text: The reinforcement wave is timed and will spawn even if the left group of frigates is not attacked.
      - text: Structures on site
