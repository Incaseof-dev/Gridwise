notes:
  - text: Angel Refuge is an unrated combat site belonging to the Angel Cartel pirate faction. It can be found via exploration as a cosmic anomaly within systems owned by the Minmatar Republic or occupied by the Angel Cartel. As an ungated complex, the limitations as to which ships can enter this site are tied to the security rating of the system where the anomaly spawns (up to T2 Battleships for high-security systems, and Titans for low-security and null-security systems). Completing this complex may award the player with valuable Domination faction modules and ammunition.
  - text: This combat site consists of a single ungated pocket of space containing a variety of frigate- and destroyer-sized enemy ships. Destroying all hostile ships may escalate into the DED rated, Angel's Red Light District complex.
  - text: "Escalation: This anomaly can escalate to Angel's Red Light District."
