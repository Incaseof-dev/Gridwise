  - name: Fourth location
    notes:
      - text: Single normal space pocket.
      - text: This last site is not time-sensitive, though it can be time-consuming if you do not bring something that can tank the high DPS or snipe the three Madcat Frigates from afar. Once the three Madcats are killed, the container unlocks. The loot can be anything from Metal Scraps to the usual array of faction modules.
      - text: The Madcat Frigates are effectively a DPS check, as they boast high passive shield regeneration, strong 90% armor resistances, and strong armor repair. Fortunately, you do not need that much DPS (at least 180) to kill them if you pull them away from the site, though more is always better. While it is much faster to be able to overwhelm their armor repair, it is not strictly necessary. Recommend at least 450 DPS to break their active tank.
      - text: "Note - Apr 2025: It seems that there is some criteria under which they stop repairing their armor. I can't figure out what it is, and it doesn't seem to be consistent. It allowed me to kill 2/3 of the Madcat frigates, but not the third."
      - text: "August 2026: Madcats destroyed with HAMs and a Web."
      - text: "For clearing this site, there are three approaches: bookmark chaining to kite, sniping, or tanking."
      - text: For the first two approaches (kiting/sniping), all you have to do is warp in, then warp out to the sun (or somewhere consistent) after creating a bookmark. Then, you warp to your bookmark at the site at 100km, and then create another bookmark so you are now 200km from the site. Depending on if you are kiting or sniping, you may be able to stop here and pick off the 5 Sentry Guns who can do a fair amount of damage up to 250km. However, if you can't, then you'll need to repeat the process one more time so you're 250-300km from the site. Then, you'll need to warp into the site at 0, tag an enemy once (or more, depending on your fit and tank), and then warp out to your bookmark at 250-300km. Provided you managed to shoot an enemy, they should aggro and begin moving toward you, even if you temporarily break the lock via warping to 300km. For the Madcats, this process won't take very long thanks to their MWDs. For the other rats, however, this can be a time-consuming process if not using a ship able to hit 100-250km (such as a cheap Railgun Naga, for example), as their speed is a painful 300-500 m/s.
      - text: Once the Madcats are dead, you can warp straight to the cargo container for the loot, and then leave. If you're unlucky, you'll only get a single Metal Scrap. If you're lucky, you can receive Coreli A-type modules.
      - text: "[More information needed for minimum tanking requirements here]"
      - text: Structures on site
      - text: "Escalation finished:: Killing rich kids may be lucrative, but when they have an army of hard core Guardian Angels to hold their hand like this, it can be a bit troublesome. These at least will have enough to talk about in their luxury clone bay tonight, wherever that may be."
      - text: Note that the reinforcement spawn appears to vary to some degree, as one user reported 9 additional enemies spawning in addition to the 10 battlecruisers.
