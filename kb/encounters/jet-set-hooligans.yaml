  - name: Single room
    notes:
      - text: One of the Madcats will stay behind. Killing it can trigger escalation. Attacking it triggers first spawn.
      - text: The Madcat is difficult to kill, uses MWD and has active shield and armor rep and small signature (~500 DPS HM Tengu was not able to kill it (possible if you manage to keep it at range (pressing E all the time) - the wreck was empty!)).
      - text: If you are unable to kill the Madcat he will eventually warp away.
      - text: A group of Serpentis ships (named Guardian Angels) spawn to defend the Madcat. Each pair of Guardian Angel ships will spawn a new reinforcement wave. Last ship killed will trigger Spawn 2.
      - text: "Scarcity Update: This site, like other cosmic signatures, contains ore."
      - text: As of 1st March 2021 the site contains large amounts of Hedbergite & Hemorphite, with smaller amounts of Omber, Kernite and ores found in high sec. The ore spans a crescent shape of 120km across and is therefore impossible to scan with a single survey. It was estimated on approximately a third of the belt scanned that ISK value at current prices would be 2.5-3b. Note that if the site is left by all players it may despawn, but leaving one player at all times within the site will retain it in space for mining.
      - text: As of 3rd March 2021 the only asteroids showing on overview at the site were Scordite and Veldspar. Very disappointing.
      - text: As of 15th of October 2021 the site, once again, contains only large amounts of Scordite and Veldspar.
      - text: "Escalation message:: It seems like you have the choices of staying here and getting murdered by the Angel babysitters, or you could try to jet out and see if the lock you have on the rest of the brats is any good..."
      - text: Each pair of first reinforcements will spawn a new pair of same type.
      - text: Finishing reinforcement 2 spawns reinforcement 3. This group spawns around 100 km from warp-in.
      - text: DO NOT KILL REINFORCEMENT 3!
      - text: Killing reinforcement 3 triggers massive enemy wave. These ships will close in very quickly and will web and point. You will not be match for them.
      - text: 'The ships have special types: "Temko Interceptor", "COSMOS Gallente Commodore", "Cosmos Gallente Elite Frigate" and "Cosmos Gallente Captain". They were easily able to overpower a Vargur with 1700 ehp/s tank.'
