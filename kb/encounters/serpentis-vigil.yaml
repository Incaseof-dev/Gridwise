restrictions:
  - text: "Ship size limit: Battlecruiser"
notes:
  - text: Serpentis Vigil is an unrated combat site belonging to the Serpentis Corporation pirate faction. It can be found via exploration by scanning anomalies in high security and low security systems. It is presumed that Battlecruisers (and their Tech 2 equivalents) are the maximum ship class allowed to enter the site. Completing this complex may award the player with valuable Shadow Serpentis faction modules, as well as Tech 2 implants.
  - text: This combat site consists of two deadspace complexes, the second of which hosts Tago Uriken, the site's overseer. Access to the second complex is given by destroying all remaining hostile ships at the first complex. Defeating Tago Uriken may escalate into the Booster R&D expedition.
  - text: "Escalation: This site can escalate to Booster R&D."
  - text: 'Escalation: Expeditions: Booster R&D: Going through the items found in the Serpentis outpost, you notice some unused boosters still in their original packs complete with documentation and bear the seal of the Serpentis Corporation. The documentation notes further that these boosters as "Field Test" material and not for common consumption and at the bottom there is ordering info, stating item number and the makers electronic address. Feeling it is worth a shot, you set your communication instruments to emulate those of the Serpentis facility you just laid to waste, feed in the booster factory addy and hit send. And lo and behold, you get an instant reply, a sleepy sounding female voice says "SC medical research 504, good day. How may I help you? Oh! It is Vigil 15? I have a message for you from the supply office, they say you are late. Get to G5, pick up the materials and get here as soon as possible" She adds information on the location and tells you to talk to Nadir, also at G5 if there is anything. And with that she is off the air.'
