notes:
  - text: This site is the hardest of the three Fleet Staging Point parts, as heavy webbing, neuting and high incoming damage from spawns makes it fairly difficult to solo. Preferably use a well-tanked T3 Cruiser or fleet of battleships to handle the site, but it may also be blitzed with a well-fit Ishtar, killing only the frigates and the structure.
  - text: If using a T3 Cruiser, make sure to keep moving as fast as possible to try and avoid as much damage as possible.
  - text: The second reinforcement wave contains 3x Guristas Energy Neutralizer Sentry II so watch your cap.
  - text: The Guristas Fleet Outpost (structure that contains your loot) has a strong -80% web that reaches out to 50 km. It fires Citadel Kinetic torpedoes that can instantly destroy an unprepared ship. High resists to Kinetic damage are strongly recommended.
