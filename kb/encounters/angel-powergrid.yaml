  - text: "Escalation start: This hidden outpost seems to have played a vital role in the Angel Cartel's expansion in the area. The fact that this operation is now history surely slows down whatever plans the Cartel had. Among one of the wreckages you locate co-ordinates for an energy harvesting facility nearby. Whether you explore it or not is your decision."
