notes:
  - text: "Relics of Past Greatness: The Jove left Curse behind long ago. Their ruins in the form of stations and forgotten outposts. Centuries later the Angel Cartel moved. The Angels have managed to scavenge a good deal of information from these Jovian relics. This is most obviously reflected in Angel ships, which bear striking designs and unique capabilities. But the Cartel has yet to understand more than a fraction of the old Jovian technologies. Even the Serpentis, whose research capabilities surpass the Cartel's by leaps and bounds, have great difficulty even understanding the principles of Jovian engineering."
  - text: Single gated deadspace pocket. Initial defenders and all subsequent waves will be roughly 30 km away from warp-in.
  - text: The mission can be completed and the next mission accepted remotely.
pockets:
