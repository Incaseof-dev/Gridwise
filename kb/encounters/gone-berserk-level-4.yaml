notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: Single ungated pocket. You can [Fleet] warp to preferred distance. Auto aggro from Initial Group and spawns.
  - text: The initial formation is composed of three groups with a Cruiser and a Battleship in each.
  - text: Each Cruiser killed will trigger a spawn wave.
  - text: Each wave is composed of four spawns for a total of 12 spawns.
  - text: "Reminder: set your drones to passive to avoid triggering a swarm. AI of this mission seems to be different from most missions, as scooping sentry drone to bay and re-releasing them will not move aggro from drone to ship. An active hostile module is necessary to keep aggro at ship."
  - text: Spawn composition and distance may vary with each wave.
  - text: To manage aggro, work on a single chain of 4 waves/spawns, then kill the next Crusader from Initial defenders to cause spawn of subsequent chain. Flag the Cruisers at the beginning to make it easier to keep an eye on the triggers.
  - text: The mission is flagged complete once you have killed ALL hostile ships, so you have to destroy the EoM Death Lord from all chains.
  - text: Deathlord (last wave) uses missile over 100km range
