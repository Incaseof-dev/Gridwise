  - text: "Early Drones: The first drones in the Gallente-Caldari war were little more than mines with proximity detonators and limited movement, but soon they advanced to a level where a single drone rivalled a solo-fighter’s capabilities. The drones reversed the tide of the war and helped create a stalemate between the two empires."
