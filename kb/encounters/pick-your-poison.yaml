          - count: "1"
            class: Container
            names:
              - Minmatar Emissary Quarters
            drop: Minmatar Diplomat
            note: When looted, Amarr enemies spawn.
          - count: "1"
            class: Accl Gate
            names:
              - Acceleration Gate
            group: Acceleration Gate
            note: goes to 2nd pocket
    onWarpIn: Careful, pilot. The site is increasingly unstable. The Minmatar and Amarr diplomats are at different ends of the site. You only have time to save one.
  - name: Second Gate (Mission Entrance)
    notes:
      - text: In addition to the SOE Rescue Vessel present when you first warped-in, you now have faction ships of the faction you didn't save out for your blood (See list below), but you do not have to kill them to complete the mission. Ships will vary depending on which empire space you are in.
      - text: "Upon deposit into the SoE ship (Minmatar): The Minmatar Republic is in your debt, Pilot."
      - text: "Upon deposit into the SoE ship (Amarr): Praise be to God. The Empire is in your debt, capsuleer."
      - text: There is no reason to take the gate as it will simply return you to P1. The mission is complete once the diplomatic staff are placed inside the SoE ship.
      - text: Blitz:Use a fast frigate or interceptor. Pick up the diplomat in P1. Return to the warp in, drop them off, and warp away. Mission is complete.
      - text: "Eliminating the Navy Ships: Instead of returning to the entrance start point immediately, you can go get your ship of choice to kill all enemies at the warp-in point. Simply ensure you transfer the rescued diplomat into your combat ship's cargohold. Upon returning to the warp-in/mission entrance you can kill everything with your large ship and deposit the diplomat."
      - text: If you wish to fight the NPCs fight the Minmatar ones; they are significantly easier to destroy and tank against.
      - text: Amarr
      - text: "Loot: 7.7M Isk in Insignias and other drops, 1.4M Isk in salvage"
      - text: Minmatar
      - text: "Loot: 12.7M Isk in Insignias and other drops, 920k Isk in salvage"
      - text: "Standing: No standing loss from killing ships in pocket 2."
