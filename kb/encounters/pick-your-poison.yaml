defaults:
  confidence: verified
  source: uni
objectives:
  - text: Rescue the diplomats and other station personnel from the damaged emissary, and then return them to the Sisters of EVE Rescue Vessel.
restrictions:
  - text: "Ship size limit: Cruiser and below"
notes:
  - text: There are 2 parts to this mission, the first part is in the first pocket and restricts the size of ship that can be used to a cruiser or smaller, but there are no hostiles. You need only grab the cargo using a MWD frig or shuttle. Once you have the diplomat in cargo, you must warp back to the entrance and deposit it in a can. This can be accomplished in the fast ship, but if desired this part may be completed in any combat ship as no gate is required. This allows you to engage the navy ships present.
  - text: Initially at the warp-in there is an acceleration gate and a stationary SOE Rescue Vessel. There are no hostiles.
pockets:
  - name: Pocket 1
    notes:
      - text: "Pocket One consists of no hostiles two cans: one labeled Minmatar Embassy Housing, one labeled Amarr Embassy Housing and an Acceleration Gate to Pocket 2. Shortly after warping in you are given a message that you can only save one."
      - text: "When you rescue the Amarr diplomat: You cut it close, but our diplomat lives! Please, return him to the Sisters of Eve ship in the first deadspace pocket. (or) You recovered our revered diplomat just in time. Please bring him to the Sisters of Eve ship in the first deadspace pocket."
      - text: "When you rescue the Minmatar diplomat: You cut it close, but our emissary lives! Please, return him to the Sisters of Eve ship in the first deadspace pocket."
      - text: Pick up the embassy staff from one of the housing cans, and the other blows up. Contrary to the mission advice, you do not seem to lose faction standing for the faction that you leave behind, or receive any improvements if you rescue one or both.
      - text: "Note: It is possible to rescue both diplomats at once, but it will require a fleet and proper timing. Once you rescue one, you will have only a few seconds to rescue the second before the embassy building explodes, so you'll need a second pilot at the other embassy to grab the other diplomat at the same time you do. Either way, an opposing fleet will be present at the destination of the second gate (ie, the mission entrance) following your rescue. A third pilot with a well-tanked battleship can withstand the enemy fleet while other pilots complete the drop-off."
      - text: There is an acceleration gate here that returns to the warp-in/mission entrance and it will place you at 50km from the container, but if you prefer it is possible to warp out and then warp back to the mission.
    waves:
      - id: demonstration
        trigger:
          on: other
          text: Demonstration
          confidence: inferred
        spawns:
