            note: 31km off. Web immediatly
  - name: Room 2
    notes:
      - text: WARNING! Second room contains 4 siege railguns (80km away) that can hit for 300-400 against a tengu with 62% thermal, 92% kinetic resists! They volley at the same time.
      - text: 2023.9.17 update
      - text: Siege railguns have a damage type of 10% EM, 10% Explosive, 30% Thermal, 50% Kinetic.
      - text: A Proteus with a resistance of 87% Thermal, 95% Kinetic, 50% EM, 10% Explosive, would take 200~350 damage from one hit.
      - text: 4 siege railguns DO fire at the same time, rate of fire around 15 seconds a shot.
      - text: attacking the station will cause a Kinetic smartbomb activation, causing around 6000 Kinetic damage. The smartbomb does not repeat.
      - text: When the station is brought down to 20% structure, it would spawn a wave of 20 battleships plus more scram web frigates and a dread guristas conquistador with a 10m isk bounty. It is recommended to use afterburner to avoid damage from battleship torpedos.
      - text: If you kill the station and warp out but do not kill the faction spawn, the whole site including the faction commander will despawn.
      - text: I recommended killing the scram / web frigates immediately and taking down a couple of the siege rail guns before attacking the station. The DPS from the railguns plus the second wave can quickly overwhelm even a blingy ship.
