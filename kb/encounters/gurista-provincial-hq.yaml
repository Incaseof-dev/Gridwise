  - name: Room 1
    notes:
      - text: Mix of 15 or so Battleships/battlecruisers in first pocket
      - text: 2 stasis web towers 31km off. Both web immediately.
      - text: Got Chased out before I could finish the site. Will update later when I can. - Kaboose 909
