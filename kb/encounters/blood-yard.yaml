notes:
  - text: The site is an open Deadspace pocket, one may warp to preferred distance. Warping to beacon for close range would require a very good tank to handle the swarm’s incoming damage. Using a propulsion module or a Micro Jump Drive is recommended. Reinforcements spawns are triggered by the last ship killed.
  - text: "Escalation: This site can escalate to Crimson Hand Supply Depot."
lootNotes:
  - text: The site pays one million isk in bounties and the rare faction spawn can drop faction modules, implants or blueprints.
