notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: "Suggested ships: Battleship (sniper)"
  - text: "The Republic-Cartel Relationship: The Minmatar Republic and the Angel Cartel have a long and checkered history of locked horns and uneasy handshakes. A century back, when the Angel Cartel was building its reputation as a ruthless mercenary organization but had not yet crossed over into out-and-out piracy, the Republic was rumored to frequently contract the Cartel for operations deemed too politically sensitive for the Republic's armed forces. While these rumors have never been confirmed by either side, certain other occurrences -- such as the Cartel's immediate and unexplained withdrawal from their Skarkon sovereignty bid in YC110 -- seem to corroborate the idea of a nebulous connection between the two giant entities' top levels."
  - text: thumb|right|192px
  - text: Accept the Mission remotely.
  - text: Ungated semi-deadspace pocket zero jumps away in Todeko. All warps will land you at the same point, but you can warp around freely.
  - text: Complete the Mission remotely.
  - text: "Blitz: warp in, then warp to bookmark. Wait for 10 minutes for the final spawn to arrive and destroy the 2x Elite Battleships (Gist Domination Saint/Nephilim)."
  - text: "Tips: A new spawn appears after a minute, then after 2, then after 3 and the final spawns after 4 minutes"
  - text: "Tips: 2x Elite Battleships (Gist Domination Saint/Nephilim) Target Painting is effective even at 100KM"
  - text: "Tips: Battleships can't hit at close range due to poor tracking"
  - text: "Tips: Ships spawn around 70 km away from warp-in, all around the same spot. Large amount of elite cruisers will make speed-tanking difficult if you don't have very strong Explosive resist."
pockets:
  - name: Pocket 1
    notes:
      - text: "Mission Completion Dialogue: Nice flying out there . The Defiants dealt with the remains of the attacking fleet easily once you took out their support. As for the situation with this RSS Agent, we're still discussing our options amongst the tribal leadership, but chances are that this guy was operating on his own. That means basically nobody knew what he was doing or why the Wildfire Khumaak grabbed his attention. You're probably going to have to take that guy's passkey and go in there yourself, if the RSS lets us. We're still talking with them about the situation. Some people are looking at his disappearance in an entirely different light, if you get me. RSS operative shows up and not much later so do a bunch of Angels. Yeah…still a few discussions yet to be had, I reckon. Anyways, get back to me again soon and we'll have a plan ready for you. You've more than proven yourself now, so I'd be more than happy to trust you with whatever comes next."
