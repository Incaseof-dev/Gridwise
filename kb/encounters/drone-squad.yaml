notes:
  - text: Drone Squad is combat anomaly inhabited by Rogue Drones that can be found in low and null security space.
  - text: There are two variations of this combat site. The first variation takes place in the Infested Station Ruin and includes Heavy Missile Batteries in the initial wave. The second variation takes place in the Drone Structure I and includes Sentry Missile Batteries in the initial wave. Suits speed tanked missile ships - Jackdaw, Caracal Navy Issue, and thought likely doable with a Vexor.
  - text: Make use of range & microwarp to wean out cruisers then bombard remaining battleships.
  - text: This variant contains a prominent Infested Station Ruin
  - text: This variant contains a prominent Drone Structure I
  - text: "Escalation: This site can escalate to Outgrowth Rogue Drone Hive (10/10)."
