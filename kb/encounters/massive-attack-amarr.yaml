notes:
  - text: "Web/warp disruption: Elite Frigates"
  - text: "Suggested ships: Nightmare, Abaddon, Apocalypse, Armageddon, Maelstrom, Dominix"
  - text: "Space type: Deadspace"
  - text: "Note: The mission is reported to be against Amarr, but the Tracking Disruptor ships given are Sansha's Nation They do not appear in the details.."
  - text: The majority of hostile ships are frigate/destroyer/cruiser class with only a handful of battlecruisers and only a few battleships.
  - text: When first posted, (on EVE-Survival) there were questions about whether an Angel Cartel Gistum Defeater was outside of the gate for an anti-Amarr mission. If anyone else getting this mission could confirm it that would be useful.
  - text: "MariaEpiconthe (2009-03-04) : I doubt Angel Cartel is working alongside Amarr empire, so if anyone picks this mission up, enlighten us if the Angel Cartel rats are there for you or if this is a bug or whatnot. Thanks"
  - text: "StraightChillen (2009-04-15) : I can confrim that as of today, there were infact gistum angel rats at the gate"
  - text: "HappyPants (2013-07-02) : Confirmed again 2xgistum rats, didn't need to kill them to use gate, just killed amarr rats"
  - text: "Anonymous (2022-07-14) : Confirmed 2x Angel Cartel Cruisers amongst Amarr rats. Cannot confirm presence or absence of any EWar. No need to kill any of them, could go straight into the first mission room."
  - text: thumb|Two Gistum Cruisers amongst Amarr rats
