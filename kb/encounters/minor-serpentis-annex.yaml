notes:
  - text: "Database Information: Previous explorers have commented that one of the gates requires a passkey. Alternatively, it can be bypassed by convincing the commander to unlock it. The overseer guards the Smuggler Gate vigorously. There must be a way to lure out some of his guards before engaging him though ..."
  - text: The site is very similar to Serpentis Watch.
  - text: "Escalation: Serpentis Owned Station: To your surprise, the Overseer seems to have spent the last moments of his life sending some message to your ship on a private channel, a fact you learn from a blinking entry on your communication panel a few seconds after his innards slid across your windshield, bounced along your fuselage and were sucked into your thrusters. It appears he wanted to save his life by telling you the whereabouts of some place you could load your cargohold with riches, but before he could get very far with his offer, his journey ended. All you have is some hysteric babble about a hidden mining station at a certain location."
  - text: "Escalation: Can escalate to Serpentis Owned Station"
loot:
  - item: + Commander and other valuable loot
  - item: Shadow Serpentis Gold Tag, faction ammo
    note: est. 1.5M (wiki)
  - item: + Exploration logs
  - item: Nov 2016
    note: est. 1.5M (wiki) · Can be done in a Cruise-Phoon with auto-missiles, but takes forever and you're always worried of getting jumped. Not worth the effort? Will try again. Bounties and salvage seems decent if you run in a group and clear it quickly.
  - item: Oct 2017
    note: est. 15M+ in Bounties (wiki) · Fairly significant DPS on the smuggler's gate wave, including scram elite frigates. Completed in a 100MN HAM legion with no issues.
