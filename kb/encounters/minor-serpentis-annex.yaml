  - name: Second Pocket
    notes:
      - text: ----
      - text: "Smuggler Gate Operator:: Intruders! Defend the gate!"
      - text: Notable structures on site
      - text: Shooting any of the Serpentis Towers triggers Tower wave. Shooting the Smuggler gate triggers gate wave.
      - text: If you shoot at the gate before triggering tower wave then tower wave is also triggered (verify).
      - text: Spawns can be grouped differently depending on what order they are triggered in. The following is from shooting one of the towers before shooting at the gate.
      - text: "Tower wave triggered:: A distress signal is sent when the Starbase Control Tower is attacked! Hostile reinforcements are incoming!"
      - text: "Reinforcements:: A group of Core activists have jumped through the stargate to defend the Starbase Control Tower"
      - text: Reinforcements to tower wave arrive few seconds later.
      - text: "Core Militant Overseer:: Imbeciles. I'm surrounded by imbeciles! I spent a fortune on this place and you can't even defend it from some rag-tag outsiders. Pfft! I'll deal with you all after I mop the floor with these pests."
      - text: "Commander:: The Overseer has come to defend the stargate! Prepare for a fight."
