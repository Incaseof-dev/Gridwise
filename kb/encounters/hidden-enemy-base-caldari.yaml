notes:
  - text: "Web/warp disruption: All Frigates 25-35% chance each"
  - text: "Suggested ships: Ishtar with Osprey Shield Repping. Osprey was only needed for last room."
  - text: "Space type: Deadspace, multiple pockets with gates"
  - text: Two Remote Cloaking Array's must be destroyed before a hidden gate that leads to the Enemy Base will appear
  - text: Use a Passive Tank and save time by not having to destroy Energy Neutralizer Sentries.
  - text: Set drones to aggressive for any jamming ships (especially Room 2).
  - text: For Pockets 5 & 6, wait until all ships have spawned before bringing in a logistics ship.
  - text: Suggest using a Drake instead of logistics if not needed. Really speeds up the process.
  - text: Thanks to JohnnyMnemonic. I borrowed a good portion of his page and changed what I needed to for the Caldari version.
