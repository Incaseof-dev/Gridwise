pockets:
  - name: 1st pocket
    notes:
      - text: Acceleration gate 60 km from warp-in. Gate is locked until all enemies destroyed.
      - text: No aggro on warp-in. Proximity aggro on groups 2 & 3 when within 6km of the gate.
      - text: "Tips: Group 4 can be sniped without aggroing anything else."
      - text: "Tips: Attacking Group 2 aggroes Group 3. The last group will remain neutral and can be aggroed separately."
      - text: "Tips: Attacking Group 1 OR 3: Aggroes whole pocket."
      - text: You can eliminate both groups 4 and 1 without drawing pocket aggro but it gets a bit complicated. You need to fly your ship off to the side putting the station ruins between your ship and groups 1 2 and 3. After your within range eliminate group 4 this will draw group 1 aggro. If you wait for a few minutes after destroying group 4 you will notice that group 1 will be stuck in the station ruins unable to get close to you. Additionally they will have drifted out of aggro range of the other 2 pockets. At this point it should be safe to eliminate group 1 without 2 and 3 aggroing you.
