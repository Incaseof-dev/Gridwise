  - name: Second Pocket
    notes:
      - text: To get the commander wave to spawn, you have to approach the Warning Sign in the corner of the station. Alternatively, it can be triggered by destroying the battlecruisers from initial defenders.
      - text: There is also a second version, where the commander wave consists of around 15 cruisers and battlecruisers instead of the battleships. 15 cruisers wave was additional one for me, which spawned battleship wave with Sentient Supreme Alvus Parasite after.
