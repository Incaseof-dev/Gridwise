  - name: Fourth Pocket(Sanctum)
    notes:
      - text: "Database information: The source of the drone infestation seems to lie in this deadspace pocket, located inside a fiery nebula. The extreme and hostile environment, accompanied by a very heavy drone presence, seems to have kept most of the looters away, as two fully intact ancient ruins would indicate."
      - text: The Hive Mother does very little damage and has a moderate tank. It will trigger new waves as it is destroyed so be sure to kill a new wave before continuing shooting the Hive Mother or you'll be quickly overwhelmed.
      - text: "Reinforcements: The Drone Hive Mother has deployed Drone Cruise Missile Batteries along with more drone ships!"
      - text: "Reinforcements: Drones have emerged from the nearby bunkers to defend the Hive Mother!"
      - text: "Reinforcements: Drones have emerged from the nearby bunkers to defend the Hive Mother!"
      - text: "Reinforcements: Drones have emerged from the nearby bunkers to defend the Hive Mother!"
      - text: "Smartbomb wave triggered: Someone has gone too close to one of the ruins and triggered an ancient hidden explosive. Energy and material spurts in all directions, and all ships caught in the blast radius take damage!"
