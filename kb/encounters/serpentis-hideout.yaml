restrictions:
  - text: "Ship size limit: Destroyer"
notes:
  - text: Serpentis Hideout is an Unrated Deadspace Complex that is found in High Security and Low Security Gallente Space, via Probe scanning. The site consists of an entrance pocket, and two main pockets, separated by acceleration gates.
  - text: If running the site in a T1 frigate, or if using light drones, take care against the Elite Frigates (Coreli Guardian Agent/Defender/Guard/Protector) as they will do higher damage than the regular frigate enemies, and will target light drones.
  - text: When you warp to the site you will land on an acceleration gate. There are no enemies on it, and nothing around other than the acceleration gate that leads to the first main room of the site.
  - text: "Escalation: This site can escalate to Mindflood. Escalation chance ~25% (3 out of 13)."
  - text: 'Escalation: class="wikitable complex collapsible"'
  - text: "Escalation: + Commander and other valuable loot"
  - text: "Escalation: Shadow Hybrid Ammo S x 1000"
  - text: "Escalation: 5k - 100k"
  - text: "Escalation: Shadow Serpentis Copper Tag"
