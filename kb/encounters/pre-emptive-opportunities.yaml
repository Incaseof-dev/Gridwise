notes:
  - text: "Web/warp disruption: Spider Drones / Elite Frigates"
  - text: "Paranoia: Hyasyoda is one of the oldest of the Caldari megacorporations, having been formed shortly after first contact with Gallente when the Caldari were still in their Industrial Age. Throughout State history, Hyasyoda executives have always been conservative and cautious. As a result, the corporation has informally claimed as theirs the age-old Caldari saying that “only the paranoid survive.”"
  - text: "Blitz: Destroy the Caldari Logistics Center (Caldari Station1) and GFTFO, DPS will build up. Destroying the station will cause any rats currently on grid to despawn, but waves which have not been triggered yet will continue to spawn if you stick around. Station has quite a lot of HP, about 250K HP total. 950DPS applied right from the start will do it right before the spider drone wave. This mission can be completed remotely and the next mission accepted remotely."
  - text: Ungated normal space.
  - text: "The station drops 1x CPF.HYA LogInt Facility POI-26: Data Cache that you can keep as a souvenir."
  - text: "Warning: Prioritize targets and eliminate EWAR threats asap. Reinforcement Waves are time based (3-5min) with no trigger. The final wave is very strong, might consider getting help from friends."
  - text: "Note: The Mercenary Wingmen may web and point. The Spider Drones are very quick. After warping to the location you will receive the following objective - Destroy The Logistics Center. No additional waves spawn when shooting the Logistics Center. However, it does have a lot of armor and structure points. If you destroy the Logistics Center, and stay in the deadspace pocket, additional waves (up to the final wave) may continue to spawn."
