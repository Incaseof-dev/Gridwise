objectives:
  - text: Clear the third (last) room of NPCs.
ewar:
  - kind: sensorDamp
  - kind: web
  - kind: warpDisruption
notes:
  - text: "Web/warp disruption: Yes (Guardian Protector, Coreli Guardian Agent/Spy)"
  - text: The mission consists of three pockets and you only have to clear the NPCs in the third (last) pocket. You might have to clear some warp disrupting frigates in pocket 1 and 2 so you can take the acceleration gate.
  - text: "Blitz: In the first and second pockets, ignore all hostile targets and proceed through the acceleration gates. Note that the gates cannot be activated while warp disrupted, so it may be necessary to destroy any disrupting frigates before activating the gates. Destroy all the ships in the final pocket."
  - text: "Warning: It can be helpful to fit a Sensor Booster or Signal Boost Amplifier to help counteract sensor dampening."
lootNotes:
  - text: "Loot: 12.4-18 mil"
  - text: "Salvage: 11.3-15,2 mil"
  - text: "Bounty: 21,5-22 mil"
  - text: As of 10/10/24
pockets:
