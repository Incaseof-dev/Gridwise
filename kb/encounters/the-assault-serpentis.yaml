    notes:
      - text: Attacking group 1 has a chance to aggro group 2. Attacking group 3 will aggro group 2. Destroying any of the triggers will spawn reinforcements. Avoid triggering reinforcements too early as it includes more warp disruption and heavy dps.
      - text: The acceleration gate is not locked, and can be activated at any time. However, note that the acceleration gate cannot be used while warp disrupted.
