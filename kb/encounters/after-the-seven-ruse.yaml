objectives:
  - text: Obtain the hostages from the holding cell, escape using the acceleration gate, and deliver them safely to the CONCORD ship.
restrictions:
  - text: "Ship size limit: Shuttle"
notes:
  - text: No combat, only damage
  - text: This mission is issued by a Security division agent and is part 4 of the 5 part mission chain After The Seven
  - text: A Caldari Shuttle will be granted when accepting the mission. Use the shuttle to accomplish the mission.
pockets:
  - name: 1st pocket
    notes:
      - text: When you warp in Anakism is waiting, he won't know who you are so he won't attack you. Make your way to the container and grab the kidnapped citizens.
      - text: Once you grab the citizens Anakism realizes who you are and will attack you. Rush to the second gate and warp to second pocket.
      - text: When approaching the holding cells at ~20km
      - text: "Get to the Gate!: The hostages must be in those holding cells. Get them to the rescue ship on the other side of that acceleration gate."
      - text: When at about 5.5km form the cells
      - text: "Anakism's Message: Hang on a second... Phenod has never been able to interface with anything without putting several dents in his own ship. Who are you? Get back here with that loot."
      - text: Now Anakism turns hostile
