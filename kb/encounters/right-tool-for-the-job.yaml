notes:
  - text: "Web/warp disruption: Elite frigates"
  - text: 0.001 Gallente Federation Faction Standing loss; Requires a Data Analyzer
  - text: "New Region connected to Stargate Networks by Caldari State, Scope Article, June 11th, YC 110: In yet another twist in the recent events, multiple reports are coming in of new stargates appearing in systems on the fringes of Caldari and Gallente space. It would appear that the volume of space known as Black Rise - previously thought to be completely impenetrable - has been secretly colonized by Caldari forces. Initial reports from capsuleers indicate that the new region contains a wealth of virgin systems, full of resources unexploited thus far by the four empires. Additionally, early cartography has revealed that the region opens an additional border between Caldari and Gallente sovereign space, something officials on both sides are scrambling to prepare for as they readjust strategies. Even as they do so, pod pilots both loyalist and independent are rushing into the area to stake a claim of their own. It remains unclear exactly how the phenomena shrouding this area were penetrated, or indeed how the Caldari State has managed to colonize the area in complete secrecy. State officials have so far remained tight-lipped on any details, providing no explanations. After such startling events in recent times however, and with officials from all three Empires as well as CONCORD pushing for answers on the matter, it is something they will likely have to address in the nearby future."
  - text: Ungated deadspace pocket one jump away. Do not forget to equip a Data Analyzer.
  - text: "Blitz: Warp at range and bounce to the Federation Navy Shipyard, destroy all the frigates guarding it, and loot the FedNav F.O.F Identifier Tag AC-106V:FNSBR (The shipyard needs to be hacked through the Data Analyzer & Hacking minigame before you can loot)."
  - text: "Tips: You can warp in at range and land closer (or farther) from the Federation Navy Shipyard. If more than 150km away, you can warp directly to it; create a bookmark before you land so you can quickly bounce to it"
  - text: "Tips: The Broadcast Tower Group will not shoot at you unless you get close (they will if you warp to 0)"
  - text: "Tips: Broadcast Tower Group receives reinforcements every 2 minutes three times"
  - text: "Tips: All ships will drop Gallente Navy Tags"
  - text: "Tips: If you plan on tanking, destroy the Cruisers first"
  - text: "Tips: Negligible standing loss to the Gallente Federation for destroying enemy ships"
  - text: "Tips: Buy Caldari Prisoners of War and bring them with you so you can instantly complete the next mission"
