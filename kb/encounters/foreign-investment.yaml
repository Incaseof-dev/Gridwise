  - text: "Lore Blurb: Iyen-Oursta Loopholes: Gallente Navy ships are not often allowed inside State borders – at least not officially. Conditions determined in the Iyen-Oursta Treaty at the end of the war place strict conditions on the manner in which each nation's fleets enter the other's sovereign space. One of the current laws allows such deployments, though, if they are hired by a third party as part of usual trade business. Additionally, they must meet stringent size and composition requirements that greatly limit any damage they could potentially cause. Since official search and rescue missions are, by treaty, conducted exclusively by the nation that owns the space, further \"hostile\" forces cannot legally be sent to recover hired navy forces that go missing."
