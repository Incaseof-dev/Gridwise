notes:
  - text: The site is very rare and hard, and should only be attempted by skilled players. Rogue Drone, Serpentis, Angel Cartel and Guristas rats are present in this site. Omni tanks are highly recommended, especially against Kinetic and Thermal damage.
  - text: Compared to other combat relic sites, this is noticeably harder due to higher DPS, especially in the fourth and last pocket.
  - text: You land at an acceleration gate at warp-in. It is locked until the three battleships guarding it are destroyed.
