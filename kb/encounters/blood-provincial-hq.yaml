restrictions:
  - text: "Ship size limit: T2 Battleship"
notes:
  - text: The first room is largely straightforward; a well-tanked T3 Cruiser or Battleship can do it fairly easily. The second room is much harder to solo due to strong webbing, neuting and fairly high DPS. If your ship does not have the ~1000 DPS required to destroy the Arena Sentinel structure in the second room, recommend bringing a friend for this site.
  - text: Warping to the site lands you on an acceleration gate that permits up to T2 Battleships.
  - text: "Escalation: This site can escalate to Fountain of Youth."
  - text: "Escalation: Escalation start: As the dust settles from the battle, you receive a transmission from someone claiming to be a local vigilante who congratulates you on a job well done. Your computers run a check on his ship ID's and other info they can gather on him in such a short period of time, but come up with nothing. He appears to represent neither a pirate faction nor one of the empires. This person continues to welcome you to the area and offers to point you to some other Blood bases he knows about and have been a menace for the local population. If you want to come and meet him, he will lead the way."
