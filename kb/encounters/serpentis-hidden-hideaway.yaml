    onWarpIn: The Serpentis Corporation was founded a few decades ago by V. Salvador Sarpati. At first it was engaged in hi-tech neural booster research, but with the discovery of their fatal side-effects, prematurely closed. The company was re-established by Igil's adopted son, Salvador Sarpati, and with time its ties with the underworld grew and the Serpentis research stations, scattered around in remote areas, became infamous pirate havens. Sarpati made a deal with the Angel Cartel early on to provide protection for his stations and the duty was taken on by the Guardian Angels. Both sides have prospered enormously for this deal - Serpentis can operate in peace and the Angel Cartel gets access to the illegal research efforts of the Serpentis. It is strongly believed that Serpentis is the main developer and manufacturer of illegal neural boosters, especially since Sarpati's father was a renown specialist in that field. The home of Serpentis is in the Phoenix constellation in the Fountain region.
