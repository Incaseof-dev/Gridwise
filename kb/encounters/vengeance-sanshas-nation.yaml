      - text: DO NOT deploy drones to attack Group 1 as it will be targetted by Group 5.
      - text: Group 3 & 4 forms an aggro pair. Both will aggro if either one is attacked. Drones can be safely deployed as long as both groups have been aggroed.
      - text: Group 2 & 5 can be independently attacked in any order without drawing pocket aggro. You may deploy drones as per normal.
      - text: "- The warp gate is locked until all ships have been eliminated."
      - text: "- Recommended order of elimination: Group 1 & 5, Group 2 and Group 3 & 4."
      - text: "- Pocket 1 has a sizeable Veldspar deposits."
