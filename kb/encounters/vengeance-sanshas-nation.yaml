  - name: Pocket 3
    notes:
      - text: No aggro at warp-in. You warp in to approximately 65-75 KM from NPCs and sentry towers.
      - text: Sentry towers proximity aggro will be triggered if your ship moves to within 50km. (This includes your drones, too!)
      - text: "- As of 20 June 2011 This room changed, there are 3-4 spawns and triggers. Fit hard tank."
      - text: "- As of Crucible, no new spawns. Tower sentries don't even aggro until you're within 50km."
      - text: "- There are new spawns, 2 waves 12/11/2016"
      - text: "- It is recommended that your ship carry at least 2-3 weapon upgrade modules (e.g. Ballistic Control System, Heat Sink, etc.) when attacking Draben Kuvakei."
      - text: "- If you stay slightly more than 50KM away from all sentry towers, do no use drones and your guns or missiles have a range slightly higher than 50 KM (i.e. 55KM Heavy Missiles), the NPCs can be killed without receiving fire from the sentry towers as they will not agro at greater than 50 KM."
      - text: "- Mission is flagged completed once you have eliminated ALL ships(tower sentries are not required) in Pocket 3."
      - text: "- There is no quick way. Pocket 1 & 2 warp gates are locked until all ships have been eliminated. The last pocket must be cleared of ships to complete the mission."
      - text: "- You can mine 1.995.000 Veldspar, 180.000 Scordite and 150.000 in all 3 stages."
      - text: "- As of 12/2/2020 there is no ore to mine in this site. This is likely associated with EVE ore rebalancing."
      - text: "- 14,694,118.05 ISK"
      - text: "- 15,600,000.00 ISK Loot & Salvage"
