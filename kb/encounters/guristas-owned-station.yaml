      - text: "Escalation dead-end: Either the Overseer was trying to trick you and this was the best he could come up with, or that you killed him before he could reveal the juicy parts of his offer. Either way, the takings from this expedition were as juicy as the good Overseer's remains after your thrusters were done with him."
      - text: "Escalation trigger: Among the things you find are a few drones. Running a scan on their control units reveals they have been used not long ago, at another place not far away from here."
