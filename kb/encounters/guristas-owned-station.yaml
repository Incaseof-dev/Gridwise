notes:
  - text: The site has all four of its parts in low security space, and often leads up to 20 jumps away from the starting system.
  - text: "Escalation start: To your surprise, the Overseer seems to have spent the last moments of his life sending some message to your ship on a private channel, a fact you learn from a blinking entry on your communication panel a few seconds after his innards slid across your windshield, bounced along your fuselage and were sucked into your thrusters. It appears he wanted to save his life by telling you the whereabouts of some place you could load your cargohold with riches, but before he could get very far with his offer, his journey ended. All you have is some hysteric babble about a hidden mining station at a certain location."
loot:
  - item: Pithum A-Type Cruiser module
    from: Guristas Research Outpost
    note: est. 10-500M ISK (wiki)
  - item: Dread Guristas Cruiser modules
    from: Dread Guristas commander battlecruisers
    note: May also drop from the Research Outpost
  - item: Gila BPC
    from: Guristas Research Outpost
    note: Rare drop
lootNotes:
  - text: Typical loot from Dread Guristas commander battlecruisers includes faction ammo and Dread Gurista tags. The Guristas Research Outpost can drop Pithum A-Type cruiser modules and a rare Gila BPC.
