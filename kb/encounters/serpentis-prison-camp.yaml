    notes:
      - text: "Note: The Serpentis Prisoner Isolation Facility (the structure that contains your loot) has a very strong web and will immediately target you upon warp in. Be prepared to not be able to speed tank or move closer to the structure. Also of note is that it shoots XL Inferno torpedoes that do approx 2000 thermal damage, though their explosion radius is appropriate to the signature radius of capital ships so they apply little damage to battleships or smaller ships. The outpost also repairs itself to the tune of about 1000 DPS and has lots of structure hit points."
      - text: "Incoming damage can be very high by reason of the Stasis Towers and the structure's web. Suggest refitting for maximum tank. Kill the webbing towers first, then the Elite Frigates, then move on to the rest. Profile is shown here: Database Entry"
      - text: There is a glitch on this structure whereby the structure will stop repairing armor if it switches aggro. The structure's armor repair can be turned off by forcing it to switch its primary target (the target it fires torpedoes at and webs). A drone ship does this by having its drones out and attacking the structure, then flying over 120km away from it. Players in ships without drones will have to have ensure another pilot is in space within application range of the structure.
