notes:
  - text: "Voluval: The Minmatar coming-of-age ceremony, known as the Voluval, involves an injection of a hallucinatory chemical which puts the youth in a trance. As the visions wear off, the individual finds him or herself marked with a tattoo of an unpredictable pattern on an unpredictable portion of body. The chemical used to induce trance and create the mark is so well guarded, even some Minmatar wonder if there is not more to the process than their elders admit."
  - text: "Space type: Gated Deadspace (That allows MWD to work as of 05/March/2010)"
