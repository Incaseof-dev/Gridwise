      - text: Killing the Amarr Energy neutralizer battery results in 2.4% standing lose.
      - text: Killing the Amarr control tower results in 2.4% standing loss and it is NOT required.
      - text: Two Gates, If you want to finish fast go mining then production/living,
      - text: if you want to kill all go worship then mining.
