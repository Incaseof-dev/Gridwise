notes:
  - text: "Escalation message:: Your instruments suddenly flash a string of emergency messages. A transport ship connected to this station is reporting a malfunction and provides its location."
  - text: Usually the first three locations are in high sec and the final one in low sec but there are exceptions.
lootNotes:
  - text: Typical commander loot includes Domination copper and silver dog tags and some faction ammo, as well as possible Domination faction modules or a Mid-Grade Halo implant. The Secret Angel Facility in final location can drop Gistii A-Type modules or a rare Dramiel BPC.
