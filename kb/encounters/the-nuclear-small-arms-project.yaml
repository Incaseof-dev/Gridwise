    notes:
      - text: "Warning: Incoming DPS can be very high due to close proximity of spawns."
      - text: The facility webs have 20 km range and -75% speed reduction. Attacking the station will trigger reinforcement wave.
      - text: The valuable drops are in the Secret Angel Facility. These include Gistii A-Type modules and Dramiel BPC.
      - text: It is possible to blitz this section by dropping a bookmark at the warp-in, warping off, warping at range to the bookmark and sniping the Secret Angel Facility to greatly reduce incoming damage.
      - text: "Escalation completion message:: It looks like you have managed to destroy a facility developing one of the hottest new commodities in the galactic underworld, the Nuclear Small Arms. As far as you know, none of these new weapons have hit the market yet, but from the look of this place, it is not long until common criminals will go nuclear. You can't help wondering what is wrong with the good old sawed off shotgun."
      - text: This expedition end message will also appear in local.
