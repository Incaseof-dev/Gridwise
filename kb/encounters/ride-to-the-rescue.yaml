  - text: "Gang War: The Angel Cartel and Guristas have a lot in common on the surface. Both seem to be the classical thugs, engaging in all the brutish activities attributed to base criminals. But while the two do have some overlapping interests, their methods and core desires are different. The Angel Cartel is closer to a criminal mafia, dedicated to pushing drugs, running protection rackets, taking out assassination contracts, and involving themselves in all manner of nefarious research projects. The Guristas, however, are opportunistic pirates. They prowl the space lanes and hit any target that looks half-valuable or vulnerable. They loot and plunder what they can, ransom off the valuable survivors, and then hit the bars to celebrate. The Cartel sees the Guristas as chaotic malcontents, disrupting trade, causing economic difficulties, and generally making it more difficult for them to ply their illicit trades. The Guristas see the Cartel as dishonorable brutes, skulking in the darkness and using trickery and deception to dull the minds and sensibilities of their clients."
  - text: Accept the Mission remotely.
  - text: Gated deadspace pocket up to 2 jumps away.
  - text: "Blitz: take the Gate and kill Yukiro Demense."
  - text: Complete the Mission remotely.
  - text: "Tips: Yukiro Demense minimum resistance is 64% Kinetic Shields and Armour"
