restrictions:
  - text: "Ship size limit: Battlecruiser"
notes:
  - text: "Angel Vigil is a unrated combat site that can be found via exploration by scanning down signatures with scanner probes in high-security systems. Its gate allows Battlecruisers or smaller to enter, and a (well equipped) Battlecruiser or HAC is suggested to bring into the site. (Addition: after completing in a Hurricane Dooobles notes that resists over 60% exp/kinetic, robust T2 tank with substantial buffer, exp/kinetic dmg dealing, web, and tracking gear are ESSENTIAL; the incoming damage is very high and the mobs kite.) The largest ship allowed to enter is a Command Ship (T2 Battlecruiser)."
  - text: Before shooting any tower, focus on lowering the number of enemies in the pocket. The incoming damage is quite substantial so something with a decent tank, or warp-outs are necessary. You will be webbed down to ~10% velocity or less (14.0 m/s in a BC), so speed tanking isn't possible. After the area is cleared of most of the enemies, shoot one of the stasis towers. This pocket can easily become tank-melting if you target the turrets before clearing the initial ships. After all the turrets are gone and everything's dead, shoot 'Pat's Shipyard' for the final spawn and kill him off. There are multiple cargo containers in the pocket (containing a small amount of ammo, one had faction ammo). A large number of Veldspar asteroids are in this pocket.
  - text: Pat Wead dropped a Low-Grade Halo Beta when I ran this. (*Pat Wead drop for Dooobles Sept 22, 2010 - Domination 220mm autocannon, Domination Copper tag, 1000 Angel faction ammo)
  - text: -Update 15 Feb 23 - Pat Wead dropped Mid-grade Halo Omega (valued at 329M isk, 220M isk Jita).
  - text: Blitzing this pocket is possible but fairly impractical. Shoot Pat's Shipyard and kill Pat. You will probably want to kill all initial ships as you will be moving at the snail's pace of 14 m/s and the damage will be significant. Then kill stasis towers and Wave B. Ignoring missile turrets and Wave A will still allow you to complete the site and qualify for a potential escalation.
  - text: As stated above you only need to shoot the smugglers gate in the first pocket once to spawn gate keeper (smuggler commander) and the gate is open once he is destroyed. Do it quickly as his DPS is quite high.
  - text: In second room I suggest heading towards Pat's shipyard (obviously slowly due to webs) and take out the dessies and cruisers first (remove the dps). Once they are gone, shoot the shipyard to spawn Pat's wave as the bc's and Pat's wave don't have enough DPS to break a decent tank. Destroy the weed frigates and bc's while you wait for Pat to get closer. Once Pat is close, take him out and scoop wreck, and hopefully receive escalation. While slow boating to wreck (which is usually only 5000m away if done correctly) shoot other ships at your discretion - but never the towers. I find this easy to do in a Loki with a DC2, Anti-Explosive Shield Hardener 2, shield boost amp 2 and med shield booster running. Even though it seems a slow way to do the mission, it is still faster than shooting everything.
  - text: "Escalation: This site can escalate to The Big Blue (expedition)."
  - text: "Escalation: Expeditions: The Big Blue (expedition): Scanning through Pat Wead´s logs reveals that this druglord was surprisingly well connected, long lists of buyers and sellers throughout the neighboring regions would make this document a dream read of any law enforcement agent in the galaxy, if only all the vital parts were not in some completely alien code. No matter how much you let your central computer chew on this stuff, you get no feedback on any names or places, except perhaps one... this seems to be a hasty entry from almost a year back, not in code. At least the coordinates do reflect a true point in space."
lootNotes:
  - text: For the initial exploration site (two pockets)
  - text: 5M isk in bounties + loot, salvage, possible implant.
  - text: Asteroids for mining listed in each pocket.
  - text: Commander can drop Domination faction modules or implants.
