    onWarpIn: This area has been reported to be heavily defended by a large force of rogue drones. Although many of the automated machines are light and do not carry much heavy weaponry, DED advises pilots to be on high alert. It appears to be a pre-departure rendezvous point for excursion swarms and raiding forces. The acceleration gate is actively scrambled by the resident forces, denying anyone entrance while there's at least a single drone left with an open scrambling frequency.
