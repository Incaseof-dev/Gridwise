    onWarpIn: "This section used to be a small navy base specializing in plasma weapon research. The station's torn superstructure still floats around the swarming new inhabitants, emitting hazardous plasma leaks. The pocket's acceleration gate is frequently scrambled by the local drone force. Appendix: Old reports from the time the complex is thought to have been overtaken by the rogue drone strain say that at the time an infamous band of pirates were seen docking at the station, loading a secret cargo into their industrial ships. Some have speculated that the pirates summoned the drones here, intending to wipe out the complex after they had stolen all of its valuable equipment. Whether that's truly the case remains uncertain, but what is certain is that a few derelict industrial ships remain within the pocket, cluttered with the frozen bodies of known criminals."
