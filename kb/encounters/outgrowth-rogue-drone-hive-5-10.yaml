    onWarpIn: This pocket appears to serve as the main defense gauntlet into the complex. The primary acceleration gate is locked by an encrypted passcode, normally stored by one of the resident master drones. Another gate lies at the pocket's border, this one with a serious plasma leak that renders it all but useless for anyone not knowledgeable in the field of plasma physics. It has been speculated that this other gate may provide a shortcut to another pocket deep inside the sprawling complex.
