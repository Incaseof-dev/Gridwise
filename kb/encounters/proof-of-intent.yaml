notes:
  - text: "Hyasyoda Corporation Announces Aid for Ishukone, Scope Article, May 17th: Hyasyoda Corporation CEO Ahtonen Osmon has announced a crash program of aid to assist the overstretched Ishukone Corporation, following the disaster in Malkalen. Hyasyoda, a long-time partner of Ishukone in the so-called 'Liberal Faction', will provide emergency enabling loans to Ishukone Corporation and direct relief aid to Malkalen system. \"The Hyasyoda Corporation will not stand by and see a great megacorporation of the Caldari State fall to an act of treachery and unprovoked aggression. We are therefore making funds available at preferential rates so that the Ishukone executives who survive can continue to run their organisation and oversee the relief efforts. We are also sending relief ships to the Malkalen system to directly assist the efforts at the Ishukone Headquarters,\" said Ahtonen Osmon."
  - text: Listen to what Arikio Kuretsu has to say.
