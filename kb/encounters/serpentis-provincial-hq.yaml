notes:
  - text: The Serpentis Provincial HQ is a Cosmic Signature of the Unrated Complex type, occupied by the Serpentis pirate faction. It can be found via exploration by probing in Null-sec systems.
  - text: The site consists of a volume of space with an acceleration gate and contains various structures and their defending pirates. Using the gate allows access to other areas within the site. When attacked, the defenders may send multiple waves of reinforcements. Each group's appearance is triggered by the destruction of members of the previous group. The names and amount of ships listed may vary slightly, but will always be of Battleship class or smaller.
  - text: This site's acceleration gate allows only Battleship class ships or lower and their Tech 2 equivalents to enter the site.
  - text: "Warning: Initial damage upon entry to both rooms is high, so a high combination of speed tanking, and either armor or shield tanking is recommended."
lootNotes:
  - text: ~ 23 million in loot and salvage without shadow drop. About 58 million in bounty
  - text: =Escalation=
  - text: "After killing Shadow Serpentis BS or Sarpati Luxury Lodge you might get the escalation Serpentis Secrets:"
pockets:
  - name: First Room
    notes:
      - text: The Acceleration Gate "Gate to the Sarpati Luxury Lodge" remains locked after destroying the initial spawn. It may be unlocked if you have a Shadow Serpentis Crystal Tag in your cargo hold when you attempt to operate the gate, or alternatively it you may destroy the Core Defense Officer's Quarters to permanently unlock it. Be warned, doing so will cause heavy reinforcements to arrive. If you pre-align with the acceleration gate before destroying the Officer's Quarters, you can instantly activate the gate as soon as the Officer's Quarters are destroyed, avoiding the reinforcements.
      - text: Notable structures
