pockets:
  - name: Part 1 of 3
    notes:
      - text: "The Guristas: The worst enemy is the one who was once an ally. This is a lesson not lost on the Caldari Navy, for it was from within their own ranks that the seeds of the Guristas pirates were born. The Guristas were founded by two ex-Caldari Navy members now known only as \"Fatal\" and \"The Rabbit.\" Utilizing their knowledge of the Navy's procedures — and thus its weaknesses — these two renegades have confounded their previous employers for many years with their persistence and ingenuity. The Guristas cannot totally disown their militaristic origins: among pirates, they remain arguably the most honorable among a dishonorable bunch. Yet spacefarers shouldn't take too much comfort from that fact, or from their amusing bunny-skull logo. The Guristas will still slit your throat if there's profit involved. Honor, as many have learned, goes only so far when ISK is concerned."
      - text: "Blitz: destroy the Static Caracal Navy Issue, warp out."
