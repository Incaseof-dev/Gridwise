  - name: Part 3 of 3
    notes:
      - text: "The Murky World of Covert Ops: Few have the skills to enter the world of Covert Ops, and fewer still survive long once they enter it. And of those who do survive, rare are those who can claim to be totally sane afterwards. One of the first lessons in Covert Ops is \"plausible deniability\"; this, along with the selective use of misinformation, allows a government and or a military entity to distance itself from its spies and operatives should their activities become known. Paradoxically, though, while every government and military organization requires Covert Ops to survive, it can be extremely harmful to admit such groups' existence, at least without a feasible back-up story — a story usually provided by the covert agents themselves. At times, the distance between a Covert Ops agency and its parent organization can become so byzantine that funding can present a dangerous optic. When that occurs, operatives may have to raise funds themselves, in ways only they can..."
