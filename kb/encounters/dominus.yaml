notes:
  - text: "The Dominations: The Dominations represent the command division of the Angel Cartel. The Dominations are elusive and mysterious, preferring to shroud their agendas in secrecy and obfuscation. Many of their membership seldom venture far from their bases in the Curse region, but CONCORD agents have reported sightings of highly-placed Cartel leaders as far north as Lonetrek. Little is known about the identities of the Angel Cartel leadership, though it is understood that – as with the rest of the organization – they come from all the races and backgrounds."
