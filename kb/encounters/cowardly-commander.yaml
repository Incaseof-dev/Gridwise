notes:
  - text: "Blitz: Take the acceleration gates to the last room. Kill elite frigates if they point you. In last room triger the wave 2 and destroy it."
  - text: thumb
  - text: The mission is completed when last ship in third room wave 2 dies. This mission can be completed remotely and the next mission can be accepted remotely.
  - text: "Tips: The pockets are not deadspace. You can bm them and warp back if you take too much damage."
  - text: "Tips: The acceleration gates are NOT locked."
  - text: "Tips: Be prepared for very heavy dps and large amounts of EWAR"
  - text: "Tips: Make sure to prioritize targets (destroy EWAR ships first)"
  - text: "Tips: Energy neutralizer towers are always primary targets"
  - text: "Tips: To avoid getting neuted and scramed while traveling to the next gate, you can create pingspots while warping in into every room. Warp back to your ping, then warp to the next gate at 0 km."
  - text: "Tips: The Sansha Commander will be present in each room as you warp-in and will warp away without engaging."
