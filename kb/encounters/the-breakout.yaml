notes:
  - text: Requires probing and data analyzer and 1x FedNav F.O.F. Identifier Tag AC-106V:FNSBR (Gained from Agent). Mission item can be bought instead.
  - text: "Two Bloodlines, one Race: the Raata spirit in the Deteis and Civire soul: “Look at each other,” Cold Wind told them. “How do you tell one man from the other? How do you know which man to kill?” The men struggled to stand up and looked at their armors; the symbols of their Houses were torn and broken, not visible anymore. “No two men on this field have the same face, but can you tell them apart now?” The men gazed at each other trying to distinguish brothers from enemies, yet the blood covering their faces made all of them alike."
  - text: "Blitz: Buy the 1x Caldari Prisoners Of War (0.5m3) on Contracts or market and complete the mission. No need to search/probe, hack, or fight anything."
  - text: The next mission will be low sec hauling mission so you should turn this mission in in an instawarp frigate.
  - text: The mission site consists of two deadspace pockets.
pockets:
