      - text: "No NPC's most of the time but sometimes it ends up with:"
      - text: In the case of these spawns, a cloaky frigate or interceptor is best used to just fly past them to the gate. The 1x FedNav F.O.F. Identifier Tag AC-106V:FNSBR will not prevent them from attacking.
