  - name: Second pocket
    notes:
      - text: The Gallente Warden Frigates may not attack if the 1x FedNav F.O.F. Identifier Tag AC-106V:FNSBR (Gained from Agent) is in your cargohold (There is a bug where they may still shoot you but they hit for 1 damage). After successfully hacking a Detention Facility to save a prisoner, a 60-second self-destruct timer will start. If you are fast you can hack one or two more containers before the Detention Facilities self-destruct, but only 1x Caldari Prisoners Of War is needed to complete the mission.
      - text: The Detention Facility structures appear as a white container to hack, and are Easy difficulty (70 HP green System Core). If no Detention Facility structures are present and/or you see 8x blue containers, then that site has been completed by another player. Instead of waiting for respawn, just look for the site in another system.
