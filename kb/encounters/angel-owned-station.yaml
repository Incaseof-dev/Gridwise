      - text: "Escalation dead-end: Either the Overseer was trying to trick you and this was the best he could come up with, or you killed him before he could reveal the juicy parts of his offer. Whatever the reason, the takings from this limited expedition are yours for the taking."
      - text: "Escalation trigger: Among the wreckage and debris you find a few combat drones. A scan of their control units reveals they have been used not long ago, and at a location nearby."
