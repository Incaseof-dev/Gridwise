notes:
  - text: Angel Owned Station is a low/null-sec expedition that can be found by completing Minor Angel Annex unrated complexes, triggered by destroying the commander battlecruiser.
  - text: This site's difficulty is on par with a DED 6/10, and multiple battlecruisers with logi support are recommended to complete it.
  - text: Upon initial warp in you land 10 - 15 KM from the rats.
lootNotes:
  - text: Completing all four parts of the escalation may yield Gistum A-type modules and/or a Cynabal BPC.
