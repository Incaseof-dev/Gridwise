notes:
  - text: The site consists of single ungated area. Warping to beacon for close range would require a very good tank to handle the swarm’s incoming damage. Using a propulsion module or a Micro Jump Drive is recommended. With the initial group and 3 triggered spawns, the site totals of 27 ships.
  - text: text-top|300px|thumb|The site is an open Deadspace pocket, one may warp to preferred distance.
  - text: "Escalation: The anomaly can escalate to Blood Raider Prison Camp."
lootNotes:
  - text: The site rewards 9 million in bounties and the possible commander can drop faction modules, implants or blueprints.
