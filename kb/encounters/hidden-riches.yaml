    onWarpIn: You pick up a signal containing co-ordinates to a mysterious location. Surely, True Creations are up to something.
  - name: First Pocket
    notes:
      - text: You land among some rocks and a ghost ship. There are no enemies present.
      - text: "Escalation end: All you find are a few bits and pieces of ancient machinery and a couple of hollow structures. Marks on the floating objects and some of the debris floating around, hints to this place having recently been excavated. You have however no means of finding out by whom or where they might be by now."
      - text: 'Escalation continuing: All you find are a few bits and pieces of ancient machinery and a couple of hollow structures. However, your instruments identify this place as one of two locations specially registered as "digs" in a database picked up from one of the ship wrecks. You set destination for the other location.'
  - name: Second Location(lowsec)
    notes:
      - text: Again you land at an acceleration gate at 0 on rats.
      - text: "Escalation message: Despite the Sansha's heroic effort to throw you off track, your instruments manage to gather enough information before the main force escapes too far away. They left before you got there, but you still know where they're heading."
