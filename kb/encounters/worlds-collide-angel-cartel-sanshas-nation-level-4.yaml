  - name: Pocket 3 (Research Outpost)
    notes:
      - text: You will warp-in randomly around 5km from the Heron. In addition to the immediate aggro from Group 1, there is a small chance that one or more other groups will aggro due to proximity triggers.
      - text: If this happens, start moving away from the remaining neutral groups and check if the webbing/scrambling Elite Frigates have you locked. Kill them first if they have you locked.
      - text: If you are fleeted with friends, have them focus fire on Group 1 or any groups that have been aggroed by mistake.
      - text: The FIRST ship needs to act as an Fleet Commander and assign the appropriate targets. A common mistake is to have everyone shoot random or their closest target, which leads to the whole pocket being aggroed.
      - text: "Sometimes fleet members that enter later will land differently and aggro groups that were unaggroed. If this includes the elite frigates and they scramble the new arrival, it can mean a quick death. All fleet members should have at least enough tank to survive until the scramblers are cleared. Having the lead ship tank the entire pocket is extremely difficult, as it can put down 1300-1500 DPS, in a wide variety of configurations. Here are some (extreme) examples:"
      - text: 50% Exp, 31% Therm, 16% Kin, 2% EM
      - text: 63% Exp, 15% EM, 15% Kin, 6% Therm
      - text: 58% Exp, 23% Kin, 12% EM, 7% Therm
      - text: "Tip: Warping-in from either Angel or Sansha Base does not change the ship combination for this pocket. It will always be Angel ships."
