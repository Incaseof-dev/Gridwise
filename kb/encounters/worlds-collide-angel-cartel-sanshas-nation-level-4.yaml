  - name: Pocket 2 (Angel Base)
    notes:
      - text: On warp-in, Group 1 will auto aggro. The Angel Spy frigates do not scramble but they do web. DO watch for Thugs and Outlaws scrams. All ships in this pocket have to be destroyed to unlock the gate.
      - text: "Tip: Once Group 1 has been eliminated, it is fairly safe to deploy your drones for the remaining groups. Keep a close watch on your drones’ target to ensure that they do not stray and mistakenly attack a neutral group."
      - text: "Tip: Recommended order for elimination: Group 1, Group 2, Group 3 and finally Group 4."
      - text: "Tip: An Angel Overseer battleship will have a random chance to spawn in this pocket. The chance to spawn seems to be based on triggering the Angel Base warp gate in Pocket 1 and then completing the warp into this pocket."
      - text: "Warning: DO NOT deploy your drones to attack Group 1. (I'm going to say this is optional. I didn't move and I had my drones attack group 1 with no problem. However, everyone in the room did target my drones and not me. T1 hobgoblin)"
      - text: "Warning: Any attack on the Angel Spy frigates by fleet members will aggro the entire pocket. It is safe however, for them to kill the sentry guns in Group 1."
      - text: "Warning: The FIRST ship that had warped into the pocket may kill the Angel Spy frigates without repercussions, as long as you stick to turret weapons/missiles."
      - text: "Warning: NO aggro from the other groups until you attack them. Each group can be aggroed independently."
      - text: thumb|upright= 2
