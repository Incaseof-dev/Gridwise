objectives:
  - text: Rescue the stranded crew members from the damaged ship in the third room of this deadspace complex.
ewar:
  - kind: targetPaint
  - kind: web
notes:
  - text: "Web/warp disruption: All Elite Frigate types. Spy frigates only webs."
  - text: "Suggested ships: Sleipnir, Raven, CNR, Drake"
  - text: "Note: Heavy drone aggro in Angel & Sansha Pocket 2. Setting drones to passive in order to avoid accidental aggro is recommended."
  - text: This is not a drone friendly mission. However, one thing I notice since the AI update is a "glitch". If you do not shoot anyone, and you release more than one drone shooting at one target. Once they start shooting at one of your drones you can scoop that drone back into the bay. The foes should not shoot at your other drones. This "glitch" maybe fixed down the road.
  - text: This is a time consuming mission if you do both the Angel & Sansha sides.
  - text: "Blitz: Pocket 1: Unlock the Angel Base gate either using a Zbikoki's Hacker Card (or killing the Gist War General). The card will be consumed upon activation."
  - text: "Blitz: Pocket 2: (Angel Base): All ships in Pocket 2 have to be destroyed to unlock the gate."
  - text: "Blitz: Pocket 3: (Research Outpost): Destroy Group 1, grab the hostages from the heron, fly back to your agent. No need to destroy entire groups. - confirmed in July 16, 2014."
  - text: "Blitz: The Zbikoki's Hacker Card can be found in Zor's wreck in The Right Hand of Zazzmatazz or The Damsel In Distress Level 4 mission."
