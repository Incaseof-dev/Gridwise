notes:
  - text: Angel's Red Light District is a DED Complex (rated 5/10), occupied by the Angel Cartel pirate faction. It can be found via exploration by probing in Highsec and Lowsec systems, or as an escalation from Angel Refuge or Angel Den.
  - text: The site consists of a volume of space with an acceleration gate and contains various structures and their defending pirates. Using the gate allows access to other areas within the site.
  - text: This site's acceleration gate allows all subcapitals to enter.
  - text: "The location of this complex can be received as an escalation from Cosmic Anomalies, in particular the Angel Refuge and Angel Den. Upon such a discovery, the following message appears:"
  - text: ": Your scanner has picked up a transmission originating from a nearby system. It would be wise to investigate this mysterious signal further."
