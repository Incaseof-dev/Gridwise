lootNotes:
  - text: Each part has a commander rat which, when killed, will drop T2 salvage and Rogue Drone components. Lootable cans may contain drone alloys.
pockets:
  - name: Part 1
    notes:
      - text: ----
      - text: The initial defenders can vary wildly.
      - text: The initial defenders consists of around 6 frigates and one sentient drone.
      - text: "Note: Trash Construction is not vulnerable (despite warp-in message) - just approach it to trigger reinforcement wave. (On 26-Nov-YC124 destroying elite frigates didn't trigger reinforcement wave.)"
      - text: Reinforcement wave triggers when the elite frigates are destroyed. It is possible to have this wave included in initial defenders, possibly due to warping through the trash construct.
      - text: Two additional spawns triggered by killing ships from initial spawn
      - text: "Dead end message: All the drones have been obliterated, no clues are offered on where more can be found and your expedition seems to have come to a dead end."
      - text: "Escalation message: Most of the drones have been obliterated, but a few made it away. Luckily the average drone operates in part like a jukebox trying to play all its tracks repeatedly at the same time over the airwaves, relying on the other drones to filter out the information they need and disregard the rest. Therefore they are usually easy to find while within reasonable range and this time is no different. Your instruments concentrate on messages from one of the escaped drones and after having filtered through several thousand repetitions of electrical manuals for every hydraulic system built the last three hundred years this side of the Myridian Strip, the entire known literature on the theory of relativity recited three times and for some obscure reason a text on the effect of oriental gardening on the human condition played simultaneously on four parallel channels, they finally come across a new location:"
