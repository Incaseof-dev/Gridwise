      - text: There is at least one reinforcement wave. The escalation can be triggered by killing either the Sentient drone, or all enemies except the Sentient drone.
      - text: "Escalation message: The current strategy chosen by the drones seems to be running away as fast as they can. Your instruments have no problems tracking their destination"
      - text: "Escalation fail: The current strategy chosen by the drones seems to be running away as fast as they can in every conceivable direction. For a while you are getting transmissions from all over the place and your tracking devices try desperately to make sense of all this information, but all of a sudden all waves are quiet and you realize that the drones deception has succeeded, you have no clue where to go to hunt them."
