      - text: 5 small rogue drones waiting on warpin, and 5 "Drone Hold" cans. Completion popup happened after blowing up the first wave and starting to open cans. Strain Splinter drones can warp scram and web. Two reinforcement waves later appeared, one with a Rogue Mining Overseer dropping T2 salvage. One of the Drone Hold cans contained some drone goo (Dark Compound, Condensed Compound). All drone hold cans can be empty.
      - text: "Completion: As expected, the drones were busy turning this old station into a hive, which if they had succeeded would no doubt be spewing out innumerable copies of their kind to haunt this part of the constellation for years to come. You wonder if sentient machines can dream...if so, then this one is at least permanently broken."
