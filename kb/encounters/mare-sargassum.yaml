notes:
  - text: Mare Sargassum is an expedition found by completing Desolate Site combat sites. It may contain up to four parts. The first three will be in high-sec space, while the fourth can be in low-sec or high-sec.
  - text: The sites do not have gates, and can be easily completed in a cruiser.
  - text: "Incoming transmission: At first it seems strange the drones have picked this barren and resource deficient place to build a new hive. But then again, while you were blowing up the place, you noticed a few vessels that might have been used as transports, indicating the drones were pulling in the materials they needed from someplace else. As to compliment you on your reasoning, your communication systems start indicating several different incoming transmissions in drone beeps and clicks and after a while you manage to coerce your instruments into pointing out an approximate spatial origin of the message."
