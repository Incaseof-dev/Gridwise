  - name: Bonus Pocket
    notes:
      - text: It is not necessary to clear the bonus pocket to complete the mission.
      - text: To activate the acceleration gate, the player ship must have an Angel Palladium Tag in its cargo hold. The tag is not consumed.
      - text: "Upon landing in the pocket: I only asked you to find 5 Cartel rendezvous points!! This is not part of the mission I gave you, you are traveling to an unknown location deep into enemy territory. Be careful."
      - text: The Angel Battlestation has 700K HP and generally doesn't drop any good loot, you want to ignore this. Terzam's Stash may contain Domination faction modules, though.
