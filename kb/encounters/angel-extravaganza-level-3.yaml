notes:
  - text: "Web/warp disruption: Angel Viper/Webifier"
  - text: Except where noted otherwise, all hostile NPCs will auto-aggro on spawn or warp-in. Drones will receive aggro from newly-spawned waves. The ship that triggers the next wave on destruction is usually the ship with the highest bounty.
  - text: All Sentries can be ignored and gates will still unlock.
  - text: The majority of the explosive damage noted in the mission details is found in the bonus pocket.
  - text: "Pocket 1: Destroy Angel Cartel Structure and Small Refinery so that Wave 1 and Wave 2 won't spawn."
  - text: "Pocket 2: Destroy Shipyard so Wave 2 will not spawn."
  - text: "Pocket 3: Destroy Storage Silo so Wave 1 won't spawn."
  - text: "Pocket 4: Destroy Cruiser, no need to destroy Turrets."
  - text: "Pocket 5: Trigger all triggers leading to spawn of Terzam Tazzon, and destroy his/her ship and both drones."
lootNotes:
  - text: "Loot: ~10 Mil ISK with 2x Clutch Restrained Warp Disruption Field Generator (2025/06/23)"
  - text: "Salvage: ~1.6 Mil ISK (2025/06/23)"
