    notes:
      - text: "Dead end message: This place is long deserted and when your instruments scan the outposts docking station, it turns up logs that are a couple of years old. It seems the blood trail has grown cold."
      - text: "Escalation message: This place seems to be deserted and recently so, as all systems are up and running. Your scanners can even pick up signals from small houshold appliances, indicating that someone should actually be home. When your instruments scan the outposts docking station, it turns up logs only few minutes old showing four ships departing at the same time, these logs are incomplete though, only listing departure time and destination. For some reason all the ships are headed for the same spot ..."
