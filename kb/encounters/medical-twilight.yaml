notes:
  - text: 'Escalation: Expedition start: The slaves you liberated from this Blood facility report that this was a holding place where slaves were gathered, before being sent off to a blood replenishing "medical" station. You have heard about those places; where the Blood members go to get their blood exchanged with the blood of a slave who has been put on a special "blood cleansing" diet for a period of time. Needless to say, this leaves the poor slave empty of the vital fluid in question. Understandably your newfound slaves are quite thrilled with these recent turn of events. None of them knows where this so called "medical" station is, but a couple can tell you that they were in another holding station like this one, before they came here and coincidentally it is not all that far away ...'
  - text: "Escalation: The next wave will spawn upon attacking the Ritual Center."
  - text: "Escalation: Second wave: The inhabitants of the Ritual Center have sent out distress signals. and more ships quickly arrive!"
  - text: "Escalation: The final wave will spawn when the Ritual Center is at half shield."
  - text: "Escalation: Final wave: The Overseer of the Ritual Center has undocked. The Ritual Center has deployed sentry guns and more ships into the fray."
  - text: "Escalation: Do not underestimate the final wave. Being neuted, pointed and webbed can get you killed quickly! A suggested tactic is to fight at range and only go in to brawl when the elite frigates are off the field. To blitz this site, shoot the Ritual Center until all waves are spawned and then take out the elite frigates followed by the Dark Blood frigate. Be prepared to tank DPS under neut pressure."
  - text: "Escalation: Escalation message: Another Blood hideout and more slaves. You find no clues as to where the medical facility is, but piecing together information from the slaves, you are pretty sure some part of this Blood operations is located here ..."
  - text: "Escalation: The warp in is within neut range of the Elite Cruisers. The DPS combined with the heavy neuting and webs is a serious problem for active tanked ships. Dropping a bookmark and warping in at range to the bookmark is recommended. Warping inside the site itself is possible and there are plenty of small asteroids to warp between. You can draw the Blood Factory Overseer and the Elite Frigates away from the rest by kiting (the Overseer BS has a top speed of 700+ m/s). [Jan 2025 (0.5 System)]"
  - text: "Escalation: Expeditions: You are pretty sure that at some time in history, there would have been places in the galaxy where destroying an evil thing like this would have prompted some noble and decent ruler to award you with a medal or even a prize."
  - text: "Escalation: Another Blood hideout and more slaves. You find no clues as to where the medical facility is, nor can you find any information on other parts of this Blood operation. It looks like your expedition has come to an end."
lootNotes:
  - text: Completing all four escalations gives the possibility of a Cruor BPC or Corpii (Frigate) A-Type module drops in the final escalation site.
pockets:
