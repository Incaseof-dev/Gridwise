notes:
  - text: "Suggested ships: Long range battleship"
  - text: "Sweatshops: Technology levels vary throughout New Eden. Not every system, constellation, or even region is at the cutting edge of technology. Sometimes, factories rely on old-fashioned techniques and tried-and-true methods. Child labor is one of those methods. A child's tiny hands and little fingers are perfect tools for creating the high-end textiles of Gallente fashion, as well as reaching those hard-to-reach corners of ship armaments. Though not commonplace – or legal, for that matter – sweatshops like the Rattler Row can be found in the more backwards areas of New Eden."
  - text: Ungated semi-deadspace pocket zero jumps away in the same System.
  - text: "Tips: Initial defenders and Reinforcements 2 deal damage over 80 km and approach at 200 m/s"
  - text: "Tips: Reinforcements 1 and Reinforcements 3 deal damage over 20 km and approach at 1000 m/s"
  - text: "Tips: Carry On Token is used to Blitz the next Mission while Amphere 9 and Tattered Doll are lore items"
  - text: "Tips: 3% The Syndicate Faction Standing loss if you destroy the Fuel Depot"
  - text: "Tips: The center Fuel Depot has the Carry On Token"
