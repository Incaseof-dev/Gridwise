  - text: Ungated semi-deadspace pocket 11 jumps away in Jark. All warps will land you at the same point, but you can warp around freely.
  - text: "Blitz: loot the Encrypted Transmission from Tili's Brothel with a fast ship (or ping to it in your combat ship). Warp out and bring in a combat ship. Kill all Battleships."
  - text: "Tips: Mercenary ships spawn at 25 km range several seconds after Encrypted Transmission is removed from Tili's Brothel"
  - text: "Tips: Mercenary Cruisers deal EM/TH while the Battleships deal KIN/TH"
  - text: "Tips: Mercenary Wingmen rarely use Warp Disruptors, but always Web"
  - text: "Tips: You will be traveling another 11 jumps back to Aldrat to complete the mission, but the remaining missions there can be blitzed in a frigate (with a Data Analyzer), so you might want to leave your combat ship near Jark, since you'll be coming back through there next."
