  - name: 5th pocket
    notes:
      - text: "Warning: The Fleet Stronghold fires Kinetic Citadel Torpedoes that can instantly destroy any craft not suitably equipped for it! https://zkillboard.com/ship/25528/. Each individual hit does upwards of 500k Kinetic damage, and while they have virtually zero application to subcapitals, they will still wreck your tank if you aren't moving constantly. The station itself doesn't have significant tank, with only 120k total HP and 288 DPS shield rep."
      - text: This room contains a mixture of frigates, cruisers, and battleships along with cruise missile batteries and the fleet outpost (firing Citadel Kinetic Torpedoes). Upon attacking the outpost 4 battleships spawn. The outpost will release more waves of defenders as it takes damage. Upon the outpost's destruction a jetcan will appear with a 23rd Tier Overseer's Personal Effects and possibly additional loot including Pith-X Type modules or a Rattlesnake BPC.
      - text: There are 4 additional spawns that occur at damage intervals on the station. A spawn will occur at half-shield, half-armor. two-thirds structure and one third structure. Once you have reduced the station to one third structure you may as well finish it off before dealing with the spawn. Database Entry for structure stats.
