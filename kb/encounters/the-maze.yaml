    onWarpIn: '"The Maze" is the name of this mysterious Gurista military complex. Most of those who have dared venture inside have not lived to tell about it, and those who are still alive are now labour workers for the Gurista. Although never confirmed, the deepest pockets of this complex are rumored to be the home of Fatal himself.'
  - name: 2nd pocket
    notes:
      - text: After successfully navigating the correct acceleration gate you arrive in the second room of The Maze. Once again you will be confronted by a group defending the area.
      - text: Once again you are faced with a choice of twelve acceleration gates, of which only one will lead further inside the complex. Take the fifth gate from the top
