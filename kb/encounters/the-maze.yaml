restrictions:
  - text: "Ship size limit: T2 Battleship"
notes:
  - text: The Maze is a null security DED rated site found through exploration. It can also be received as an escalation from the Guristas Haven and Guristas Sanctum.
  - text: The maze contains a large number of acceleration gates. In each room one gate takes you deeper into the complex while the rest of them lead back to the first pocket.
loot:
  - item: 23rd Tier Overseer's Effects
    from: Fleet Stronghold
    note: est. 133,837,000 ISK (wiki) · 100% drop rate
  - item: Pith X-Type module
    from: Fleet Stronghold
  - item: Rattlesnake BPC
    from: Fleet Stronghold
    note: Very rare
pockets:
  - name: 1st pocket
    notes:
      - text: The gate is unlocked and the rats do not need to be killed. But you will most likely have to fly through this pocket many times so thinning out the rats is recommended.
      - text: In the room there are twelve acceleration gates. One of them leads deeper into the complex while the rest loop back. Take the bottom gate.
      - text: Experienced explorers will quickly establish a simple method to always choose the correct acceleration gate. Before taking any gate, drop a canister in front of it. If the gate returns you to the entrance, proceed to the next gate you wish to try and drop a canister in front of that one. Label each can and proceed to continue with this process until you find the right gate - make a note of which can is in front of the proper gate and either ignore or destroy all of the others.
      - text: Each acceleration gate will first send you to an empty room and then back to the beginning of the complex. When you activate the second acceleration gate, you will instantly be able to tell whether or not you are being returned to the beginning - if you are, the intro window bearing the complex's description will pop up once again.
