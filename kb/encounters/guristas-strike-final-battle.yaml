objectives:
  - text: Find the Central Control Hub of this Serpentis outpost, in the final room of the complex. Destroy it before the Serpentis fleet guarding it manages to destroy you. Once you fire at the Central Control Hub, the fleet guarding it WILL attack. You have been warned.
notes:
  - text: "Suggested ships: Drake, faction or T2 HAC"
  - text: Guristas Strike - (The) Final Battle is the 10th and final mission of the mission chain Guristas Strike. This is a "normal" storyline mission unlike the other missions in this chain e.g. it gives faction standing and the usual derived standing for friendly and hostile factions.
  - text: "Space Type: Deadspace with gates. No hostiles at initial gate."
