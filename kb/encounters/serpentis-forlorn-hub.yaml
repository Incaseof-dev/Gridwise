notes:
  - text: Serpentis Forlorn Hub is an unrated combat site belonging to the Serpentis pirate faction. It can be found via exploration as a cosmic anomaly. As an ungated complex, the limitations as to which ships can complete this site are tied to the security rating of the system where the anomaly spawns (up to Titans in low-security and null-security systems). Completing this complex may award the player with valuable True Serpentis faction modules and ammunition. This combat site consists of a single ungated pocket of space containing a variety of Frigate to Battleship-sized enemy ships.
  - text: This site can be done in any drone boat, such as the Vexor, Vexor Navy Issue or the Gila.
  - text: "A quick guide: When you enter the site, turn on your modules and drop drones. Then you want to move a bit away from the warp-in, drop down your Mobile Tractor Unit, start orbiting it while you attack the rats."
  - text: You want to kill frigates first, then cruisers, battlecruiser then battleships, BUT keep an eye on what rat triggers the next wave, and leave 1 of those for last.
  - text: "Escalation: Can escalate to the Shadow Serpentis Fleet Staging Point."
lootNotes:
  - text: Around 22.500.000 ISK can be collected as bounty for the pirates, with more if the Shadow Serpentis spawn.
