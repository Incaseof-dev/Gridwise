restrictions:
  - text: "Ship size limit: Battlecruisers/T3"
notes:
  - text: No NPCs at initial warp in.
  - text: Initial gate will allow Tech 2 and 3 cruisers to pass.
  - text: While mining after the site is complete, an additional frigate may occasionally spawn.
  - text: "Escalation: This site has a chance to escalate to Angel Kickbacks."
  - text: "Escalation: Expeditions: Angel Kickbacks: As soon as you arrive, your instruments detect a large group of ships departing. Further analysis of the data indicates this was a convoy of six to eight transport ships from the Salvation Angels accompanied by an unknown number of combat vessels. Your navigational systems have already come up with a likely destination in case you feel you have any business with them."
  - text: "Escalation: Escalation Failure: The trail seems to have run cold at this point."
pockets:
