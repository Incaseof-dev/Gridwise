notes:
  - text: "A place to rest: It is not unheard of for Blood Raider vessels to stray into State space. Having something of a relationship with the Guristas in the north, the Covenant has erected various safe havens for members who make the long journey up to Venal through Caldari space."
  - text: Ungated normal space.
  - text: "Blitz: Put the NOH Signal Operator into the container and return to the agent. For fast delivery you can create a bounce BM as you land, warp to the bounce BM and then warp to an asteroid near the container."
  - text: "Tip: Warp to 100km and lead the initial group out to 150 to 175km range. Keep at least 30km range from the 7 Corpus battleships (Neut). Destroy the 2 Dark Corpus Harbinger Battleships last to trigger spawn."
