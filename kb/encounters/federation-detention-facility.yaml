notes:
  - text: Federation Detention Facility is an unrated combat site belonging to the Gallente Federation faction. It can be found via exploration by scanning signatures in high security systems in Black Rise within the Aokinen constellation. The site is level II scanning difficulty.
  - text: This site appears to be the target for the Caldari epic arc mission The Breakout, and will only spawn when the respective mission has been accepted. One site will spawn in every system in the constellation and will respawn after completion.
