    onWarpIn: This facility was once the home to a fledgling Caldari mining company that arrived to Black Rise with the hope of striking it rich on all of the untapped resources littering the newly-discovered systems. As with many others who cut corners on security, the company learned the hard way that Black Rise was not as safe an investment as other more established areas of State space. Soon enough their shareholders came to the same conclusion and a buyer for the company was sought. Noticing both the hard times the company had fallen upon, and the uniquely advantageous location of its headquarters, Federation Navy strategists began to formulate a plan reminiscent of the Serpent's Coil takeover. Elite raiding parties, spearheaded by some of the Federation's most capable Black Ops wings, moved in large amounts of personnel and supplies, quickly commandeering the area and fortifying it against attacks. This facility, and many others like it, would serve as a deep foothold within Caldari space, where they could offer logistics to friendly pilots, and project forces even deeper into the heart of the State.
  - name: First Pocket
    notes:
      - text: The non-Warden frigates may not spawn. The Warden frigates are very weak (<100 HP) and can't stand a lot of damage.
      - text: The Federation Detention Facility containers must be hacked with a Data Analyzer to retrieve the "Caldari Prisoners of War" item required to complete The Breakout. The containers are Easy difficulty (70 HP green System Core). After the first container is successfully hacked, an invisible 60-second timer starts, after which the containers will all explode and the site despawns. The containers are grouped relatively close together in a straight line, so if you have a fast ship and good hacking skills, you can hack multiple containers and pick up multiple mission items.
