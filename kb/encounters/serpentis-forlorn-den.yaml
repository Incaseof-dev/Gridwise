notes:
  - text: Serpentis Forlorn Den is an unrated combat site belonging to the Serpentis Corporation pirate faction. It can be found via exploration as a cosmic anomaly within systems owned by the Gallente Federation or occupied by the Serpentis Corporation. As an ungated complex, the limitations as to which ships can complete this site are tied to the security rating of the system where the anomaly spawns (T2 Battleships for high-security systems, and up to Titans in low-security and null-security systems).
  - text: Completing this complex may award the player with valuable Shadow Serpentis faction modules and ammunition. This combat site consists of a single ungated pocket of space containing a variety of Frigate to Battleship-sized enemy ships, as well as some batteries. Destroying all hostile ships may escalate into the DED rated Serpentis Corporation Hydroponics Site complex.
  - text: "Escalation: This site can escalate to Serpentis Corporation Hydroponics Site and the Serpentis Paramilitary Complex."
  - text: "Escalation: Serpentis Corporation Hydroponics Site: Your scanner has picked up a transmission originating from a nearby system. It would be wise to investigate this mysterious signal further."
