notes:
  - text: This site is very similar to Sansha Watch.
  - text: Upon warping to the site you will land at an acceleration gate.
  - text: "Escalation: Destroying the True Sansha commander may escalate the site to Sansha Owned Station."
  - text: "Escalation: Escalation start: To your surprise, the Overseer seems to have spent the last moments of his life sending some message to your ship on a private channel, a fact you learn from a blinking entry on your communication panel a few seconds after his innards slid across your windshield, bounced along your fuselage and were sucked into your thrusters. It appears he wanted to save his life by telling you the whereabouts of some place you could load your cargohold with riches, but before he could get very far with his offer, his journey ended. All you have is some hysteric babble about a hidden mining station at a certain location."
