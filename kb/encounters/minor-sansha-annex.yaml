    notes:
      - text: "Blitz: Destroy the True Sansha battlecruiser, bookmark his wreck, warp out and come back in a few minutes to pick up the loot."
      - text: Full room aggro on warp-in. The fleet is spread out in several groups at significant distances across the pocket so immediate incoming damage will be low. Most of them will be ~50 km away; one battleship will spawn at a high angle above you 90 km away and can be ignored.
      - text: True Sansha Battlecruiser will not be immediately present on warp-in. After roughly 30 seconds in the pocket a loud alarm will sound in local and (sometimes) spawn the commander. Shoot the Mind Control Tower and kill the Centus Militant Supervisor if no commander spawns to despawn the site.
